name: Build and Push Docker Image

on:
  push:
    branches: [ main ]
    paths:
      - 'Dockerfile'
      - 'aiwarehouse-linux-amd64-x64'
      - 'aiwarehouse-linux-arm64-arm64'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# -------------------------------------------------------------------------
# 全局参数配置：在此处统一管理保留数量，方便后续调整。
# KEEP_VERSIONS  - 保留最近多少个 Docker 镜像版本（untagged 历史层）
# KEEP_RELEASES  - 保留最近多少个 GitHub Release
# KEEP_WORKFLOWS - 保留最近多少条 Workflow 运行记录
# -------------------------------------------------------------------------
env:
  KEEP_VERSIONS: 5
  KEEP_RELEASES: 5
  KEEP_WORKFLOWS_DAYS: 1

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # 删除 Release 需要 write 权限
      packages: write      # 推送/删除 GHCR 镜像需要 write 权限
      actions: write       # 删除 Workflow 运行记录需要 write 权限

    steps:
      # -------------------------------------------------------------------------
      # 服务器性能检测：在构建开始前，输出当前 Runner 的 CPU、内存、硬盘信息。
      # 方便判断当前分配到的机器性能，及时调整构建策略（如减少并行任务）。
      # 同时验证 GITHUB_TOKEN 是否正常注入，并提示即将开始清理旧数据。
      # -------------------------------------------------------------------------
      - name: Check Server Performance
        run: |
          echo "警告⚠"
          echo "分配的服务器性能有限，若选择的插件过多，务必注意CPU性能！"
          echo -e "已知CPU型号(降序): 7763，8370C，8272CL，8171M，E5-2673\n"
          echo "--------------------------CPU信息--------------------------"
          echo "CPU物理数量: $(cat /proc/cpuinfo | grep "physical id" | sort | uniq | wc -l)"
          echo "CPU核心数量: $(nproc)"
          echo -e "CPU型号信息:$(cat /proc/cpuinfo | grep -m1 name | awk -F: '{print $2}')\n"
          echo "--------------------------内存信息--------------------------"
          echo "已安装内存详细信息:"
          echo -e "$(sudo lshw -short -C memory | grep GiB)\n"
          echo "--------------------------硬盘信息--------------------------"
          echo "硬盘数量: $(ls /dev/sd* | grep -v [1-9] | wc -l)" && df -hT
          echo "-------------------------Tokens Ready----------------------"
          echo "GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}"
          echo "----------开始编译------------"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/claw_host:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=HTTP Server
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # -------------------------------------------------------------------------
      # 清理旧 Docker 镜像版本：推送新镜像后，只保留最近 KEEP_VERSIONS 个版本。
      # 使用 snok/container-retention-policy Action：
      #   - 仅删除 untagged（无标签）的旧版本历史层，带 tag 的版本不受影响；
      #   - cut-off 设为 1 秒前，确保刚推送的新层不会被误删；
      #   - 仅在推送到 main 分支时执行，PR 触发时跳过。
      # -------------------------------------------------------------------------
      - name: Clean Old Data
        run: |
          echo "----------开始清空旧的固件和数据------------"   
      # -------------------------------------------------------------------------
      # 清理旧 Docker 镜像版本：推送新镜像后，只保留最近 KEEP_VERSIONS 个版本。
      # 使用 snok/container-retention-policy Action：
      #   - 仅删除 untagged（无标签）的旧版本历史层，带 tag 的版本不受影响；
      #   - cut-off 设为 1 秒前，确保刚推送的新层不会被误删；
      #   - 仅在推送到 main 分支时执行，PR 触发时跳过。
      # -------------------------------------------------------------------------
      - name: Delete old Docker image versions (keep latest ${{ env.KEEP_VERSIONS }})
        if: github.event_name != 'pull_request'
        # ⚠️ 注意：删除 GHCR packages 需要 PAT（Personal Access Token）
        # secrets.GITHUB_TOKEN 权限不足，会导致 API 返回异常响应。
        # 请在仓库 Settings → Secrets → Actions 中添加名为 PAT 的 secret：
        #   1. 访问 https://github.com/settings/tokens → Generate new token (classic)
        #   2. 勾选 write:packages 和 delete:packages 权限
        #   3. 将生成的 token 保存为仓库 secret，命名为 PAT
      # -------------------------------------------------------------------------
      # 清理旧 Docker 镜像版本：推送新镜像后，只保留最近 KEEP_VERSIONS 个版本。
      # 使用 snok/container-retention-policy Action：
      #   - 仅删除 untagged（无标签）的旧版本历史层，带 tag 的版本不受影响；
      #   - cut-off 设为 1 秒前，确保刚推送的新层不会被误删；
      #   - 仅在推送到 main 分支时执行，PR 触发时跳过。
      # -------------------------------------------------------------------------
      - name: Delete old Docker image versions (keep latest ${{ env.KEEP_VERSIONS }})
        if: github.event_name != 'pull_request'
        # ⚠️ 注意：删除 GHCR packages 需要 PAT（Personal Access Token）
        # secrets.GITHUB_TOKEN 权限不足，会导致 API 返回异常响应。
        # 请在仓库 Settings → Secrets → Actions 中添加名为 PAT 的 secret：
        #   1. 访问 https://github.com/settings/tokens → Generate new token (classic)
        #   2. 勾选 write:packages 和 delete:packages 权限
        #   3. 将生成的 token 保存为仓库 secret，命名为 PAT
        uses: snok/container-retention-policy@v3.0.0
        with:
          account: ${{ github.repository_owner }}
          token: ${{ secrets.PAT }}       # 必须用 PAT，GITHUB_TOKEN 无 delete:packages 权限
          account-type: personal          # cn4096 是个人账号填 personal，组织账号填 org
          image-names: claw_host
          image-tags: "!latest"           # 排除 latest 标签，只清理 untagged 旧版本
          cut-off: 2h                     # 删除 2 小时前的旧版本，保护刚推送的新层
          keep-n-most-recent: ${{ env.KEEP_VERSIONS }}
          
      - name: Delete Old Workflows
        uses: Mattraks/delete-workflow-runs@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          retain_days: ${{ env.KEEP_WORKFLOWS_DAYS }}
          keep_minimum_runs: 0


      - name: Delete Old Releases
        uses: dev-drprasad/delete-older-releases@master
        with:
          keep_latest: ${{ env.KEEP_RELEASES }}
          delete_tags: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Done
        run: |
          echo "----------数据清除完毕.------------"  
