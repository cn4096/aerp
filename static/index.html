      <div style="font-size:11px;font-weight:600;color:var(--text3);margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em">数据源</div>
      <select onchange="_rptCfg.source=this.value;_rptCfg.dimensions=[];_rptCfg.values=[];_rptCfg.filters=[];_rptRefreshForm()"
        style="width:100%;font-size:13px;padding:6px 8px;background:var(--bg3);border:1px solid var(--border);border-radius:6px;color:var(--text)">
        <option value="">-- 选择数据源 --</option>
        ${sourceOpts}
      </select>
    </div>

    <!-- 维度（GROUP BY） -->
    <div style="min-width:280px;flex:1">
      <div style="font-size:11px;font-weight:600;color:var(--text3);margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em">行维度（GROUP BY）</div>
      ${dimRows}
      ${_rptCfg.source ? `<button onclick="_rptCfg.dimensions.push({field:'',truncate:'',alias:''});_rptRefreshForm()"
        style="font-size:12px;color:var(--accent);background:none;border:1px dashed var(--accent);border-radius:6px;padding:3px 10px;cursor:pointer">＋ 添加维度</button>` : ''}
    </div>

    <!-- 数值指标 -->
    <div style="min-width:280px;flex:1">
      <div style="font-size:11px;font-weight:600;color:var(--text3);margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em">数值指标（聚合）</div>
      ${valRows}
      ${_rptCfg.source ? `<button onclick="_rptCfg.values.push({field:'',agg:'SUM',alias:''});_rptSyncYDefaults();_rptRefreshForm()"
        style="font-size:12px;color:var(--green);background:none;border:1px dashed var(--green);border-radius:6px;padding:3px 10px;cursor:pointer">＋ 添加指标</button>` : ''}
    </div>

    <!-- 筛选条件 -->
    <div style="min-width:340px;flex:1">
      <div style="font-size:11px;font-weight:600;color:var(--text3);margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em">筛选条件</div>
      ${filterRows}
      ${_rptCfg.source ? `<button onclick="_rptCfg.filters.push({field:'',op:'=',value:''});if(_rptCfg.filters.length>1)_rptCfg.filter_logic.push('AND');_rptRefreshForm()"
        style="font-size:12px;color:var(--yellow);background:none;border:1px dashed var(--yellow);border-radius:6px;padding:3px 10px;cursor:pointer">＋ 添加筛选</button>` : ''}
    </div>
  </div>

  <!-- 第二行：图表、排序、限制 -->
  <div style="display:flex;flex-wrap:wrap;gap:16px;margin-top:14px;padding-top:14px;border-top:1px solid var(--border)">
    <!-- 图表类型 -->
    <div>
      <div style="font-size:11px;font-weight:600;color:var(--text3);margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em">图表类型</div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">
        ${chartTypes.map(ct=>`<button onclick="_rptCfg.chart.type='${ct.v}';_rptRefreshForm()"
          style="font-size:12px;padding:5px 12px;border-radius:6px;border:1px solid ${_rptCfg.chart.type===ct.v?'var(--accent)':'var(--border)'};
                 background:${_rptCfg.chart.type===ct.v?'rgba(88,166,255,.15)':'var(--bg3)'};
                 color:${_rptCfg.chart.type===ct.v?'var(--accent)':'var(--text2)'};cursor:pointer">${ct.l}</button>`).join('')}
        ${_rptCfg.chart.type !== 'none' ? `
        <button onclick="_rptCfg.chart.show_table=!(_rptCfg.chart.show_table!==false);_rptRefreshForm()"
          title="图表显示时是否同时显示下方数据明细表格"
          style="font-size:12px;padding:5px 12px;border-radius:6px;cursor:pointer;
                 border:1px solid ${_rptCfg.chart.show_table!==false?'var(--accent)':'var(--border)'};
                 background:${_rptCfg.chart.show_table!==false?'rgba(88,166,255,.15)':'var(--bg3)'};
                 color:${_rptCfg.chart.show_table!==false?'var(--accent)':'var(--text2)'}"
          >${_rptCfg.chart.show_table!==false?'☑':'☐'} 数据明细</button>` : ''}
      </div>
    </div>

    <!-- X轴 / Y轴 -->
    ${_rptCfg.chart.type !== 'none' && allAliases.length ? `
    <div>
      <div style="font-size:11px;font-weight:600;color:var(--text3);margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em">图表轴</div>
      <div style="display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start">
        <div style="display:flex;gap:8px;align-items:center">
          <span style="font-size:12px;color:var(--text3);white-space:nowrap">X轴（分组）：</span>
          <select onchange="_rptCfg.chart.x=this.value" style="font-size:12px;padding:4px 6px;background:var(--bg3);border:1px solid var(--border);border-radius:6px;color:var(--text)">
            <option value="">-- 选择 --</option>${aliasOpts(_rptCfg.chart.x)}
          </select>
        </div>
        ${(_rptCfg.chart.type === 'bar' || _rptCfg.chart.type === 'line') && _rptCfg.dimensions.length > 0 ? `
        <div style="display:flex;gap:8px;align-items:center">
          <span style="font-size:12px;color:var(--text3);white-space:nowrap">系列维度：</span>
          <select onchange="_rptCfg.chart.series=this.value;_rptRefreshForm()" style="font-size:12px;padding:4px 6px;background:var(--bg3);border:1px solid var(--border);border-radius:6px;color:var(--text)">
            <option value="">不拆分（单系列）</option>
            ${_rptCfg.dimensions.map(d=>d.alias).filter(Boolean).map(a=>
              `<option value="${escHtml(a)}" ${_rptCfg.chart.series===a?'selected':''}>${escHtml(a)}</option>`
            ).join('')}
          </select>
          ${_rptCfg.chart.series ? `<span style="font-size:11px;color:var(--text3)">（每个值一条线）</span>` : ''}
        </div>` : ''}
        <div style="display:flex;gap:8px;align-items:flex-start">
          <span style="font-size:12px;color:var(--text3);white-space:nowrap;padding-top:2px">Y轴（指标）：</span>
          <div style="display:flex;flex-wrap:wrap;gap:6px">
            ${(() => {
              const selected = (_rptCfg.chart.y||'').split(',').map(s=>s.trim()).filter(Boolean);
              const valueAliases = _rptCfg.values.map(v=>v.alias).filter(Boolean);
              // 候选：优先数值指标别名，没有时用全部别名
              const candidates = valueAliases.length ? valueAliases : allAliases;
              return candidates.map(a => {
                const checked = selected.includes(a) || (selected.length===0);
                return `<label style="display:flex;align-items:center;gap:4px;cursor:pointer;font-size:12px;padding:3px 8px;background:${checked?'rgba(88,166,255,.15)':'var(--bg3)'};border:1px solid ${checked?'var(--accent)':'var(--border)'};border-radius:6px;color:${checked?'var(--accent)':'var(--text2)'};transition:all .15s">
                  <input type="checkbox" ${checked?'checked':''} value="${escHtml(a)}"
                    onchange="_rptUpdateYFields()"
                    style="accent-color:var(--accent);cursor:pointer">
                  ${escHtml(a)}
                </label>`;
              }).join('');
            })()}
          </div>
        </div>
      </div>
    </div>` : ''}

    <!-- 排序 -->
    <div>
      <div style="font-size:11px;font-weight:600;color:var(--text3);margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em">排序</div>
      <div style="display:flex;gap:6px;align-items:center">
        <select onchange="_rptCfg.sort.field=this.value" style="font-size:12px;padding:4px 6px;background:var(--bg3);border:1px solid var(--border);border-radius:6px;color:var(--text)">
          <option value="">默认</option>${aliasOpts(_rptCfg.sort.field)}
        </select>
        <select onchange="_rptCfg.sort.dir=this.value" style="width:72px;font-size:12px;padding:4px 6px;background:var(--bg3);border:1px solid var(--border);border-radius:6px;color:var(--text)">
          <option value="desc" ${_rptCfg.sort.dir==='desc'?'selected':''}>降序</option>
          <option value="asc"  ${_rptCfg.sort.dir==='asc'?'selected':''}>升序</option>
        </select>
      </div>
    </div>

    <!-- 返回行数 -->
    <div>
      <div style="font-size:11px;font-weight:600;color:var(--text3);margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em">最大行数</div>
      <input type="number" min="1" max="5000" value="${_rptCfg.limit||500}"
        onchange="_rptCfg.limit=parseInt(this.value)||500"
        style="width:90px;font-size:12px;padding:4px 8px;background:var(--bg3);border:1px solid var(--border);border-radius:6px;color:var(--text)">
    </div>
  </div>`;
}

// 从复选框收集当前勾选的Y轴字段，存入 _rptCfg.chart.y
function _rptUpdateYFields() {
  const checked = [...document.querySelectorAll('#rpt-config-body input[type=checkbox]')]
    .filter(cb => cb.checked)
    .map(cb => cb.value);
  _rptCfg.chart.y = checked.join(',');
  // 同步刷新复选框样式（不重建整个表单，避免焦点丢失）
  document.querySelectorAll('#rpt-config-body input[type=checkbox]').forEach(cb => {
    const label = cb.closest('label');
    if (!label) return;
    if (cb.checked) {
      label.style.background = 'rgba(88,166,255,.15)';
      label.style.borderColor = 'var(--accent)';
      label.style.color = 'var(--accent)';
    } else {
      label.style.background = 'var(--bg3)';
      label.style.borderColor = 'var(--border)';
      label.style.color = 'var(--text2)';
    }
  });
}

// 当指标列表变动时，自动把所有有效别名写入 chart.y（全选）
function _rptSyncYDefaults() {
  const valueAliases = _rptCfg.values.map(v => v.alias).filter(Boolean);
  if (valueAliases.length) {
    _rptCfg.chart.y = valueAliases.join(',');
  }
}

// 运行前强制把所有表单 DOM 当前值同步回 _rptCfg，
// 解决 alias input 用 onchange（失焦触发）导致的未同步问题
function _rptFlushForm() {
  const body = document.getElementById('rpt-config-body');
  if (!body) return;

  // 同步所有指标别名 input（用 data-val-alias-idx 标记索引）
  body.querySelectorAll('input[data-val-alias]').forEach(input => {
    const i = parseInt(input.dataset.valAlias);
    if (!isNaN(i) && _rptCfg.values[i] !== undefined) {
      _rptCfg.values[i].alias = input.value;
    }
  });

  // 同步所有维度别名 input
  body.querySelectorAll('input[data-dim-alias]').forEach(input => {
    const i = parseInt(input.dataset.dimAlias);
    if (!isNaN(i) && _rptCfg.dimensions[i] !== undefined) {
      _rptCfg.dimensions[i].alias = input.value;
    }
  });

  // 同步所有筛选值 input
  body.querySelectorAll('input[data-filter-value]').forEach(input => {
    const i = parseInt(input.dataset.filterValue);
    if (!isNaN(i) && _rptCfg.filters[i] !== undefined) {
      _rptCfg.filters[i].value = input.value;
    }
  });

  // 同步所有筛选操作符 select（select 虽然 onchange 即时，但保持一致性）
  body.querySelectorAll('select[data-filter-op]').forEach(sel => {
    const i = parseInt(sel.dataset.filterOp);
    if (!isNaN(i) && _rptCfg.filters[i] !== undefined) {
      _rptCfg.filters[i].op = sel.value;
    }
  });

  // 同步 Y 轴复选框
  const checked = [...body.querySelectorAll('input[type=checkbox]')]
    .filter(cb => cb.checked).map(cb => cb.value);
  if (checked.length > 0) {
    _rptCfg.chart.y = checked.join(',');
  } else {
    // 没有任何勾选时，默认用所有有效别名
    _rptSyncYDefaults();
  }
}

function _rptRefreshForm() {
  const el = document.getElementById('rpt-config-body');
  if (el) el.innerHTML = _rptRenderConfigForm();
}

// ── 运行查询 ──────────────────────────────────────────────────
async function rptRunQuery() {
  if (!_rptCfg.source) { alert('请先选择数据源'); return; }

  // 发请求前强制同步表单所有输入值（解决 alias/value 改了未失焦的问题）
  _rptFlushForm();
  // 确保 chart.y 与最新别名保持一致（若无复选框勾选则自动全选）
  _rptSyncYDefaults();

  const emptyEl   = document.getElementById('rpt-empty');
  const chartCard = document.getElementById('rpt-chart-card');
  const tableCard = document.getElementById('rpt-table-card');

  if (emptyEl)   emptyEl.style.display = 'none';
  if (chartCard) chartCard.style.display = 'none';
  if (tableCard) { tableCard.style.display = 'block'; document.getElementById('rpt-table-wrap').innerHTML = '<div style="padding:30px;text-align:center;color:var(--text3)">查询中…</div>'; }

  let res;
  try {
    res = await api('POST', '/reports/query', _rptCloneCfg());
  } catch(e) {
    document.getElementById('rpt-table-wrap').innerHTML = `<div style="padding:20px;color:var(--red)">❌ ${e.message}</div>`;
    return;
  }

  // 渲染表格
  _rptRenderTable(res);
  // 图表模式下根据 show_table 开关控制数据明细可见性
  if (_rptCfg.chart.type !== 'none' && _rptCfg.chart.show_table === false) {
    const tc = document.getElementById('rpt-table-card');
    if (tc) tc.style.display = 'none';
  }

  // 渲染图表
  if (_rptCfg.chart.type !== 'none' && res.rows.length > 0) {
    _rptRenderChart(res);
  } else {
    if (chartCard) chartCard.style.display = 'none';
    if (_rptChart) { _rptChart.dispose(); _rptChart = null; }
  }
}

// ── 渲染数据表格 ──────────────────────────────────────────────
function _rptRenderTable(res) {
  const tableCard = document.getElementById('rpt-table-card');
  const wrap      = document.getElementById('rpt-table-wrap');
  const countEl   = document.getElementById('rpt-row-count');
  if (!tableCard || !wrap) return;

  tableCard.style.display = 'block';
  if (countEl) countEl.textContent = `共 ${res.total} 行`;

  if (!res.rows.length) {
    wrap.innerHTML = '<div style="padding:30px;text-align:center;color:var(--text3)">无数据，请调整筛选条件</div>';
    return;
  }

  const fmtCell = v => {
    if (v === null || v === undefined) return '-';
    if (typeof v === 'number') return Number.isInteger(v) ? v.toLocaleString() : v.toFixed(2);
    return String(v);
  };

  const thead = `<tr>${res.columns.map(c=>`<th style="white-space:nowrap">${escHtml(c)}</th>`).join('')}</tr>`;
  const tbody = res.rows.slice(0, 500).map(row =>
    `<tr>${res.columns.map(c=>`<td>${escHtml(fmtCell(row[c]))}</td>`).join('')}</tr>`
  ).join('');

  wrap.innerHTML = `<table><thead>${thead}</thead><tbody>${tbody}</tbody></table>`;
  if (res.total > 500) {
    wrap.innerHTML += `<div style="padding:8px 0;font-size:12px;color:var(--text3);text-align:center">仅显示前 500 行，共 ${res.total} 行</div>`;
  }
}

// ── 渲染 ECharts 图表 ─────────────────────────────────────────
function _rptRenderChart(res) {
  const chartCard = document.getElementById('rpt-chart-card');
  const wrap      = document.getElementById('rpt-chart-wrap');
  const titleEl   = document.getElementById('rpt-chart-title');
  if (!chartCard || !wrap) return;

  chartCard.style.display = 'block';

  // 销毁旧实例
  if (_rptChart) { _rptChart.dispose(); _rptChart = null; }

  const t = _rptGetTheme();
  const xField = _rptCfg.chart.x || res.columns[0];
  const yField = _rptCfg.chart.y || res.columns[1] || res.columns[0];
  const chartType = _rptCfg.chart.type || 'bar';

  const src = _rptSourceMeta(_rptCfg.source);
  if (titleEl) titleEl.textContent = `${src?.label||''} · ${chartType==='pie'?xField+' / '+yField:xField+' vs '+yField}`;

  // 恢复已保存的图表高度（新建时为默认320px）
  _rptApplyPanelHeight();

  _rptChart = echarts.init(wrap, null, { renderer: 'canvas' });

  // 数字格式化
  const fmtNum = n => {
    const abs = Math.abs(n);
    if (abs >= 1e8) return (n/1e8).toFixed(2) + '亿';
    if (abs >= 1e4) return (n/1e4).toFixed(1) + 'w';
    return Number.isInteger(n) ? n.toLocaleString() : n.toFixed(2);
  };

  let option;

  if (chartType === 'pie') {
    const pieData = res.rows.map(row => ({
      name:  String(row[xField] ?? ''),
      value: parseFloat(row[yField]) || 0,
    }));
    option = {
      backgroundColor: 'transparent',
      tooltip: {
        trigger: 'item',
        formatter: p => `${p.name}<br/>${yField}：${fmtNum(p.value)} (${p.percent}%)`,
        backgroundColor: t.bg, borderColor: t.border, textStyle: { color: t.text },
      },
      legend: { orient: 'vertical', right: 10, top: 'center', textStyle: { color: t.text2 }, type: 'scroll' },
      series: [{
        type: 'pie', radius: ['35%', '65%'], center: ['40%', '50%'],
        data: pieData,
        label: { formatter: '{b}\n{d}%', color: t.text2, fontSize: 11 },
        emphasis: { itemStyle: { shadowBlur: 10, shadowOffsetX: 0, shadowColor: 'rgba(0,0,0,0.5)' } },
      }],
    };
  } else if (chartType === 'scatter') {
    const xData = res.rows.map(r => parseFloat(r[xField]) || 0);
    const yData = res.rows.map(r => parseFloat(r[yField]) || 0);
    const scatterData = xData.map((x, i) => [x, yData[i]]);
    option = {
      backgroundColor: 'transparent',
      tooltip: {
        trigger: 'item',
        formatter: p => `${xField}：${fmtNum(p.data[0])}<br/>${yField}：${fmtNum(p.data[1])}`,
        backgroundColor: t.bg, borderColor: t.border, textStyle: { color: t.text },
      },
      grid: { left: 60, right: 20, top: 30, bottom: 40 },
      xAxis: { type: 'value', name: xField, nameTextStyle: { color: t.text3 }, axisLine: { lineStyle: { color: t.border } }, splitLine: { lineStyle: { color: t.border, opacity: .5 } }, axisLabel: { color: t.text3, formatter: fmtNum } },
      yAxis: { type: 'value', name: yField, nameTextStyle: { color: t.text3 }, axisLine: { lineStyle: { color: t.border } }, splitLine: { lineStyle: { color: t.border, opacity: .5 } }, axisLabel: { color: t.text3, formatter: fmtNum } },
      series: [{ type: 'scatter', data: scatterData, symbolSize: 8, itemStyle: { color: t.accent, opacity: .8 } }],
    };
  } else {
    // bar / line
    const seriesField = _rptCfg.chart.series || ''; // 系列维度字段别名

    let categories, series;
    const colors = [t.accent, t.green, t.yellow, t.red, '#a371f7', '#39d353', '#f78166', '#56d364', '#e3b341'];

    if (seriesField && res.columns.includes(seriesField)) {
      // ── 多系列模式：透视转换 ─────────────────────────────────────
      // 原始数据格式：[{xField: '2025-01', seriesField: '公司A', yField: 100}, ...]
      // 目标：categories=[月份], series=[{name:'公司A', data:[...]}, ...]

      // 1. 收集所有 X 轴值（有序去重）
      const catSet = new Set();
      res.rows.forEach(r => catSet.add(String(r[xField] ?? '')));
      categories = [...catSet];

      // 2. 收集所有系列值（有序去重）
      const seriesNames = [];
      const seriesSet = new Set();
      res.rows.forEach(r => {
        const sv = String(r[seriesField] ?? '（空）');
        if (!seriesSet.has(sv)) { seriesSet.add(sv); seriesNames.push(sv); }
      });

      // 3. 构建透视表：map[seriesName][xValue] = 数值
      const yf = yField.split(',')[0].trim(); // 透视模式只取第一个Y指标
      const pivot = {};
      seriesNames.forEach(sn => { pivot[sn] = {}; });
      res.rows.forEach(r => {
        const sn  = String(r[seriesField] ?? '（空）');
        const xv  = String(r[xField] ?? '');
        const val = parseFloat(r[yf]) || 0;
        pivot[sn][xv] = (pivot[sn][xv] || 0) + val;
      });

      // 4. 生成 ECharts series
      series = seriesNames.map((sn, si) => ({
        name: sn,
        type: chartType,
        data: categories.map(xv => pivot[sn][xv] ?? 0),
        smooth: chartType === 'line',
        areaStyle: chartType === 'line' ? { opacity: .06 } : undefined,
        itemStyle: { color: colors[si % colors.length] },
        barMaxWidth: 40,
      }));

      if (titleEl) titleEl.textContent = `${src?.label||''} · ${xField} / ${seriesField} → ${yf}`;

    } else {
      // ── 单/多指标模式（原有逻辑）────────────────────────────────
      categories = res.rows.map(r => String(r[xField] ?? ''));
      const yFields = yField ? yField.split(',').map(s=>s.trim()).filter(Boolean) : [yField];
      series = yFields.map((yf, si) => ({
        name: yf,
        type: chartType,
        data: res.rows.map(r => parseFloat(r[yf]) || 0),
        smooth: chartType === 'line',
        areaStyle: chartType === 'line' ? { opacity: .08 } : undefined,
        itemStyle: { color: colors[si % colors.length] },
        barMaxWidth: 50,
      }));
    }

    const hasLegend = series.length > 1;
    option = {
      backgroundColor: 'transparent',
      tooltip: {
        trigger: 'axis',
        backgroundColor: t.bg, borderColor: t.border, textStyle: { color: t.text },
        formatter: params => {
          let s = `<b>${params[0]?.axisValue}</b><br/>`;
          params.forEach(p => { s += `${p.marker}${p.seriesName}：${fmtNum(p.value)}<br/>`; });
          return s;
        },
      },
      legend: hasLegend ? {
        top: 4, textStyle: { color: t.text2 }, type: 'scroll',
        pageTextStyle: { color: t.text3 },
      } : undefined,
      grid: { left: 70, right: 20, top: hasLegend ? 36 : 16, bottom: 46 },
      xAxis: {
        type: 'category', data: categories,
        axisLine: { lineStyle: { color: t.border } },
        axisLabel: {
          color: t.text3,
          rotate: categories.length > 8 ? 30 : 0,
          overflow: 'truncate',
          ellipsis: '…',
          width: 72,
          formatter: v => v,
        },
      },
      yAxis: {
        type: 'value',
        axisLine: { lineStyle: { color: t.border } },
        splitLine: { lineStyle: { color: t.border, opacity: .5 } },
        axisLabel: { color: t.text3, formatter: fmtNum },
      },
      series,
    };
  }

  _rptChart.setOption(option);

  // 响应容器 resize
  const ro = new ResizeObserver(() => _rptChart?.resize());
  ro.observe(wrap);
}

// ── 图表区高度拖动 ────────────────────────────────────────────
function rptResizeStart(e) {
  e.preventDefault();
  const wrap = document.getElementById('rpt-chart-wrap');
  if (!wrap) return;

  const startY = e.clientY;
  const startH = wrap.getBoundingClientRect().height;
  const minH   = 120;
  const maxH   = window.innerHeight * 0.85;

  document.body.style.cursor     = 'ns-resize';
  document.body.style.userSelect = 'none';

  function onMove(ev) {
    const newH = Math.min(maxH, Math.max(minH, startH + (ev.clientY - startY)));
    wrap.style.height     = newH + 'px';
    _rptCfg.panelHeight   = Math.round(newH);
    // ECharts 需要手动通知 resize
    if (_rptChart) _rptChart.resize();
  }

  function onUp() {
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup',   onUp);
    document.body.style.cursor     = '';
    document.body.style.userSelect = '';
  }

  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup',   onUp);
}

// 把已保存的图表高度应用到 rpt-chart-wrap
function _rptApplyPanelHeight() {
  const wrap = document.getElementById('rpt-chart-wrap');
  if (!wrap) return;
  const h = _rptCfg.panelHeight;
  wrap.style.height = (h && h > 0) ? h + 'px' : '320px';
  if (_rptChart) _rptChart.resize();
}

// ── 显示/隐藏配置面板 ─────────────────────────────────────────
function rptToggleConfig() {
  const panel = document.getElementById('rpt-config-panel');
  const btn   = document.getElementById('btn-rpt-toggle-cfg');
  if (!panel) return;
  const isHidden = panel.style.display === 'none';
  panel.style.display = isHidden ? 'block' : 'none';
  if (isHidden) _rptApplyPanelHeight();  // 展开时恢复保存的高度
  if (btn) {
    btn.style.background    = isHidden ? 'rgba(88,166,255,.15)' : '';
    btn.style.borderColor   = isHidden ? 'var(--accent)' : '';
    btn.style.color         = isHidden ? 'var(--accent)' : '';
  }
}

// ── 新建报表（重置配置）────────────────────────────────────────
function rptNewReport() {
  _rptEditingId = null;
  _rptCfg.source = '';
  _rptCfg.filters = [];
  _rptCfg.filter_logic = [];
  _rptCfg.dimensions = [];
  _rptCfg.values = [];
  _rptCfg.chart = { type: 'bar', x: '', y: '', series: '', show_table: true };
  _rptCfg.sort = { field: '', dir: 'desc' };
  _rptCfg.limit = 500;
  _rptCfg.panelHeight = 0;
  _rptRefreshForm();

  // 新建时展开配置面板，隐藏切换按钮（无需切换）
  const panel = document.getElementById('rpt-config-panel');
  const btn   = document.getElementById('btn-rpt-toggle-cfg');
  if (panel) { panel.style.display = 'block'; }
  if (btn)   { btn.style.display = 'none'; btn.style.background=''; btn.style.borderColor=''; btn.style.color=''; }

  const emptyEl   = document.getElementById('rpt-empty');
  const chartCard = document.getElementById('rpt-chart-card');
  const tableCard = document.getElementById('rpt-table-card');
  if (emptyEl)   emptyEl.style.display = '';
  if (chartCard) chartCard.style.display = 'none';
  if (tableCard) tableCard.style.display = 'none';
  if (_rptChart) { _rptChart.dispose(); _rptChart = null; }
  _rptRenderSavedList(null);  // 取消高亮
}

// ── 加载已保存报表 ────────────────────────────────────────────
async function rptLoadSaved(id) {
  // 同一 id 正在加载中，忽略重复点击
  if (_rptLoadingId === id) return;

  const r = _rptSavedList.find(x => x.id === id);
  if (!r) return;

  // 标记当前加载的目标，并发时后来的请求会覆盖这个值
  _rptLoadingId = id;
  _rptEditingId = id;

  let cfg;
  try { cfg = JSON.parse(r.config); } catch { cfg = {}; }

  Object.assign(_rptCfg, {
    source:      cfg.source      || '',
    filters:     cfg.filters     || [],
    filter_logic: cfg.filter_logic || [],
    dimensions:  cfg.dimensions  || [],
    values:      cfg.values      || [],
    chart:       cfg.chart ? { type:'bar', x:'', y:'', series:'', show_table:true, ...cfg.chart } : { type: 'bar', x: '', y: '', series: '', show_table: true },
    sort:        cfg.sort        || { field: '', dir: 'desc' },
    limit:       cfg.limit       || 500,
    panelHeight: cfg.panelHeight || 0,
  });

  _rptRefreshForm();

  // 隐藏配置面板，显示切换按钮
  const panel = document.getElementById('rpt-config-panel');
  const btn   = document.getElementById('btn-rpt-toggle-cfg');
  if (panel) panel.style.display = 'none';
  if (btn)   { btn.style.display = ''; btn.style.background=''; btn.style.borderColor=''; btn.style.color=''; }

  // 立即高亮选中项
  _rptRenderSavedList(id);

  // 执行查询（可能耗时）
  await rptRunQuery();

  // await 返回后检查：若期间用户又点了别的报表，则本次结果作废
  if (_rptLoadingId !== id) return;
  _rptLoadingId = null;

  // 记录上次打开的报表 id 到 localStorage
  try { localStorage.setItem(_RPT_LAST_KEY, String(id)); } catch(e) {}
}

// ── 保存报表 ──────────────────────────────────────────────────
async function rptSaveReport() {
  if (!_rptCfg.source) { alert('请先选择数据源'); return; }
  _rptFlushForm();
  _rptSyncYDefaults();

  const existing = _rptSavedList.find(r => r.id === _rptEditingId);
  const defName  = existing?.name        || '';
  const defDesc  = existing?.description || '';
  const isUpdate = !!_rptEditingId;

  _rptOpenSaveModal({
    title:   isUpdate ? '更新报表' : '保存报表',
    defName, defDesc,
    saveLabel: isUpdate ? '更新' : '保存',
    forceNew: false,
  });
}

// ── 另存为新报表 ──────────────────────────────────────────────
async function rptSaveAsReport() {
  if (!_rptCfg.source) { alert('请先选择数据源'); return; }
  _rptFlushForm();
  _rptSyncYDefaults();

  const existing = _rptSavedList.find(r => r.id === _rptEditingId);
  const defName  = existing ? (existing.name + ' (副本)') : '';
  const defDesc  = existing?.description || '';

  _rptOpenSaveModal({
    title:     '另存为新报表',
    defName, defDesc,
    saveLabel: '另存为',
    forceNew:  true,
  });
}

// ── 共用弹窗 ─────────────────────────────────────────────────
function _rptOpenSaveModal({ title, defName, defDesc, saveLabel, forceNew }) {
  // 加载用户列表用于「指定人」分享
  api('GET', '/users').then(users => {
    const userOpts = (users||[]).filter(u=>u.id!==state.user.user_id)
      .map(u=>`<option value="${u.id}">${escHtml(u.full_name||u.username)}</option>`).join('');
    const deptSet = new Set((users||[]).map(u=>u.department).filter(Boolean));
    const deptOpts = [...deptSet].map(d=>`<option value="dept:${escHtml(d)}">${escHtml(d)}</option>`).join('');

    showModal(`
    <div class="modal" style="max-width:480px">
      <div class="modal-header">${title}<span class="modal-close" onclick="closeModal()">×</span></div>
      <div class="modal-body">
        <div class="form-group">
          <label>报表名称 <span style="color:var(--red)">*</span></label>
          <input id="rpt-save-name" value="${escHtml(defName)}" placeholder="如：按月收入汇总">
        </div>
        <div class="form-group">
          <label>描述（选填）</label>
          <input id="rpt-save-desc" value="${escHtml(defDesc)}" placeholder="简要说明用途">
        </div>
        <div style="border-top:1px solid var(--border);margin-top:14px;padding-top:14px">
          <div style="font-size:12px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px">分享设置</div>
          <div style="display:flex;flex-direction:column;gap:8px">
            <label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13px">
              <input type="radio" name="rpt-share" value="none" checked> 仅自己可见
            </label>
            <label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13px">
              <input type="radio" name="rpt-share" value="all"> 全部成员可见
            </label>
            ${deptOpts ? `<label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13px">
              <input type="radio" name="rpt-share" value="dept"> 指定部门：
              <select id="rpt-share-dept" style="font-size:12px;padding:3px 6px;background:var(--bg3);border:1px solid var(--border);border-radius:5px;color:var(--text)">
                ${deptOpts}
              </select>
            </label>` : ''}
            ${userOpts ? `<label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13px">
              <input type="radio" name="rpt-share" value="user"> 指定人员：
              <select id="rpt-share-user" style="font-size:12px;padding:3px 6px;background:var(--bg3);border:1px solid var(--border);border-radius:5px;color:var(--text)">
                ${userOpts}
              </select>
            </label>` : ''}
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn" onclick="closeModal()">取消</button>
        <button class="btn btn-primary" onclick="rptDoSave(${forceNew})">${saveLabel}</button>
      </div>
    </div>`);
    document.getElementById('modal-close').onclick = closeModal;
    setTimeout(() => document.getElementById('rpt-save-name')?.focus(), 50);

    // 如已有分享设置则回填
    if (_rptEditingId && !forceNew) {
      api('GET', `/reports/${_rptEditingId}/shares`).then(res => {
        const shares = res.data || [];
        if (!shares.length) return;
        const s = shares[0];
        const radios = document.querySelectorAll('input[name="rpt-share"]');
        radios.forEach(r => { if(r.value === s.share_type) r.checked = true; });
        if (s.share_type === 'user' && s.target_id) {
          const sel = document.getElementById('rpt-share-user');
          if (sel) sel.value = s.target_id;
        }
        if (s.share_type === 'dept') {
          // 找目标用户的部门
          const sel = document.getElementById('rpt-share-dept');
          if (sel && s.target_id) {
            const u = (users||[]).find(x=>x.id==s.target_id);
            if (u) sel.value = `dept:${u.department}`;
          }
        }
      }).catch(()=>{});
    }
  }).catch(() => {
    // 降级：无用户列表时显示简化弹窗
    showModal(`
    <div class="modal">
      <div class="modal-header">${title}<span class="modal-close" onclick="closeModal()">×</span></div>
      <div class="modal-body">
        <div class="form-group"><label>报表名称 <span style="color:var(--red)">*</span></label>
          <input id="rpt-save-name" value="${escHtml(defName)}" placeholder="如：按月收入汇总"></div>
        <div class="form-group"><label>描述（选填）</label>
          <input id="rpt-save-desc" value="${escHtml(defDesc)}" placeholder="简要说明用途"></div>
      </div>
      <div class="modal-footer">
        <button class="btn" onclick="closeModal()">取消</button>
        <button class="btn btn-primary" onclick="rptDoSave(${forceNew})">${saveLabel}</button>
      </div>
    </div>`);
    document.getElementById('modal-close').onclick = closeModal;
    setTimeout(() => document.getElementById('rpt-save-name')?.focus(), 50);
  });
}

async function rptDoSave(forceNew = false) {
  const name = document.getElementById('rpt-save-name')?.value?.trim();
  const desc = document.getElementById('rpt-save-desc')?.value?.trim() || '';
  if (!name) { alert('报表名称不能为空'); return; }

  const payload = { name, description: desc, config: _rptCloneCfg() };
  try {
    let reportId;
    if (_rptEditingId && !forceNew) {
      await api('PUT', `/reports/${_rptEditingId}`, payload);
      reportId = _rptEditingId;
    } else {
      const res = await api('POST', '/reports', payload);
      _rptEditingId = res.id;
      reportId = res.id;
      try { localStorage.setItem(_RPT_LAST_KEY, String(res.id)); } catch(e) {}
    }

    // 提交分享设置
    const shareRadio = document.querySelector('input[name="rpt-share"]:checked');
    if (shareRadio) {
      const shareType = shareRadio.value;
      let shares = [];
      if (shareType === 'all') {
        shares = [{ share_type: 'all', target_id: null }];
      } else if (shareType === 'dept') {
        // 找该部门下任意一个用户作为代表（后端按department字段匹配）
        const sel = document.getElementById('rpt-share-dept');
        if (sel) {
          const deptName = sel.value.replace(/^dept:/, '');
          shares = [{ share_type: 'dept', target_id: null, dept_name: deptName }];
        }
      } else if (shareType === 'user') {
        const sel = document.getElementById('rpt-share-user');
        if (sel && sel.value) shares = [{ share_type: 'user', target_id: parseInt(sel.value) }];
      }
      // 若shareType为none则清空分享
      await api('POST', `/reports/${reportId}/shares`, { shares });
    }

    const listRes = await api('GET', '/reports');
    _rptSavedList = listRes.data || [];
    _rptRenderSavedList(_rptEditingId);
    closeModal();
  } catch(e) {
    alert('保存失败：' + e.message);
  }
}

// ── 删除报表（右键菜单 / 双击）────────────────────────────────
// 在列表上长按或使用上下文菜单删除，此处简化为在加载时附加删除按钮
function _rptRenderSavedList(activeId) {
  if (activeId === undefined) activeId = _rptEditingId;

  const el = document.getElementById('rpt-list-inner');
  if (!el) return;

  const myList     = _rptSavedList.filter(r => !r.is_shared);
  const sharedList = _rptSavedList.filter(r => r.is_shared);

  if (!myList.length && !sharedList.length) {
    el.innerHTML = `<div style="padding:20px 14px;color:var(--text3);font-size:12px;text-align:center">暂无已保存报表<br>配置好后点「💾 保存报表」</div>`;
    return;
  }

  const renderItem = (r) => {
    const isActive    = r.id === activeId;
    const activeBg    = 'rgba(88,166,255,.15)';
    const activeBorder= '1px solid rgba(88,166,255,.35)';
    const shared      = r.is_shared ? '1' : '';
    return `
    <div class="rpt-saved-item" data-rid="${r.id}" data-shared="${shared}"
      onclick="rptLoadSaved(${r.id})"
      style="padding:8px 14px;cursor:pointer;border-radius:6px;margin:2px 6px;transition:background .15s,border .15s;position:relative;
             background:${isActive ? activeBg : ''};
             border:${isActive ? activeBorder : '1px solid transparent'}"
      onmouseenter="if(this.dataset.rid!='${activeId}'){this.style.background='var(--bg3)'};if(!this.dataset.shared){var b=this.querySelector('.rpt-del-btn');if(b)b.style.opacity='1';}"
      onmouseleave="if(this.dataset.rid!='${activeId}'){this.style.background=''};if(!this.dataset.shared){var b=this.querySelector('.rpt-del-btn');if(b)b.style.opacity='0';}">
      <div style="font-size:13px;font-weight:500;color:${isActive ? 'var(--accent)' : 'var(--text)'};white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:20px">${escHtml(r.name)}</div>
      ${r.is_shared ? `<div style="font-size:11px;color:var(--accent);margin-top:2px;opacity:.8">📤 ${escHtml(r.owner_name||'')} 的报表</div>` : ''}
      ${r.description ? `<div style="font-size:11px;color:var(--text3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${escHtml(r.description)}</div>` : ''}
      <div style="font-size:11px;color:var(--text3);margin-top:3px">${(r.updated_at||'').slice(0,10)}</div>
      ${r.is_shared ? '' : `<button class="rpt-del-btn" onclick="rptDeleteSaved(${r.id},event)"
        style="position:absolute;right:8px;top:8px;background:none;border:none;color:var(--red);cursor:pointer;font-size:15px;opacity:0;transition:opacity .15s;padding:2px 4px"
        title="删除报表">×</button>`}
    </div>`;
  };

  let html = myList.map(renderItem).join('');
  if (sharedList.length) {
    html += `<div style="padding:8px 14px 4px;font-size:11px;font-weight:600;color:var(--text3);letter-spacing:.05em;text-transform:uppercase;margin-top:6px;border-top:1px solid var(--border)">他人分享</div>`;
    html += sharedList.map(renderItem).join('');
  }
  el.innerHTML = html;
}

async function rptDeleteSaved(id, e) {
  e.stopPropagation();
  if (!confirm('确认删除此报表？')) return;
  await api('DELETE', `/reports/${id}`);
  _rptSavedList = _rptSavedList.filter(r => r.id !== id);
  if (_rptEditingId === id) {
    _rptEditingId = null;
    rptNewReport();
  }
  _rptRenderSavedList();
}

// ============================================================
// DATA CENTER — 数据中心
// ============================================================

let _dcTables      = [];      // 所有数据表列表
let _dcActiveTable = null;    // 当前选中的表元数据
let _dcRows        = [];      // 当前表的数据行
let _dcPage        = 1;
let _dcTotal       = 0;
let _dcSortBy      = 'id';
let _dcSortDir     = 'asc';
const _DC_LAST_KEY = 'erp_last_dc_table';

// ── 入口 ─────────────────────────────────────────────────────
async function loadDataCenter(content, actions) {
  actions.innerHTML = `
    <button class="btn btn-primary" onclick="dcNewTable()">⊞ 新建数据表</button>
    <button class="btn" onclick="dcFromExcel()">📥 从Excel创建</button>`;

  const res = await api('GET', '/dc/tables');
  _dcTables = res.data || [];

  content.innerHTML = `
  <div style="display:flex;gap:16px;height:calc(100vh - 120px);min-height:500px">
    <!-- 左侧：数据表列表 -->
    <div id="dc-sidebar" style="width:220px;flex-shrink:0;background:var(--bg2);border:1px solid var(--border);border-radius:10px;overflow-y:auto;padding:12px 0">
      <div style="padding:0 14px 10px;font-size:12px;font-weight:600;color:var(--text3);letter-spacing:.05em;text-transform:uppercase">已创建数据表</div>
      <div id="dc-list-inner"></div>
    </div>
    <!-- 右侧：数据内容区 -->
    <div id="dc-main" style="flex:1;display:flex;flex-direction:column;gap:12px;overflow:hidden;min-width:0">
      <div id="dc-empty" style="flex:1;display:flex;align-items:center;justify-content:center;color:var(--text3);font-size:14px">
        <div style="text-align:center">
          <div style="font-size:48px;margin-bottom:12px">🗄️</div>
          <div>选择左侧数据表查看数据</div>
          <div style="font-size:12px;margin-top:8px">或点击「新建数据表」创建</div>
        </div>
      </div>
      <div id="dc-content" style="display:none;flex:1;overflow:hidden;display:flex;flex-direction:column;gap:10px"></div>
    </div>
  </div>`;

  dcRenderSidebar();

  // 恢复上次打开的表
  try {
    const lastId = parseInt(localStorage.getItem(_DC_LAST_KEY));
    if (lastId && _dcTables.some(t => t.id === lastId)) {
      dcSelectTable(lastId);
    }
  } catch(e) {}
}

// ── 左侧列表渲染 ─────────────────────────────────────────────
function dcRenderSidebar(activeId) {
  if (activeId === undefined) activeId = _dcActiveTable?.id;
  const el = document.getElementById('dc-list-inner');
  if (!el) return;
  if (!_dcTables.length) {
    el.innerHTML = `<div style="padding:20px 14px;color:var(--text3);font-size:12px;text-align:center">暂无数据表<br>点击「新建数据表」开始</div>`;
    return;
  }
  el.innerHTML = _dcTables.map(t => {
    const isActive = t.id === activeId;
    return `<div class="dc-table-item" data-tid="${t.id}" onclick="dcSelectTable(${t.id})"
      style="padding:8px 14px;cursor:pointer;border-radius:6px;margin:2px 6px;position:relative;
             background:${isActive?'rgba(88,166,255,.15)':''};
             border:${isActive?'1px solid rgba(88,166,255,.35)':'1px solid transparent'};
             transition:all .15s"
      onmouseenter="if(this.dataset.tid!='${activeId}')this.style.background='var(--bg3)';this.querySelector('.dc-del-btn').style.opacity='1'"
      onmouseleave="if(this.dataset.tid!='${activeId}')this.style.background='';this.querySelector('.dc-del-btn').style.opacity='0'">
      <div style="font-size:13px;font-weight:500;color:${isActive?'var(--accent)':'var(--text)'};white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:20px">
        📋 ${escHtml(t.name)}
      </div>
      <div style="font-size:11px;color:var(--text3);margin-top:2px">${t.fields?.length||0} 个字段</div>
      <button class="dc-del-btn" onclick="dcDeleteTable(${t.id},event)"
        style="position:absolute;right:8px;top:8px;background:none;border:none;color:var(--red);cursor:pointer;font-size:15px;opacity:0;transition:opacity .15s;padding:2px 4px">×</button>
    </div>`;
  }).join('');
}

// ── 选择数据表 ────────────────────────────────────────────────
async function dcSelectTable(id) {
  const t = _dcTables.find(x => x.id === id);
  if (!t) return;
  _dcActiveTable = t;
  _dcPage = 1;
  _dcSortBy = 'id';
  _dcSortDir = 'asc';
  dcRenderSidebar(id);
  try { localStorage.setItem(_DC_LAST_KEY, String(id)); } catch(e) {}
  await dcLoadContent();
}

// ── 主内容区 ─────────────────────────────────────────────────
async function dcLoadContent() {
  if (!_dcActiveTable) return;
  const t = _dcActiveTable;

  document.getElementById('dc-empty').style.display = 'none';
  const content = document.getElementById('dc-content');
  content.style.display = 'flex';

  content.innerHTML = `
    <!-- 工具栏 -->
    <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;flex-shrink:0">
      <div style="display:flex;align-items:center;gap:8px">
        <span style="font-size:15px;font-weight:600;color:var(--text)">📋 ${escHtml(t.name)}</span>
        <span style="font-size:12px;color:var(--text3)">${t.fields?.length||0} 个字段</span>
      </div>
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        <button class="btn btn-primary btn-sm" onclick="dcAddRow()">＋ 新增</button>
        <button class="btn btn-sm" onclick="dcImportExcel()">📥 导入Excel</button>
        <button class="btn btn-sm" onclick="dcExport()">📤 导出</button>
        <button class="btn btn-sm" onclick="dcManageFormats()">📐 导入格式</button>
        <button class="btn btn-sm" onclick="dcShareTable()">🔗 分享</button>
        <button class="btn btn-sm" onclick="dcEditTable()">⚙️ 表结构</button>
      </div>
    </div>
    <!-- 搜索栏 -->
    <div class="search-bar" style="flex-shrink:0">
      <input class="search-input" id="dc-search" placeholder="搜索数据…">
      <button class="btn" onclick="dcSearch()">搜索</button>
    </div>
    <!-- 数据表格 -->
    <div style="flex:1;overflow:auto;background:var(--bg2);border:1px solid var(--border);border-radius:10px">
      <div id="dc-table-wrap" style="min-width:100%"></div>
    </div>
    <!-- 分页 -->
    <div id="dc-pagination" style="flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:4px 0"></div>`;

  document.getElementById('dc-search')?.addEventListener('keydown', e => { if(e.key==='Enter') dcSearch(); });
  await dcLoadRows();
}

async function dcLoadRows() {
  if (!_dcActiveTable) return;
  const q = document.getElementById('dc-search')?.value || '';
  const res = await api('GET', `/dc/tables/${_dcActiveTable.id}/rows?q=${encodeURIComponent(q)}&page=${_dcPage}&sort_by=${_dcSortBy}&order=${_dcSortDir}`);
  _dcRows  = res.data  || [];
  _dcTotal = res.total || 0;

  // 更新本地字段定义（可能刚改过）
  if (res.fields) _dcActiveTable.fields = res.fields;
  dcRenderTable();
  dcRenderPagination();
}

function dcSearch() { _dcPage = 1; dcLoadRows(); }

// ── 数据表格渲染 ──────────────────────────────────────────────
function dcRenderTable() {
  const wrap = document.getElementById('dc-table-wrap');
  if (!wrap) return;
  const fields = (_dcActiveTable?.fields || []).filter(f => !f.hidden);
  const canEdit = true;

  if (!_dcRows.length) {
    wrap.innerHTML = `<div style="padding:40px;text-align:center;color:var(--text3)">
      <div style="font-size:32px;margin-bottom:8px">📭</div>暂无数据，点击「新增」添加第一条记录
    </div>`;
    return;
  }

  const thStyle = 'padding:10px 12px;text-align:left;font-size:12px;font-weight:600;color:var(--text3);white-space:nowrap;cursor:pointer;user-select:none;border-bottom:1px solid var(--border)';
  const tdStyle = 'padding:9px 12px;font-size:13px;border-bottom:1px solid var(--border);vertical-align:middle;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap';

  const arrow = fid => {
    if (_dcSortBy !== fid) return ' <span style="color:var(--text3);font-size:10px">⇅</span>';
    return _dcSortDir === 'asc' ? ' <span style="color:var(--accent);font-size:11px">↑</span>' : ' <span style="color:var(--accent);font-size:11px">↓</span>';
  };

  const thead = `<tr>
    <th style="${thStyle}" onclick="dcSetSort('id')">#${arrow('id')}</th>
    ${fields.map(f=>`<th style="${thStyle}" onclick="dcSetSort('${f.id}')">${escHtml(f.name)}${arrow(f.id)}</th>`).join('')}
    <th style="${thStyle}">操作</th>
  </tr>`;

  const tbody = _dcRows.map(row => `
    <tr onmouseenter="this.style.background='var(--bg3)'" onmouseleave="this.style.background=''">
      <td style="${tdStyle};color:var(--text3);font-size:11px">${row.id}</td>
      ${fields.map(f => {
        const v = row[f.id] ?? '';
        return `<td style="${tdStyle}" title="${escHtml(String(v))}">${escHtml(String(v))}</td>`;
      }).join('')}
      <td style="${tdStyle}">
        <button class="btn btn-sm" onclick="dcEditRow(${row.id})">编辑</button>
        <button class="btn btn-sm btn-danger" onclick="dcDeleteRow(${row.id})" style="margin-left:4px">删除</button>
      </td>
    </tr>`).join('');

  wrap.innerHTML = `<table style="width:100%;border-collapse:collapse">
    <thead style="position:sticky;top:0;background:var(--bg2)">${thead}</thead>
    <tbody>${tbody}</tbody>
  </table>`;
}

function dcSetSort(col) {
  if (_dcSortBy === col) _dcSortDir = _dcSortDir === 'asc' ? 'desc' : 'asc';
  else { _dcSortBy = col; _dcSortDir = 'desc'; }
  _dcPage = 1;
  dcLoadRows();
}

function dcRenderPagination() {
  const el = document.getElementById('dc-pagination');
  if (!el) return;
  const totalPages = Math.ceil(_dcTotal / 50) || 1;
  el.innerHTML = `
    <span style="font-size:12px;color:var(--text3)">共 ${_dcTotal} 条</span>
    <div style="display:flex;gap:6px;align-items:center">
      <button class="btn btn-sm" onclick="_dcPage=Math.max(1,_dcPage-1);dcLoadRows()" ${_dcPage<=1?'disabled':''}>‹ 上一页</button>
      <span style="font-size:12px;color:var(--text2)">${_dcPage} / ${totalPages}</span>
      <button class="btn btn-sm" onclick="_dcPage=Math.min(${totalPages},_dcPage+1);dcLoadRows()" ${_dcPage>=totalPages?'disabled':''}>下一页 ›</button>
    </div>`;
}

// ── 新增/编辑行 ───────────────────────────────────────────────
function dcAddRow() {
  dcOpenRowModal(null);
}

async function dcEditRow(rid) {
  const row = _dcRows.find(r => r.id === rid);
  if (row) dcOpenRowModal(row);
}

function dcOpenRowModal(row) {
  if (!_dcActiveTable) return;
  const fields = (_dcActiveTable.fields || []).filter(f => !f.hidden);
  const isEdit = !!row;

  const formRows = fields.map(f => {
    const val = row ? (row[f.id] ?? '') : '';
    const inputType = f.type === 'number' ? 'number' : f.type === 'date' ? 'date' : 'text';
    return `<div class="form-group">
      <label>${escHtml(f.name)}${f.required?'<span style="color:var(--red)"> *</span>':''}</label>
      <input id="dc-field-${f.id}" type="${inputType}" value="${escHtml(String(val))}"
        placeholder="${escHtml(f.name)}"
        style="width:100%;padding:8px;background:var(--bg3);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:13px">
    </div>`;
  }).join('');

  showModal(`
  <div class="modal">
    <div class="modal-header">${isEdit?'编辑记录':'新增记录'}<span class="modal-close" onclick="closeModal()">×</span></div>
    <div class="modal-body">${formRows}</div>
    <div class="modal-footer">
      <button class="btn" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" onclick="dcSaveRow(${row?.id||'null'})">保存</button>
    </div>
  </div>`);
  document.getElementById('modal-close').onclick = closeModal;
}

async function dcSaveRow(rid) {
  if (!_dcActiveTable) return;
  const fields = (_dcActiveTable.fields || []).filter(f => !f.hidden);
  const body = {};
  for (const f of fields) {
    const el = document.getElementById(`dc-field-${f.id}`);
    if (!el) continue;
    const v = el.value.trim();
    if (f.required && !v) { alert(`${f.name} 不能为空`); return; }
    body[f.id] = f.type === 'number' ? (parseFloat(v)||0) : v;
  }
  try {
    if (rid) await api('PUT', `/dc/tables/${_dcActiveTable.id}/rows/${rid}`, body);
    else     await api('POST', `/dc/tables/${_dcActiveTable.id}/rows`, body);
    closeModal();
    await dcLoadRows();
  } catch(e) { alert('保存失败: ' + e.message); }
}

async function dcDeleteRow(rid) {
  if (!confirm('确认删除此行？')) return;
  await api('DELETE', `/dc/tables/${_dcActiveTable.id}/rows/${rid}`);
  await dcLoadRows();
}

// ── 新建数据表（手动）────────────────────────────────────────
function dcNewTable() {
  dcOpenTableModal(null);
}

function dcOpenTableModal(table) {
  const isEdit = !!table;
  const fields = table?.fields || [{ name: '', type: 'text', required: false }];

  const renderFieldRows = (flds) => flds.map((f, i) => `
    <div id="dc-frow-${i}" style="display:flex;gap:6px;align-items:center;margin-bottom:6px">
      <input value="${escHtml(f.name)}" placeholder="字段名称" id="dc-fn-${i}"
        style="flex:1;font-size:12px;padding:5px 8px;background:var(--bg3);border:1px solid var(--border);border-radius:6px;color:var(--text)">
      <select id="dc-ft-${i}" style="width:80px;font-size:12px;padding:5px 6px;background:var(--bg3);border:1px solid var(--border);border-radius:6px;color:var(--text)">
        <option value="text"   ${f.type==='text'  ?'selected':''}>文本</option>
        <option value="number" ${f.type==='number'?'selected':''}>数字</option>
        <option value="date"   ${f.type==='date'  ?'selected':''}>日期</option>
      </select>
      <label title="参与联合去重键：导入时多字段同时相同则视为重复记录"
        style="display:flex;align-items:center;gap:3px;font-size:12px;color:var(--text2);white-space:nowrap;cursor:pointer">
        <input type="checkbox" id="dc-fr-${i}" ${f.required?'checked':''}>必填
      </label>
      <label title="参与联合去重键：导入时指定列相同即视为重复记录"
        style="display:flex;align-items:center;gap:3px;font-size:12px;white-space:nowrap;cursor:pointer;
               color:${f.unique_key?'var(--accent)':'var(--text3)'}">
        <input type="checkbox" id="dc-fu-${i}" ${f.unique_key?'checked':''}
          onchange="this.closest('label').style.color=this.checked?'var(--accent)':'var(--text3)'">🔑去重
      </label>
      <button onclick="dcRemoveFieldRow(${i})" style="background:none;border:none;color:var(--red);cursor:pointer;font-size:16px;padding:0 4px">×</button>
    </div>`).join('');

  showModal(`
  <div class="modal modal-lg">
    <div class="modal-header">${isEdit?'编辑表结构':'新建数据表'}<span class="modal-close" onclick="closeModal()">×</span></div>
    <div class="modal-body">
      <div class="form-group"><label>表名 <span style="color:var(--red)">*</span></label>
        <input id="dc-tname" value="${escHtml(table?.name||'')}" placeholder="如：设备台账、跟进记录"></div>
      <div class="form-group"><label>描述（选填）</label>
        <input id="dc-tdesc" value="${escHtml(table?.description||'')}" placeholder="简要说明用途"></div>
      <div style="font-size:12px;font-weight:600;color:var(--text3);margin-bottom:8px;margin-top:12px">字段定义</div>
      <div id="dc-field-rows">${renderFieldRows(fields)}</div>
      <button onclick="dcAddFieldRow()" style="font-size:12px;color:var(--accent);background:none;border:1px dashed var(--accent);border-radius:6px;padding:3px 10px;cursor:pointer;margin-top:4px">＋ 添加字段</button>
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" onclick="dcSaveTable('${table?.id||''}')">${isEdit?'保存修改':'创建数据表'}</button>
    </div>
  </div>`);
  document.getElementById('modal-close').onclick = closeModal;
}

function dcAddFieldRow() {
  const container = document.getElementById('dc-field-rows');
  const i = container.querySelectorAll('[id^=dc-frow-]').length;
  const div = document.createElement('div');
  div.id = `dc-frow-${i}`;
  div.style.cssText = 'display:flex;gap:6px;align-items:center;margin-bottom:6px';
  div.innerHTML = `
    <input placeholder="字段名称" id="dc-fn-${i}"
      style="flex:1;font-size:12px;padding:5px 8px;background:var(--bg3);border:1px solid var(--border);border-radius:6px;color:var(--text)">
    <select id="dc-ft-${i}" style="width:80px;font-size:12px;padding:5px 6px;background:var(--bg3);border:1px solid var(--border);border-radius:6px;color:var(--text)">
      <option value="text">文本</option><option value="number">数字</option><option value="date">日期</option>
    </select>
    <label style="display:flex;align-items:center;gap:3px;font-size:12px;color:var(--text2);white-space:nowrap;cursor:pointer">
      <input type="checkbox" id="dc-fr-${i}">必填
    </label>
    <label style="display:flex;align-items:center;gap:3px;font-size:12px;color:var(--text3);white-space:nowrap;cursor:pointer"
      title="参与联合去重键">
      <input type="checkbox" id="dc-fu-${i}"
        onchange="this.closest('label').style.color=this.checked?'var(--accent)':'var(--text3)'">🔑去重
    </label>
    <button onclick="this.closest('[id^=dc-frow-]').remove()" style="background:none;border:none;color:var(--red);cursor:pointer;font-size:16px;padding:0 4px">×</button>`;
  container.appendChild(div);
}

function dcRemoveFieldRow(i) {
  document.getElementById(`dc-frow-${i}`)?.remove();
}

async function dcSaveTable(tableId) {
  const name = document.getElementById('dc-tname')?.value?.trim();
  const desc = document.getElementById('dc-tdesc')?.value?.trim() || '';
  if (!name) { alert('表名不能为空'); return; }

  // 收集字段
  const container = document.getElementById('dc-field-rows');
  const rows = container.querySelectorAll('[id^=dc-frow-]');
  const fields = [];
  rows.forEach((row, idx) => {
    const nameEl = row.querySelector(`[id^=dc-fn-]`);
    const typeEl = row.querySelector(`[id^=dc-ft-]`);
    const reqEl  = row.querySelector(`[id^=dc-fr-]`);
    const ukEl   = row.querySelector(`[id^=dc-fu-]`);
    const fn = nameEl?.value?.trim();
    if (fn) {
      const existId = _dcActiveTable?.fields?.[fields.length]?.id;
      fields.push({
        id: existId || `f_${fields.length}`,
        name: fn,
        type: typeEl?.value || 'text',
        required: !!reqEl?.checked,
        unique_key: !!ukEl?.checked,
      });
    }
  });
  if (fields.length === 0) { alert('至少需要一个字段'); return; }

  try {
    if (tableId) {
      await api('PUT', `/dc/tables/${tableId}`, { name, description: desc, fields });
      const idx = _dcTables.findIndex(t => t.id == tableId);
      if (idx >= 0) { _dcTables[idx].name = name; _dcTables[idx].fields = fields; }
      if (_dcActiveTable?.id == tableId) { _dcActiveTable.name = name; _dcActiveTable.fields = fields; }
    } else {
      const res = await api('POST', '/dc/tables', { name, description: desc, fields });
      const listRes = await api('GET', '/dc/tables');
      _dcTables = listRes.data || [];
      dcRenderSidebar();
      closeModal();
      dcSelectTable(res.id);
      return;
    }
    dcRenderSidebar();
    closeModal();
    if (_dcActiveTable?.id == tableId) dcLoadContent();
  } catch(e) { alert('保存失败: ' + e.message); }
}

// ── 编辑表结构 ────────────────────────────────────────────────
function dcEditTable() {
  if (!_dcActiveTable) return;
  dcOpenTableModal(_dcActiveTable);
}

// ── 删除数据表 ────────────────────────────────────────────────
async function dcDeleteTable(id, e) {
  e.stopPropagation();
  const t = _dcTables.find(x => x.id === id);
  if (!confirm(`确认删除数据表「${t?.name}」及其所有数据？此操作不可恢复！`)) return;
  await api('DELETE', `/dc/tables/${id}`);
  _dcTables = _dcTables.filter(x => x.id !== id);
  if (_dcActiveTable?.id === id) {
    _dcActiveTable = null;
    document.getElementById('dc-empty').style.display = '';
    document.getElementById('dc-content').style.display = 'none';
  }
  dcRenderSidebar();
}

async function dcFromExcelConfirm(token, fieldCount) {

// ── 数据中心表分享 ────────────────────────────────────────────
async function dcShareTable() {
  if (!_dcActiveTable) return;
  const t = _dcActiveTable;

  // 检查是否自己创建的
  if (t.created_by && t.created_by !== state.user.user_id && !state.user.is_admin) {
    alert('只有创建者才能管理分享设置');
    return;
  }

  const [usersRes, sharesRes] = await Promise.all([
    api('GET', '/users').catch(() => []),
    api('GET', `/dc/tables/${t.id}/shares`).catch(() => ({ data: [] })),
  ]);
  const users  = usersRes || [];
  const shares = sharesRes.data || [];
  const cur    = shares[0] || null;

  const deptSet  = new Set(users.map(u => u.department).filter(Boolean));
  const deptOpts = [...deptSet].map(d => `<option value="${escHtml(d)}">${escHtml(d)}</option>`).join('');
  const userOpts = users.filter(u => u.id !== state.user.user_id)
    .map(u => `<option value="${u.id}">${escHtml(u.full_name || u.username)}</option>`).join('');

  showModal(`
  <div class="modal" style="max-width:420px">
    <div class="modal-header">🔗 分享「${escHtml(t.name)}」<span class="modal-close" id="modal-close">×</span></div>
    <div class="modal-body">
      <div style="font-size:12px;color:var(--text3);margin-bottom:12px">设置谁可以访问此数据表</div>
      <div style="display:flex;flex-direction:column;gap:10px">
        <label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13px">
          <input type="radio" name="dc-share" value="none" ${!cur?'checked':''}> 仅自己可见
        </label>
        <label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13px">
          <input type="radio" name="dc-share" value="all" ${cur?.share_type==='all'?'checked':''}> 全部成员可见
        </label>
        ${deptOpts ? `<label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13px">
          <input type="radio" name="dc-share" value="dept" ${cur?.share_type==='dept'?'checked':''}> 指定部门：
          <select id="dc-share-dept" style="font-size:12px;padding:3px 6px;background:var(--bg3);border:1px solid var(--border);border-radius:5px;color:var(--text)">
            ${deptOpts}
          </select>
        </label>` : ''}
        ${userOpts ? `<label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13px">
          <input type="radio" name="dc-share" value="user" ${cur?.share_type==='user'?'checked':''}> 指定人员：
          <select id="dc-share-user" style="font-size:12px;padding:3px 6px;background:var(--bg3);border:1px solid var(--border);border-radius:5px;color:var(--text)">
            ${userOpts}
          </select>
        </label>` : ''}
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" onclick="dcSaveShare(${t.id})">保存</button>
    </div>
  </div>`);

  document.getElementById('modal-close').onclick = closeModal;

  // 回填当前分享设置
  if (cur?.share_type === 'user' && cur.target_id) {
    const sel = document.getElementById('dc-share-user');
    if (sel) sel.value = cur.target_id;
  }
}

async function dcSaveShare(tid) {
  const radio = document.querySelector('input[name="dc-share"]:checked');
  if (!radio) return;
  const shareType = radio.value;
  let shares = [];

  if (shareType === 'all') {
    shares = [{ share_type: 'all', target_id: null }];
  } else if (shareType === 'dept') {
    const sel = document.getElementById('dc-share-dept');
    if (sel) shares = [{ share_type: 'dept', target_id: null, dept_name: sel.value }];
  } else if (shareType === 'user') {
    const sel = document.getElementById('dc-share-user');
    if (sel && sel.value) shares = [{ share_type: 'user', target_id: parseInt(sel.value) }];
  }
  // none 时 shares=[] 清空

  try {
    await api('POST', `/dc/tables/${tid}/shares`, { shares });
    closeModal();
    // 若是分享给别人后，本地列表名称可能已经是带标注的，刷新一下
    const listRes = await api('GET', '/dc/tables');
    _dcTables = listRes.data || [];
    dcRenderSidebar();

          <input type="radio" name="dc-share" value="all" ${curType==='all'?'checked':''}> 全部成员可见
        </label>
        ${deptOpts ? `<label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;padding:8px 12px;border-radius:6px;border:1px solid var(--border);background:var(--bg3)">
          <input type="radio" name="dc-share" value="dept" ${curType==='dept'?'checked':''}> 指定部门：
          <select id="dc-share-dept" style="font-size:12px;padding:3px 6px;background:var(--bg2);border:1px solid var(--border);border-radius:5px;color:var(--text)">
            ${deptOpts}
          </select>
        </label>` : ''}
        ${userOpts ? `<label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;padding:8px 12px;border-radius:6px;border:1px solid var(--border);background:var(--bg3)">
          <input type="radio" name="dc-share" value="user" ${curType==='user'?'checked':''}> 指定人员：

async function dcSaveShare(tableId) {
  const radio = document.querySelector('input[name="dc-share"]:checked');
  if (!radio) return;
  const shareType = radio.value;
  let shares = [];

  if (shareType === 'all') {
    shares = [{ share_type: 'all', target_id: null }];
  } else if (shareType === 'dept') {
    const deptName = document.getElementById('dc-share-dept')?.value || '';
    shares = deptName ? [{ share_type: 'dept', target_id: null, dept_name: deptName }] : [];
  } else if (shareType === 'user') {
    const uid = parseInt(document.getElementById('dc-share-user')?.value || '0');
    if (uid) shares = [{ share_type: 'user', target_id: uid }];
  }
  // none 则 shares=[] 清空分享

  try {
    await api('POST', `/dc/tables/${tableId}/shares`, { shares });
    closeModal();
    // 刷新侧边栏（分享名称标注可能改变）
    const listRes = await api('GET', '/dc/tables');
    _dcTables = listRes.data || [];
    dcRenderSidebar();
  } catch(e) { alert('保存失败：' + e.message); }
}

async function dcSaveFormat(tid) {
  const name = document.getElementById('dcfmt-name')?.value?.trim();
  if (!name) { alert('格式名称不能为空'); return; }
  const fields = _dcActiveTable?.fields?.filter(f => !f.hidden) || [];
  const colMap = {};
  fields.forEach(f => {
    const col = document.getElementById(`dcfmt-col-${f.id}`)?.value?.trim();
    if (col) colMap[col] = f.id;
  });
  await api('POST', `/dc/tables/${tid}/formats`, { name, col_map: JSON.stringify(colMap) });
  alert('格式已保存');
  closeModal();
}

async function dcDeleteFormat(tid, fid, btn) {
  if (!confirm('确认删除此格式？')) return;
  await api('DELETE', `/dc/tables/${tid}/formats/${fid}`);
  btn.closest('div[style]').remove();
}

async function dcSaveShare(tid) {
  const radio = document.querySelector('input[name="dc-share"]:checked');

  const shareType = radio.value;
  let shares = [];
  if (shareType === 'all') {
    shares = [{ share_type: 'all', target_id: null }];
  } else if (shareType === 'dept') {
    const sel = document.getElementById('dc-share-dept');

    await api('POST', `/dc/tables/${tid}/shares`, { shares });

function saSwitchTab(tab) {
  ['info','company','settings'].forEach(t => {
    const btn   = document.getElementById(`sa-tab-${t}`);
    const panel = document.getElementById(`sa-panel-${t}`);
    const isActive = t === tab;
    if (btn) {
      btn.style.borderBottomColor = isActive ? 'var(--accent)' : 'transparent';
      btn.style.color = isActive ? 'var(--accent)' : 'var(--text3)';
      btn.style.fontWeight = isActive ? '600' : '500';
    }
    if (panel) panel.style.display = isActive ? '' : 'none';
  });
  if (tab === 'info')     saLoadSysInfo();
  if (tab === 'company')  saLoadCompany();
  if (tab === 'settings') saLoadSettings();
}

// ── 系统信息 ─────────────────────────────────────────────────
async function saLoadSysInfo() {
  const body = document.getElementById('sa-sysinfo-body');
  if (!body) return;
  try {
    const d = await api('GET', '/admin/sysinfo');

    const row = (label, val) => `
      <tr>
        <td style="padding:9px 16px;font-size:13px;color:var(--text3);white-space:nowrap;width:120px">${label}</td>
        <td style="padding:9px 16px;font-size:13px;color:var(--text);font-family:'JetBrains Mono',monospace">${escHtml(String(val||'—'))}</td>
      </tr>`;

    const section = (icon, title, rows) => `
      <div class="card" style="margin-bottom:16px;padding:0;overflow:hidden">
        <div style="padding:12px 16px;background:var(--bg3);border-bottom:1px solid var(--border);
                    font-size:13px;font-weight:700;color:var(--accent);display:flex;align-items:center;gap:8px">
          <span>${icon}</span><span>${title}</span>
        </div>
        <table style="width:100%;border-collapse:collapse">${rows}</table>
      </div>`;

    const mem = d.memory;
    const memPct = mem.pct ? parseFloat(mem.pct).toFixed(1) : '0';
    const memColor = mem.pct > 85 ? 'var(--red)' : mem.pct > 65 ? 'var(--yellow)' : 'var(--green)';
    const memBarRow = `
      <tr>
        <td style="padding:9px 16px;font-size:13px;color:var(--text3);white-space:nowrap;width:120px">使用率</td>
        <td style="padding:9px 16px">
          <div style="background:var(--bg3);border-radius:4px;height:10px;overflow:hidden">
            <div style="height:100%;width:${memPct}%;background:${memColor};border-radius:4px;transition:width .5s"></div>
          </div>
          <div style="font-size:11px;color:var(--text3);margin-top:3px">${memPct}%　已用 ${mem.used_gb} GB / 共 ${mem.total_gb} GB</div>
        </td>
      </tr>`;

    const disk = Array.isArray(d.disk) ? d.disk[0] : d.disk;
    const diskPct = disk?.pct ? parseFloat(disk.pct).toFixed(1) : '0';
    const diskColor = disk?.pct > 85 ? 'var(--red)' : disk?.pct > 65 ? 'var(--yellow)' : '#e6a817';
    const diskBarRow = disk ? `
      <tr>
        <td style="padding:9px 16px;font-size:13px;color:var(--text3);white-space:nowrap;width:120px">${escHtml(disk.mount||'/')}${disk.fs_type?` <span style="color:var(--text3);font-size:11px">(${escHtml(disk.fs_type)})</span>`:''}</td>
        <td style="padding:9px 16px">
          <div style="font-size:13px;color:var(--text);font-family:'JetBrains Mono',monospace;margin-bottom:4px">${disk.used_gb} / ${disk.total_gb} GB</div>
          <div style="background:var(--bg3);border-radius:4px;height:10px;overflow:hidden">
            <div style="height:100%;width:${diskPct}%;background:${diskColor};border-radius:4px"></div>
          </div>
          <div style="font-size:11px;color:var(--text3);margin-top:3px">${diskPct}%</div>
        </td>
      </tr>` : '';

    const cpu = d.cpu;
    const freqStr = (cpu.freq_min_ghz && cpu.freq_max_ghz && cpu.freq_min_ghz !== '0.00')
      ? `${cpu.freq_min_ghz} ~ ${cpu.freq_max_ghz} GHz` : '—';

    body.innerHTML =
      section('💻', '操作系统',
        row('主机名', d.os.hostname) +
        row('系统', d.os.system) +
        row('架构', d.os.arch) +
        row('内核', d.os.kernel || '—') +
        row('运行时间', d.os.uptime || '—')
      ) +
      section('⚙️', 'CPU',
        row('型号', cpu.model || '—') +
        row('物理核心', cpu.phys_cores ? cpu.phys_cores + ' 核' : '—') +
        row('逻辑线程', cpu.logic_cores + ' 线程') +
        row('主频', freqStr)
      ) +
      section('🧠', '内存',
        row('总内存', mem.total_gb > 0 ? mem.total_gb + ' GB' : '—') +
        row('已使用', mem.used_gb  > 0 ? mem.used_gb  + ' GB' : '—') +
        row('可用',   mem.avail_gb > 0 ? mem.avail_gb + ' GB' : '—') +
        memBarRow
      ) +
      section('💾', '磁盘', diskBarRow) +
      section('🚀', '应用信息',
        `<tr>
          <td style="padding:9px 16px;font-size:13px;color:var(--text3);white-space:nowrap;width:120px">软件版本</td>
          <td style="padding:9px 16px;font-size:13px;color:var(--text);font-family:'JetBrains Mono',monospace"
              title="${escHtml(d.go.version)}">${escHtml(String(d.go.app_version||'—'))}</td>
        </tr>` +
        row('构建日期', d.go.build_time  || '—') +
        row('协程数',   d.go.goroutines) +
        row('程序内存', `${d.go.mem_alloc_mb} MB（堆）/ ${d.go.mem_sys_mb} MB（系统申请）`) +
        row('版权所有', d.go.copyright || '—')
      );

  } catch(e) {
    if (body) body.innerHTML = `<div style="padding:20px;color:var(--red)">❌ 加载失败：${e.message}</div>`;
  }
}

// 按组保存设置
async function saSaveGroup(group, btn) {
  const keyMap = {
    ui:      ['logo_title', 'logo_sub'],
    company: ['company_name','bank_account','bank_name','reg_address',
              'tax_number','reg_phone','company_address','contact_phone','contact_name'],
  };
  const keys = keyMap[group] || [];
  const body = {};
  for (const k of keys) {
    const el = document.getElementById(`sa-input-${k}`);
    if (el) body[k] = el.value.trim();
  }
  try {
    await api('PUT', '/admin/settings', body);
    // 界面设置保存后立即刷新侧边栏logo
    if (group === 'ui') saApplyLogoSettings(body);
    const orig = btn.textContent;
    btn.textContent = '✓ 已保存';
    btn.disabled = true;
    setTimeout(() => { btn.textContent = orig; btn.disabled = false; }, 1500);
  } catch(e) { alert('保存失败：' + e.message); }
}

// 应用logo设置到当前页面
function saApplyLogoSettings(s) {
  // 更新state缓存
  if (!state.siteSettings) state.siteSettings = {};
  if (s.logo_title) state.siteSettings.logo_title = s.logo_title;
  if (s.logo_sub)   state.siteSettings.logo_sub   = s.logo_sub;
  try { localStorage.setItem('erp_site_settings', JSON.stringify(state.siteSettings)); } catch(e) {}
  // 直接更新DOM，不用重渲染整个侧边栏
  document.querySelectorAll('.logo-title').forEach(el => el.textContent = s.logo_title || el.textContent);
  document.querySelectorAll('.logo-sub').forEach(el   => el.textContent = s.logo_sub   || el.textContent);
}

async function saToggle(el, key) {
  if (el.dataset.saving) return;  // 防止请求未完成时重复点击
  const isOn  = !!el.dataset.on;
  const newOn = !isOn;

  // 立即更新视觉和状态
  el.dataset.on = newOn ? '1' : '';
  const spans = el.querySelectorAll('span');
  if (spans[0]) spans[0].style.background = newOn ? 'var(--accent)' : 'var(--border)';
  if (spans[1]) spans[1].style.left       = newOn ? '23px' : '3px';

  el.dataset.saving = '1';
  try {
    await api('PUT', '/admin/settings', { [key]: newOn ? 'true' : 'false' });
  } catch(e) {
    // 回滚
    el.dataset.on = isOn ? '1' : '';
    if (spans[0]) spans[0].style.background = isOn ? 'var(--accent)' : 'var(--border)';
    if (spans[1]) spans[1].style.left       = isOn ? '23px' : '3px';
    alert('保存失败：' + e.message);
  }
  delete el.dataset.saving;
}

// CHAT MODULE
// ============================================================

// Chat-specific modal: close without full page reload
function chatCloseModal() {
  const overlay = document.getElementById('chat-modal-overlay');
  if (overlay) overlay.remove();
}

function _chatShowModal(html) {
  chatCloseModal(); // remove any existing
  const overlay = document.createElement('div');
  overlay.id = 'chat-modal-overlay';
  overlay.className = 'modal-overlay';
  overlay.innerHTML = html;
  overlay.onclick = e => { if (e.target === overlay) chatCloseModal(); };
  document.body.appendChild(overlay);
}
const _chat = {
  ws: null,
  convs: [],          // conversation list
  contacts: [],       // all users
  activeGid: null,    // current open group_id
  msgs: {},           // { gid: [msg,...] }
  unread: {},         // { gid: count }
  typing: {},         // { gid: {uid: name, timer} }
  onlineSet: new Set(),
  groupInfo: {},      // { gid: {name,owner_id,is_direct,members} }
  pendingGid: null,   // open this gid after ws ready
};

// ── WebSocket ────────────────────────────────────────────────
function chatWsConnect() {
  if (_chat.ws && _chat.ws.readyState <= 1) return;
  const wsProto = location.protocol === 'https:' ? 'wss' : 'ws';
  const ws = new WebSocket(`${wsProto}://${location.host}/ws/chat?token=${state.token}`);
  _chat.ws = ws;
  ws.onmessage = e => {
    try { chatHandleMsg(JSON.parse(e.data)); } catch(_) {}
  };
  ws.onclose = () => {
    _chat.ws = null;
    setTimeout(() => { if (state.token) chatWsConnect(); }, 3000);
  };
  ws.onerror = () => ws.close();
}

function chatWsSend(type, payload) {
  if (_chat.ws && _chat.ws.readyState === 1)
    _chat.ws.send(JSON.stringify({ type, payload }));
}

function chatHandleMsg(env) {
  switch (env.type) {
    case 'new_msg':      return chatOnNewMsg(env.payload);
    case 'msg_revoked':  return chatOnRevoked(env.payload);
    case 'typing':       return chatOnTyping(env.payload);
    case 'presence':     return chatOnPresence(env.payload);
    case 'unread_summary': return chatOnUnreadSummary(env.payload);
    case 'group_created':
    case 'member_joined':
    case 'member_left':
    case 'group_updated': return chatRefreshConvs();
    case 'error':        return chatShowErr(env.payload?.msg || '操作失败');
  }
}

function chatOnNewMsg(msg) {
  const gid = msg.group_id;
  if (!_chat.msgs[gid]) _chat.msgs[gid] = [];
  _chat.msgs[gid].push(msg);
  const isActive = _chat.activeGid === gid && document.getElementById('chat-root');
  if (isActive) {
    chatWsSend('mark_read', { group_id: gid, last_msg_id: msg.id });
    chatAppendMsg(msg);
    chatScrollBottom();
  } else {
    _chat.unread[gid] = (_chat.unread[gid] || 0) + 1;
    chatUpdateTotalUnread();
  }
  // update conv preview
  chatUpdateConvPreview(msg);
}

function chatOnRevoked(p) {
  const gid = p.group_id;
  if (_chat.msgs[gid]) {
    const m = _chat.msgs[gid].find(x => x.id === p.msg_id);
    if (m) { m.is_revoked = true; m.content = '消息已撤回'; }
  }
  if (_chat.activeGid === gid) chatRenderMsgList();
}

function chatOnTyping(p) {
  const gid = p.group_id;
  if (p.user_id === state.user?.user_id) return;
  if (!_chat.typing[gid]) _chat.typing[gid] = {};
  clearTimeout(_chat.typing[gid][p.user_id]?.timer);
  if (p.typing) {
    _chat.typing[gid][p.user_id] = {
      name: p.sender_name,
      timer: setTimeout(() => {
        if (_chat.typing[gid]) delete _chat.typing[gid][p.user_id];
        chatUpdateTypingHint();
      }, 4000)
    };
  } else {
    delete _chat.typing[gid][p.user_id];
  }
  chatUpdateTypingHint();
}

function chatOnPresence(p) {
  if (p.status === 'online') _chat.onlineSet.add(p.user_id);
  else _chat.onlineSet.delete(p.user_id);
  // update conv list dot
  document.querySelectorAll(`.chat-conv-item[data-gid]`).forEach(el => {
    const pid = parseInt(el.dataset.peer || 0);
    if (pid === p.user_id) {
      const dot = el.querySelector('.online-dot');
      if (dot) dot.style.background = p.status === 'online' ? 'var(--green)' : 'var(--text3)';
    }
  });
  // update group panel header
  chatUpdateHeaderStatus();
}

function chatOnUnreadSummary(data) {
  Object.entries(data).forEach(([gid, n]) => { _chat.unread[parseInt(gid)] = n; });
  chatUpdateTotalUnread();
}

// ── REST helpers ─────────────────────────────────────────────
async function chatLoadContacts() {
  const r = await api('GET', '/chat/contacts');
  _chat.contacts = r.data || [];
}

async function chatLoadConvs() {
  const r = await api('GET', '/chat/conversations');
  _chat.convs = r.data || [];
  // merge unread from server
  _chat.convs.forEach(cv => {
    if (cv.unread > 0 && !(_chat.unread[cv.group_id] > 0))
      _chat.unread[cv.group_id] = cv.unread;
  });
  chatUpdateTotalUnread();
}

async function chatLoadMsgs(gid, before) {
  const q = before ? `?before=${before}` : '';
  const r = await api('GET', `/chat/messages/${gid}${q}`);
  return r.data || [];
}

async function chatLoadGroupInfo(gid) {
  const r = await api('GET', `/chat/groups/${gid}`);
  _chat.groupInfo[gid] = r;
  return r;
}

// ── Conv list rendering ───────────────────────────────────────
function chatRenderConvList(filter) {
  const el = document.getElementById('chat-conv-list');
  if (!el) return;
  let list = _chat.convs;
  if (filter) {
    const q = filter.toLowerCase();
    list = list.filter(cv => cv.name.toLowerCase().includes(q));
  }
  if (!list.length) {
    el.innerHTML = `<div style="padding:24px;text-align:center;color:var(--text3);font-size:13px">暂无会话</div>`;
    return;
  }
  el.innerHTML = list.map(cv => {
    const unread = _chat.unread[cv.group_id] || 0;
    const online = cv.is_direct ? _chat.onlineSet.has(cv.peer_id) : false;
    const avatar = cv.is_direct
      ? `<div style="position:relative;flex-shrink:0">
           ${chatAvatar(cv.name, 40)}
           <span class="online-dot" style="position:absolute;bottom:1px;right:1px;width:9px;height:9px;border-radius:50%;background:${online?'var(--green)':'var(--text3)'};border:2px solid var(--bg2)"></span>
         </div>`
      : `<div style="flex-shrink:0;width:40px;height:40px;border-radius:50%;background:var(--accent2);display:flex;align-items:center;justify-content:center;font-size:16px">👥</div>`;
    const lastMsg = chatConvLastMsg(cv);
    const timeStr = cv.last_time ? chatFmtTime(cv.last_time) : '';
    const active = _chat.activeGid === cv.group_id;
    return `<div class="chat-conv-item${active?' chat-conv-active':''}" data-gid="${cv.group_id}" data-peer="${cv.peer_id||0}"
      onclick="chatOpenConv(${cv.group_id})"
      style="display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer;border-bottom:1px solid var(--border);
             transition:background 0.15s;${active?'background:rgba(88,166,255,0.1)':''}">
      ${avatar}
      <div style="flex:1;min-width:0">
        <div style="display:flex;align-items:center;gap:4px;margin-bottom:2px">
          <span style="font-weight:${unread?'600':'500'};font-size:14px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escHtml(cv.name)}</span>
          <span style="font-size:11px;color:var(--text3);flex-shrink:0">${timeStr}</span>
        </div>
        <div style="display:flex;align-items:center;gap:4px">
          <span style="font-size:12px;color:var(--text3);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escHtml(lastMsg)}</span>
          ${unread?`<span style="background:var(--red);color:#fff;font-size:10px;border-radius:10px;padding:1px 5px;flex-shrink:0">${unread>99?'99+':unread}</span>`:''}
        </div>
      </div>
    </div>`;
  }).join('');
}

function chatConvLastMsg(cv) {
  if (!cv.last_content) return '暂无消息';
  if (cv.last_msg_type === 'image') return '[图片]';
  if (cv.last_msg_type === 'file') return '[文件]';
  if (cv.last_msg_type === 'system') return cv.last_content;
  return cv.last_content.substring(0, 40);
}

function chatUpdateConvPreview(msg) {
  const cv = _chat.convs.find(c => c.group_id === msg.group_id);
  if (cv) {
    cv.last_msg_type = msg.msg_type;
    cv.last_content = msg.content;
    cv.last_time = msg.created_at;
    cv.last_sender_id = msg.sender_id;
    // bubble to top
    _chat.convs = [cv, ..._chat.convs.filter(c => c.group_id !== msg.group_id)];
  } else {
    chatRefreshConvs();
    return;
  }
  chatRenderConvList(document.getElementById('chat-search')?.value);
}

async function chatRefreshConvs() {
  await chatLoadConvs();
  chatRenderConvList(document.getElementById('chat-search')?.value);
}

function chatFilterConvs(q) { chatRenderConvList(q); }

// ── Open conversation ─────────────────────────────────────────
async function chatOpenConv(gid) {
  _chat.activeGid = gid;
  // clear unread
  delete _chat.unread[gid];
  chatUpdateTotalUnread();
  chatRenderConvList(document.getElementById('chat-search')?.value);

  const main = document.getElementById('chat-main');
  if (!main) return;

  // Add chat-open class always; CSS media query decides if slide effect applies
  const root = document.getElementById('chat-root');
  if (root) root.classList.add('chat-open');

  main.innerHTML = `<div style="flex:1;display:flex;align-items:center;justify-content:center;color:var(--text3)">加载中…</div>`;

  // load group info & messages
  const [info, msgs] = await Promise.all([
    chatLoadGroupInfo(gid),
    chatLoadMsgs(gid)
  ]);
  _chat.msgs[gid] = msgs;
  chatWsSend('mark_read', { group_id: gid, last_msg_id: msgs.length ? msgs[msgs.length-1].id : 0 });

  main.innerHTML = chatConvHtml(gid, info);
  chatRenderMsgList();
  chatScrollBottom();
  // 桌面端自动聚焦输入框；手机端不聚焦，避免键盘弹出
  if (!window.matchMedia('(pointer: coarse)').matches) {
    setTimeout(() => document.getElementById('chat-input')?.focus(), 100);
  }
}

// Mobile: back to conv list
function chatBackToList() {
  const root = document.getElementById('chat-root');
  if (root) root.classList.remove('chat-open');
  _chat.activeGid = null;
  // re-render conv list to clear active highlight
  chatRenderConvList(document.getElementById('chat-search')?.value);
}
