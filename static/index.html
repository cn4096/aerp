// 构建格式编辑 Modal 的 HTML
function _bankFmtEditorHtml(f) {
  // 解析 col_map JSON 成行列表
  let pairs = [];
  try {
    const cm = JSON.parse(f.col_map || '{}');
    for (const [k, v] of Object.entries(cm)) pairs.push({ k, v });
  } catch {}
  if (pairs.length === 0) pairs.push({ k: '', v: 0 });

  const fieldOpts = BANK_FIELD_OPTIONS.map(o =>
    `<option value="${o.v}">${o.label}</option>`).join('');

  const pairRows = pairs.map((p, i) => `
    <div class="fmt-pair-row" style="display:flex;gap:8px;margin-bottom:6px;align-items:center">
      <input class="input fmt-col-title" placeholder="Excel列标题" value="${escHtml(p.k)}"
        style="flex:1;min-width:0" />
      <select class="input fmt-field-sel" style="flex:1;min-width:0">
        ${BANK_FIELD_OPTIONS.map(o =>
          `<option value="${o.v}"${o.v===p.v?' selected':''}>${o.label}</option>`).join('')}
      </select>
      <button class="btn btn-sm btn-danger" onclick="this.closest('.fmt-pair-row').remove()" title="删除此行">×</button>
    </div>`).join('');

  return `
    <div class="form-group"><label>格式名称 <span style="color:var(--red)">*</span></label>
      <input class="input" id="fmt-name" value="${escHtml(f.name || '')}" placeholder="如：招商银行标准格式" />
    </div>
    <div class="form-group"><label>说明（可选）</label>
      <input class="input" id="fmt-desc" value="${escHtml(f.description || '')}" placeholder="简短描述此格式来源" />
    </div>
    <div class="form-group">
      <label style="display:flex;align-items:center;gap:8px">
        <input type="checkbox" id="fmt-active" ${(f.is_active===undefined||f.is_active)?'checked':''} />
        启用（导入时自动尝试此格式）
      </label>
    </div>
    <div class="form-group">
      <label style="display:flex;align-items:center;justify-content:space-between">
        列标题映射 <button class="btn btn-sm" id="btn-add-pair">＋ 添加行</button>
      </label>
      <div style="font-size:12px;color:var(--text3);margin-bottom:8px">
        填写 Excel 中的<strong>列标题文字</strong>，选择对应的<strong>数据库字段</strong>
      </div>
      <div id="fmt-pairs-container">${pairRows}</div>
    </div>`;
}

function _bankFmtCollectColMap() {
  const rows = document.querySelectorAll('#fmt-pairs-container .fmt-pair-row');
  const cm = {};
  let valid = true;
  rows.forEach(row => {
    const title = row.querySelector('.fmt-col-title').value.trim();
    const fld = parseInt(row.querySelector('.fmt-field-sel').value);
    if (title) cm[title] = fld;
  });
  // 必须至少有 交易时间(0) + (借方或贷方)
  const vals = Object.values(cm);
  if (!vals.includes(0) || (!vals.includes(1) && !vals.includes(2))) {
    valid = false;
  }
  return valid ? JSON.stringify(cm) : null;
}

async function bankSaveFmt(id) {
  const name = document.getElementById('fmt-name')?.value.trim();
  const desc = document.getElementById('fmt-desc')?.value.trim() || '';
  const active = document.getElementById('fmt-active')?.checked ? 1 : 0;
  if (!name) { alert('请填写格式名称'); return; }
  const colMap = _bankFmtCollectColMap();
  if (!colMap) {
    alert('列映射必须包含「交易时间」，以及「借方金额」或「贷方金额」中至少一个');
    return;
  }
  const body = { name, description: desc, col_map: colMap, is_active: active };
  if (id) {
    await api('PUT', `/bank/formats/${id}`, body);
  } else {
    await api('POST', '/bank/formats', body);
  }
  closeModal();
  // 重新打开设置面板并刷新列表
  await bankOpenFmtSettings();
}

  const res = await api('GET', '/bank/formats');

  await api('PUT', `/bank/formats/${id}`, {
    name: f.name,
    description: f.description,
    col_map: f.col_map,
    is_active: newActive,
  });
  await bankRefreshFmtList();
}

      <div style="font-size:13px;color:var(--text3);margin-bottom:14px">文件：${file.name}（${(file.size/1024/1024).toFixed(1)} MB）</div>
      <div id="imp-step" style="font-size:14px;font-weight:500;margin-bottom:10px">正在上传文件至服务器…</div>
      <div style="background:var(--bg3);border-radius:6px;overflow:hidden;height:8px;margin-bottom:8px">
        <div id="imp-bar" style="height:100%;width:0%;background:var(--accent);border-radius:6px;transition:width .5s ease"></div>
      </div>
      <div id="imp-sub" style="font-size:12px;color:var(--text3)">服务端直接解析，无需前端处理，大文件极速导入…</div>
      <div id="imp-preview" style="display:none;margin-top:18px"></div>
      <div id="imp-result"  style="display:none;margin-top:16px"></div>
    </div>
    <div class="modal-footer" id="imp-footer"></div>
  </div>`);

  const setStep = (text, pct, sub='') => {
    const el=document.getElementById('imp-step');
    const bar=document.getElementById('imp-bar');
    const sub_el=document.getElementById('imp-sub');
    if(el) el.textContent=text;
    if(bar) bar.style.width=pct+'%';
    if(sub_el) sub_el.textContent=sub;
  };

  const unlockClose = () => {
    const cx=document.getElementById('modal-close');
    if(cx){cx.style.opacity='1';cx.style.cursor='pointer';cx.onclick=closeModal;}
  };

  const setResult = (html, success) => {
    const r=document.getElementById('imp-result');
    const bar=document.getElementById('imp-bar');
    if(r){r.style.display='block';r.innerHTML=html;}
    if(bar){bar.style.width='100%';bar.style.background=success?'var(--green)':'var(--red)';}
    document.getElementById('imp-preview').style.display='none';
    document.getElementById('imp-footer').innerHTML =
      `<button class="btn" onclick="closeModal()">关闭</button>`;
    unlockClose();
  };

  try {
    const _t0 = Date.now();
    setStep('上传文件至服务器…', 5, `文件大小 ${(file.size/1024/1024).toFixed(1)} MB，正在传输…`);

    const formData = new FormData();
    formData.append('file', file);

    // ── 第一步：上传解析，获取预览统计 ────────────────────────────────────
    let _tUploadDone = 0;
    const preview = await new Promise((resolve, reject) => {
      const xhr = new XMLHttpRequest();
      xhr.open('POST', '/api/bank/import/file');
      if (state.token) xhr.setRequestHeader('Authorization', 'Bearer ' + state.token);
      xhr.upload.onprogress = e => {
        if (e.lengthComputable) {
          const pct = Math.round((e.loaded / e.total) * 50);
          setStep('上传文件至服务器…', pct,
            `已上传 ${(e.loaded/1024/1024).toFixed(1)} / ${(e.total/1024/1024).toFixed(1)} MB`);
        }
      };
      xhr.upload.onloadend = () => { _tUploadDone = Date.now(); };
      xhr.onload = () => {
        if (xhr.status >= 200 && xhr.status < 300) {
          try { resolve(JSON.parse(xhr.responseText)); }
          catch(e) { reject(new Error('服务器返回非 JSON 响应')); }
        } else {
          try {
            const err = JSON.parse(xhr.responseText);
            reject(new Error(err.error || `HTTP ${xhr.status}`));
          } catch { reject(new Error(`HTTP ${xhr.status}`)); }
        }
      };
      xhr.onerror = () => reject(new Error('网络错误'));
      xhr.send(formData);
    });

    const _tParseDone = Date.now();
    const uploadSec = _tUploadDone ? (_tUploadDone - _t0)/1000 : null;
    const parseSec  = _tUploadDone ? (_tParseDone - _tUploadDone)/1000 : (_tParseDone - _t0)/1000;

    // 如果解析结果为0条有效数据，直接结束
    if (!preview.token) {
      setStep('解析完成', 100, '');
      setResult(`
        <div style="color:var(--text2);font-size:14px;margin-bottom:10px">⚠ 文件解析完成，但未找到有效数据</div>
        <div style="padding:8px 12px;background:rgba(99,179,237,0.08);border:1px solid rgba(99,179,237,0.25);border-radius:6px;font-size:12px;color:var(--text2)">
          📐 格式识别：<strong>${preview.format || '未识别'}</strong>
        </div>`, false);
      return;
    }

    // ── 第二步：显示预览统计，等待用户确认 ───────────────────────────────
    setStep('解析完成，请确认导入', 60, '');

    const hasInvalid = (preview.invalid||0) > 0;
    const invalidHtml = hasInvalid
      ? `<div style="text-align:center;padding:12px 16px;background:rgba(239,68,68,0.07);border:1px solid rgba(239,68,68,0.2);border-radius:8px">
           <div style="font-size:26px;font-weight:700;color:var(--red)">${preview.invalid}</div>
           <div style="font-size:12px;color:var(--text3);margin-top:2px">数据无效</div>
         </div>`
      : '';

    const previewEl = document.getElementById('imp-preview');
    previewEl.style.display = 'block';
    previewEl.innerHTML = `
      <div style="font-size:13px;font-weight:600;color:var(--text2);margin-bottom:12px">📊 导入预览统计</div>

      <!-- 条数统计 -->
      <div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px">
        <div style="flex:1;min-width:80px;text-align:center;padding:12px 10px;background:var(--bg2);border-radius:8px;border:1px solid var(--border)">
          <div style="font-size:26px;font-weight:700;color:var(--text1)">${(preview.total||0).toLocaleString()}</div>
          <div style="font-size:12px;color:var(--text3);margin-top:2px">文件总行数</div>
        </div>
        <div style="flex:1;min-width:80px;text-align:center;padding:12px 10px;background:var(--bg2);border-radius:8px;border:1px solid rgba(72,199,142,0.35)">
          <div style="font-size:26px;font-weight:700;color:var(--green)">${(preview.new_count||0).toLocaleString()}</div>
          <div style="font-size:12px;color:var(--text3);margin-top:2px">将新增条数</div>
        </div>
        <div style="flex:1;min-width:80px;text-align:center;padding:12px 10px;background:var(--bg2);border-radius:8px;border:1px solid var(--border)">
          <div style="font-size:26px;font-weight:700;color:var(--text3)">${(preview.skipped||0).toLocaleString()}</div>
          <div style="font-size:12px;color:var(--text3);margin-top:2px">重复（将跳过）</div>
        </div>
        ${invalidHtml}
      </div>

      <!-- 金额统计 -->
      <div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px">
        <div style="flex:1;min-width:120px;padding:12px 16px;background:rgba(72,199,142,0.07);border:1px solid rgba(72,199,142,0.3);border-radius:8px">
          <div style="font-size:11px;color:var(--text3);margin-bottom:4px">贷方收入合计（新增部分）</div>
          <div style="font-size:20px;font-weight:700;color:var(--green)">¥ ${fmtAmt(preview.total_credit)}</div>
        </div>
        <div style="flex:1;min-width:120px;padding:12px 16px;background:rgba(239,68,68,0.06);border:1px solid rgba(239,68,68,0.25);border-radius:8px">
          <div style="font-size:11px;color:var(--text3);margin-bottom:4px">借方支出合计（新增部分）</div>
          <div style="font-size:20px;font-weight:700;color:var(--red)">¥ ${fmtAmt(preview.total_debit)}</div>
        </div>
      </div>

      <!-- 格式 & 耗时 -->
      <div style="padding:8px 12px;background:rgba(99,179,237,0.06);border:1px solid rgba(99,179,237,0.2);border-radius:6px;font-size:12px;color:var(--text2);line-height:1.8">
        📐 识别格式：<strong>${preview.format || '按列位置'}</strong>
        ${uploadSec !== null ? `&nbsp;·&nbsp; ⏱ 上传 ${fmtT(uploadSec)}，服务端解析 ${fmtT(parseSec)}` : ''}
      </div>
      ${hasInvalid ? `<div style="margin-top:6px;padding:8px 12px;background:rgba(239,68,68,0.06);border:1px solid rgba(239,68,68,0.2);border-radius:6px;font-size:12px;color:var(--text2)">
        ⚠ ${preview.invalid} 条因交易时间无效或借贷金额均为空，将被忽略
      </div>` : ''}
    `;

    // 按钮：确认导入 / 取消
    document.getElementById('imp-footer').innerHTML = `
      <button class="btn btn-secondary" onclick="closeModal()" style="margin-right:8px">取消</button>
      <button class="btn btn-primary" id="imp-confirm-btn" onclick="bankDoConfirmImport('${preview.token}')">
        ✅ 确认导入 ${(preview.new_count||0).toLocaleString()} 条
      </button>
    `;
    unlockClose();

  } catch(e) {
    console.error(e);
    const isProtectedView = e.message && e.message.includes('找不到工作表');
    document.getElementById('imp-preview').style.display='none';
    const bar=document.getElementById('imp-bar');
    if(bar){bar.style.width='100%';bar.style.background='var(--red)';}
    const r=document.getElementById('imp-result');
    if(r){
      r.style.display='block';
      r.innerHTML=`
        <div style="color:var(--red);font-size:14px">❌ 解析失败</div>
        <div style="font-size:12px;margin-top:8px;color:var(--text2)">${e.message}</div>
        ${isProtectedView ? `
        <div style="margin-top:12px;padding:10px 14px;background:rgba(255,193,7,0.1);border:1px solid rgba(255,193,7,0.4);border-radius:6px;font-size:12px;color:var(--text2);line-height:1.8">
          💡 <strong>解决方法：</strong>文件从网络下载时 Excel 会以「受保护的视图」打开。<br>
          请用 Excel 打开该文件 → 点击顶部黄色提示栏的 <strong>【启用编辑】</strong> → 保存文件 → 重新导入
        </div>` : ''}`;
    }
    document.getElementById('imp-footer').innerHTML = `<button class="btn" onclick="closeModal()">关闭</button>`;
    unlockClose();
  }
}

// ── 第三步：用户点「确认导入」，凭 token 真正写库 ─────────────────────────
async function bankDoConfirmImport(token) {
  const btn = document.getElementById('imp-confirm-btn');
  if(btn){ btn.disabled=true; btn.textContent='导入中…'; }

  const bar = document.getElementById('imp-bar');
  if(bar){ bar.style.width='80%'; bar.style.background='var(--accent)'; }

  const setStep = (text, pct, sub='') => {
    const el=document.getElementById('imp-step');
    const s=document.getElementById('imp-sub');
    if(el) el.textContent=text;
    if(bar) bar.style.width=pct+'%';
    if(s) s.textContent=sub;
  };

  const fmtT = s => s >= 60 ? `${Math.floor(s/60)}m ${(s%60).toFixed(1)}s` : `${s.toFixed(1)}s`;

  try {
    setStep('正在写入数据库…', 85, '');
    const _t0 = Date.now();
    const res = await api('POST', '/bank/import/confirm', { token });
    const elapsed = (Date.now() - _t0) / 1000;

    setStep('导入完成', 100, '');
    if(bar) bar.style.background = 'var(--green)';

    // 刷新年份列表和数据
    const yr = await api('GET', '/bank/years');
    _bankYearList = yr.years || [];
    const sel = document.getElementById('bank-year-sel');
    if(sel && _bankYearList.length){
      _bankYears = [];
      sel.innerHTML = _bankYearList.map(y=>`<option value="${y}">${y}年</option>`).join('')
        + `<option value="__more__">📅 更多…</option>
           <option value="__all__" selected>🔍 显示全部</option>`;
    }
    bankRefreshAll();

    const invalidHtml = (res.invalid||0) > 0
      ? `<div style="text-align:center;padding:10px;background:rgba(239,68,68,0.07);border:1px solid rgba(239,68,68,0.2);border-radius:8px">
           <div style="font-size:26px;font-weight:700;color:var(--red)">${res.invalid}</div>
           <div style="font-size:12px;color:var(--text3)">数据无效</div>
         </div>` : '';

    const previewEl = document.getElementById('imp-preview');
    if(previewEl) previewEl.style.display='none';
    const r = document.getElementById('imp-result');
    if(r){
      r.style.display='block';
      r.innerHTML=`
        <div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:12px">
          <div style="flex:1;min-width:80px;text-align:center;padding:12px 10px;background:rgba(72,199,142,0.07);border:1px solid rgba(72,199,142,0.3);border-radius:8px">
            <div style="font-size:26px;font-weight:700;color:var(--green)">${(res.imported||0).toLocaleString()}</div>
            <div style="font-size:12px;color:var(--text3);margin-top:2px">成功导入</div>
          </div>
          <div style="flex:1;min-width:80px;text-align:center;padding:12px 10px;background:var(--bg2);border-radius:8px;border:1px solid var(--border)">
            <div style="font-size:26px;font-weight:700;color:var(--text3)">${(res.skipped||0).toLocaleString()}</div>
            <div style="font-size:12px;color:var(--text3);margin-top:2px">跳过（重复）</div>
          </div>
          ${invalidHtml}
          <div style="flex:1;min-width:80px;text-align:center;padding:12px 10px;background:var(--bg2);border-radius:8px;border:1px solid var(--border)">
            <div style="font-size:26px;font-weight:700;color:var(--accent)">${fmtT(elapsed)}</div>
            <div style="font-size:12px;color:var(--text3);margin-top:2px">写库耗时</div>
          </div>
        </div>
        <div style="padding:8px 12px;background:rgba(99,179,237,0.06);border:1px solid rgba(99,179,237,0.2);border-radius:6px;font-size:12px;color:var(--text2)">
          📐 识别格式：<strong>${res.format || '按列位置'}</strong>
        </div>
        ${(res.invalid||0)>0 ? `<div style="margin-top:6px;padding:8px 12px;background:rgba(239,68,68,0.06);border:1px solid rgba(239,68,68,0.2);border-radius:6px;font-size:12px;color:var(--text2)">⚠ ${res.invalid} 条因交易时间无效或借贷金额均为空被忽略</div>` : ''}
      `;
    }
    document.getElementById('imp-footer').innerHTML = `<button class="btn" onclick="closeModal()">关闭</button>`;
    const cx=document.getElementById('modal-close');
    if(cx){cx.style.opacity='1';cx.style.cursor='pointer';cx.onclick=closeModal;}

  } catch(e) {
    console.error(e);
    if(bar) bar.style.background = 'var(--red)';
    if(btn){ btn.disabled=false; btn.textContent='重试'; }
    alert('导入失败：' + e.message);
  }
}

// ── 状态 ─────────────────────────────────────────────────────
let _rptSources   = [];          // 数据源元数据
let _rptSavedList = [];          // 已保存报表列表
let _rptChart     = null;        // 当前 ECharts 实例
let _rptEditingId = null;        // 正在编辑的报表 id（null=新建）
let _rptLoadingId = null;        // 当前正在加载的报表 id（并发保护）
const _RPT_LAST_KEY = 'erp_last_report_id';  // localStorage key：上次打开的报表 id

// 当前配置（与后端 reportConfig 对应）
const _rptCfg = {
  source: '',
  filters: [],
  filter_logic: [],  // 相邻筛选条件间的逻辑：'AND'|'OR'，长度 = filters.length - 1
  dimensions: [],
  values: [],
  chart: { type: 'bar', x: '', y: '', series: '', show_table: true },  // series: 系列维度别名；show_table: 是否显示数据明细
  sort: { field: '', dir: 'desc' },
  limit: 500,
  panelHeight: 0,
};

// ── 工具 ─────────────────────────────────────────────────────
function _rptGetTheme() {
  const s = getComputedStyle(document.documentElement);
  const g = v => s.getPropertyValue(v).trim();
  return {
    bg:      g('--bg2')   || '#1c2128',
    text:    g('--text')  || '#e6edf3',
    text2:   g('--text2') || '#8b949e',
    text3:   g('--text3') || '#6e7681',
    border:  g('--border')|| '#30363d',
    accent:  g('--accent')|| '#58a6ff',
    green:   g('--green') || '#3fb950',
    red:     g('--red')   || '#f85149',
    yellow:  g('--yellow')|| '#d29922',
  };
}

function _rptSourceMeta(sid) {
  return _rptSources.find(s => s.id === sid) || null;
}

function _rptFieldMeta(sid, fid) {
  const src = _rptSourceMeta(sid);
  return src ? (src.fields.find(f => f.id === fid) || null) : null;
}

function _rptCloneCfg() {
  return JSON.parse(JSON.stringify(_rptCfg));
}

          <span style="font-size:14px;font-weight:600;color:var(--text)">⚙️ 报表配置</span>

// ── 左侧已保存报表渲染 ───────────────────────────────────────
function _rptRenderSavedList() {
  const el = document.getElementById('rpt-list-inner');
  if (!el) return;
  if (!_rptSavedList.length) {
    el.innerHTML = `<div style="padding:20px 14px;color:var(--text3);font-size:12px;text-align:center">暂无已保存报表<br>点击「新建报表」开始</div>`;
    return;
  }
  el.innerHTML = _rptSavedList.map(r => `
    <div class="rpt-saved-item" data-rid="${r.id}" style="padding:8px 14px;cursor:pointer;border-radius:6px;margin:1px 6px;transition:background .15s"
         onmouseenter="this.style.background='var(--bg3)'" onmouseleave="this.style.background=''"
         onclick="rptLoadSaved(${r.id})">
      <div style="font-size:13px;font-weight:500;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${escHtml(r.name)}</div>
      ${r.description ? `<div style="font-size:11px;color:var(--text3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${escHtml(r.description)}</div>` : ''}
      <div style="font-size:11px;color:var(--text3);margin-top:3px">${(r.updated_at||'').slice(0,10)}</div>
    </div>`).join('');
}

function escHtml(s) {
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── 配置表单渲染 ──────────────────────────────────────────────
function _rptRenderConfigForm() {
  const src = _rptSourceMeta(_rptCfg.source);
  const fields = src ? src.fields : [];

  const sourceOpts = _rptSources.map(s =>
    `<option value="${s.id}" ${_rptCfg.source===s.id?'selected':''}>${s.label}</option>`
  ).join('');

  const fOpts = (extra='', filterFn=null) => {
    const list = filterFn ? fields.filter(filterFn) : fields;
    return `<option value="">-- 选择字段 --</option>` +
      list.map(f => `<option value="${f.id}" ${extra===f.id?'selected':''}>${f.label}（${f.type==='number'?'数值':f.type==='datetime'?'时间':'文本'}）</option>`).join('');
  };

  // 维度行
  const dimRows = _rptCfg.dimensions.map((d,i) => {
    const meta = _rptFieldMeta(_rptCfg.source, d.field);
    const isDatetime = meta && meta.type === 'datetime';
    return `<div style="display:flex;gap:6px;align-items:center;margin-bottom:6px">
      <select onchange="_rptCfg.dimensions[${i}].field=this.value;_rptCfg.dimensions[${i}].alias=this.options[this.selectedIndex]?.text.split('（')[0]||'';_rptRefreshForm()" style="flex:1;font-size:12px;padding:4px 6px;background:var(--bg3);border:1px solid var(--border);border-radius:6px;color:var(--text)">
        ${fOpts(d.field)}
      </select>
      ${isDatetime ? `<select onchange="_rptCfg.dimensions[${i}].truncate=this.value" style="width:80px;font-size:12px;padding:4px 6px;background:var(--bg3);border:1px solid var(--border);border-radius:6px;color:var(--text)">
        <option value="" ${d.truncate===''?'selected':''}>原始</option>
        <option value="year" ${d.truncate==='year'?'selected':''}>按年</option>
        <option value="month" ${d.truncate==='month'?'selected':''}>按月</option>
        <option value="day" ${d.truncate==='day'?'selected':''}>按日</option>
      </select>` : ''}
      <input value="${escHtml(d.alias)}" placeholder="别名" data-dim-alias="${i}"
        oninput="_rptCfg.dimensions[${i}].alias=this.value"
        style="width:90px;font-size:12px;padding:4px 6px;background:var(--bg3);border:1px solid var(--border);border-radius:6px;color:var(--text)">
      <button onclick="_rptCfg.dimensions.splice(${i},1);_rptRefreshForm()" style="background:none;border:none;color:var(--red);cursor:pointer;font-size:16px;line-height:1;padding:0 4px">×</button>
    </div>`;
  }).join('');

  // 指标行
  const aggOpts = ['SUM','COUNT','AVG','MAX','MIN'];
  const valRows = _rptCfg.values.map((v,i) => `
    <div style="display:flex;gap:6px;align-items:center;margin-bottom:6px">
      <select onchange="_rptCfg.values[${i}].field=this.value;_rptCfg.values[${i}].alias=(this.options[this.selectedIndex]?.text.split('（')[0]||'')+' '+_rptCfg.values[${i}].agg;_rptSyncYDefaults();_rptRefreshForm()" style="flex:1;font-size:12px;padding:4px 6px;background:var(--bg3);border:1px solid var(--border);border-radius:6px;color:var(--text)">
        ${fOpts(v.field, f => f.type === 'number')}
      </select>
      <select onchange="_rptCfg.values[${i}].agg=this.value" style="width:80px;font-size:12px;padding:4px 6px;background:var(--bg3);border:1px solid var(--border);border-radius:6px;color:var(--text)">
        ${aggOpts.map(a=>`<option value="${a}" ${v.agg===a?'selected':''}>${a}</option>`).join('')}
      </select>
      <input value="${escHtml(v.alias)}" placeholder="别名" data-val-alias="${i}"
        oninput="_rptCfg.values[${i}].alias=this.value;_rptSyncYDefaults();_rptUpdateYFields()"
        style="width:90px;font-size:12px;padding:4px 6px;background:var(--bg3);border:1px solid var(--border);border-radius:6px;color:var(--text)">
      <button onclick="_rptCfg.values.splice(${i},1);_rptSyncYDefaults();_rptRefreshForm()" style="background:none;border:none;color:var(--red);cursor:pointer;font-size:16px;line-height:1;padding:0 4px">×</button>
    </div>`).join('');

  // 筛选行
  const opsMap = {
    '=':        '等于',
    '!=':       '不等于',
    '>':        '大于',
    '>=':       '≥ 大于等于',
    '<':        '小于',
    '<=':       '≤ 小于等于',
    'LIKE':     '包含',
    'NOT LIKE': '不包含',
    'LIKE_ANY': '包含任意',
  };
  // 根据操作符类型给出合适的 placeholder 提示
  const opPlaceholder = op => {
    if (op === 'LIKE' || op === 'NOT LIKE') return '关键字（自动加%）';
    if (op === 'LIKE_ANY') return '关键字1 关键字2（空格或逗号分隔）';
    if (op === '>' || op === '>=' || op === '<' || op === '<=') return '数字 或 日期';
    return '值';
  };
  const filterRows = _rptCfg.filters.map((f,i) => {
    const logicBadge = i < _rptCfg.filters.length - 1 ? (() => {

      const isAnd = logic === 'AND';
      return `<div style="display:flex;justify-content:center;margin:2px 0">
        <button onclick="_rptCfg.filter_logic[${i}]=(_rptCfg.filter_logic[${i}]||'AND')==='AND'?'OR':'AND';_rptRefreshForm()"

    <div>
      <div style="display:flex;gap:6px;align-items:center;margin-bottom:2px">

          ${fOpts(f.field)}

        <select data-filter-op="${i}" onchange="_rptCfg.filters[${i}].op=this.value;_rptRefreshForm()" style="width:88px;font-size:12px;padding:4px 6px;background:var(--bg3);border:1px solid var(--border);border-radius:6px;color:var(--text)">

        </select>
        <input value="${escHtml(f.value)}" placeholder="${opPlaceholder(f.op)}" data-filter-value="${i}"
          oninput="_rptCfg.filters[${i}].value=this.value"
          style="width:120px;font-size:12px;padding:4px 6px;background:var(--bg3);border:1px solid var(--border);border-radius:6px;color:var(--text)">
        <button onclick="_rptCfg.filters.splice(${i},1);_rptCfg.filter_logic.splice(${i}<_rptCfg.filter_logic.length?${i}:${i}-1,1);_rptRefreshForm()" style="background:none;border:none;color:var(--red);cursor:pointer;font-size:16px;line-height:1;padding:0 4px">×</button>

  // 所有已有别名（用于图表轴选择）
  const allAliases = [
    ..._rptCfg.dimensions.map(d=>d.alias).filter(Boolean),
    ..._rptCfg.values.map(v=>v.alias).filter(Boolean),
  ];
  const aliasOpts = (sel='') => allAliases.map(a=>`<option value="${a}" ${a===sel?'selected':''}>${a}</option>`).join('');

  const chartTypes = [
    {v:'bar',l:'柱状图'},{v:'line',l:'折线图'},{v:'pie',l:'饼图'},

  return `
  <div style="display:flex;flex-wrap:wrap;gap:16px">
    <!-- 数据源 -->
