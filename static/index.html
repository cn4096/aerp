<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智云 ERP · 企业管理系统</title>

<!-- Google Fonts: non-blocking -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=JetBrains+Mono:wght@400;600&display=swap"></noscript>

<style>
  /* ── Base ── */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    font-family: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    font-size: 14px;
    line-height: 1.5;
  }

  /* ── CSS Variables (mapped to Tailwind dark/light) ── */
  :root {
    --bg:      #f6f8fa;
    --bg2:     #ffffff;
    --bg3:     #f0f2f5;
    --bg4:     #e8eaed;
    --border:  #d0d7de;
    --text:    #1f2328;
    --text2:   #57606a;
    --text3:   #8c959f;
    --text1:   #1f2328;
    --accent:  #0969da;
    --accent2: #0550ae;
    --green:   #1a7f37;
    --red:     #cf222e;
    --yellow:  #9a6700;
    --purple:  #8250df;
    --orange:  #bc4c00;
    --teal:    #1a7f37;
    --radius:  8px;
    --shadow:  0 8px 24px rgba(0,0,0,0.12);
  }
  .dark {
    --bg:      #0d1117;
    --bg2:     #161b22;
    --bg3:     #1c2128;
    --bg4:     #21262d;
    --border:  #30363d;
    --text:    #e6edf3;
    --text2:   #8b949e;
    --text3:   #656d76;
    --text1:   #e6edf3;
    --accent:  #58a6ff;
    --accent2: #1f6feb;
    --green:   #3fb950;
    --red:     #f85149;
    --yellow:  #d29922;
    --purple:  #bc8cff;
    --orange:  #ffa657;
    --teal:    #39d353;
    --shadow:  0 8px 24px rgba(0,0,0,0.4);
  }

  /* ── Layout ── */
  #app { display: flex; height: 100vh; overflow: hidden; background: var(--bg); }

  /* ── Sidebar ── */
  #sidebar {
    width: 220px;
    min-width: 44px;
    max-width: 220px;
    background: var(--bg2);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    overflow-x: hidden;
    transition: none;
    z-index: 40;
    position: relative;
    flex-shrink: 0;
  }
  /* 拖动条 */
  #sidebar-resize-handle {
    position: absolute;
    top: 0; right: 0; bottom: 0;
    width: 6px;
    cursor: ew-resize;
    z-index: 50;
    background: transparent;
    transition: background .15s;
  }
  #sidebar-resize-handle:hover,
  #sidebar-resize-handle.dragging {
    background: rgba(88,166,255,.25);
  }
  /* 折叠态：隐藏文字和分组标题 */
  #sidebar.sidebar-collapsed .nav-label,
  #sidebar.sidebar-collapsed .logo-title,
  #sidebar.sidebar-collapsed .logo-sub,
  #sidebar.sidebar-collapsed .user-name,
  #sidebar.sidebar-collapsed .user-role {
    display: none;
  }
  /* 折叠态：分组标题变成细线分隔 */
  #sidebar.sidebar-collapsed .nav-section {
    font-size: 0;
    padding: 0;
    margin: 4px 8px;
    height: 1px;
    background: var(--border);
    border: none;
  }
  #sidebar.sidebar-collapsed .nav-item {
    justify-content: center;
    padding: 9px 0;
    margin: 1px 4px;
  }
  #sidebar.sidebar-collapsed .logo {
    justify-content: center;
    padding: 16px 0;
  }
  #sidebar.sidebar-collapsed .user-info {
    justify-content: center;
    padding: 8px 0;
  }
  #sidebar.sidebar-collapsed .avatar {
    margin: 0;
  }
  /* Desktop: hamburger and close btn hidden */
  .hamburger { display: none; }
  #sidebar-close-btn { display: none; }
  #sidebar-overlay { display: none; }

  /* Mobile: sidebar as full-height drawer */
  @media (max-width: 768px) {
    .hamburger {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #sidebar {
      position: fixed;
      top: 0; left: 0; bottom: 0;
      width: 260px;
      transform: translateX(-100%);
      box-shadow: 4px 0 24px rgba(0,0,0,0.35);
    }
    #sidebar.open {
      transform: translateX(0);
    }
    #sidebar-close-btn {
      display: block;
    }
    #sidebar-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 39;
    }
    #sidebar-overlay.open {
      display: block;
    }
  }

  .logo { padding: 20px 16px 16px; border-bottom: 1px solid var(--border); }
  .logo-title { font-size: 18px; font-weight: 700; color: var(--accent); letter-spacing: 1px; }
  .logo-sub { font-size: 11px; color: var(--text3); margin-top: 2px; font-family: 'JetBrains Mono', 'Courier New', monospace; }
  .nav-section { padding: 12px 8px 4px; font-size: 11px; color: var(--text3); text-transform: uppercase; letter-spacing: 1px; font-weight: 500; }
  .nav-item { display: flex; align-items: center; gap: 10px; padding: 9px 12px; margin: 1px 8px; border-radius: 6px; cursor: pointer; color: var(--text2); transition: all 0.15s; font-size: 13.5px; }
  .nav-item:hover { background: var(--bg3); color: var(--text); }
  .nav-item.active { background: rgba(88,166,255,0.12); color: var(--accent); }
  .dark .nav-item.active { background: rgba(88,166,255,0.12); }
  .light .nav-item.active, html:not(.dark) .nav-item.active { background: rgba(9,105,218,0.1); color: var(--accent); }
  .nav-item .icon { font-size: 16px; width: 20px; text-align: center; }
  .user-area { margin-top: auto; border-top: 1px solid var(--border); padding: 12px; }
  .user-info { display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 6px; cursor: pointer; }
  .user-info:hover { background: var(--bg3); }
  .avatar { width: 32px; height: 32px; background: var(--accent2); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; color: white; flex-shrink: 0; }
  .user-name { font-size: 13px; font-weight: 500; color: var(--text); }
  .user-role { font-size: 11px; color: var(--text3); }

  /* ── Main ── */
  #main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .topbar { height: 52px; background: var(--bg2); border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 20px; gap: 12px; }
  .page-title { font-size: 16px; font-weight: 600; flex: 1; color: var(--text); }
  .topbar-actions { display: flex; gap: 8px; align-items: center; }
  .content { flex: 1; overflow-y: auto; padding: 20px; background: var(--bg); }

  /* ── Auth ── */
  .auth-page { min-height: 100vh; background: var(--bg); display: flex; align-items: center; justify-content: center; }
  .auth-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; padding: 40px; width: 380px; box-shadow: var(--shadow); }
  @media (max-width: 480px) { .auth-card { width: 92vw; padding: 28px 20px; } }
  .auth-logo { text-align: center; margin-bottom: 28px; }
  .auth-logo-text { font-size: 28px; font-weight: 700; color: var(--accent); }
  .auth-logo-sub { font-size: 12px; color: var(--text3); margin-top: 4px; }
  /* 登录页输入框圆角稍大 */
  .auth-card input { border-radius: 8px; font-size: 15px; }

  /* ── Cards ── */
  .card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 16px; }
  .card-title { font-size: 15px; font-weight: 600; margin-bottom: 14px; padding-bottom: 10px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; color: var(--text); }

  /* ── Stat cards ── */
  .stats-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; margin-bottom: 20px; }
  @media (max-width: 480px) { .stats-grid { grid-template-columns: repeat(2, 1fr); } }
  .stat-card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; transition: border-color 0.2s; }
  .stat-card:hover { border-color: var(--accent2); }
  .stat-icon { font-size: 22px; margin-bottom: 8px; }
  .stat-value { font-size: 24px; font-weight: 700; font-family: 'JetBrains Mono', 'Courier New', monospace; color: var(--text); }
  .stat-label { font-size: 12px; color: var(--text3); margin-top: 2px; }
  .stat-card.green .stat-value { color: var(--green); }
  .stat-card.blue .stat-value  { color: var(--accent); }
  .stat-card.yellow .stat-value{ color: var(--yellow); }
  .stat-card.red .stat-value   { color: var(--red); }
  .stat-card.purple .stat-value{ color: var(--purple); }
  .stat-card.orange .stat-value{ color: var(--orange); }

  /* ── Forms ── */
  .form-group { margin-bottom: 14px; }
  label { display: block; font-size: 12px; color: var(--text2); margin-bottom: 5px; font-weight: 500; }
  input, select, textarea {
    width: 100%;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 9px 12px 9px 12px;
    color: var(--text);
    font-size: 14px;
    font-family: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    outline: none;
    transition: border-color 0.15s;
    box-sizing: border-box;
  }
  textarea { height: auto; resize: vertical; min-height: 80px; }
  select { appearance: auto; }
  input:focus, select:focus, textarea:focus { border-color: var(--accent); }
  select option { background: var(--bg3); }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .form-row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
  @media (max-width: 600px) { .form-row, .form-row-3 { grid-template-columns: 1fr; } }

  /* ── Buttons ── */
  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: 6px; border: 1px solid var(--border); cursor: pointer; font-size: 13px; font-family: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif; font-weight: 500; transition: all 0.15s; background: var(--bg3); color: var(--text); }
  .btn:hover { background: var(--bg4); border-color: var(--text3); }
  .btn-primary { background: var(--accent2); border-color: var(--accent); color: white; }
  .btn-primary:hover { background: var(--accent); }
  .btn-danger { background: rgba(248,81,73,0.12); border-color: var(--red); color: var(--red); }
  .btn-danger:hover { background: rgba(248,81,73,0.25); }
  .btn-success { background: rgba(63,185,80,0.12); border-color: var(--green); color: var(--green); }
  .btn-success:hover { background: rgba(63,185,80,0.25); }
  .btn-sm { padding: 4px 10px; font-size: 12px; }
  .btn-lg { padding: 10px 20px; font-size: 15px; width: 100%; justify-content: center; }

  /* ── Table ── */
  .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; padding: 10px 12px; font-size: 12px; color: var(--text3); font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  td { padding: 10px 12px; border-bottom: 1px solid rgba(48,54,61,0.5); font-size: 13.5px; vertical-align: middle; color: var(--text); }
  tr:hover td { background: rgba(255,255,255,0.02); }
  tr:last-child td { border-bottom: none; }

  /* ── Badges ── */
  .badge { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 600; letter-spacing: 0.3px; }
  .badge-green  { background: rgba(63,185,80,0.15);  color: var(--green); }
  .badge-blue   { background: rgba(88,166,255,0.15); color: var(--accent); }
  .badge-yellow { background: rgba(210,153,34,0.15); color: var(--yellow); }
  .badge-red    { background: rgba(248,81,73,0.15);  color: var(--red); }
  .badge-gray   { background: rgba(139,148,158,0.15);color: var(--text2); }

  /* ── Modal ── */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: flex; align-items: center; justify-content: center; z-index: 1000; backdrop-filter: blur(4px); animation: fadeIn 0.15s; }
  @keyframes fadeIn { from { opacity: 0; } }
  .modal { background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; width: min(600px, 95vw); max-height: 90vh; overflow-y: auto; box-shadow: var(--shadow); animation: slideUp 0.2s; }
  .modal-lg { width: min(800px, 95vw); }
  @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } }
  .modal-header { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; font-size: 15px; font-weight: 600; position: sticky; top: 0; background: var(--bg2); z-index: 1; color: var(--text); }
  .modal-close { cursor: pointer; color: var(--text3); font-size: 20px; line-height: 1; }
  .modal-close:hover { color: var(--text); }
  .modal-body { padding: 20px; }
  .modal-footer { padding: 12px 20px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 8px; background: var(--bg2); position: sticky; bottom: 0; }

  /* ── Chat ── */
  #chat-conv-list::-webkit-scrollbar, #chat-msg-list::-webkit-scrollbar { width: 4px; }
  #chat-conv-list::-webkit-scrollbar-thumb, #chat-msg-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  .chat-conv-item:hover { background: rgba(255,255,255,0.03); }
  .chat-conv-active { background: rgba(88,166,255,0.1) !important; }

  /* ── Chat mobile: full-screen panel switching ── */
  @media (max-width: 768px) {
    #chat-root { position: relative; overflow: hidden; }

    /* 会话列表：默认全屏显示 */
    #chat-sidebar {
      position: absolute !important;
      inset: 0 !important;
      width: 100% !important;
      min-width: unset !important;
      z-index: 2;
      transform: translateX(0);
      transition: transform 0.28s cubic-bezier(.4,0,.2,1);
    }
    /* 进入聊天时，会话列表滑出左侧 */
    #chat-root.chat-open #chat-sidebar {
      transform: translateX(-100%);
    }

    /* 聊天主窗口：默认在右侧屏幕外 */
    #chat-main {
      position: absolute !important;
      inset: 0 !important;
      z-index: 3;
      transform: translateX(100%);
      transition: transform 0.28s cubic-bezier(.4,0,.2,1);
      background: var(--bg);
    }
    /* 进入聊天时，主窗口滑入 */
    #chat-root.chat-open #chat-main {
      transform: translateX(0);
    }

    /* 聊天头部加返回按钮 */
    #chat-back-btn { display: flex !important; align-items: center; }

    /* 输入区字体放大，防止iOS自动缩放 */
    #chat-input { font-size: 16px !important; }
  }
  @media (min-width: 769px) {
    #chat-back-btn { display: none !important; }
  }

  /* ── Search bar ── */
  .search-bar { display: flex; gap: 8px; margin-bottom: 16px; align-items: center; flex-wrap: wrap; }
  .search-input { flex: 1; max-width: 320px; min-width: 160px; }

  /* ── Status checks ── */
  .status-checks { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .status-check { display: flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 20px; border: 1px solid var(--border); cursor: pointer; font-size: 12px; font-weight: 500; transition: all 0.15s; user-select: none; color: var(--text2); }
  .status-check input { display: none; }
  .status-check.checked { background: rgba(88,166,255,0.12); border-color: var(--accent); color: var(--accent); }

  /* ── Quote items ── */
  .quote-item { background: var(--bg3); border: 1px solid var(--border); border-radius: 6px; padding: 12px; margin-bottom: 8px; }
  .quote-item-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }

  /* ── Misc ── */
  .mono { font-family: 'JetBrains Mono', 'Courier New', monospace; }
  .alert { padding: 10px 14px; border-radius: 6px; font-size: 13px; margin-bottom: 12px; }
  .alert-error   { background: rgba(248,81,73,0.12);  border: 1px solid rgba(248,81,73,0.3);  color: var(--red); }
  .alert-success { background: rgba(63,185,80,0.12);  border: 1px solid rgba(63,185,80,0.3);  color: var(--green); }
  .contract-status-row { display: flex; gap: 4px; flex-wrap: wrap; }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .status-dot.on  { background: var(--green); }
  .status-dot.off { background: var(--border); }

  /* ── Finance / Dashboard ── */
  .finance-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 20px; }
  @media (max-width: 640px) { .finance-row { grid-template-columns: 1fr; } }
  .finance-card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; }
  .finance-card .amount { font-size: 28px; font-weight: 700; font-family: 'JetBrains Mono', 'Courier New', monospace; margin: 6px 0; }
  .finance-card .label { font-size: 12px; color: var(--text3); }

  /* ── Perm grid ── */
  .perm-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  @media (max-width: 500px) { .perm-grid { grid-template-columns: repeat(2, 1fr); } }
  .perm-item { display: flex; align-items: center; gap: 8px; padding: 8px 10px; background: var(--bg3); border-radius: 6px; cursor: pointer; font-size: 13px; color: var(--text); }
  .perm-item input[type=checkbox] { width: 16px; height: 16px; flex-shrink: 0; accent-color: var(--accent); cursor: pointer; }
  input[type=checkbox] { width: 16px; height: 16px; flex-shrink: 0; accent-color: var(--accent); cursor: pointer; }
  input[type=radio] { width: 16px; height: 16px; flex-shrink: 0; accent-color: var(--accent); cursor: pointer; }
  .combobox-wrap { width: 100%; }

  /* ── Empty state ── */
  .empty-state { text-align: center; padding: 40px; color: var(--text3); font-size: 14px; }
  .empty-state .icon { font-size: 36px; margin-bottom: 10px; }

  /* ── Spinner ── */
  .spinner { width: 20px; height: 20px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.6s linear infinite; display: inline-block; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── KPI ── */
  .kpi-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
  @media (max-width: 640px) { .kpi-grid { grid-template-columns: 1fr; } }
  .kpi-card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 20px; position: relative; overflow: hidden; }
  .kpi-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; }
  .kpi-card.month::before { background: linear-gradient(90deg, #58a6ff, #1f6feb); }
  .kpi-card.year::before  { background: linear-gradient(90deg, #3fb950, #238636); }
  .kpi-label { font-size: 12px; color: var(--text3); font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 10px; }
  .kpi-row { display: flex; gap: 20px; align-items: flex-end; flex-wrap: wrap; }
  .kpi-item { flex: 1; min-width: 120px; }
  .kpi-name { font-size: 11px; color: var(--text3); margin-bottom: 3px; }
  .kpi-value { font-size: 22px; font-weight: 700; font-family: 'JetBrains Mono', 'Courier New', monospace; }
  .kpi-trend { display: inline-flex; align-items: center; gap: 3px; font-size: 12px; font-weight: 600; padding: 2px 7px; border-radius: 20px; margin-top: 4px; }
  .kpi-trend.up   { background: rgba(63,185,80,0.12);  color: var(--green); }
  .kpi-trend.down { background: rgba(248,81,73,0.12);  color: var(--red); }
  .kpi-trend.flat { background: rgba(139,148,158,0.12);color: var(--text3); }
  .kpi-divider { width: 1px; background: var(--border); align-self: stretch; margin: 0 4px; }

  /* ── Chart ── */
  .chart-container { position: relative; width: 100%; height: 260px; margin-top: 4px; }
  .chart-svg { width: 100%; height: 100%; overflow: visible; }
  .chart-toolbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; flex-wrap: wrap; gap: 8px; }
  .chart-toolbar-title { font-size: 14px; font-weight: 600; color: var(--text); }
  .chart-legend { display: flex; gap: 16px; margin-top: 6px; flex-wrap: wrap; }
  .legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text2); }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .chart-tabs { display: flex; gap: 2px; background: var(--bg3); border-radius: 6px; padding: 3px; }
  .chart-tab { padding: 5px 14px; border-radius: 4px; border: none; background: transparent; color: var(--text3); cursor: pointer; font-size: 12px; font-weight: 500; transition: all 0.15s; font-family: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif; white-space: nowrap; }
  .chart-tab:hover { color: var(--text); }

<body>
<div id="root"></div>

<script>
// ============================================================
// THEME MANAGEMENT (Tailwind dark mode via class)
// ============================================================
(function() {
  const saved = localStorage.getItem('erp_theme') || 'dark';
  document.documentElement.className = saved;
})();

function toggleTheme() {
  const isDark = document.documentElement.classList.contains('dark');
  const next = isDark ? 'light' : 'dark';
  document.documentElement.className = next;
  localStorage.setItem('erp_theme', next);
  // Update button icon
  const btn = document.getElementById('btn-theme');
  if (btn) btn.textContent = next === 'dark' ? '☀️' : '🌙';
}

function getThemeIcon() {
  return document.documentElement.classList.contains('dark') ? '☀️' : '🌙';
}

// ============================================================
// MOBILE SIDEBAR
// ============================================================
function openSidebar() {
  document.getElementById('sidebar')?.classList.add('open');
  document.getElementById('sidebar-overlay')?.classList.add('open');
}
function closeSidebar() {
  document.getElementById('sidebar')?.classList.remove('open');
  document.getElementById('sidebar-overlay')?.classList.remove('open');
}

// ============================================================
// STATE
// ============================================================
const state = {
  token: localStorage.getItem('erp_token'),
  user: JSON.parse(localStorage.getItem('erp_user') || 'null'),
  page: localStorage.getItem('erp_last_page') || 'dashboard',
  modal: null,
  modalData: null,
  data: {},
  loading: false,
  chatUnread: 0,
  siteSettings: JSON.parse(localStorage.getItem('erp_site_settings') || 'null'),
};

// ============================================================
// API
// ============================================================
async function api(method, path, body) {
  const opts = {
    method,
    headers: { 'Content-Type': 'application/json' },
  };
  if (state.token) opts.headers['Authorization'] = 'Bearer ' + state.token;
  if (body) opts.body = JSON.stringify(body);
  const res = await fetch('/api' + path, opts);
  const data = await res.json();
  if (res.status === 401) {
    // Token 失效或未登录，直接跳回登录界面
    doLogout();
    return;
  }
  if (res.status === 403) throw new Error('__FORBIDDEN__');
  if (!res.ok) throw new Error(data.error || '请求失败');
  return data;
}

// 个人信息对话框
function showUserProfile() {
  const u = state.user;
  if (!u) return;
  const initials = (u.full_name || u.username || 'U').charAt(0).toUpperCase();
  const permsMap = {
    products:'产品管理', inventory:'库存管理', customers:'客户管理',
    quotations:'报价系统', contracts:'合同管理', finance:'财务管理',
    bank:'银行流水', chat:'即时通讯', users:'员工管理',
  };
  let permsHtml = '';
  if (u.is_admin) {
    permsHtml = '<span class="badge badge-blue">全部权限</span>';
  } else {
    try {
      const p = JSON.parse(u.perms || '{}');
      const granted = Object.keys(permsMap).filter(k => p[k]);
      permsHtml = granted.length
        ? granted.map(k => `<span class="badge badge-blue" style="margin:2px">${permsMap[k]}</span>`).join('')
        : '<span style="color:var(--text3);font-size:13px">暂无权限</span>';
    } catch(e) {
      permsHtml = '<span style="color:var(--text3);font-size:13px">暂无权限</span>';
    }
  }
  const infoRows = [
    ['用户名', u.username || '-'],
    ['姓名',   u.full_name || '-'],
    ['角色',   u.is_admin ? '超级管理员' : '普通用户'],
  ];
  const rowsHtml = infoRows.map(([label, val]) => `
    <div style="display:flex;align-items:center;padding:10px 0;border-bottom:1px solid var(--border)">
      <div style="width:80px;color:var(--text3);font-size:13px;flex-shrink:0">${label}</div>
      <div style="font-size:14px;font-weight:500;color:var(--text1)">${val}</div>
    </div>`).join('');
  showModal(`
    <div class="modal" style="width:min(400px,92vw)">
      <div class="modal-header">
        <span>个人信息</span>
        <span class="modal-close" onclick="closeModal()">✕</span>
      </div>
      <div class="modal-body">
        <div style="display:flex;flex-direction:column;align-items:center;padding:20px 0 24px">
          <div style="width:64px;height:64px;border-radius:50%;background:var(--accent2);display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700;color:white;margin-bottom:12px">${initials}</div>
          <div style="font-size:17px;font-weight:600;color:var(--text1)">${u.full_name || u.username}</div>
          <div style="font-size:12px;color:var(--text3);margin-top:4px">${u.is_admin ? '超级管理员' : '普通用户'}</div>
        </div>
        <div style="margin-bottom:16px">${rowsHtml}</div>
        <div>
          <div style="font-size:12px;color:var(--text3);margin-bottom:8px">已开通权限</div>
          <div style="display:flex;flex-wrap:wrap;gap:4px">${permsHtml}</div>
        </div>
      </div>
      <div class="modal-footer" style="display:flex;justify-content:flex-end;gap:8px">
        <button class="btn btn-danger" onclick="closeModal();doLogout()">退出登录</button>
        <button class="btn btn-secondary" onclick="closeModal()">返回</button>
      </div>
    </div>`);
}

// 统一登出：清除本地状态并跳回登录页
function doLogout() {
  // 关闭并清空聊天模块状态，防止下个用户看到上个用户的数据
  if (_chat.ws) {
    _chat.ws.onclose = null; // 阻止自动重连
    _chat.ws.close();
    _chat.ws = null;
  }
  _chat.convs      = [];
  _chat.contacts   = [];
  _chat.activeGid  = null;
  _chat.msgs       = {};
  _chat.unread     = {};
  _chat.typing     = {};
  _chat.onlineSet  = new Set();
  _chat.groupInfo  = {};
  _chat.pendingGid = null;

  state.token = null;
  state.user  = null;
  state.page  = 'dashboard';
  state.siteSettings = null;
  state.chatUnread = 0;
  localStorage.removeItem('erp_token');
  localStorage.removeItem('erp_user');
  localStorage.removeItem('erp_last_page');
  localStorage.removeItem('erp_site_settings');
  render();
}

// ============================================================
// RENDER ENGINE
// ============================================================
function render() {
  const root = document.getElementById('root');
  if (!state.token || !state.user) {
    root.innerHTML = renderAuth();
  } else {
    root.innerHTML = renderApp();
    sidebarResizeInit();
  }
  attachEvents();
}

// ── 侧边栏宽度拖动 ────────────────────────────────────────────
const _SIDEBAR_W_KEY = 'erp_sidebar_w';
const _SIDEBAR_MIN   = 44;   // 只显示图标的最小宽度
const _SIDEBAR_MAX   = 220;  // 最大宽度（不可超过）
const _SIDEBAR_LABEL_THRESHOLD = 140; // 低于此宽度隐藏文字

function sidebarApplyWidth(w) {
  const sidebar = document.getElementById('sidebar');
  if (!sidebar) return;
  sidebar.style.width = w + 'px';
  if (w < _SIDEBAR_LABEL_THRESHOLD) {
    sidebar.classList.add('sidebar-collapsed');
  } else {
    sidebar.classList.remove('sidebar-collapsed');
  }
}

function sidebarResizeInit() {
  // 读取上次保存的宽度
  let savedW = _SIDEBAR_MAX;
  try { savedW = Math.min(_SIDEBAR_MAX, Math.max(_SIDEBAR_MIN, parseInt(localStorage.getItem(_SIDEBAR_W_KEY)) || _SIDEBAR_MAX)); } catch(e) {}
  sidebarApplyWidth(savedW);

  const handle = document.getElementById('sidebar-resize-handle');
  if (!handle) return;

  handle.addEventListener('mousedown', e => {
    e.preventDefault();
    const sidebar = document.getElementById('sidebar');
    if (!sidebar) return;

    const startX    = e.clientX;
    const startW    = sidebar.getBoundingClientRect().width;
    handle.classList.add('dragging');
    document.body.style.cursor     = 'ew-resize';
    document.body.style.userSelect = 'none';

    function onMove(ev) {
      // 向左拖动 delta 为负，宽度减小
      const newW = Math.min(_SIDEBAR_MAX, Math.max(_SIDEBAR_MIN, startW + (ev.clientX - startX)));
      sidebarApplyWidth(newW);
    }

    function onUp(ev) {
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup',   onUp);
      handle.classList.remove('dragging');
      document.body.style.cursor     = '';
      document.body.style.userSelect = '';

      const finalW = Math.min(_SIDEBAR_MAX, Math.max(_SIDEBAR_MIN,
        sidebar.getBoundingClientRect().width));
      try { localStorage.setItem(_SIDEBAR_W_KEY, Math.round(finalW)); } catch(e) {}
    }

    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup',   onUp);
  });
}

function renderApp() {
  return `
  <div id="app">

    <div id="sidebar-overlay" onclick="closeSidebar()"></div>
    <div id="main">

    { id: 'chat', icon: '💬', label: '聊天' },
    { id: 'sharefiles', icon: '🗂️', label: '企业网盘' },
    { section: '业务' },
    { id: 'products',   icon: '📦', label: '产品管理',  perm: 'products' },
    { id: 'inventory',  icon: '🏭', label: '产品库存',  perm: 'inventory' },
    { id: 'customers',  icon: '🏢', label: '客户管理',  perm: 'customers' },
    { id: 'quotations', icon: '📋', label: '报价系统',  perm: 'quotations' },
    { id: 'contracts',  icon: '📝', label: '合同管理',  perm: 'contracts' },
    { section: '财务' },

  let html = `<div id="sidebar"><div id="sidebar-resize-handle"></div><div class="logo" style="display:flex;align-items:center;justify-content:space-between">

  </div><nav>`;
  for (const item of nav) {
    if (item.section) {
      html += `<div class="nav-section">${item.section}</div>`;
      continue;
    }
    if (item.adminOnly && !u.is_admin && !hasPermission('users')) continue;
    const active = state.page === item.id ? 'active' : '';
    const badge = item.id==='chat' && state.chatUnread>0
      ? `<span style="background:var(--red);color:#fff;font-size:10px;border-radius:10px;padding:1px 6px;margin-left:auto">${state.chatUnread>99?'99+':state.chatUnread}</span>` : '';
    html += `<div class="nav-item ${active}" data-page="${item.id}" data-id="${item.id}" title="${item.label}">
      <span class="icon">${item.icon}</span><span class="nav-label" style="flex:1">${item.label}</span>${badge}
    </div>`;

  return html;
}

function getPageTitle() {

    customers: '客户管理', quotations: '报价系统', contracts: '合同管理',
    finance: '财务管理', bank: '银行流水-现金流', users: '员工管理', templates: '合同模板',
    reports: '报表中心', datacenter: '数据中心',
    chat: '聊天', sharefiles: '企业网盘',

function renderAuth() {
  return `
  <div class="auth-page">
    <div style="position:fixed;top:16px;right:16px;z-index:10">
      <button class="theme-btn" id="btn-theme" onclick="toggleTheme()" title="切换主题">${getThemeIcon()}</button>
    </div>
    <div class="auth-card" id="auth-card">
      <div class="auth-logo">
        <div class="auth-logo-text">智云 ERP</div>
        <div class="auth-logo-sub">企业资源管理系统</div>
      </div>

      </div>

function renderLoginForm() {

  <div class="form-group"><label>用户名</label><input id="f-username" type="text" placeholder="请输入用户名" autocomplete="username"/></div>
  <div class="form-group"><label>密码</label><input id="f-password" type="password" placeholder="请输入密码" autocomplete="current-password"/></div>
  <button class="btn btn-primary btn-lg" id="btn-login">登 录</button>`;
}

function renderRegisterForm() {
  return `
  <div class="form-group"><label>用户名 *</label><input id="f-username" type="text" placeholder="请输入用户名"/></div>

// ============================================================
// MODAL
// ============================================================
function renderModal() {
  return `<div class="modal-overlay" id="modal-overlay">${state.modal}</div>`;
}

function showModal(html) {
  state.modal = html;
  render();
}

function closeModal() {
  state.modal = null;
  state.modalData = null;
  render();
  loadPage();
}

// ============================================================
// EVENTS
// ============================================================
function attachEvents() {
  // Navigation
  document.querySelectorAll('.nav-item[data-page]').forEach(el => {
    el.addEventListener('click', () => { state.page = el.dataset.page; render(); loadPage(); });
  });

  // User profile dialog
  const btnUserProfile = document.getElementById('btn-user-profile');
  if (btnUserProfile) {
    btnUserProfile.addEventListener('click', () => showUserProfile());
  }

  // Auth
  const btnLogin = document.getElementById('btn-login');
  if (btnLogin) btnLogin.onclick = doLogin;

  const btnReg = document.getElementById('btn-register');
  if (btnReg) btnReg.onclick = doRegister;

  const authSwitch = document.getElementById('auth-switch');
  if (authSwitch) {
    authSwitch.onclick = e => {
      e.preventDefault();
      const isLogin = authSwitch.textContent === '注册';
      document.getElementById('auth-form').innerHTML = isLogin ? renderRegisterForm() : renderLoginForm();
      authSwitch.textContent = isLogin ? '登录' : '注册';
      document.getElementById('auth-switch-text').textContent = isLogin ? '已有账户？' : '没有账户？';
      // 清空上次的错误提示
      const errEl = document.getElementById('auth-error');
      if (errEl) errEl.innerHTML = '';
      attachEvents();
    };
  }

  // Enter key on auth
  ['f-username', 'f-password'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        document.getElementById('btn-login')?.click();
        document.getElementById('btn-register')?.click();
      }
    });
  });

  // Load page content
  if (state.token && !state.modal) loadPage();
}

// ============================================================
// AUTH ACTIONS
// ============================================================
async function doLogin() {
  const username = document.getElementById('f-username').value.trim();
  const password = document.getElementById('f-password').value;
  if (!username || !password) return showAuthError('请填写用户名和密码');
  try {
    const data = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password }),
    }).then(r => r.json().then(d => { if (!r.ok) throw new Error(d.error); return d; }));
    state.token = data.token;
    state.user = { user_id: data.user_id, username: data.username, full_name: data.full_name, is_admin: data.is_admin, perms: data.perms };
    localStorage.setItem('erp_token', state.token);
    localStorage.setItem('erp_user', JSON.stringify(state.user));
    loadSiteSettings().then(() => { render(); loadPage(); });
  } catch (e) { showAuthError(e.message); }
}

// 加载并缓存站点设置（logo标题等），所有用户均可调用
async function loadSiteSettings() {
  try {
    // 使用公开接口（无需管理员权限）
    const res = await fetch('/api/auth/site/settings').then(r => r.json());
    const pub = res.settings || {};
    // 管理员额外获取完整设置
    let full = {};
    if (state.user?.is_admin) {
      try { const r2 = await api('GET', '/admin/settings'); full = r2.settings || {}; } catch(e) {}
    }
    state.siteSettings = Object.assign({}, pub, full);
    try { localStorage.setItem('erp_site_settings', JSON.stringify(state.siteSettings)); } catch(e) {}
  } catch(e) {
    state.siteSettings = JSON.parse(localStorage.getItem('erp_site_settings') || 'null') || {};
  }
}

async function doRegister() {
  const username = document.getElementById('f-username').value.trim();
  const password = document.getElementById('f-password').value;
  const full_name = document.getElementById('f-fullname')?.value.trim() || '';
  const email = document.getElementById('f-email')?.value.trim() || '';
  if (!username || !password) return showAuthError('请填写用户名和密码');
  try {
    await fetch('/api/auth/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password, full_name, email }),
    }).then(r => r.json().then(d => { if (!r.ok) throw new Error(d.error); return d; }));

    // 注册成功后直接自动登录
    const data = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password }),
    }).then(r => r.json().then(d => { if (!r.ok) throw new Error(d.error); return d; }));

    state.token = data.token;
    state.user = { user_id: data.user_id, username: data.username, full_name: data.full_name, is_admin: data.is_admin, perms: data.perms };
    localStorage.setItem('erp_token', state.token);
    localStorage.setItem('erp_user', JSON.stringify(state.user));
    loadSiteSettings().then(() => { render(); loadPage(); });
  } catch (e) { showAuthError(e.message); }
}

function showAuthError(msg, type = 'error') {
  const el = document.getElementById('auth-error');
  if (el) el.innerHTML = `<div class="alert alert-${type}">${msg}</div>`;
}

// PAGE LOADER

// 页面级权限配置：perm 为空表示所有登录用户可访问
const PAGE_PERMS = {
  products:   'products',
  inventory:  'inventory',
  customers:  'customers',
  quotations: 'quotations',
  contracts:  'contracts',
  finance:    'finance',
  bank:       'bank',
  chat:       'chat',
  users:      'users',
  templates:  'users',
  reports:    'reports',
  sharefiles: 'sharefiles',
  datacenter: 'datacenter',
  dashboard:  { any: ['finance', 'bank'] },
};

function noPermHtml(page) {
  const titles = {
    products:'产品管理', inventory:'库存管理', customers:'客户管理',
    quotations:'报价系统', contracts:'合同管理', finance:'财务管理',
    bank:'银行流水', chat:'即时通讯', users:'员工管理', templates:'合同模板',
    reports:'报表中心', sharefiles:'企业网盘', datacenter:'数据中心',
  };
  return `<div class="empty-state" style="padding:80px 0">
    <div class="icon" style="font-size:48px;margin-bottom:16px">🔒</div>
    <div style="font-size:18px;font-weight:600;color:var(--text1);margin-bottom:8px">${titles[page]||page}</div>
    <div style="color:var(--text3);font-size:14px">您没有访问该模块的权限，请联系管理员开通</div>
  </div>`;
}

async function loadPage() {
  const content = document.getElementById('page-content');
  const actions = document.getElementById('topbar-actions');
  if (!content) return;

  // 记住最后访问的页面
  localStorage.setItem('erp_last_page', state.page);
  try {
    const me = await api('GET', '/me');
    if (me) {
      // 若后端返回了新 Token（含最新权限），同步更新本地 Token
      if (me.token) {
        state.token = me.token;
        localStorage.setItem('erp_token', state.token);
      }
      state.user = { ...state.user, ...me };
      localStorage.setItem('erp_user', JSON.stringify(state.user));
      // 权限更新后重新渲染侧边栏
      // 重新渲染侧边栏，让菜单权限立刻更新
      const sidebarEl = document.getElementById('sidebar');
      if (sidebarEl) {
        sidebarEl.outerHTML = renderSidebar();
        document.querySelectorAll('.nav-item').forEach(el => {
          el.addEventListener('click', () => {
            state.page = el.dataset.page;
            if (window.innerWidth <= 768) closeSidebar();
            render(); loadPage();
          });
        });
        const btnUserProfileInner = document.getElementById('btn-user-profile');
        if (btnUserProfileInner) btnUserProfileInner.addEventListener('click', () => showUserProfile());
        // 重新初始化侧边栏宽度拖动
        sidebarResizeInit();
      }
    }
  } catch(_) {}

  // 每次切换页面先重置 content 样式（聊天页会覆盖，其他页恢复默认）
  content.style.padding = '';
  content.style.overflow = '';
  content.style.display = '';
  content.style.flexDirection = '';
  content.innerHTML = '<div class="empty-state"><div class="spinner"></div></div>';
  if (actions) actions.innerHTML = '';

  // 页面级权限检查（requiredPerm 可为字符串或数组，数组时需全部满足）
  const requiredPerm = PAGE_PERMS[state.page];
  const isAdminPage  = state.page === 'users' || state.page === 'templates' || state.page === 'sysadmin';
  if (!state.user.is_admin) {
    if (isAdminPage && !hasPermission('users')) {
      content.innerHTML = noPermHtml(state.page);
      return;
    }
    if (!isAdminPage && requiredPerm) {
      // OR 逻辑：{ any: [...] }，满足其中一个即可
      // AND 逻辑：字符串或数组，需全部满足
      if (requiredPerm.any) {
        if (!requiredPerm.any.some(p => hasPermission(p))) {
          content.innerHTML = noPermHtml(state.page);
          return;
        }
      } else {
        const permsNeeded = Array.isArray(requiredPerm) ? requiredPerm : [requiredPerm];
        if (permsNeeded.some(p => !hasPermission(p))) {
          content.innerHTML = noPermHtml(state.page);
          return;
        }
      }
    }
  }

  try {
    switch (state.page) {
      case 'dashboard': await loadDashboard(content, actions); break;
      case 'products': await loadProducts(content, actions); break;
      case 'inventory': await loadInventory(content, actions); break;
      case 'customers': await loadCustomers(content, actions); break;
      case 'quotations': await loadQuotations(content, actions); break;
      case 'contracts': await loadContracts(content, actions); break;
      case 'finance': await loadFinance(content, actions); break;
      case 'bank': await loadBank(content, actions); break;
      case 'reports': await loadReports(content, actions); break;
      case 'datacenter': await loadDataCenter(content, actions); break;
      case 'users': await loadUsers(content, actions); break;
      case 'templates': await loadTemplates(content, actions); break;
      case 'sysadmin': await loadSysAdmin(content, actions); break;
      case 'chat': await loadChat(content, actions); break;
      case 'sharefiles': await loadShareFiles(content, actions); break;
      default: content.innerHTML = '<div class="empty-state"><div class="icon">🚧</div>开发中...</div>';
    }
  } catch (e) {
    if (e.message === '__FORBIDDEN__') {
      content.innerHTML = noPermHtml(state.page);
    } else {
      content.innerHTML = `<div class="alert alert-error">加载失败: ${e.message}</div>`;
    }
  }
}

// ── SVG chart renderer ────────────────────────────────────────
async function renderTrendChart() {
  const wrap = document.getElementById('chart-wrap');
  const legendEl = document.getElementById('chart-legend');
  if (!wrap) return;

  wrap.innerHTML = '<div style="color:var(--text3);text-align:center;padding:80px 0">加载中…</div>';

  let seriesA, seriesB, labelA, labelB, labelB2;
  const fmtFull = n => '¥' + Number(n).toLocaleString('zh-CN', { minimumFractionDigits: 2 });

  try {
    if (_chartMode === 'yoy') {
      const res = await api('GET', '/dashboard/trend?mode=yoy');
      seriesA = res.cur_year || [];
      seriesB = res.prev_year || [];
      labelA = '今年合同'; labelB = '去年合同';
      // update legend
      if (legendEl) legendEl.innerHTML = `
        <div class="legend-item"><div class="legend-dot" style="background:#58a6ff"></div>今年合同</div>
        <div class="legend-item"><div class="legend-dot" style="background:#3fb950"></div>今年已收</div>
        <div class="legend-item"><div style="width:18px;height:0;border-top:2px dashed #d29922;flex-shrink:0"></div>去年合同</div>
        <div class="legend-item"><div style="width:18px;height:0;border-top:2px dashed #a371f7;flex-shrink:0"></div>去年已收</div>`;
    } else {
      const res = await api('GET', `/dashboard/trend?mode=${_chartMode}`);
      seriesA = res.trend || [];
      seriesB = null;
      if (legendEl) legendEl.innerHTML = `
        <div class="legend-item"><div class="legend-dot" style="background:#58a6ff"></div>合同金额</div>
        <div class="legend-item"><div class="legend-dot" style="background:#3fb950"></div>已收款</div>`;
    }
  } catch(e) {
    wrap.innerHTML = `<div style="color:var(--red);text-align:center;padding:80px 0">加载失败: ${e.message}</div>`;
    return;
  }

  // Fill missing months for thisyear / yoy modes so X axis is always 1-12
  const fillMonths = (data, yearPrefix) => {
    if (!yearPrefix) return data;
    const map = {};
    (data || []).forEach(d => { map[d.month] = d; });
    return Array.from({length: 12}, (_, i) => {
      const m = String(i + 1).padStart(2, '0');
      const key = `${yearPrefix}-${m}`;
      return map[key] || { month: key, contracts: 0, total_amount: 0, paid_amount: 0, balance: 0 };
    });
  };

  if (_chartMode === 'thisyear') {
    const yr = new Date().getFullYear().toString();
    seriesA = fillMonths(seriesA, yr);
  } else if (_chartMode === 'yoy') {
    const yr = new Date().getFullYear();
    seriesA = fillMonths(seriesA, yr.toString());
    seriesB = fillMonths(seriesB, (yr - 1).toString());
  }

  const allData = [...(seriesA || []), ...(seriesB || [])];
  if (!allData.length || allData.every(d => d.total_amount === 0 && d.paid_amount === 0)) {
    wrap.innerHTML = '<div style="color:var(--text3);text-align:center;padding:80px 0;font-size:13px">暂无数据 — 创建合同后将自动显示趋势图</div>';
    return;
  }

  const W = wrap.clientWidth || 700;
  const H = 250;
  const PAD = { top: 24, right: 24, bottom: 44, left: 76 };
  const chartW = W - PAD.left - PAD.right;
  const chartH = H - PAD.top - PAD.bottom;

  const maxVal = Math.max(...allData.flatMap(d => [d.total_amount, d.paid_amount]), 1);
  // Nice ceiling
  const mag = Math.pow(10, Math.floor(Math.log10(maxVal)));
  const niceMax = Math.ceil(maxVal / mag) * mag;

  const N = seriesA.length;
  const xScale = i => PAD.left + (N <= 1 ? chartW / 2 : (i / (N - 1)) * chartW);
  const yScale = v => PAD.top + chartH - (v / niceMax) * chartH;

  const fmtY = n => {
    if (n >= 100000000) return '¥' + (n/100000000).toFixed(1) + '亿';
    if (n >= 10000) return '¥' + (n/10000).toFixed(1) + 'w';
    return '¥' + n.toFixed(0);
  };

  // Draw one series (amount + paid lines)
  const drawSeries = (data, colorAmount, colorPaid, dashed, idSuffix) => {
    if (!data || !data.length) return '';
    const dashAttr = dashed ? 'stroke-dasharray="7,4"' : '';
    const opacity = dashed ? '0.75' : '1';

    const pathLine = (key, color) => {
      if (data.length === 1) {
        const cx = xScale(0), cy = yScale(data[0][key]);
        return `<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="5" fill="${color}" opacity="${opacity}"/>`;
      }
      const pts = data.map((d, i) => `${xScale(i).toFixed(1)},${yScale(d[key]).toFixed(1)}`).join(' ');
      const firstX = xScale(0).toFixed(1), lastX = xScale(data.length-1).toFixed(1);
      const baseY = (PAD.top + chartH).toFixed(1);
      const areaPts = `${firstX},${baseY} ${pts} ${lastX},${baseY}`;
      const areaOpacity = dashed ? '0' : '0.07';
      const dots = data.map((d, i) =>
        `<circle cx="${xScale(i).toFixed(1)}" cy="${yScale(d[key]).toFixed(1)}" r="3.5" fill="${color}" stroke="var(--bg2)" stroke-width="1.5" class="chart-dot" data-idx="${i}" data-series="${idSuffix}" opacity="${opacity}"/>`
      ).join('');
      return `
        <polygon points="${areaPts}" fill="${color}" opacity="${areaOpacity}"/>
        <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" ${dashAttr} opacity="${opacity}"/>
        ${dots}`;
    };

    return pathLine('total_amount', colorAmount) + pathLine('paid_amount', colorPaid);
  };

  // Grid lines + Y labels
  const yTicks = 5;
  const grid = Array.from({length: yTicks + 1}, (_, i) => {
    const v = (niceMax / yTicks) * i;
    const y = yScale(v).toFixed(1);
    return `
      <line x1="${PAD.left}" y1="${y}" x2="${PAD.left + chartW}" y2="${y}" stroke="var(--border)" stroke-width="1" opacity="0.4"/>
      <text x="${(PAD.left - 8).toFixed(1)}" y="${y}" text-anchor="end" dominant-baseline="middle" fill="var(--text3)" font-size="11">${fmtY(v)}</text>`;
  }).join('');

  // X labels — for yoy mode show only month number (1–12), else YYYY/MM
  const step = Math.max(1, Math.ceil(N / 10));
  const xLabels = seriesA.map((d, i) => {
    if (i % step !== 0 && i !== N - 1) return '';
    const x = xScale(i).toFixed(1);
    const label = (_chartMode === 'thisyear' || _chartMode === 'yoy')
      ? (parseInt(d.month.split('-')[1]) + '月')
      : d.month.replace('-', '/');
    return `<text x="${x}" y="${(PAD.top + chartH + 20).toFixed(1)}" text-anchor="middle" fill="var(--text3)" font-size="11">${label}</text>`;
  }).join('');

  // Vertical hover line placeholder
  const svgContent = `
    <svg class="chart-svg" viewBox="0 0 ${W} ${H}" id="trend-svg">
      ${grid}
      ${xLabels}
      ${drawSeries(seriesA, '#58a6ff', '#3fb950', false, 'cur')}
      ${_chartMode === 'yoy' ? drawSeries(seriesB, '#d29922', '#a371f7', true, 'prev') : ''}
    </svg>`;

  wrap.innerHTML = svgContent;

  // ── Tooltip ────────────────────────────────────────────────
  const tooltip = document.getElementById('chart-tooltip');
  const card    = document.getElementById('trend-card');

  document.querySelectorAll('.chart-dot').forEach(dot => {
    dot.style.cursor = 'crosshair';
    dot.addEventListener('mouseenter', () => {
      const idx = parseInt(dot.dataset.idx);
      const ser = dot.dataset.series;
      const dCur  = seriesA[idx];
      const dPrev = seriesB ? seriesB[idx] : null;
      if (!tooltip || !dCur) return;

      const monthLabel = (_chartMode === 'thisyear' || _chartMode === 'yoy')
        ? parseInt(dCur.month.split('-')[1]) + '月'
        : dCur.month.replace('-', '/');

      let html = `<div class="tooltip-month">${monthLabel}</div>`;
      if (_chartMode === 'yoy') {
        const yr = new Date().getFullYear();
        html += `
          <div style="font-size:11px;color:var(--text3);margin-bottom:3px">${yr}年</div>
          <div class="tooltip-row"><span style="color:#58a6ff">合同</span><span>${fmtFull(dCur.total_amount)}</span></div>
          <div class="tooltip-row"><span style="color:#3fb950">已收</span><span>${fmtFull(dCur.paid_amount)}</span></div>`;
        if (dPrev) {
          html += `
          <div style="font-size:11px;color:var(--text3);margin:5px 0 3px;border-top:1px solid var(--border);padding-top:5px">${yr-1}年</div>
          <div class="tooltip-row"><span style="color:#d29922">合同</span><span>${fmtFull(dPrev.total_amount)}</span></div>
          <div class="tooltip-row"><span style="color:#a371f7">已收</span><span>${fmtFull(dPrev.paid_amount)}</span></div>`;
          // YoY diff
          const diff = dCur.total_amount - dPrev.total_amount;
          const diffPct = dPrev.total_amount > 0 ? (diff / dPrev.total_amount * 100).toFixed(1) : '—';
          const diffColor = diff >= 0 ? 'var(--green)' : 'var(--red)';
          const diffArrow = diff >= 0 ? '↑' : '↓';
          html += `<div class="tooltip-row" style="margin-top:5px;border-top:1px solid var(--border);padding-top:5px"><span style="color:var(--text3)">同比</span><span style="color:${diffColor}">${diffArrow} ${diffPct}%</span></div>`;
        }
      } else {
        html += `
          <div class="tooltip-row"><span style="color:#58a6ff">合同</span><span>${fmtFull(dCur.total_amount)}</span></div>
          <div class="tooltip-row"><span style="color:#3fb950">已收</span><span>${fmtFull(dCur.paid_amount)}</span></div>
          <div class="tooltip-row"><span style="color:#d29922">待收</span><span>${fmtFull(dCur.balance)}</span></div>
          <div class="tooltip-row" style="margin-top:4px;border-top:1px solid var(--border);padding-top:4px"><span style="color:var(--text3)">合同数</span><span>${dCur.contracts}</span></div>`;
      }

      tooltip.innerHTML = html;
      const cardRect = card.getBoundingClientRect();
      const dotRect  = dot.getBoundingClientRect();
      let left = dotRect.left - cardRect.left + 14;
      let top  = dotRect.top  - cardRect.top  - 14;
      if (left + 170 > card.clientWidth) left -= 180;
      if (top < 0) top = 4;
      tooltip.style.left = left + 'px';
      tooltip.style.top  = top  + 'px';
      tooltip.classList.add('visible');
    });
    dot.addEventListener('mouseleave', () => tooltip?.classList.remove('visible'));
  });
}

// ============================================================
// 通用前端排序工具
// ============================================================
// 每个模块用一个独立的排序状态对象，格式：{ col: '', dir: 'asc'|'desc' }
// makeSortTh(label, col, state, onSort) → 返回 <th> HTML 字符串
// clientSort(arr, col, dir, getter) → 排序后的新数组
// updateSortArrows(prefix, state) → 刷新当前模块所有表头箭头

function makeSortTh(label, col, sortState, prefix, extra='') {
  return `<th onclick="${prefix}SetSort('${col}')" style="cursor:pointer;user-select:none;white-space:nowrap;${extra}">${label}<span id="${prefix}sort-${col}" style="color:var(--text3);font-size:11px"> ⇅</span></th>`;
}

function updateSortArrows(prefix, sortState, cols) {
  cols.forEach(col => {
    const el = document.getElementById(prefix + 'sort-' + col);
    if (!el) return;
    if (col === sortState.col) {
      el.textContent = sortState.dir === 'asc' ? ' ↑' : ' ↓';
      el.style.cssText = 'color:var(--accent);font-weight:bold;font-size:12px';
    } else {
      el.textContent = ' ⇅';
      el.style.cssText = 'color:var(--text3);font-weight:normal;font-size:11px';
    }
  });
}

// 通用前端排序：getter(item, col) 返回可比较的值
function clientSort(arr, col, dir, getter) {
  if (!col) return arr;
  return [...arr].sort((a, b) => {
    let va = getter(a, col), vb = getter(b, col);
    // 数字比较
    if (typeof va === 'number' && typeof vb === 'number') {
      return dir === 'asc' ? va - vb : vb - va;
    }
    // 字符串比较（空值始终排末尾）
    va = (va ?? '').toString();
    vb = (vb ?? '').toString();
    if (!va && vb) return 1;
    if (va && !vb) return -1;
    const cmp = va.localeCompare(vb, 'zh-CN', { numeric: true });
    return dir === 'asc' ? cmp : -cmp;
  });
}

function prodSetSort(col) {
  if (_prodSort.col === col) _prodSort.dir = _prodSort.dir === 'asc' ? 'desc' : 'asc';
  else { _prodSort.col = col; _prodSort.dir = 'asc'; }
  const canEdit = state.user.is_admin || hasPermission('products');
  prodRenderTable(canEdit);
}

function prodRenderTable(canEdit) {
  const getter = (p, col) => col === 'unit_price' ? (p.unit_price || 0) : (p[col] || '');
  const sorted = clientSort(_prodData, _prodSort.col, _prodSort.dir, getter);
  document.getElementById('products-tbody').innerHTML = renderProductRows(sorted, canEdit);
  updateSortArrows('prod', _prodSort, ['name','brand','model','type','unit_price','unit']);
  attachProductActions(canEdit);
}

// 第一阶段：上传解析，显示预览统计
async function productImportPreview(file) {
  showModal(`
  <div class="modal modal-lg">
    <div class="modal-header">📥 导入产品数据<span class="modal-close" id="modal-close" style="opacity:0.4;cursor:not-allowed">×</span></div>
    <div class="modal-body">
      <div style="font-size:13px;color:var(--text3);margin-bottom:14px">文件：${file.name}（${(file.size/1024/1024).toFixed(2)} MB）</div>
      <div id="pip-step" style="font-size:14px;font-weight:500;margin-bottom:10px">正在上传并解析…</div>
      <div style="background:var(--bg3);border-radius:6px;overflow:hidden;height:8px;margin-bottom:10px">
        <div id="pip-bar" style="height:100%;width:0%;background:var(--accent);border-radius:6px;transition:width .4s ease"></div>
      </div>
      <div style="margin-top:8px;padding:10px 14px;background:var(--bg2);border:1px solid var(--border);border-radius:6px;font-size:12px;color:var(--text3);line-height:1.9">
        支持列标题：<code>产品名称</code> <code>品牌</code> <code>型号</code> <code>类型</code> <code>描述</code> <code>单价</code> <code>单位</code><br>
        <strong>型号</strong>为唯一键：已存在的型号可选择跳过或覆盖更新。
      </div>
      <div id="pip-preview" style="display:none;margin-top:16px"></div>
      <div id="pip-result"  style="display:none;margin-top:16px"></div>
    </div>
    <div class="modal-footer" id="pip-footer"></div>
  </div>`);

  const setBar = pct => { const b=document.getElementById('pip-bar'); if(b) b.style.width=pct+'%'; };
  const setStep = (txt, pct) => { const e=document.getElementById('pip-step'); if(e) e.textContent=txt; setBar(pct); };
  const unlockClose = () => { const cx=document.getElementById('modal-close'); if(cx){cx.style.opacity='1';cx.style.cursor='pointer';cx.onclick=closeModal;} };

  try {
    setStep('上传文件…', 10);
    const formData = new FormData();
    formData.append('file', file);

    let uploadDone = 0;
    const t0 = Date.now();
    const preview = await new Promise((resolve, reject) => {
      const xhr = new XMLHttpRequest();
      xhr.open('POST', '/api/products/import/preview');
      if (state.token) xhr.setRequestHeader('Authorization', 'Bearer ' + state.token);
      xhr.upload.onprogress = e => {
        if (e.lengthComputable) setBar(Math.round(e.loaded/e.total*50));
      };
      xhr.upload.onloadend = () => { uploadDone = Date.now(); setBar(55); };
      xhr.onload = () => {
        if (xhr.status >= 200 && xhr.status < 300) {
          try { resolve(JSON.parse(xhr.responseText)); }
          catch { reject(new Error('服务器返回非 JSON 响应')); }
        } else {
          try { reject(new Error(JSON.parse(xhr.responseText).error || `HTTP ${xhr.status}`)); }
          catch { reject(new Error(`HTTP ${xhr.status}`)); }
        }
      };
      xhr.onerror = () => reject(new Error('网络错误'));
      xhr.send(formData);
    });

    setStep('解析完成，请确认导入', 65);

    if (!preview.token) {
      setStep('文件中未找到有效产品数据', 100);
      document.getElementById('pip-bar').style.background = 'var(--red)';
      document.getElementById('pip-footer').innerHTML = `<button class="btn" onclick="closeModal()">关闭</button>`;
      unlockClose();
      return;
    }

    const parseSec = uploadDone ? ((Date.now()-uploadDone)/1000).toFixed(1) : '-';
    const invalidHtml = (preview.invalid||0) > 0
      ? `<div style="flex:1;min-width:80px;text-align:center;padding:12px 10px;background:rgba(239,68,68,0.07);border:1px solid rgba(239,68,68,0.2);border-radius:8px">
           <div style="font-size:26px;font-weight:700;color:var(--red)">${preview.invalid}</div>
           <div style="font-size:12px;color:var(--text3);margin-top:2px">数据无效</div>
         </div>` : '';

    document.getElementById('pip-preview').style.display = 'block';
    document.getElementById('pip-preview').innerHTML = `
      <div style="font-size:13px;font-weight:600;color:var(--text2);margin-bottom:12px">📊 导入预览</div>
      <div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px">
        <div style="flex:1;min-width:80px;text-align:center;padding:12px 10px;background:var(--bg2);border-radius:8px;border:1px solid var(--border)">
          <div style="font-size:26px;font-weight:700;color:var(--text1)">${(preview.total||0).toLocaleString()}</div>
          <div style="font-size:12px;color:var(--text3);margin-top:2px">文件总行数</div>
        </div>
        <div style="flex:1;min-width:80px;text-align:center;padding:12px 10px;background:rgba(72,199,142,0.07);border:1px solid rgba(72,199,142,0.3);border-radius:8px">
          <div style="font-size:26px;font-weight:700;color:var(--green)">${(preview.new_count||0).toLocaleString()}</div>
          <div style="font-size:12px;color:var(--text3);margin-top:2px">新增产品</div>
        </div>
        <div style="flex:1;min-width:80px;text-align:center;padding:12px 10px;background:rgba(99,179,237,0.07);border:1px solid rgba(99,179,237,0.3);border-radius:8px">
          <div style="font-size:26px;font-weight:700;color:var(--accent)">${(preview.update_count||0).toLocaleString()}</div>
          <div style="font-size:12px;color:var(--text3);margin-top:2px">型号已存在</div>
        </div>
        ${invalidHtml}
      </div>
      ${(preview.update_count||0) > 0 ? `
      <div style="margin-bottom:14px;padding:12px 14px;background:var(--bg2);border:1px solid var(--border);border-radius:8px">
        <div style="font-size:13px;font-weight:500;margin-bottom:8px;color:var(--text2)">⚙️ 已存在型号处理方式</div>
        <label style="display:flex;align-items:center;gap:8px;cursor:pointer;margin-bottom:6px;font-size:13px">
          <input type="radio" name="pip-update-mode" value="skip" checked> 跳过（保留现有数据，不修改）
        </label>
        <label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13px">
          <input type="radio" name="pip-update-mode" value="overwrite"> 覆盖更新（用 Excel 数据覆盖现有产品信息）
        </label>
      </div>` : ''}
      <div style="padding:8px 12px;background:rgba(99,179,237,0.06);border:1px solid rgba(99,179,237,0.2);border-radius:6px;font-size:12px;color:var(--text2)">
        ⏱ 服务端解析耗时 ${parseSec}s &nbsp;·&nbsp; 📄 ${file.name}
      </div>
      ${(preview.invalid||0)>0 ? `<div style="margin-top:6px;padding:8px 12px;background:rgba(239,68,68,0.06);border:1px solid rgba(239,68,68,0.2);border-radius:6px;font-size:12px;color:var(--text2)">⚠ ${preview.invalid} 条因缺少型号或品牌/名称被忽略</div>` : ''}
    `;

    document.getElementById('pip-footer').innerHTML = `
      <button class="btn btn-secondary" onclick="closeModal()" style="margin-right:8px">取消</button>
      <button class="btn btn-primary" id="pip-confirm-btn" onclick="productImportConfirm('${preview.token}')">
        ✅ 确认导入 ${((preview.new_count||0)+(preview.update_count||0)).toLocaleString()} 条
      </button>
    `;
    unlockClose();

  } catch(e) {
    console.error(e);
    document.getElementById('pip-bar').style.background = 'var(--red)';
    document.getElementById('pip-step').textContent = '解析失败';
    document.getElementById('pip-preview').style.display = 'none';
    const r = document.getElementById('pip-result');
    r.style.display = 'block';
    r.innerHTML = `<div style="color:var(--red);font-size:14px">❌ ${e.message}</div>`;
    document.getElementById('pip-footer').innerHTML = `<button class="btn" onclick="closeModal()">关闭</button>`;
    unlockClose();
  }
}

  if(bar){ bar.style.width='85%'; bar.style.background='var(--accent)'; }

  const updateMode = document.querySelector('input[name="pip-update-mode"]:checked')?.value || 'skip';

  try {
    const t0 = Date.now();
    const res = await api('POST', '/products/import/confirm', { token, update_mode: updateMode });

    if(bar){ bar.style.width='100%'; bar.style.background='var(--green)'; }

      <div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:12px">
        <div style="flex:1;min-width:80px;text-align:center;padding:12px 10px;background:rgba(72,199,142,0.07);border:1px solid rgba(72,199,142,0.3);border-radius:8px">
          <div style="font-size:26px;font-weight:700;color:var(--green)">${res.inserted||0}</div>
          <div style="font-size:12px;color:var(--text3);margin-top:2px">新增成功</div>
        </div>
        <div style="flex:1;min-width:80px;text-align:center;padding:12px 10px;background:rgba(99,179,237,0.07);border:1px solid rgba(99,179,237,0.3);border-radius:8px">
          <div style="font-size:26px;font-weight:700;color:var(--accent)">${res.updated||0}</div>
          <div style="font-size:12px;color:var(--text3);margin-top:2px">覆盖更新</div>
        </div>
        <div style="flex:1;min-width:80px;text-align:center;padding:12px 10px;background:var(--bg2);border-radius:8px;border:1px solid var(--border)">
          <div style="font-size:26px;font-weight:700;color:var(--text3)">${res.skipped||0}</div>
          <div style="font-size:12px;color:var(--text3);margin-top:2px">跳过</div>
        </div>
        ${invalidHtml}
      </div>
      <div style="padding:8px 12px;background:rgba(99,179,237,0.06);border:1px solid rgba(99,179,237,0.2);border-radius:6px;font-size:12px;color:var(--text2)">

      </div>`;

    document.getElementById('pip-footer').innerHTML = `<button class="btn btn-primary" onclick="closeModal();loadPage()">完成并刷新</button>`;
    const cx=document.getElementById('modal-close'); if(cx){cx.style.opacity='1';cx.style.cursor='pointer';cx.onclick=()=>{closeModal();loadPage();};}

  } catch(e) {
    console.error(e);
    if(btn){ btn.disabled=false; btn.textContent='重试'; }
    alert('导入失败：' + e.message);
  }
}

function renderProductRows(products, canEdit) {
  if (!products.length) return '<tr><td colspan="8"><div class="empty-state"><div class="icon">📦</div>暂无产品</div></td></tr>';
  return products.map(p => `
  <tr>
    <td style="font-weight:500">${p.name||'-'}</td>
    <td><span class="badge badge-blue">${p.brand}</span></td>
    <td class="mono" style="color:var(--text)">${p.model}</td>
    <td>${p.type || '-'}</td>
    <td style="color:var(--text2);max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${p.description || '-'}</td>
    <td class="mono" style="color:var(--green)">¥${p.unit_price?.toFixed(2)}</td>
    <td>${p.unit}</td>
    ${canEdit ? `<td>
      <button class="btn btn-sm" data-action="edit-product" data-id="${p.id}">编辑</button>
      <button class="btn btn-sm btn-danger" data-action="del-product" data-id="${p.id}" style="margin-left:4px">删除</button>
    </td>` : ''}
  </tr>`).join('');
}

function attachProductActions(canEdit) {
  if (!canEdit) return;
  document.querySelectorAll('[data-action=edit-product]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const products = await api('GET', '/products');
      const p = products.find(x => x.id == btn.dataset.id);
      if (p) openProductModal(p);
    });
  });
  document.querySelectorAll('[data-action=del-product]').forEach(btn => {
    btn.addEventListener('click', async () => {
      if (!confirm('确定删除？')) return;
      await api('DELETE', '/products/' + btn.dataset.id);
      loadPage();
    });
  });
}

function openProductModal(product) {
  const p = product || {};
  showModal(`
  <div class="modal">
    <div class="modal-header">${p.id ? '编辑产品' : '新增产品'}<span class="modal-close" id="modal-close">×</span></div>
    <div class="modal-body">
      <div class="form-group"><label>产品名称 *</label><input id="p-name" value="${p.name||''}" placeholder="如：无线蓝牙耳机 Pro"></div>
      <div class="form-row">
        <div class="form-group"><label>品牌 *</label><input id="p-brand" value="${p.brand||''}"></div>
        <div class="form-group"><label>型号 *</label><input id="p-model" value="${p.model||''}"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>类型</label><input id="p-type" value="${p.type||''}"></div>
        <div class="form-group"><label>单位</label><input id="p-unit" value="${p.unit||'PCS'}"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>单价 (¥)</label><input id="p-price" type="number" step="0.01" value="${p.unit_price||0}"></div>
      </div>
      <div class="form-group"><label>描述</label><textarea id="p-desc">${p.description||''}</textarea></div>
    </div>
    <div class="modal-footer">
      <button class="btn" id="modal-cancel">取消</button>
      <button class="btn btn-primary" id="modal-save">保存</button>
    </div>
  </div>`);
  document.getElementById('modal-close').onclick = closeModal;
  document.getElementById('modal-cancel').onclick = closeModal;
  document.getElementById('modal-save').onclick = async () => {
    const body = {
      name: document.getElementById('p-name').value.trim(),
      brand: document.getElementById('p-brand').value.trim(),
      model: document.getElementById('p-model').value.trim(),
      type: document.getElementById('p-type').value.trim(),
      unit: document.getElementById('p-unit').value.trim() || 'PCS',
      unit_price: parseFloat(document.getElementById('p-price').value) || 0,
      description: document.getElementById('p-desc').value.trim(),
    };
    if (!body.name || !body.brand || !body.model) return alert('请填写产品名称、品牌和型号');
    try {
      if (p.id) await api('PUT', '/products/' + p.id, body);
      else await api('POST', '/products', body);
      closeModal();
    } catch (e) { alert(e.message); }
  };
}

async function loadInventory(content, actions) {

  if (canEdit) document.getElementById('btn-add-inv')?.addEventListener('click', () => openInventoryModal(null));

  const [items, stats, summary] = await Promise.all([
    api('GET', '/inventory'),
    api('GET', '/inventory/stats'),
    api('GET', '/inventory/summary'),
  ]);
  _invData = items;

  _invStatusBadge = s => ({
    'in_stock': '<span class="badge badge-green">在库</span>',
    'shipped':  '<span class="badge badge-blue">已出库</span>',
    'reserved': '<span class="badge badge-yellow">预留</span>',
  }[s] || `<span class="badge badge-gray">${s}</span>`);

  content.innerHTML = `
  <!-- 顶部统计卡 -->
  <div style="display:flex;flex-wrap:wrap;gap:12px;margin-bottom:20px;align-items:stretch">
    <div class="stat-card green"  style="min-width:110px;flex:0 0 auto"><div class="stat-value">${stats.in_stock}</div><div class="stat-label">在库数量</div></div>
    <div class="stat-card blue"   style="min-width:110px;flex:0 0 auto"><div class="stat-value">${stats.shipped}</div><div class="stat-label">已出库</div></div>
    <div class="stat-card yellow" style="min-width:110px;flex:0 0 auto"><div class="stat-value">${stats.total - stats.in_stock - stats.shipped}</div><div class="stat-label">预留</div></div>
    <div style="width:1px;background:var(--border);align-self:stretch;margin:0 4px"></div>
    ${summary.filter(s => s.in_stock > 0).map(s => `
    <div class="stat-card green" style="flex:0 0 auto">
      <div class="stat-value">${s.in_stock}</div>
      <div class="stat-label">${s.model}</div>
    </div>`).join('')}
    <div style="width:1px;background:var(--border);align-self:stretch;margin:0 4px"></div>
    <div class="stat-card" style="min-width:110px;flex:0 0 auto;border-left:3px solid var(--text3)">
      <div class="stat-value">${stats.total}</div><div class="stat-label">总计</div>
    </div>
  </div>

  <!-- 明细列表 -->
  <div class="search-bar">
    <input class="search-input" id="inv-search" placeholder="搜索产品名称、型号、序列号…">
    <select id="inv-status" style="width:120px">
      <option value="">全部状态</option>
      <option value="in_stock">在库</option>
      <option value="shipped">已出库</option>
      <option value="reserved">预留</option>
    </select>
    <button class="btn" id="btn-inv-search">搜索</button>
  </div>
  <div class="card">
    <div class="card-title">库存明细</div>
    <div class="table-wrap">
      <table>
        <thead><tr>
          ${makeSortTh('产品名称','product_name',_invSort,'inv')}
          ${makeSortTh('型号','product_model',_invSort,'inv')}
          <th>序列号 / 数量</th>
          <th>QC</th>
          ${makeSortTh('生产日期','manufacture_date',_invSort,'inv')}
          ${makeSortTh('出库日期','ship_date',_invSort,'inv')}
          ${makeSortTh('购买客户','customer_name',_invSort,'inv')}
          ${makeSortTh('保修(月)','warranty_months',_invSort,'inv')}
          ${makeSortTh('状态','status',_invSort,'inv')}
          ${canEdit ? '<th>操作</th>' : ''}
        </tr></thead>
        <tbody id="inv-tbody"></tbody>
      </table>
    </div>
  </div>`;

  invRenderTable(canEdit);

  document.getElementById('inv-search')?.addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('btn-inv-search')?.click(); });
  document.getElementById('btn-inv-search')?.addEventListener('click', async () => {
    const q  = document.getElementById('inv-search').value;
    const st = document.getElementById('inv-status').value;
    _invData = await api('GET', `/inventory?q=${encodeURIComponent(q)}&status=${st}`);
    invRenderTable(canEdit);
  });
}

function invSetSort(col) {
  if (_invSort.col === col) _invSort.dir = _invSort.dir === 'asc' ? 'desc' : 'asc';
  else { _invSort.col = col; _invSort.dir = 'asc'; }
  const canEdit = state.user.is_admin || hasPermission('inventory');
  invRenderTable(canEdit);
}

function invRenderTable(canEdit) {
  const sb = _invStatusBadge || (s => s);
  const getter = (i, col) => {
    if (col === 'warranty_months') return i.warranty_months || 0;
    return i[col] || '';
  };
  const sorted = clientSort(_invData, _invSort.col, _invSort.dir, getter);
  document.getElementById('inv-tbody').innerHTML = renderInventoryRows(sorted, canEdit, sb);
  updateSortArrows('inv', _invSort, ['product_name','product_model','manufacture_date','ship_date','customer_name','warranty_months','status']);
  attachInventoryActions(canEdit, sb);
}

function renderInventoryRows(items, canEdit, statusBadge) {
  if (!items.length) return `<tr><td colspan="${canEdit ? 10 : 9}"><div class="empty-state"><div class="icon">🏭</div>暂无库存明细</div></td></tr>`;
  return items.map(i => {
    // 有序列号：显示序列号；无序列号：显示数量
    const serialOrQty = i.serial_number
      ? `<span class="mono" style="color:var(--accent)">${i.serial_number}</span>`
      : `<span style="display:inline-flex;align-items:center;gap:4px">
           <span style="color:var(--text3);font-size:11px">数量</span>
           <span class="mono" style="color:var(--green);font-weight:700">${i.quantity ?? 1}</span>
         </span>`;
    return `
  <tr>
    <td style="font-weight:500">${i.product_name || '-'}</td>
    <td class="mono">${i.product_model}</td>
    <td>${serialOrQty}</td>
    <td style="color:var(--text2)">${i.qc_info || '-'}</td>
    <td>${i.manufacture_date || '-'}</td>
    <td>${i.ship_date || '-'}</td>
    <td>${i.customer_name || '-'}</td>
    <td class="mono">${i.warranty_months}</td>
    <td>${statusBadge(i.status)}</td>
    ${canEdit ? `<td>
      <button class="btn btn-sm" data-action="edit-inv" data-id="${i.id}">编辑</button>
      <button class="btn btn-sm btn-danger" data-action="del-inv" data-id="${i.id}" style="margin-left:4px">删除</button>
    </td>` : ''}
  </tr>`;
  }).join('');
}

function attachInventoryActions(canEdit, statusBadge) {
  if (!canEdit) return;
  document.querySelectorAll('[data-action=edit-inv]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const items = await api('GET', '/inventory');
      const item = items.find(x => x.id == btn.dataset.id);
      if (item) openInventoryModal(item);
    });
  });
  document.querySelectorAll('[data-action=del-inv]').forEach(btn => {
    btn.addEventListener('click', async () => {
      if (!confirm('确定删除此条库存记录？')) return;
      await api('DELETE', '/inventory/' + btn.dataset.id);
      loadPage();
    });
  });
}

function openInventoryModal(item) {
  const i = item || {};
  const products  = state.data.products  || [];
  const customers = state.data.customers || [];

  showModal(`
  <div class="modal">
    <div class="modal-header">${i.id ? '编辑库存' : '新增库存'}<span class="modal-close" id="modal-close">×</span></div>
    <div class="modal-body">
      <div class="form-group"><label>选择产品 *</label>
        <select id="i-product">
          <option value="">-- 请选择产品 --</option>
          ${products.map(p => `<option value="${p.id}|${p.model}|${p.warranty_months||12}" ${i.product_id==p.id?'selected':''}>${p.name ? p.name+' · ' : ''}[${p.brand}] ${p.model}</option>`).join('')}
        </select>
      </div>

      <div class="form-row">
        <div class="form-group"><label>序列号 <span style="color:var(--text3);font-size:11px">（有序列号时数量自动为1）</span></label>
          <input id="i-serial" value="${i.serial_number||''}" placeholder="无序列号则留空">
        </div>
        <div class="form-group"><label>数量 <span style="color:var(--text3);font-size:11px">（无序列号时填写）</span></label>
          <input id="i-qty" type="number" min="1" value="${i.quantity ?? 1}" placeholder="1">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group"><label>QC信息</label><input id="i-qc" value="${i.qc_info||''}"></div>
        <div class="form-group"><label>保修期(月)</label><input id="i-warranty" type="number" value="${i.warranty_months||12}"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>生产日期</label><input id="i-mfg" type="date" value="${i.manufacture_date||new Date().toISOString().split('T')[0]}"></div>
        <div class="form-group"><label>出库日期</label><input id="i-ship" type="date" value="${i.ship_date||''}"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>状态</label>
          <select id="i-status">
            <option value="in_stock" ${i.status==='in_stock'||!i.status?'selected':''}>在库</option>
            <option value="shipped"  ${i.status==='shipped' ?'selected':''}>已出库</option>
            <option value="reserved" ${i.status==='reserved'?'selected':''}>预留</option>
          </select>
        </div>
        <div class="form-group"><label>购买客户</label>
          <select id="i-customer">
            <option value="">-- 无 --</option>
            ${customers.map(c => `<option value="${c.id}" ${i.customer_id==c.id?'selected':''}>${c.company_name}</option>`).join('')}
          </select>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn" id="modal-cancel">取消</button>
      <button class="btn btn-primary" id="modal-save">保存</button>
    </div>
  </div>`);

  // 选择产品时自动填入保修期
  document.getElementById('i-product')?.addEventListener('change', e => {
    const val = e.target.value;
    if (val) {
      const parts = val.split('|');
      document.getElementById('i-warranty').value = parts[2] || '12';
    }
  });

  document.getElementById('modal-close').onclick  = closeModal;
  document.getElementById('modal-cancel').onclick = closeModal;
  document.getElementById('modal-save').onclick   = async () => {
    const productVal = document.getElementById('i-product').value;
    if (!productVal) return alert('请选择产品');
    const [productIdStr, productModel] = productVal.split('|');
    const customerID  = document.getElementById('i-customer').value;
    const serialValue = document.getElementById('i-serial').value.trim();
    const qtyValue    = parseInt(document.getElementById('i-qty').value) || 1;

    const body = {
      product_id:       parseInt(productIdStr),
      product_model:    productModel,
      serial_number:    serialValue,
      quantity:         serialValue ? 1 : qtyValue,
      qc_info:          document.getElementById('i-qc').value.trim(),
      manufacture_date: document.getElementById('i-mfg').value,
      ship_date:        document.getElementById('i-ship').value,
      customer_id:      customerID ? parseInt(customerID) : null,
      warranty_months:  parseInt(document.getElementById('i-warranty').value) || 12,
      status:           document.getElementById('i-status').value,
    };
    try {
      if (i.id) await api('PUT', '/inventory/' + i.id, body);
      else       await api('POST', '/inventory', body);
      closeModal();
    } catch (e) { alert(e.message); }
  };

  // 异步刷新产品和客户列表
  Promise.all([api('GET', '/products'), api('GET', '/customers')]).then(([ps, cs]) => {
    state.data.products  = ps;
    state.data.customers = cs;
    const pSel = document.getElementById('i-product');
    const cSel = document.getElementById('i-customer');
    if (pSel) {
      pSel.innerHTML = '<option value="">-- 请选择产品 --</option>' +
        ps.map(p => `<option value="${p.id}|${p.model}|${p.warranty_months||12}" ${i.product_id==p.id?'selected':''}>${p.name ? p.name+' · ' : ''}[${p.brand}] ${p.model}</option>`).join('');
    }
    if (cSel) {
      cSel.innerHTML = '<option value="">-- 无 --</option>' +
        cs.map(c => `<option value="${c.id}" ${i.customer_id==c.id?'selected':''}>${c.company_name}</option>`).join('');
    }
  });
}
