// ── 定时同步 ──────────────────────────────────────────────────────────────────
// 两档间隔：
//   邮件页面打开  → 30秒（快速）
//   其他页面      → 240秒（慢速，后台兜底）
//   关闭浏览器    → 完全停止（visibilitychange 触发）
const EMAIL_SYNC_FAST = 30000;   // 邮件页面：30秒
const EMAIL_SYNC_SLOW = 240000;  // 其他页面：240秒

// 启动快速定时（进入邮件页面时调用）
function emailStartSyncTimer() {
  emailSetSyncInterval(EMAIL_SYNC_FAST);
  // 立刻同步一次
  emailSyncAll(null);
}

// 切换到慢速定时（离开邮件页面时调用）
function emailSlowSyncTimer() {
  emailSetSyncInterval(EMAIL_SYNC_SLOW);
}

// 停止所有定时（关闭浏览器/退出登录时调用）
function emailStopSyncTimer() {
  if (_emailSyncTimer) { clearInterval(_emailSyncTimer); _emailSyncTimer = null; }
}

// 内部：设置间隔（自动清除旧定时器）
function emailSetSyncInterval(ms) {
  if (_emailSyncTimer) clearInterval(_emailSyncTimer);
  _emailSyncTimer = setInterval(() => emailSyncAll(null), ms);
}

async function emailSyncAll(btn) {
  // 前提：必须有配置邮箱账户，否则跳过
  if (_emailAccounts.length === 0) {
    // 尝试静默加载一次账户（可能刚登录还没加载）
    await emailLoadAccounts();
    if (_emailAccounts.length === 0) return; // 确实没有账户，不发请求
  }
  const info = document.getElementById('em-sync-info');
  if (btn) { btn.disabled = true; btn.textContent = '同步中…'; }
  try {
    const res = await api('POST', '/email/sync');
    const now = new Date().toLocaleTimeString('zh-CN', {hour:'2-digit',minute:'2-digit'});
    if (info) info.textContent = `${now} +${res.new||0}封`;
    if (res.new > 0) await emailLoadMessages();
    // 同步后刷新发件箱角标（可能有邮件发送成功/失败状态变化）
    emailRefreshOutboxBadge();
  } catch(e) {
    if (info) info.textContent = '同步失败';
  }
  if (btn) { btn.disabled = false; btn.textContent = '📨 收信'; }
}

// ── 账户 & 联系人加载 ─────────────────────────────────────────────────────────
async function emailLoadAccounts() {
  try {
    const res = await api('GET', '/email/accounts');
    _emailAccounts = res.accounts || [];
  } catch(e) { _emailAccounts = []; }
}

async function emailLoadContacts() {
  try {
    const res = await api('GET', '/email/contacts');
    _emailContacts = res.contacts || [];
  } catch(e) { _emailContacts = []; }
}

// ── 文件夹渲染 ────────────────────────────────────────────────────────────────
function emailRenderFolders() {
  const el = document.getElementById('em-folder-list');
  if (!el) return;
  el.innerHTML = EMAIL_FOLDERS.map(f => {
    const isActive = _emailFolder === f.id || (_emailFolder === 'starred' && f.id === 'starred');
    return `<div onclick="emailSwitchFolder('${f.id}')"
      style="display:flex;align-items:center;gap:8px;padding:8px 14px;cursor:pointer;
             font-size:13px;border-radius:6px;margin:2px 6px;
             background:${isActive ? 'var(--accent)' : 'transparent'};
             color:${isActive ? '#fff' : 'var(--text)'};"
      onmouseenter="if(!${isActive}) this.style.background='var(--bg3)'"
      onmouseleave="if(!${isActive}) this.style.background='transparent'">
      <span>${f.icon}</span>
      <span style="flex:1">${f.label}</span>
    </div>`;
  }).join('');
}

async function emailSwitchFolder(folder) {
  _emailFolder = folder;
  _emailPage = 1;
  emailRenderFolders();
  const titleEl = document.getElementById('em-folder-title');
  if (titleEl) {
    const f = EMAIL_FOLDERS.find(x => x.id === folder);
    if (f) titleEl.textContent = f.label;
  }
  // 重置右侧
  const detail = document.getElementById('em-detail');
  if (detail) detail.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;
    height:100%;color:var(--text3);font-size:14px">选择邮件查看详情</div>`;
  await emailLoadMessages();
}

// ── 邮件列表 ──────────────────────────────────────────────────────────────────
async function emailLoadMessages() {
  const listEl = document.getElementById('em-list');
  if (!listEl) return;
  _emailSelected.clear(); // 切换/刷新时清空多选
  emailUpdateSelectBar();
  listEl.innerHTML = `<div style="padding:20px;text-align:center;color:var(--text3)"><div class="spinner"></div></div>`;

  try {
    let url = `/email/messages?page=${_emailPage}`;
    if (_emailFolder === 'starred') {
      url += '&starred=1';
    } else {
      url += `&folder=${_emailFolder}`;
    }
    const res = await api('GET', url);
    _emailMessages = res.messages || [];
    _emailTotal    = res.total || 0;

    if (_emailMessages.length === 0) {
      listEl.innerHTML = `<div style="padding:30px;text-align:center;color:var(--text3);font-size:13px">暂无邮件</div>`;
      document.getElementById('em-total-badge').textContent = '';
      document.getElementById('em-pagination').innerHTML = '';
      return;
    }

    document.getElementById('em-total-badge').textContent = `共 ${_emailTotal} 封`;
    listEl.innerHTML = _emailMessages.map(m => emailMessageRow(m)).join('');
    emailRenderPagination();
  } catch(e) {
    listEl.innerHTML = `<div style="padding:20px;color:var(--red);font-size:13px">加载失败: ${e.message}</div>`;
  }
}

function emailMessageRow(m) {
  const date = m.mail_date ? m.mail_date.substring(0, 16) : '';
  const from = escHtml(m.from_addr.replace(/<.*?>/, '').trim() || m.from_addr);
  const subject = escHtml(m.subject || '（无主题）');
  const unread = !m.is_read;
  const star = m.is_starred ? '⭐' : '☆';
  const hasAtt = m.has_attachments ? '📎 ' : '';
  // 发件箱状态标签
  const statusTag = m.folder === 'outbox' ? (() => {
    const s = m.send_status || 'pending';
    const map = { pending:'⏳ 等待发送', sending:'📡 发送中', sent:'✅ 已发送', failed:'❌ 发送失败' };
    const color = { pending:'var(--text3)', sending:'var(--accent)', sent:'var(--green)', failed:'var(--red)' };
    return `<span style="font-size:11px;color:${color[s]||'var(--text3)'}">${map[s]||s}</span>`;
  })() : '';
  // 多账户标签
  const acctTag = _emailAccounts.length > 1
    ? `<span style="font-size:10px;background:var(--bg3);border-radius:4px;padding:1px 5px;color:var(--text3);margin-left:4px">${escHtml(m.account_email||'')}</span>`
    : '';

  const sel = _emailSelected.has(m.id);
  const rowBg = sel ? 'var(--bg3)' : unread ? 'var(--bg2)' : '';
  const leaveBg = sel ? 'var(--bg3)' : unread ? 'var(--bg2)' : '';
  return `<div id="em-row-${m.id}"
    onclick="emailOpenMessage(${m.id})"
    style="padding:8px 12px;border-bottom:1px solid var(--border);cursor:pointer;background:${rowBg}"
    onmouseenter="this.style.background='var(--bg3)'"
    onmouseleave="this.style.background='${leaveBg}'">
    <div style="display:flex;align-items:center;gap:6px;margin-bottom:3px">
      <input type="checkbox" id="em-chk-${m.id}"
        ${sel ? 'checked' : ''}
        onclick="emailToggleSelect(event,${m.id})"
        style="width:13px;height:13px;cursor:pointer;flex-shrink:0">
      <span style="flex:1;font-size:13px;font-weight:${unread ? '600' : '400'};
               color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap"
        title="${escHtml(m.from_addr)}">${from}${acctTag}</span>
      <span style="font-size:11px;color:var(--text3);flex-shrink:0">${date}</span>
      <span onclick="emailToggleStar(event,${m.id},${m.is_starred})"
        style="font-size:13px;cursor:pointer;flex-shrink:0" title="星标">${star}</span>
    </div>
    <div style="display:flex;align-items:center;gap:6px">
      <div style="flex:1;font-size:12px;color:var(--text);font-weight:${unread?'600':'400'};
                  overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${hasAtt}${subject}</div>
      ${statusTag}
    </div>
  </div>`;
}

// ── 多选 ──────────────────────────────────────────────────────────────────────
function emailToggleSelect(e, mid) {
  e.stopPropagation();
  if (_emailSelected.has(mid)) {
    _emailSelected.delete(mid);
  } else {
    _emailSelected.add(mid);
  }
  // 更新行背景
  const row = document.getElementById(`em-row-${mid}`);
  if (row) row.style.background = _emailSelected.has(mid) ? 'var(--bg3)' : '';
  emailUpdateSelectBar();
}

function emailToggleSelectAll(checked) {
  _emailSelected.clear();
  if (checked) {
    _emailMessages.forEach(m => _emailSelected.add(m.id));
  }
  // 刷新所有行的复选框和背景
  _emailMessages.forEach(m => {
    const chk = document.getElementById(`em-chk-${m.id}`);
    if (chk) chk.checked = checked;
    const row = document.getElementById(`em-row-${m.id}`);
    if (row) row.style.background = checked ? 'var(--bg3)' : '';
  });
  emailUpdateSelectBar();
}

// 更新操作栏显示（有选中则显示，同步全选框状态）
function emailUpdateSelectBar() {
  const bar = document.getElementById('em-select-bar');
  const cnt = document.getElementById('em-select-count');
  const allChk = document.getElementById('em-select-all');
  const n = _emailSelected.size;
  if (bar) bar.style.display = n > 0 ? 'flex' : 'none';
  if (cnt) cnt.textContent = `已选 ${n} 封`;
  if (allChk) {
    allChk.checked = n > 0 && n === _emailMessages.length;
    allChk.indeterminate = n > 0 && n < _emailMessages.length;
  }
}

async function emailDeleteSelected() {
  const ids = [..._emailSelected].map(id => parseInt(id)); // 确保是整数
  if (ids.length === 0) return;
  const label = _emailFolder === 'drafts' ? '删除' : '删除（移入回收站）';
  if (!confirm(`确认${label} ${ids.length} 封邮件？`)) return;

  // 逐条删除，避免并发时SQLite写锁竞争
  let ok = 0;
  for (const id of ids) {
    try {
      await api('DELETE', `/email/messages/${id}`);
      ok++;
    } catch(e) { /* 静默，继续删其他的 */ }
  }
  _emailSelected.clear();
  await emailLoadMessages();
  // 右侧清空（草稿删除后不保留预览）
  const detail = document.getElementById('em-detail');
  if (detail && (_emailFolder === 'drafts' || ok > 0)) {
    detail.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;
      height:100%;color:var(--text3);font-size:14px">选择邮件查看详情，或点击「写信」新建邮件</div>`;
  }
  if (ok < ids.length) emailToast(`删除完成：${ok}/${ids.length} 封成功`, 'warn');
}

function emailRenderPagination() {
  const el = document.getElementById('em-pagination');
  if (!el) return;
  const totalPages = Math.ceil(_emailTotal / 30) || 1;
  el.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;font-size:12px">
      <button class="btn btn-sm" onclick="_emailPage=Math.max(1,_emailPage-1);emailLoadMessages()"
        ${_emailPage<=1?'disabled':''}>‹</button>
      <span style="color:var(--text3)">${_emailPage}/${totalPages}</span>
      <button class="btn btn-sm" onclick="_emailPage=Math.min(${totalPages},_emailPage+1);emailLoadMessages()"
        ${_emailPage>=totalPages?'disabled':''}>›</button>
    </div>`;
}

async function emailToggleStar(e, mid, currentStar) {
  e.stopPropagation();
  const newStar = !currentStar;
  await api('PUT', `/email/messages/${mid}/star`, { starred: newStar });
  const m = _emailMessages.find(x => x.id === mid);
  if (m) m.is_starred = newStar;
  const row = document.getElementById(`em-row-${mid}`);
  if (row) {
    const starEl = row.querySelector('span[title="星标"]');
    if (starEl) starEl.textContent = newStar ? '⭐' : '☆';
  }
}

// ── 邮件详情 ──────────────────────────────────────────────────────────────────
let _emailOpeningMsg = false; // 防重入：避免快速连点触发多次请求

async function emailOpenMessage(mid) {
  if (_emailOpeningMsg) return;
  _emailOpeningMsg = true;
  const detail = document.getElementById('em-detail');
  if (!detail) { _emailOpeningMsg = false; return; }
  detail.innerHTML = `<div style="padding:20px;text-align:center;color:var(--text3)"><div class="spinner"></div></div>`;

  // 标记列表中已读
  const row = document.getElementById(`em-row-${mid}`);
  if (row) {
    row.style.background = '';
    row.style.fontWeight = '400';
  }

  try {
    const res = await api('GET', `/email/messages/${mid}`);
    const m = res.message;

    // 草稿箱：直接进入编辑状态
    if (m.folder === 'drafts') {
      _emailOpeningMsg = false;
      emailOpenDraft(m);
      return;
    }
    const atts = res.attachments || [];

    const fromHtml = `<span style="font-weight:600">${escHtml(m.from_addr)}</span>`;
    const attHtml = atts.length > 0 ? `
      <div style="padding:10px 20px;border-top:1px solid var(--border);display:flex;flex-wrap:wrap;gap:8px">
        ${atts.map(a => `
          <a href="/api/email/messages/${mid}/attachments/${a.id}/download?token=${state.token}"
             style="display:flex;align-items:center;gap:6px;padding:6px 10px;
                    background:var(--bg3);border-radius:6px;font-size:12px;
                    color:var(--text);text-decoration:none;border:1px solid var(--border)"
             download="${escHtml(a.filename)}">
            📎 ${escHtml(a.filename)}
            <span style="color:var(--text3)">(${(a.size/1024).toFixed(1)}KB)</span>
          </a>`).join('')}
      </div>` : '';

    // 正文区域：优先HTML，在iframe中渲染
    let bodyHtml = '';
    if (m.body_html) {
      const encoded = btoa(unescape(encodeURIComponent(m.body_html)));
      bodyHtml = `<iframe sandbox="allow-same-origin"
        srcdoc="${escHtml(m.body_html)}"
        style="width:100%;min-height:400px;border:none;background:#fff"
        onload="this.style.height=this.contentDocument.body.scrollHeight+40+'px'"></iframe>`;
    } else {
      bodyHtml = `<pre style="white-space:pre-wrap;font-size:13px;color:var(--text);
                       font-family:inherit;margin:0;padding:16px 20px">${escHtml(m.body_text)}</pre>`;
    }

    detail.innerHTML = `
      <div style="max-width:860px;margin:0 auto;padding:20px 16px">
        <!-- 操作栏 -->
        <div style="display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap">
          <button class="btn btn-sm" onclick="emailReply(${mid})">↩ 回复</button>
          <button class="btn btn-sm" onclick="emailForward(${mid})">↪ 转发</button>
          <button class="btn btn-sm" onclick="emailToggleStar(event,${mid},${m.is_starred})">
            ${m.is_starred?'⭐ 取消星标':'☆ 星标'}
          </button>
          <button class="btn btn-sm" onclick="emailMovePrompt(${mid})">📁 移动</button>
          <button class="btn btn-sm btn-danger" onclick="emailDelete(${mid})">🗑 删除</button>
          ${m.folder==='trash'||m.folder==='spam'
            ? `<button class="btn btn-sm btn-danger" onclick="emailPermanentDelete(${mid})">彻底删除</button>` : ''}
        </div>
        <!-- 邮件头 -->
        <div class="card" style="padding:0;overflow:hidden;margin-bottom:0">
          <div style="padding:16px 20px;border-bottom:1px solid var(--border)">
            <div style="font-size:17px;font-weight:700;color:var(--text);margin-bottom:10px">
              ${escHtml(m.subject||'（无主题）')}
            </div>
            <div style="font-size:12px;color:var(--text3);line-height:1.8">
              <div>发件人：${fromHtml}</div>
              <div>收件人：${escHtml(m.to_addrs)}</div>
              ${m.cc_addrs ? `<div>抄送：${escHtml(m.cc_addrs)}</div>` : ''}
              <div>时间：${m.mail_date||'—'}</div>
              ${_emailAccounts.length>1 ? `<div>账户：${escHtml(m.account_name)} &lt;${escHtml(m.account_email)}&gt;</div>` : ''}
            </div>
          </div>
          <!-- 正文 -->
          <div style="padding:0">${bodyHtml}</div>
          <!-- 附件 -->
          ${attHtml}
        </div>
      </div>`;

    // 更新列表中已读状态
    const msgInList = _emailMessages.find(x => x.id === mid);
    if (msgInList) msgInList.is_read = true;
    _emailOpeningMsg = false;
  } catch(e) {
    _emailOpeningMsg = false;
    detail.innerHTML = `<div style="padding:20px;color:var(--red)">加载失败: ${e.message}</div>`;
  }
}

// ── 邮件操作 ──────────────────────────────────────────────────────────────────
async function emailDelete(mid) {
  await api('DELETE', `/email/messages/${mid}`);
  await emailLoadMessages();
  const detail = document.getElementById('em-detail');
  if (detail) detail.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;
    height:100%;color:var(--text3);font-size:14px">邮件已删除</div>`;
}

async function emailPermanentDelete(mid) {
  if (!confirm('彻底删除后无法恢复，确认删除？')) return;
  await api('DELETE', `/email/messages/${mid}/permanent`);
  await emailLoadMessages();
}

function emailMovePrompt(mid) {
  const folders = EMAIL_FOLDERS.filter(f => !['starred','contacts'].includes(f.id));
  dcShowModal(`
    <div class="modal">
      <div class="modal-header">移动到文件夹<span class="modal-close" onclick="dcCloseModal()">×</span></div>
      <div class="modal-body">
        <div style="display:flex;flex-direction:column;gap:8px">
          ${folders.map(f => `
            <button class="btn" onclick="emailMoveTo(${mid},'${f.id}')"
              style="text-align:left;padding:10px 16px;font-size:13px">
              ${f.icon} ${f.label}
            </button>`).join('')}
        </div>
      </div>
    </div>`);
}

async function emailMoveTo(mid, folder) {
  dcCloseModal();
  await api('PUT', `/email/messages/${mid}/move`, { folder });
  await emailLoadMessages();
}

function emailReply(mid) {
  const m = _emailMessages.find(x => x.id === mid);
  if (!m) return;
  const accountId = m.account_id || (_emailAccounts[0]?.id);
  emailCompose({
    account_id: accountId,
    to: [m.from_addr],
    subject: m.subject.startsWith('Re:') ? m.subject : 'Re: ' + m.subject,
    quote: m.body_text || m.body_html,
    quoteIsHtml: !!m.body_html,
  });
}

function emailForward(mid) {
  const m = _emailMessages.find(x => x.id === mid);
  if (!m) return;
  const accountId = m.account_id || (_emailAccounts[0]?.id);
  emailCompose({
    account_id: accountId,
    subject: m.subject.startsWith('Fwd:') ? m.subject : 'Fwd: ' + m.subject,
    quote: m.body_text || m.body_html,
    quoteIsHtml: !!m.body_html,
  });
}

// 打开草稿进入编辑状态（内容预填，保存时走更新草稿接口）
function emailOpenDraft(m) {
  // 先停草稿自动保存（如果有的话）
  if (_emailDraftTimer) { clearInterval(_emailDraftTimer); _emailDraftTimer = null; }

  // 设置当前草稿ID，后续保存/发送时使用
  _emailDraftId = m.id;

  // 确定发件账户（优先使用草稿关联的账户）
  const draftAccountId = m.account_id || (_emailAccounts[0]?.id || 0);

  emailCompose({
    account_id: draftAccountId,
    to:         m.to_addrs ? m.to_addrs.split(',').map(s => s.trim()).filter(Boolean) : [],
    cc:         m.cc_addrs || '',
    subject:    m.subject  || '',
    body_html:  m.body_html || '',
    body_text:  m.body_text || '',
    _draftId:   m.id,      // 标记为草稿编辑模式，顶部标题显示"编辑草稿"
  });
}

// ── 写信 ──────────────────────────────────────────────────────────────────────
function emailCompose(opts) {
  _emailComposeData = opts || {};
  // 如果是从草稿打开（opts._draftId 有值），保留草稿ID；否则清空（新写信）
  if (opts?._draftId) {
    _emailDraftId = opts._draftId;
  } else {
    _emailDraftId = null;
  }
  if (_emailDraftTimer) { clearInterval(_emailDraftTimer); _emailDraftTimer = null; }
  _quillEditor = null;

  const detail = document.getElementById('em-detail');
  if (!detail) return;

  const acctOptions = _emailAccounts.map(a =>
    `<option value="${a.id}" ${(opts?.account_id===a.id)?'selected':''}>${escHtml(a.name)} &lt;${escHtml(a.email_address)}&gt;</option>`
  ).join('');

  if (_emailAccounts.length === 0) {
    detail.innerHTML = `<div style="padding:30px;text-align:center;color:var(--text3)">
      请先在「账户设置」中添加邮箱账户
      <br><button class="btn btn-primary" style="margin-top:12px" onclick="emailShowAccounts()">去添加</button>
    </div>`;
    return;
  }

  const toVal = opts?.to ? opts.to.join(', ') : '';
  const subjectVal = escHtml(opts?.subject || '');
  const ccVal = escHtml(opts?.cc || '');
  const isDraft = !!opts?._draftId;
  const composeTitle = isDraft ? '📝 编辑草稿' : '✏️ 新邮件';

  detail.innerHTML = `
    <div style="display:flex;flex-direction:column;height:100%">
      <!-- 头部 -->
      <div style="padding:12px 16px;border-bottom:1px solid var(--border);
                  display:flex;align-items:center;justify-content:space-between">
        <span style="font-size:14px;font-weight:600;color:var(--text)">${composeTitle}</span>
        <div style="display:flex;gap:8px">
          <button class="btn btn-sm" onclick="emailSaveDraft()">💾 保存草稿</button>
          <button class="btn btn-primary btn-sm" onclick="emailSendNow()">📤 发送</button>
          <button class="btn btn-sm" onclick="emailCancelCompose()">✕</button>
        </div>
      </div>
      <!-- 表单 -->
      <div style="padding:12px 16px;border-bottom:1px solid var(--border)">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
          <span style="width:50px;font-size:12px;color:var(--text3);flex-shrink:0">发件人</span>
          <select id="em-compose-account" style="flex:1;padding:5px 8px;font-size:13px;
            background:var(--bg3);border:1px solid var(--border);border-radius:6px;color:var(--text)">
            ${acctOptions}
          </select>
        </div>
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
          <span style="width:50px;font-size:12px;color:var(--text3);flex-shrink:0">收件人</span>
          <input id="em-compose-to" value="${escHtml(toVal)}" placeholder="多个地址用逗号分隔"
            style="flex:1;padding:5px 8px;font-size:13px;background:var(--bg3);
                   border:1px solid var(--border);border-radius:6px;color:var(--text)">
        </div>
        <div id="em-cc-row" style="${ccVal ? 'display:flex' : 'display:none'};align-items:center;gap:8px;margin-bottom:8px">
          <span style="width:50px;font-size:12px;color:var(--text3);flex-shrink:0">抄送</span>
          <input id="em-compose-cc" value="${ccVal}" placeholder="抄送地址"
            style="flex:1;padding:5px 8px;font-size:13px;background:var(--bg3);
                   border:1px solid var(--border);border-radius:6px;color:var(--text)">
        </div>
        <div style="display:flex;align-items:center;gap:8px">
          <span style="width:50px;font-size:12px;color:var(--text3);flex-shrink:0">主题</span>
          <input id="em-compose-subject" value="${subjectVal}" placeholder="邮件主题"
            style="flex:1;padding:5px 8px;font-size:13px;background:var(--bg3);
                   border:1px solid var(--border);border-radius:6px;color:var(--text)">
          <button onclick="document.getElementById('em-cc-row').style.display='flex'"
            style="background:none;border:none;font-size:12px;color:var(--accent);cursor:pointer">
            +抄送
          </button>
        </div>
      </div>
      <!-- Quill编辑器 -->
      <div style="flex:1;display:flex;flex-direction:column;overflow:hidden">
        <div id="em-quill-editor" style="flex:1;font-size:13px;overflow-y:auto"></div>
      </div>
    </div>`;

  // 加载 Quill
  emailInitQuill(opts);

  // 每30秒自动保存草稿
  _emailDraftTimer = setInterval(() => emailSaveDraft(true), 30000);
}

function emailInitQuill(opts) {
  if (typeof Quill === 'undefined') {
    // 动态加载 Quill CSS + JS
    if (!document.getElementById('quill-css')) {
      const link = document.createElement('link');
      link.id = 'quill-css';
      link.rel = 'stylesheet';
      link.href = 'https://cdnjs.cloudflare.com/ajax/libs/quill/1.3.7/quill.snow.min.css';
      document.head.appendChild(link);
    }
    const script = document.createElement('script');
    script.src = 'https://cdnjs.cloudflare.com/ajax/libs/quill/1.3.7/quill.min.js';
    script.onload = () => emailInitQuillInstance(opts);
    document.head.appendChild(script);
  } else {
    emailInitQuillInstance(opts);
  }
}

function emailInitQuillInstance(opts) {
  const el = document.getElementById('em-quill-editor');
  if (!el) return;
  _quillEditor = new Quill('#em-quill-editor', {
    theme: 'snow',
    placeholder: '写点什么…',
    modules: {
      toolbar: [
        ['bold','italic','underline','strike'],
        [{ color: [] }, { background: [] }],
        [{ list: 'ordered' }, { list: 'bullet' }],
        ['link'],
        ['clean'],
      ],
    },
  });

  // 草稿：直接填入正文内容（不作为引用块）
  if (opts?.body_html) {
    _quillEditor.clipboard.dangerouslyPasteHTML(opts.body_html);
    _quillEditor.setSelection(0, 0);
  } else if (opts?.body_text) {
    _quillEditor.setText(opts.body_text);
    _quillEditor.setSelection(0, 0);
  } else if (opts?.quote) {
    // 回复/转发：作为引用块插入
    const quoteHtml = opts.quoteIsHtml
      ? `<blockquote style="border-left:3px solid #ccc;margin:8px 0;padding-left:12px;color:#666">${opts.quote}</blockquote>`
      : `<blockquote style="border-left:3px solid #ccc;margin:8px 0;padding-left:12px;color:#666"><pre style="margin:0;white-space:pre-wrap">${escHtml(opts.quote)}</pre></blockquote>`;
    _quillEditor.clipboard.dangerouslyPasteHTML('<p><br></p>' + quoteHtml);
    _quillEditor.setSelection(0, 0);
  }
}

async function emailSaveDraft(silent) {
  if (!_quillEditor) return;
  const to  = document.getElementById('em-compose-to')?.value.trim() || '';
  const cc  = document.getElementById('em-compose-cc')?.value.trim() || '';
  const sub = document.getElementById('em-compose-subject')?.value.trim() || '';
  const html = _quillEditor.root.innerHTML;
  const text = _quillEditor.getText();
  const accId = parseInt(document.getElementById('em-compose-account')?.value || '0');

  try {
    if (_emailDraftId) {
      await api('PUT', `/email/draft/${_emailDraftId}`, { to, cc, subject: sub, body_html: html, body_text: text });
    } else {
      const res = await api('POST', '/email/draft', { account_id: accId, to, cc, subject: sub, body_html: html, body_text: text });
      _emailDraftId = res.id;
    }

    // silent=true 时是自动保存（定时器触发），不关闭界面
    if (!silent) {
      // 手动点保存草稿：停定时器、清状态、关闭写信界面
      if (_emailDraftTimer) { clearInterval(_emailDraftTimer); _emailDraftTimer = null; }
      _emailDraftId = null;
      _quillEditor = null;
      const detail = document.getElementById('em-detail');
      if (detail) detail.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;
        height:100%;color:var(--text3);font-size:14px">草稿已保存</div>`;
      // 若当前在草稿箱，刷新列表
      if (_emailFolder === 'drafts') await emailLoadMessages();
      emailToast('草稿已保存', 'success');
    }
  } catch(e) {
    if (!silent) emailToast('草稿保存失败：' + e.message, 'error');
  }
}

async function emailSendNow() {
  if (!_quillEditor) return;
  const to  = (document.getElementById('em-compose-to')?.value || '').split(',').map(s => s.trim()).filter(Boolean);
  const cc  = (document.getElementById('em-compose-cc')?.value || '').split(',').map(s => s.trim()).filter(Boolean);
  const sub = document.getElementById('em-compose-subject')?.value.trim() || '';
  const html = _quillEditor.root.innerHTML;
  const text = _quillEditor.getText();
  const accId = parseInt(document.getElementById('em-compose-account')?.value || '0');

  if (to.length === 0) { emailToast('请填写收件人', 'error'); return; }
  if (!accId) { emailToast('请选择发件账户', 'error'); return; }

  // 发送中状态：禁用按钮，显示进度
  const sendBtn = document.querySelector('#em-detail .btn-primary');
  const origText = sendBtn?.textContent || '📤 发送';
  if (sendBtn) { sendBtn.disabled = true; sendBtn.textContent = '发送中…'; }

  try {
    await api('POST', '/email/send', {
      account_id: accId, to, cc, subject: sub,
      body_html: html, body_text: text,
      draft_id: _emailDraftId || 0,
    });
    if (_emailDraftTimer) { clearInterval(_emailDraftTimer); _emailDraftTimer = null; }
    _emailDraftId = null;
    _quillEditor = null;
    // 异步发送：立即关闭写信界面，提示已进入发送队列
    const detail = document.getElementById('em-detail');
    if (detail) detail.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;
      height:100%;color:var(--text3);font-size:14px">选择邮件查看详情，或点击「写信」新建邮件</div>`;
    emailToast('📮 邮件已加入发送队列，将在后台发送', 'success');
    // 切换到发件箱让用户看到状态
    await emailSwitchFolder('outbox');
  } catch(e) {
    if (sendBtn) { sendBtn.disabled = false; sendBtn.textContent = origText; }
    emailToast('提交失败：' + e.message, 'error');
  }
}

// 检查发送失败退回草稿的邮件，toast提示用户
async function emailCheckFailedBack() {
  try {
    const res = await api('GET', '/email/outbox/status');
    if (res.failed_back > 0) {
      emailToast(
        `⚠️ 有 ${res.failed_back} 封邮件因多次发送失败已退回草稿箱，请检查邮箱账户设置后重新发送`,
        'warn', 8000
      );
      // 告知服务端用户已看到提示，下次不再重复提示
      api('POST', '/email/outbox/ack').catch(()=>{});
    }
    if (res.pending > 0) {
      const info = document.getElementById('em-sync-info');
      if (info) info.textContent = `📮 ${res.pending}封待发`;
    }
  } catch(e) { /* 静默 */ }
}

// 刷新发件箱角标数量
async function emailRefreshOutboxBadge() {
  try {
    const res = await api('GET', '/email/outbox/status');
    // 更新发件箱角标（如果当前在发件箱视图则刷新列表）
    if (_emailFolder === 'outbox') await emailLoadMessages();
    const info = document.getElementById('em-sync-info');
    if (info && res.pending > 0) info.textContent = `📮 ${res.pending}封待发`;
    else if (info && res.pending === 0 && info.textContent.includes('待发')) info.textContent = '';
  } catch(e) { /* 静默 */ }
}

// 邮件模块通用 Toast（不阻塞界面，3秒后自动消失）
function emailToast(msg, type, duration) {
  const el = document.createElement('div');
  const bgMap = { error: '#c62828', success: '#2e7d32', warn: '#e65100' };
  const bg = bgMap[type] || bgMap.success;
  const ms = duration || (type === 'error' ? 5000 : type === 'warn' ? 7000 : 2500);
  el.style.cssText = `position:fixed;top:72px;right:20px;z-index:9999;
    padding:10px 18px;border-radius:8px;font-size:13px;max-width:400px;word-break:break-word;
    background:${bg};color:#fff;
    box-shadow:0 4px 16px rgba(0,0,0,.35);animation:fadeIn .2s`;
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), ms);
}

function emailCancelCompose() {
  if (_emailDraftTimer) { clearInterval(_emailDraftTimer); _emailDraftTimer = null; }
  _emailDraftId = null;
  _quillEditor = null;
  const detail = document.getElementById('em-detail');
  if (detail) detail.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;
    height:100%;color:var(--text3);font-size:14px">选择邮件查看详情，或点击「写信」新建邮件</div>`;

function emailAddContact() {
  dcShowModal(`
    <div class="modal">
      <div class="modal-header">添加重要联系人<span class="modal-close" onclick="dcCloseModal()">×</span></div>
      <div class="modal-body">
        <div class="form-group">
          <label>姓名（可选）</label>

function emailApplyPreset(idx) {
  if (idx === '') return;
  const p = (window._emailPresets || [])[parseInt(idx)];
  if (!p) return;
  const set = (id, val) => { const el = document.getElementById('eaf-' + id); if (el) el.value = val; };
  set('imap_host', p.imap_host || '');
  set('imap_port', p.imap_port || 993);
  set('pop3_host', p.pop3_host || '');
  set('pop3_port', p.pop3_port || 995);
  set('smtp_host', p.smtp_host || '');
  set('smtp_port', p.smtp_port || 465);
  const setCheck = (id, val) => { const el = document.getElementById('eaf-' + id); if (el) el.checked = !!val; };
  setCheck('imap_ssl', p.imap_ssl !== false);
  setCheck('pop3_ssl', p.pop3_ssl !== false);
  setCheck('smtp_ssl', p.smtp_ssl !== false);
}

function emailEditAccount(aid) {
  emailAddAccountModal(aid);
}

async function emailSaveAccount(editId) {
  const g = id => document.getElementById('eaf-' + id);
  const val = id => g(id)?.value.trim() || '';
  const num = id => parseInt(g(id)?.value || '0') || 0;
  const chk = id => g(id)?.checked ?? true;
  const proto = document.querySelector('input[name="eaf-proto"]:checked')?.value || 'imap';

  const body = {
    name: val('name'), email_address: val('email'), protocol: proto,
    imap_host: val('imap_host'), imap_port: num('imap_port'), imap_ssl: chk('imap_ssl'),
    pop3_host: val('pop3_host'), pop3_port: num('pop3_port'), pop3_ssl: chk('pop3_ssl'),
    smtp_host: val('smtp_host'), smtp_port: num('smtp_port'), smtp_ssl: chk('smtp_ssl'),
    username: val('username'), password: val('password'),
  };

  if (!body.email_address) { alert('请填写邮箱地址'); return; }
  if (!editId && !body.password) { alert('请填写密码'); return; }

  try {
    if (editId) {
      await api('PUT', `/email/accounts/${editId}`, body);
    } else {
      await api('POST', '/email/accounts', body);
    }
    dcCloseModal();
    emailShowAccounts();
    emailLoadAccounts();
  } catch(e) { alert('保存失败: ' + e.message); }
}

// ── 系统信息 ─────────────────────────────────────────────────
async function saLoadSysInfo() {
  const body = document.getElementById('sa-sysinfo-body');
  if (!body) return;
  try {
    const d = await api('GET', '/admin/sysinfo');

    const row = (label, val) => `
      <tr>
        <td style="padding:9px 16px;font-size:13px;color:var(--text3);white-space:nowrap;width:120px">${label}</td>
        <td style="padding:9px 16px;font-size:13px;color:var(--text);font-family:'JetBrains Mono',monospace">${escHtml(String(val||'—'))}</td>
      </tr>`;

    const section = (icon, title, rows) => `
      <div class="card" style="margin-bottom:16px;padding:0;overflow:hidden">
        <div style="padding:12px 16px;background:var(--bg3);border-bottom:1px solid var(--border);
                    font-size:13px;font-weight:700;color:var(--accent);display:flex;align-items:center;gap:8px">
          <span>${icon}</span><span>${title}</span>
        </div>
        <table style="width:100%;border-collapse:collapse">${rows}</table>
      </div>`;

    const mem = d.memory;
    const memPct = mem.pct ? parseFloat(mem.pct).toFixed(1) : '0';

    const memBarRow = `

        <td style="padding:9px 16px">
          <div style="background:var(--bg3);border-radius:4px;height:10px;overflow:hidden">
            <div style="height:100%;width:${memPct}%;background:${memColor};border-radius:4px;transition:width .5s"></div>
          </div>
          <div style="font-size:11px;color:var(--text3);margin-top:3px">${memPct}%　已用 ${mem.used_gb} GB / 共 ${mem.total_gb} GB</div>
        </td>
      </tr>`;

    const disk = Array.isArray(d.disk) ? d.disk[0] : d.disk;
    const diskPct = disk?.pct ? parseFloat(disk.pct).toFixed(1) : '0';
    const diskColor = disk?.pct > 85 ? 'var(--red)' : disk?.pct > 65 ? 'var(--yellow)' : '#e6a817';
    const diskBarRow = disk ? `
      <tr>
        <td style="padding:9px 16px;font-size:13px;color:var(--text3);white-space:nowrap;width:120px">${escHtml(disk.mount||'/')}${disk.fs_type?` <span style="color:var(--text3);font-size:11px">(${escHtml(disk.fs_type)})</span>`:''}</td>
        <td style="padding:9px 16px">
          <div style="font-size:13px;color:var(--text);font-family:'JetBrains Mono',monospace;margin-bottom:4px">${disk.used_gb} / ${disk.total_gb} GB</div>
          <div style="background:var(--bg3);border-radius:4px;height:10px;overflow:hidden">
            <div style="height:100%;width:${diskPct}%;background:${diskColor};border-radius:4px"></div>
          </div>
          <div style="font-size:11px;color:var(--text3);margin-top:3px">${diskPct}%</div>
        </td>
      </tr>` : '';

    const cpu = d.cpu;
    const freqStr = (cpu.freq_min_ghz && cpu.freq_max_ghz && cpu.freq_min_ghz !== '0.00')
      ? `${cpu.freq_min_ghz} ~ ${cpu.freq_max_ghz} GHz` : '—';

    body.innerHTML =
      section('💻', '操作系统',
        row('主机名', d.os.hostname) +
        row('系统', d.os.system) +
        row('架构', d.os.arch) +
        row('内核', d.os.kernel || '—') +
        row('运行时间', d.os.uptime || '—')
      ) +
      section('⚙️', 'CPU',
        row('型号', cpu.model || '—') +
        row('物理核心', cpu.phys_cores ? cpu.phys_cores + ' 核' : '—') +
        row('逻辑线程', cpu.logic_cores + ' 线程') +
        row('主频', freqStr)
      ) +
      section('🧠', '内存',
        row('总内存', mem.total_gb > 0 ? mem.total_gb + ' GB' : '—') +
        row('已使用', mem.used_gb  > 0 ? mem.used_gb  + ' GB' : '—') +
        row('可用',   mem.avail_gb > 0 ? mem.avail_gb + ' GB' : '—') +
        memBarRow
      ) +
      section('💾', '磁盘', diskBarRow) +
      section('🚀', '应用信息',
        `<tr>
          <td style="padding:9px 16px;font-size:13px;color:var(--text3);white-space:nowrap;width:120px">软件版本</td>
          <td style="padding:9px 16px;font-size:13px;color:var(--text);font-family:'JetBrains Mono',monospace"
              title="${escHtml(d.go.version)}">${escHtml(String(d.go.app_version||'—'))}</td>
        </tr>` +
        row('构建日期', d.go.build_time  || '—') +
        row('协程数',   d.go.goroutines) +
        `<tr>
          <td style="padding:9px 16px;font-size:13px;color:var(--text3);white-space:nowrap;width:120px">程序内存</td>
          <td style="padding:9px 16px;font-size:13px;color:var(--text);font-family:'JetBrains Mono',monospace;display:flex;align-items:center;gap:10px">
            <span id="sa-mem-val">${d.go.mem_alloc_mb} MB（已使用）/ ${d.go.mem_sys_mb} MB（共申请）</span>
            <button onclick="saRunGC(this)" title="手动触发 GC 释放内存"
              style="padding:3px 8px;background:var(--bg3);border:1px solid var(--border);
                     border-radius:5px;color:var(--text2);font-size:12px;cursor:pointer;

          </td>
        </tr>` +
        row('版权所有', d.go.copyright || '—')
      );

  } catch(e) {
    if (body) body.innerHTML = `<div style="padding:20px;color:var(--red)">❌ 加载失败：${e.message}</div>`;
  }
}

// ── 手动 GC ──────────────────────────────────────────────────
async function saRunGC(btn) {
  const orig = btn.textContent;
  btn.disabled = true;
  btn.textContent = '回收中…';
  try {
    const res = await api('POST', '/admin/gc');
    // 更新内存显示
    const memEl = document.getElementById('sa-mem-val');
    if (memEl) memEl.textContent = `${res.mem_alloc_mb} MB（已使用）/ ${res.mem_sys_mb} MB（共申请）`;
    const freed = parseFloat(res.freed_mb);
    btn.textContent = freed > 0 ? `✓ 释放 ${res.freed_mb}MB` : '✓ 已整理';
    setTimeout(() => { btn.textContent = orig; btn.disabled = false; }, 2500);
  } catch(e) {
    btn.textContent = '失败';
    setTimeout(() => { btn.textContent = orig; btn.disabled = false; }, 2000);
  }
}

async function saLoadSettings() {

  body.innerHTML = '<div style="padding:30px;text-align:center;color:var(--text3)"><div class="spinner"></div></div>';
  try {
    const res = await api('GET', '/admin/settings');

async function saEmailSaveBasic(btn) {
  const maxAcc  = document.getElementById('sa-email-max')?.value || '3';
  const syncLim = document.getElementById('sa-email-sync')?.value || '200';
  try {
    await api('PUT', '/admin/settings', { email_max_accounts: maxAcc, email_sync_limit: syncLim });
    const orig = btn.textContent;
    btn.textContent = '✓ 已保存'; btn.disabled = true;
    setTimeout(() => { btn.textContent = orig; btn.disabled = false; }, 1500);
  } catch(e) { alert('保存失败：' + e.message); }
}

// 展开/收起单个预设
function saEmailTogglePreset(idx) {
  const detail = document.getElementById(`ep-detail-${idx}`);
  const arrow  = document.getElementById(`ep-arrow-${idx}`);
  if (!detail) return;
  const isOpen = detail.style.display !== 'none';
  detail.style.display = isOpen ? 'none' : '';
  if (arrow) arrow.textContent = isOpen ? '▶' : '▼';
}

// 显示新建表单
function saEmailAddPreset() {
  const newDiv = document.getElementById('sa-preset-new');
  if (newDiv) newDiv.style.display = '';
}

// 取消新建
function saEmailCancelNew() {
  const newDiv = document.getElementById('sa-preset-new');
  if (newDiv) newDiv.style.display = 'none';
}

// 保存新建的预设
async function saEmailSaveNew() {
  const g = (k) => document.getElementById(`ep-${k}-NEW`);
  const preset = {
    name:      g('name')?.value.trim() || '',
    imap_host: g('imap_host')?.value.trim() || '',
    imap_port: parseInt(g('imap_port')?.value || '993'),
    imap_ssl:  g('imap_ssl')?.checked ?? true,
    pop3_host: g('pop3_host')?.value.trim() || '',
    pop3_port: parseInt(g('pop3_port')?.value || '995'),
    pop3_ssl:  g('pop3_ssl')?.checked ?? true,
    smtp_host: g('smtp_host')?.value.trim() || '',
    smtp_port: parseInt(g('smtp_port')?.value || '465'),
    smtp_ssl:  g('smtp_ssl')?.checked ?? true,
  };
  if (!preset.name) { alert('请填写配置名称'); return; }
  const presets = [...(window._saEmailPresets || []), preset];
  await saEmailPersistPresets(presets);
}

// 保存单条编辑

  const g = (k) => document.getElementById(`ep-${k}-${idx}`);
  const preset = {
    name:      g('name')?.value.trim() || '',
    imap_host: g('imap_host')?.value.trim() || '',
    imap_port: parseInt(g('imap_port')?.value || '993'),
    imap_ssl:  g('imap_ssl')?.checked ?? true,
    pop3_host: g('pop3_host')?.value.trim() || '',
    pop3_port: parseInt(g('pop3_port')?.value || '995'),
    pop3_ssl:  g('pop3_ssl')?.checked ?? true,
    smtp_host: g('smtp_host')?.value.trim() || '',
    smtp_port: parseInt(g('smtp_port')?.value || '465'),
    smtp_ssl:  g('smtp_ssl')?.checked ?? true,
  };
  if (!preset.name) { alert('请填写配置名称'); return; }
  const presets = [...(window._saEmailPresets || [])];

}

// 删除单条
function saEmailRemovePreset(idx) {
  if (!confirm('确认删除该预设？')) return;
  const presets = [...(window._saEmailPresets || [])];
  presets.splice(idx, 1);
  saEmailPersistPresets(presets);
}

// 统一持久化：保存到服务器后刷新列表
async function saEmailPersistPresets(presets) {
  try {
    await api('PUT', '/admin/settings', { email_server_presets: JSON.stringify(presets) });
    window._saEmailPresets = undefined; // 清除本地缓存，从服务器重新加载
    await saLoadEmailSettings();
  } catch(e) { alert('保存失败：' + e.message); }
}

function saFfToggle(id) {
  if (!window._saFfCurrent) window._saFfCurrent = {};
  const cur = window._saFfCurrent[id] !== false; // 当前是否开
  const newVal = !cur;
  window._saFfCurrent[id] = newVal;

  const el = document.getElementById(`sa-ff-toggle-${id}`);
  if (!el) return;
  el.dataset.on = newVal ? '1' : '';
  const spans = el.querySelectorAll('span');
  if (spans[0]) spans[0].style.background = newVal ? 'var(--accent)' : 'var(--border)';
  if (spans[1]) spans[1].style.left       = newVal ? '20px' : '3px';
}

async function saFfSave(btn) {
  const ff = window._saFfCurrent || {};
  try {
    await api('PUT', '/admin/settings', { feature_flags: JSON.stringify(ff) });
    // 更新本地状态，立即刷新侧边栏
    state.featureFlags = ff;
    try { localStorage.setItem('erp_feature_flags', JSON.stringify(ff)); } catch(e) {}
    // 重新渲染侧边栏（只改 nav 区域，不重置页面内容）
    const sidebar = document.getElementById('sidebar');
    if (sidebar) sidebar.outerHTML = renderSidebar();
    // 重新绑定侧边栏事件
    document.querySelectorAll('.nav-item[data-page]').forEach(el => {
      el.addEventListener('click', () => { state.page = el.dataset.page; render(); });
    });
    const orig = btn.textContent;
    btn.textContent = '✓ 已保存';
    btn.disabled = true;
    setTimeout(() => { btn.textContent = orig; btn.disabled = false; }, 1500);
  } catch(e) { alert('保存失败：' + e.message); }
}

// 按组保存设置
async function saSaveGroup(group, btn) {
  const keyMap = {
    ui:      ['logo_title', 'logo_sub'],
    company: ['company_name','bank_account','bank_name','reg_address',
              'tax_number','reg_phone','company_address','contact_phone','contact_name'],
  };
  const keys = keyMap[group] || [];
  const body = {};
  for (const k of keys) {
    const el = document.getElementById(`sa-input-${k}`);
    if (el) body[k] = el.value.trim();
  }
  try {
    await api('PUT', '/admin/settings', body);
    // 界面设置保存后立即刷新侧边栏logo
    if (group === 'ui') saApplyLogoSettings(body);
    const orig = btn.textContent;
    btn.textContent = '✓ 已保存';
    btn.disabled = true;
    setTimeout(() => { btn.textContent = orig; btn.disabled = false; }, 1500);
  } catch(e) { alert('保存失败：' + e.message); }
}

// 应用logo设置到当前页面
function saApplyLogoSettings(s) {
  // 更新state缓存
  if (!state.siteSettings) state.siteSettings = {};
  if (s.logo_title) state.siteSettings.logo_title = s.logo_title;
  if (s.logo_sub)   state.siteSettings.logo_sub   = s.logo_sub;
  try { localStorage.setItem('erp_site_settings', JSON.stringify(state.siteSettings)); } catch(e) {}
  // 直接更新DOM，不用重渲染整个侧边栏
  document.querySelectorAll('.logo-title').forEach(el => el.textContent = s.logo_title || el.textContent);
  document.querySelectorAll('.logo-sub').forEach(el   => el.textContent = s.logo_sub   || el.textContent);
}

async function saToggle(el, key) {
  if (el.dataset.saving) return;  // 防止请求未完成时重复点击
  const isOn  = !!el.dataset.on;
  const newOn = !isOn;

  // 立即更新视觉和状态
  el.dataset.on = newOn ? '1' : '';
  const spans = el.querySelectorAll('span');
  if (spans[0]) spans[0].style.background = newOn ? 'var(--accent)' : 'var(--border)';
  if (spans[1]) spans[1].style.left       = newOn ? '23px' : '3px';

  el.dataset.saving = '1';
  try {
    await api('PUT', '/admin/settings', { [key]: newOn ? 'true' : 'false' });
  } catch(e) {
    // 回滚
    el.dataset.on = isOn ? '1' : '';
    if (spans[0]) spans[0].style.background = isOn ? 'var(--accent)' : 'var(--border)';
    if (spans[1]) spans[1].style.left       = isOn ? '23px' : '3px';
    alert('保存失败：' + e.message);
  }
  delete el.dataset.saving;
}

// Chat-specific modal: close without full page reload
function chatCloseModal() {
  const overlay = document.getElementById('chat-modal-overlay');
  if (overlay) overlay.remove();
}

function _chatShowModal(html) {
  chatCloseModal(); // remove any existing
  const overlay = document.createElement('div');
  overlay.id = 'chat-modal-overlay';
  overlay.className = 'modal-overlay';
  overlay.innerHTML = html;
  overlay.onclick = e => { if (e.target === overlay) chatCloseModal(); };
  document.body.appendChild(overlay);
}
const _chat = {
  ws: null,
  convs: [],          // conversation list
  contacts: [],       // all users
  activeGid: null,    // current open group_id
  msgs: {},           // { gid: [msg,...] }
  unread: {},         // { gid: count }
  typing: {},         // { gid: {uid: name, timer} }
  onlineSet: new Set(),
  groupInfo: {},      // { gid: {name,owner_id,is_direct,members} }
  pendingGid: null,   // open this gid after ws ready
};

// ── WebSocket ────────────────────────────────────────────────
function chatWsConnect() {
  // 聊天功能被禁用时不连接
  const ff = state.featureFlags || {};
  if (Object.keys(ff).length > 0 && ff['chat'] === false) return;
  if (_chat.ws && _chat.ws.readyState <= 1) return;
  const wsProto = location.protocol === 'https:' ? 'wss' : 'ws';
  const ws = new WebSocket(`${wsProto}://${location.host}/ws/chat?token=${state.token}`);
  _chat.ws = ws;
  ws.onmessage = e => {
    try { chatHandleMsg(JSON.parse(e.data)); } catch(_) {}
  };
  ws.onclose = () => {
    _chat.ws = null;
    setTimeout(() => { if (state.token) chatWsConnect(); }, 3000);
  };
  ws.onerror = () => ws.close();
}

function chatWsSend(type, payload) {
  if (_chat.ws && _chat.ws.readyState === 1)
    _chat.ws.send(JSON.stringify({ type, payload }));
}

function chatHandleMsg(env) {
  switch (env.type) {
    case 'new_msg':      return chatOnNewMsg(env.payload);
    case 'msg_revoked':  return chatOnRevoked(env.payload);
    case 'typing':       return chatOnTyping(env.payload);
    case 'presence':     return chatOnPresence(env.payload);
    case 'unread_summary': return chatOnUnreadSummary(env.payload);
    case 'group_created':
    case 'member_joined':
    case 'member_left':
    case 'group_updated': return chatRefreshConvs();
    case 'error':        return chatShowErr(env.payload?.msg || '操作失败');
  }
}

function chatOnNewMsg(msg) {
  const gid = msg.group_id;
  if (!_chat.msgs[gid]) _chat.msgs[gid] = [];
  _chat.msgs[gid].push(msg);
  const isActive = _chat.activeGid === gid && document.getElementById('chat-root');
  if (isActive) {
    chatWsSend('mark_read', { group_id: gid, last_msg_id: msg.id });
    chatAppendMsg(msg);
    chatScrollBottom();
  } else {
    _chat.unread[gid] = (_chat.unread[gid] || 0) + 1;
    chatUpdateTotalUnread();
  }
  // update conv preview
  chatUpdateConvPreview(msg);
}

function chatOnRevoked(p) {
  const gid = p.group_id;
  if (_chat.msgs[gid]) {
    const m = _chat.msgs[gid].find(x => x.id === p.msg_id);
    if (m) { m.is_revoked = true; m.content = '消息已撤回'; }
  }
  if (_chat.activeGid === gid) chatRenderMsgList();
}

function chatOnTyping(p) {
  const gid = p.group_id;
  if (p.user_id === state.user?.user_id) return;
  if (!_chat.typing[gid]) _chat.typing[gid] = {};
  clearTimeout(_chat.typing[gid][p.user_id]?.timer);
  if (p.typing) {
    _chat.typing[gid][p.user_id] = {
      name: p.sender_name,
      timer: setTimeout(() => {
        if (_chat.typing[gid]) delete _chat.typing[gid][p.user_id];
        chatUpdateTypingHint();
      }, 4000)
    };
  } else {
    delete _chat.typing[gid][p.user_id];
  }
  chatUpdateTypingHint();
}

function chatOnPresence(p) {
  if (p.status === 'online') _chat.onlineSet.add(p.user_id);
  else _chat.onlineSet.delete(p.user_id);
  // update conv list dot
  document.querySelectorAll(`.chat-conv-item[data-gid]`).forEach(el => {
    const pid = parseInt(el.dataset.peer || 0);
    if (pid === p.user_id) {
      const dot = el.querySelector('.online-dot');
      if (dot) dot.style.background = p.status === 'online' ? 'var(--green)' : 'var(--text3)';
    }
  });
  // update group panel header
  chatUpdateHeaderStatus();
}

function chatOnUnreadSummary(data) {
  Object.entries(data).forEach(([gid, n]) => { _chat.unread[parseInt(gid)] = n; });
  chatUpdateTotalUnread();
}

// ── REST helpers ─────────────────────────────────────────────
async function chatLoadContacts() {
  const r = await api('GET', '/chat/contacts');
  _chat.contacts = r.data || [];
}

async function chatLoadConvs() {
  const r = await api('GET', '/chat/conversations');
  _chat.convs = r.data || [];
  // merge unread from server
  _chat.convs.forEach(cv => {
    if (cv.unread > 0 && !(_chat.unread[cv.group_id] > 0))
      _chat.unread[cv.group_id] = cv.unread;
  });
  chatUpdateTotalUnread();
}

async function chatLoadMsgs(gid, before) {
  const q = before ? `?before=${before}` : '';
  const r = await api('GET', `/chat/messages/${gid}${q}`);
  return r.data || [];
}

async function chatLoadGroupInfo(gid) {
  const r = await api('GET', `/chat/groups/${gid}`);
  _chat.groupInfo[gid] = r;
  return r;
}

// ── Conv list rendering ───────────────────────────────────────
function chatRenderConvList(filter) {
  const el = document.getElementById('chat-conv-list');
  if (!el) return;
  let list = _chat.convs;
  if (filter) {
    const q = filter.toLowerCase();
    list = list.filter(cv => cv.name.toLowerCase().includes(q));
  }
  if (!list.length) {
    el.innerHTML = `<div style="padding:24px;text-align:center;color:var(--text3);font-size:13px">暂无会话</div>`;
    return;
  }
  el.innerHTML = list.map(cv => {
    const unread = _chat.unread[cv.group_id] || 0;
    const online = cv.is_direct ? _chat.onlineSet.has(cv.peer_id) : false;
    const avatar = cv.is_direct
      ? `<div style="position:relative;flex-shrink:0">
           ${chatAvatar(cv.name, 40)}
           <span class="online-dot" style="position:absolute;bottom:1px;right:1px;width:9px;height:9px;border-radius:50%;background:${online?'var(--green)':'var(--text3)'};border:2px solid var(--bg2)"></span>
         </div>`
      : `<div style="flex-shrink:0;width:40px;height:40px;border-radius:50%;background:var(--accent2);display:flex;align-items:center;justify-content:center;font-size:16px">👥</div>`;
    const lastMsg = chatConvLastMsg(cv);
    const timeStr = cv.last_time ? chatFmtTime(cv.last_time) : '';
    const active = _chat.activeGid === cv.group_id;
    return `<div class="chat-conv-item${active?' chat-conv-active':''}" data-gid="${cv.group_id}" data-peer="${cv.peer_id||0}"
      onclick="chatOpenConv(${cv.group_id})"
      style="display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer;border-bottom:1px solid var(--border);
             transition:background 0.15s;${active?'background:rgba(88,166,255,0.1)':''}">
      ${avatar}
      <div style="flex:1;min-width:0">
        <div style="display:flex;align-items:center;gap:4px;margin-bottom:2px">
          <span style="font-weight:${unread?'600':'500'};font-size:14px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escHtml(cv.name)}</span>
          <span style="font-size:11px;color:var(--text3);flex-shrink:0">${timeStr}</span>
        </div>
        <div style="display:flex;align-items:center;gap:4px">
          <span style="font-size:12px;color:var(--text3);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escHtml(lastMsg)}</span>
          ${unread?`<span style="background:var(--red);color:#fff;font-size:10px;border-radius:10px;padding:1px 5px;flex-shrink:0">${unread>99?'99+':unread}</span>`:''}
        </div>
      </div>
    </div>`;
  }).join('');
}

function chatConvLastMsg(cv) {
  if (!cv.last_content) return '暂无消息';
  if (cv.last_msg_type === 'image') return '[图片]';
  if (cv.last_msg_type === 'file') return '[文件]';
  if (cv.last_msg_type === 'system') return cv.last_content;
  return cv.last_content.substring(0, 40);
}

function chatUpdateConvPreview(msg) {
  const cv = _chat.convs.find(c => c.group_id === msg.group_id);
  if (cv) {
    cv.last_msg_type = msg.msg_type;
    cv.last_content = msg.content;
    cv.last_time = msg.created_at;
    cv.last_sender_id = msg.sender_id;
    // bubble to top
    _chat.convs = [cv, ..._chat.convs.filter(c => c.group_id !== msg.group_id)];
  } else {
    chatRefreshConvs();
    return;
  }
  chatRenderConvList(document.getElementById('chat-search')?.value);
}

async function chatRefreshConvs() {
  await chatLoadConvs();
  chatRenderConvList(document.getElementById('chat-search')?.value);
}

function chatFilterConvs(q) { chatRenderConvList(q); }

// ── Open conversation ─────────────────────────────────────────
async function chatOpenConv(gid) {
  _chat.activeGid = gid;
  // clear unread
  delete _chat.unread[gid];
  chatUpdateTotalUnread();
  chatRenderConvList(document.getElementById('chat-search')?.value);

  const main = document.getElementById('chat-main');
  if (!main) return;

  // Add chat-open class always; CSS media query decides if slide effect applies
  const root = document.getElementById('chat-root');
  if (root) root.classList.add('chat-open');

  main.innerHTML = `<div style="flex:1;display:flex;align-items:center;justify-content:center;color:var(--text3)">加载中…</div>`;

  // load group info & messages
  const [info, msgs] = await Promise.all([
    chatLoadGroupInfo(gid),
    chatLoadMsgs(gid)
  ]);
  _chat.msgs[gid] = msgs;
  chatWsSend('mark_read', { group_id: gid, last_msg_id: msgs.length ? msgs[msgs.length-1].id : 0 });

  main.innerHTML = chatConvHtml(gid, info);
  chatRenderMsgList();
  chatScrollBottom();
  // 桌面端自动聚焦输入框；手机端不聚焦，避免键盘弹出
  if (!window.matchMedia('(pointer: coarse)').matches) {
    setTimeout(() => document.getElementById('chat-input')?.focus(), 100);
  }
}

// ── Message rendering ─────────────────────────────────────────
function chatRenderMsgList() {
  const el = document.getElementById('chat-msg-list');
  if (!el || !_chat.activeGid) return;
  const msgs = _chat.msgs[_chat.activeGid] || [];
  if (!msgs.length) {
    el.innerHTML = `<div style="text-align:center;color:var(--text3);font-size:13px;padding:40px 0">暂无消息</div>`;
    return;
  }
  // load more button
  const hasMore = msgs.length >= 50;
  let html = hasMore
    ? `<div style="text-align:center;padding:4px 0 8px">
         <button class="btn btn-sm" onclick="chatLoadMore(${_chat.activeGid})" style="font-size:12px">加载更多</button>
       </div>`
    : '';
  let prevDate = '';
  msgs.forEach(m => {
    const _d = chatToCST(m.created_at);
    const d = _d ? `${_d.getFullYear()}-${String(_d.getMonth()+1).padStart(2,'0')}-${String(_d.getDate()).padStart(2,'0')}` : m.created_at.slice(0,10);
    if (d !== prevDate) {
      html += `<div style="text-align:center;margin:10px 0 6px"><span style="font-size:11px;color:var(--text3);background:var(--bg3);padding:2px 10px;border-radius:10px">${chatFmtDate(m.created_at)}</span></div>`;
      prevDate = d;
    }
    html += chatMsgHtml(m);
  });
  el.innerHTML = html;
}

function chatAppendMsg(msg) {
  const el = document.getElementById('chat-msg-list');
  if (!el) return;
  const empty = el.querySelector('[data-empty]');
  if (empty) empty.remove();
  // date separator
  const lastDate = el.querySelector('.chat-date-sep:last-of-type');
  const _md = chatToCST(msg.created_at);
  const msgDate = _md ? `${_md.getFullYear()}-${String(_md.getMonth()+1).padStart(2,'0')}-${String(_md.getDate()).padStart(2,'0')}` : msg.created_at.slice(0,10);
  if (!lastDate || lastDate.dataset.date !== msgDate) {
    const sep = document.createElement('div');
    sep.className = 'chat-date-sep';
    sep.dataset.date = msgDate;
    sep.style.cssText = 'text-align:center;margin:10px 0 6px';
    sep.innerHTML = `<span style="font-size:11px;color:var(--text3);background:var(--bg3);padding:2px 10px;border-radius:10px">${chatFmtDate(msg.created_at)}</span>`;
    el.appendChild(sep);
  }
  el.insertAdjacentHTML('beforeend', chatMsgHtml(msg));
}

function chatMsgHtml(m) {
  if (m.msg_type === 'system') {
    return `<div style="text-align:center;margin:4px 0">
      <span style="font-size:12px;color:var(--text3);background:var(--bg3);padding:2px 12px;border-radius:10px">${escHtml(m.content)}</span>
    </div>`;
  }
  const isMine = m.sender_id === state.user?.user_id;
  const name = chatDispNameFromMsg(m);
  const _cst = chatToCST(m.created_at);
  const time = _cst ? `${String(_cst.getHours()).padStart(2,'0')}:${String(_cst.getMinutes()).padStart(2,'0')}` : '';
  // 优先用 created_unix（Unix时间戳，无时区问题），fallback 到字符串解析
  const _msgTs = m.created_unix
    ? m.created_unix * 1000
    : new Date(m.created_at.replace(' ','T')).getTime();
  const canRevoke = isMine && !m.is_revoked
    && (Date.now() - _msgTs < 3600000);
  const bubble = m.is_revoked
    ? `<span style="font-style:italic;color:var(--text3);font-size:13px">消息已撤回</span>`
    : chatBubbleContent(m);
  const revokeBtn = canRevoke
    ? `<button onclick="chatRevoke(${m.id})" style="background:none;border:none;cursor:pointer;color:var(--text3);font-size:11px;padding:2px 4px;opacity:0.6" title="撤回">↩</button>`
    : '';
  if (isMine) {
    const myName = state.user?.full_name || state.user?.username || '我';
    return `<div class="chat-msg" data-id="${m.id}" style="display:flex;justify-content:flex-end;gap:8px;margin:3px 0;align-items:flex-end">
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:2px;max-width:65%">
        <div style="display:flex;align-items:center;gap:6px">
          <span style="font-size:11px;color:var(--text3)">${time}</span>
          ${revokeBtn}
          <span style="font-size:11px;color:var(--text3);font-weight:500">${escHtml(myName)}</span>
        </div>
        <div style="background:#2d333b;color:#e6edf3;border:1px solid #444c56;padding:8px 12px;border-radius:14px 14px 4px 14px;font-size:14px;line-height:1.5;word-break:break-word">${bubble}</div>
      </div>
      ${chatAvatar(myName, 32)}
    </div>`;
  } else {
    return `<div class="chat-msg" data-id="${m.id}" style="display:flex;gap:8px;margin:3px 0;align-items:flex-end">
      ${chatAvatar(name, 32)}
      <div style="display:flex;flex-direction:column;gap:2px;max-width:65%">
        <span style="font-size:11px;color:var(--text3);padding-left:4px">${escHtml(name)}</span>
        <div style="display:flex;align-items:center;gap:4px">
          <div style="background:var(--accent2);color:#e6edf3;padding:8px 12px;border-radius:14px 14px 14px 4px;font-size:14px;line-height:1.5;word-break:break-word">${bubble}</div>
          <span style="font-size:11px;color:var(--text3)">${time}</span>
        </div>
      </div>
    </div>`;
  }
}

let _emojiActiveCat = 0;

function chatToggleEmoji(gid) {
  const panel = document.getElementById('emoji-panel-' + gid);
  if (!panel) return;
  if (panel.style.display === 'none') {
    chatRenderEmojiPanel(gid);
    panel.style.display = 'block';
    // 点面板外部关闭，用 mousedown 避免与内部点击冲突
    setTimeout(() => {
      function _close(e) {
        const btn = document.getElementById('emoji-btn-' + gid);
        if (!panel.contains(e.target) && e.target !== btn && !btn?.contains(e.target)) {
          panel.style.display = 'none';
          document.removeEventListener('mousedown', _close);
        }
      }
      document.addEventListener('mousedown', _close);
    }, 0);
  } else {
    panel.style.display = 'none';
  }
}

function chatRenderEmojiPanel(gid) {
  const panel = document.getElementById('emoji-panel-' + gid);
  if (!panel) return;
  const cat = _EMOJI_CATS[_emojiActiveCat];
  const emojis = _EMOJI_LIST.slice(cat.start, cat.start + cat.count);

  // Category tabs —— 用 onmousedown + stopPropagation 阻止冒泡触发关闭
  const tabs = _EMOJI_CATS.map((cat, i) =>
    `<button onmousedown="event.stopPropagation();event.preventDefault();chatSwitchEmojiCat(${i},${gid})"
      style="background:${i===_emojiActiveCat?'var(--bg3)':'none'};border:none;border-radius:6px;
             padding:4px 8px;cursor:pointer;font-size:12px;color:${i===_emojiActiveCat?'var(--accent)':'var(--text3)'};white-space:nowrap">
      ${cat.name}
     </button>`
  ).join('');

  // Emoji grid —— 插入到输入框，不直接发送
  const grid = emojis.map(e =>
    `<button onmousedown="event.stopPropagation();event.preventDefault();chatInsertEmoji(${gid},'${e}')"
      style="background:none;border:none;cursor:pointer;font-size:22px;padding:3px;border-radius:6px;line-height:1.2"
      title="${e}"
      onmouseover="this.style.background='var(--bg3)'" onmouseout="this.style.background='none'">${e}</button>`
  ).join('');

  panel.innerHTML = `
    <div style="display:flex;gap:2px;flex-wrap:wrap;border-bottom:1px solid var(--border);padding-bottom:6px;margin-bottom:6px;overflow-x:auto">${tabs}</div>
    <div style="display:flex;flex-wrap:wrap;max-height:180px;overflow-y:auto">${grid}</div>`;
}

function chatSwitchEmojiCat(idx, gid) {
  _emojiActiveCat = idx;
  chatRenderEmojiPanel(gid);
}

// 把表情插入输入框光标位置，不发送
function chatInsertEmoji(gid, emoji) {
  const inp = document.getElementById('chat-input');
  if (!inp) return;
  const start = inp.selectionStart ?? inp.value.length;
  const end   = inp.selectionEnd   ?? inp.value.length;
  inp.value = inp.value.slice(0, start) + emoji + inp.value.slice(end);
  // 移动光标到插入点之后
  const pos = start + emoji.length;
  inp.setSelectionRange(pos, pos);
  inp.focus();
}

function chatPickImage(gid) {

}
function chatPickFile(gid) {
  const el = document.getElementById('chat-file-input');

async function chatUploadFile(gid, inputEl) {
  const file = inputEl.files[0];
  if (!file) return;
  await chatDoUpload(gid, file);
  inputEl.value = '';
}
function chatHandlePaste(e, gid) {
  const items = e.clipboardData?.items;
  if (!items) return;
  for (const item of items) {
    if (item.type.startsWith('image/')) {
      e.preventDefault();
      const file = item.getAsFile();
      if (file) chatDoUpload(gid, file);
      return;
    }
  }
}
async function chatDoUpload(gid, file) {
  const msgList = document.getElementById('chat-msg-list');
  const pid = 'upload-' + Date.now();
  if (msgList) {
    msgList.insertAdjacentHTML('beforeend',
      '<div id="' + pid + '" style="display:flex;justify-content:flex-end;margin:4px 0">' +
      '<div style="background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:8px 14px;font-size:13px;color:var(--text3)">' +
      '⏳ 上传中… ' + escHtml(file.name || '图片') + '</div></div>');
    chatScrollBottom();
  }
  try {
    const fd = new FormData();
    fd.append('group_id', gid);
    fd.append('file', file, file.name || ('paste_' + Date.now() + '.png'));
    const res = await fetch('/api/chat/upload', {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + state.token },
      body: fd
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.error || '上传失败');
    }
  } catch(err) {
    chatShowErr('上传失败：' + err.message);
  } finally {
    document.getElementById(pid)?.remove();
  }
}


function chatBubbleContent(m) {
  if (m.msg_type === 'image') {
    return `<img src="${escHtml(m.content)}" onclick="window.open('${escHtml(m.content)}','_blank')"
      style="max-width:240px;max-height:240px;border-radius:8px;display:block;cursor:pointer">`;
  }
  if (m.msg_type === 'file') {
    const parts = m.content.split('/');
    const fname = decodeURIComponent(parts[parts.length-1].replace(/^\d+_/, ''));
    return `<a href="${escHtml(m.content)}" target="_blank" download
      style="display:flex;align-items:center;gap:8px;color:inherit;text-decoration:none">
      <span style="font-size:22px">📎</span>
      <span style="font-size:13px;text-decoration:underline;word-break:break-all">${escHtml(fname)}</span>
    </a>`;
  }
  return escHtml(m.content).replace(/\n/g, '<br>');
}

function chatDispNameFromMsg(m) {
  if (m.full_name && m.full_name.trim()) return m.full_name;
  return m.username || m.sender_name || ('用户' + m.sender_id);
}

// ── Send & input ─────────────────────────────────────────────
function chatInputKeydown(e, gid) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    chatSend(gid);
  }
}

let _chatTypingTimer = null;
function chatOnInput(gid) {
  chatWsSend('typing', { group_id: gid, typing: true });
  clearTimeout(_chatTypingTimer);
  _chatTypingTimer = setTimeout(() => chatWsSend('typing', { group_id: gid, typing: false }), 2000);
}

function chatSend(gid) {
  const inp = document.getElementById('chat-input');
  if (!inp) return;
  const txt = inp.value.trim();
  if (!txt) return;
  chatWsSend('send_msg', { group_id: gid, content: txt, msg_type: 'text' });
  inp.value = '';
  inp.style.height = '';
  chatWsSend('typing', { group_id: gid, typing: false });
}

function chatRevoke(msgId) {
  if (!confirm('确认撤回该消息？（60分钟内可撤回）')) return;
  chatWsSend('revoke_msg', { msg_id: msgId });
}

function chatUpdateTypingHint() {
  const el = document.getElementById('chat-typing-hint');
  if (!el || !_chat.activeGid) return;
  const t = _chat.typing[_chat.activeGid];
  if (!t) { el.textContent = ''; return; }
  const names = Object.values(t).map(x => x.name).filter(Boolean);
  el.textContent = names.length ? names.join('、') + ' 正在输入…' : '';
}

function chatUpdateHeaderStatus() {
  if (!_chat.activeGid) return;
  const info = _chat.groupInfo[_chat.activeGid];
  if (!info || !info.is_direct) return;
  const peer = info.members?.find(m => m.user_id !== state.user?.user_id);
  if (!peer) return;
  const online = _chat.onlineSet.has(peer.user_id);
  const el = document.getElementById('chat-header');
  if (!el) return;
  const span = el.querySelector('.online-status');
  if (span) {
    span.style.color = online ? 'var(--green)' : 'var(--text3)';
    span.textContent = online ? '● 在线' : '○ 离线';
  }
}

// ── Load more ─────────────────────────────────────────────────
async function chatLoadMore(gid) {
  const existing = _chat.msgs[gid] || [];
  if (!existing.length) return;
  const oldest = existing[0].id;
  const more = await chatLoadMsgs(gid, oldest);
  _chat.msgs[gid] = [...more, ...existing];
  chatRenderMsgList();
  // restore scroll
  const el = document.getElementById('chat-msg-list');
  if (el) el.scrollTop = 60;
}

function chatUpdateTotalUnread() {
  const total = Object.values(_chat.unread).reduce((s, n) => s + n, 0);
  state.chatUnread = total;
  // update nav badge without full re-render
  const nav = document.querySelector('.nav-item[data-id="chat"] span[style*="var(--red)"]');
  const navItem = document.querySelector('.nav-item[data-id="chat"]');
  if (navItem) {
    const existing = navItem.querySelector('span[style*="var(--red)"]');
    if (total > 0) {
      const txt = total > 99 ? '99+' : total;
      if (existing) { existing.textContent = txt; }
      else { navItem.insertAdjacentHTML('beforeend', `<span style="background:var(--red);color:#fff;font-size:10px;border-radius:10px;padding:1px 6px;margin-left:auto">${txt}</span>`); }
    } else {
      if (existing) existing.remove();
    }
  }
}

function chatAvatar(name, size) {
  const n = (name || '?').trim();
  const ch = n.slice(-2);  // last 1-2 chars (works for Chinese names)
  const colors = ['#1f6feb','#388bfd','#7c3aed','#d97706','#059669','#dc2626','#0891b2'];
  let hash = 0;
  for (let i = 0; i < n.length; i++) hash = (hash * 31 + n.charCodeAt(i)) & 0xffff;
  const bg = colors[hash % colors.length];
  return `<div style="width:${size}px;height:${size}px;border-radius:50%;background:${bg};display:flex;align-items:center;justify-content:center;font-size:${Math.max(10,size*0.35)}px;color:#fff;font-weight:600;flex-shrink:0;user-select:none">${escHtml(ch)}</div>`;
}

// 将 UTC 时间字符串解析为本地 Date 对象（自动跟随用户电脑时区）
function chatToCST(dt) {
  if (!dt) return null;
  // 末尾加 Z 确保浏览器按 UTC 解析，再由 Date 对象自动转本地时区
  return new Date(dt.replace(' ', 'T') + (dt.includes('+') || dt.endsWith('Z') ? '' : 'Z'));
}

function chatFmtTime(dt) {
  if (!dt) return '';
  const d = chatToCST(dt);
  const now = new Date();
  // 今天本地0点
  const todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const diffDays = Math.floor((now - d) / 86400000);
  const hh = String(d.getHours()).padStart(2, '0');
  const mm = String(d.getMinutes()).padStart(2, '0');
  if (d >= todayStart) return `${hh}:${mm}`;
  if (diffDays === 1) return '昨天';
  if (diffDays < 7) return ['周日','周一','周二','周三','周四','周五','周六'][d.getDay()];
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function chatFmtDate(dt) {
  if (!dt) return '';
  const d = chatToCST(dt);
  const now = new Date();
  const todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const yesterdayStart = new Date(todayStart.getTime() - 86400000);
  if (d >= todayStart) return '今天';
  if (d >= yesterdayStart) return '昨天';
  if (d.getFullYear() === now.getFullYear()) return `${d.getMonth()+1}月${d.getDate()}日`;
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
