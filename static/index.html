function hasPermission(perm) {
  try {
    const p = JSON.parse(state.user.perms || '{}');
    return p[perm] === true;
  } catch (e) { return false; }
}

// ============================================================
// BANK STATEMENTS MODULE
// ============================================================

let _bankYears = [];           // 当前选中的年份数组（多年支持）
let _bankPage = 1;
let _bankChartTab = 'monthly';
let _bankYearList = [];
let _bankBalanceVisible = false; // 余额默认隐藏，点击眼睛后显示
let _bankMonthlyChartStyle = 'bar'; // 'bar' | 'line'，月度收支图表样式，点击标题切换
let _bankSortBy    = 'transaction_time'; // 当前排序列
let _bankSortOrder = 'desc';             // 'asc' | 'desc'

// 返回当前年份参数字符串（逗号分隔），用于 API 请求；空数组表示全部
function _bankYearsParam() { return _bankYears.join(','); }
// 返回年份显示标签，如 "2024年" 或 "2023、2024年" 或 "全部"
function _bankYearsLabel() {
  if (!_bankYears.length) return '全部';
  return _bankYears.join('、') + '年';
}

async function loadBank(content, actions) {
  const canEdit = state.user.is_admin || hasPermission('bank');

  // 快速导入（服务端解析）file input
  let _fi2 = document.getElementById('_bank_file_fast');
  if (!_fi2) {
    _fi2 = document.createElement('input');
    _fi2.type = 'file';
    _fi2.id   = '_bank_file_fast';
    _fi2.accept = '.xlsx';
    _fi2.style.display = 'none';
    document.body.appendChild(_fi2);
    _fi2.addEventListener('change', async e => {
      const file = e.target.files[0];
      if (!file) return;
      e.target.value = '';
      await bankImportFileFast(file);
    });
  } else {
    _fi2.value = '';
  }

  actions.innerHTML = (canEdit
    ? `<button class="btn" id="btn-bank-new">＋ <span class="btn-text">新建流水</span></button>
       <button class="btn" id="btn-bank-fmt-settings" title="导入格式设置">⚙ <span class="btn-text">格式设置</span></button>
       <button class="btn btn-primary" id="btn-bank-upload-fast"
         onclick="document.getElementById('_bank_file_fast').click()">📥 <span class="btn-text">导入Excel</span></button>`
    : '')
    + `<button class="btn" id="btn-bank-export-top" onclick="bankExportExcel()">📤 <span class="btn-text">导出Excel</span></button>`;

  document.getElementById('btn-bank-fmt-settings')?.addEventListener('click', bankOpenFmtSettings);

  const yearsRes = await api('GET', '/bank/years');
  _bankYearList = yearsRes.years || [];
  if (!_bankYears.length && _bankYearList.length) _bankYears = [_bankYearList[0]];
  if (!_bankYears.length) _bankYears = [new Date().getFullYear().toString()];
  _bankPage = 1;
  _bankChartTab = 'monthly';

  // 单年直接选中，多年时选中 __more__，全部时选中 __all__
  const selVal = _bankYears.length === 0 ? '__all__'
               : _bankYears.length === 1 ? _bankYears[0] : '__more__';

  content.innerHTML = `
  <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap">
    <div style="display:flex;align-items:center;gap:6px">
      <span style="font-size:13px;color:var(--text3)">年份</span>
      <select id="bank-year-sel" style="min-width:100px;max-width:180px">
        ${_bankYearList.map(y=>`<option value="${y}"${y===selVal?' selected':''}>${y}年</option>`).join('')}
        ${!_bankYearList.length?`<option value="${new Date().getFullYear()}">${new Date().getFullYear()}年</option>`:''}
        <option value="__more__"${selVal==='__more__'?' selected':''}>📅 更多…</option>
        <option value="__all__"${selVal==='__all__'?' selected':''}>🔍 显示全部</option>
      </select>
      ${_bankYears.length > 1 ? `<span id="bank-years-tag" style="font-size:12px;color:var(--accent);background:rgba(88,166,255,0.12);padding:2px 8px;border-radius:10px;white-space:nowrap">${_bankYearsLabel()}</span>` : ''}
    </div>
    <div id="bank-stats-row" style="display:flex;gap:10px;flex-wrap:wrap"></div>
  </div>

  <div class="card" id="bank-chart-card" style="margin-bottom:16px;position:relative">
    <div class="chart-toolbar">
      <div>
        <div class="chart-toolbar-title" id="bank-chart-title">月度收支</div>
        <div id="bank-chart-legend" style="display:flex;flex-wrap:wrap;gap:10px;margin-top:6px;font-size:12px"></div>
      </div>
      <div class="chart-tabs" id="bank-chart-tabs">
        <button class="chart-tab active" data-btab="monthly" id="bank-tab-monthly">月度收支 <span id="bank-monthly-icon">📊</span></button>
        <button class="chart-tab" data-btab="income">收入来源</button>
        <button class="chart-tab" data-btab="expense">支出去向</button>
      </div>
    </div>
    <div id="bank-chart-wrap" style="height:300px;overflow:hidden"></div>
    <div class="chart-tooltip" id="bank-tooltip"></div>
  </div>

  <div class="search-bar">
    <input class="search-input" id="bank-q" placeholder="搜索对方户名、摘要、备注…">
    <button class="btn" id="btn-bank-search">搜索</button>
  </div>
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
      <div class="card-title" style="margin:0">流水明细</div>
      <div id="bank-page-info" style="font-size:12px;color:var(--text3)"></div>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th onclick="bankSetSort('transaction_time')" style="cursor:pointer;user-select:none;white-space:nowrap">交易时间 <span id="bsort-transaction_time"></span></th>
          <th onclick="bankSetSort('debit_amount')" style="cursor:pointer;user-select:none;color:var(--yellow)">借方（支出）<span id="bsort-debit_amount"></span></th>
          <th onclick="bankSetSort('credit_amount')" style="cursor:pointer;user-select:none;color:var(--green)">贷方（收入）<span id="bsort-credit_amount"></span></th>
          <th id="bank-balance-th" style="cursor:pointer;user-select:none;white-space:nowrap" title="点击显示/隐藏余额">余额 <span id="bank-eye" style="font-size:11px;opacity:0.6">👁</span></th>
          <th onclick="bankSetSort('counterpart_name')" style="cursor:pointer;user-select:none">对方户名 <span id="bsort-counterpart_name"></span></th>
          <th onclick="bankSetSort('summary')" style="cursor:pointer;user-select:none">摘要 <span id="bsort-summary"></span></th>
          <th onclick="bankSetSort('remark')" style="cursor:pointer;user-select:none">备注 <span id="bsort-remark"></span></th>
          ${canEdit?'<th>操作</th>':''}
        </tr></thead>
        <tbody id="bank-tbody"></tbody>
      </table>
    </div>
    <div id="bank-page-btns" style="display:flex;gap:6px;justify-content:center;padding:12px 0"></div>
  </div>`;

  const yearSel = document.getElementById('bank-year-sel');
  yearSel?.addEventListener('change', e=>{
    const val = e.target.value;
    if (val === '__more__') {
      e.target.value = _bankYears.length === 0 ? '__all__'
                     : _bankYears.length === 1 ? _bankYears[0] : '__more__';
      bankOpenYearModal();
    } else if (val === '__all__') {
      _bankYears = [];
      _bankPage = 1;
      const tag = document.getElementById('bank-years-tag');
      if (tag) tag.remove();
      bankRefreshAll();
    } else {
      _bankYears = [val];
      _bankPage = 1;
      const tag = document.getElementById('bank-years-tag');
      if (tag) tag.remove();
      bankRefreshAll();
    }
  });
  // 当已选多年（select 值固定为 __more__）时，change 不会触发，
  // 用 mousedown 检测用户点击了 __more__ 选项，直接弹 modal
  yearSel?.addEventListener('mousedown', e=>{
    if (yearSel.value === '__more__') {
      e.preventDefault();
      yearSel.blur();
      bankOpenYearModal();
    }
  });
  document.querySelectorAll('#bank-chart-tabs .chart-tab').forEach(tab=>{
    tab.addEventListener('click', ()=>{
      const newTab = tab.dataset.btab;
      if (newTab === 'monthly' && _bankChartTab === 'monthly') {
        // 已经在月度收支 tab，切换图表样式
        _bankMonthlyChartStyle = _bankMonthlyChartStyle === 'bar' ? 'line' : 'bar';
        const icon = document.getElementById('bank-monthly-icon');
        if (icon) icon.textContent = _bankMonthlyChartStyle === 'bar' ? '📊' : '📈';
      } else {
        _bankChartTab = newTab;
        document.querySelectorAll('#bank-chart-tabs .chart-tab').forEach(t=>t.classList.remove('active'));
        tab.classList.add('active');
      }
      renderBankChart();
    });
  });
  document.getElementById('bank-q')?.addEventListener('keydown', e=>{
    if (e.key==='Enter') { _bankPage=1; bankLoadTable(); }
  });
  document.getElementById('btn-bank-search')?.addEventListener('click', ()=>{
    _bankPage=1; bankLoadTable();
  });
  document.getElementById('btn-bank-new')?.addEventListener('click', ()=> bankOpenCreateModal());

  bankRefreshAll();
}

async function bankRefreshAll() {
  await Promise.all([bankLoadStats(), bankLoadTable(), renderBankChart()]);
}

async function bankLoadStats() {
  const s = await api('GET', `/bank/stats?years=${encodeURIComponent(_bankYearsParam())}`);
  const fmt = n => {
    const abs = Math.abs(n);
    const r = abs>=1e8 ? '¥'+(abs/1e8).toFixed(2)+'亿'
             : abs>=1e4 ? '¥'+(abs/1e4).toFixed(1)+'w'
             : '¥'+abs.toLocaleString('zh-CN',{minimumFractionDigits:2});
    return (n<0?'-':'')+r;
  };
  const el = document.getElementById('bank-stats-row');
  if (!el) return;
  el.innerHTML = `
    <div class="stat-card green"  style="flex:0 0 auto;min-width:120px"><div class="stat-value" style="font-size:17px">${fmt(s.total_income)}</div><div class="stat-label">总收入</div></div>
    <div class="stat-card"        style="flex:0 0 auto;min-width:120px;border-left:3px solid var(--yellow)"><div class="stat-value" style="font-size:17px;color:var(--yellow)">${fmt(s.total_expense)}</div><div class="stat-label">总支出</div></div>
    <div class="stat-card ${s.net>=0?'blue':''}" style="flex:0 0 auto;min-width:120px${s.net<0?';border-left:3px solid var(--yellow)':''}"><div class="stat-value" style="font-size:17px;color:${s.net>=0?'var(--accent)':'var(--yellow)'}">${fmt(s.net)}</div><div class="stat-label">净收支</div></div>
    <div class="stat-card"        style="flex:0 0 auto;min-width:80px"><div class="stat-value" style="font-size:17px">${s.total_rows}</div><div class="stat-label">条记录</div></div>`;
}

// 点击表头排序（onclick 直接调用，不重复绑定）
function bankSetSort(col) {
  if (_bankSortBy === col) {
    _bankSortOrder = _bankSortOrder === 'desc' ? 'asc' : 'desc';
  } else {
    _bankSortBy = col;
    _bankSortOrder = 'desc';
  }
  _bankPage = 1;
  bankLoadTable();
}

// 刷新排序箭头显示（用固定 id，避免重复绑定）
function bankUpdateSortArrows() {
  const cols = ['transaction_time','debit_amount','credit_amount','counterpart_name','summary','remark'];
  cols.forEach(col => {
    const span = document.getElementById('bsort-' + col);
    if (!span) return;
    if (col === _bankSortBy) {
      span.textContent = _bankSortOrder === 'asc' ? ' ↑' : ' ↓';
      span.style.cssText = 'color:var(--accent);font-weight:bold;font-size:12px';
    } else {
      span.textContent = ' ⇅';
      span.style.cssText = 'color:var(--text3);font-weight:normal;font-size:11px';
    }
  });
}

async function bankLoadTable() {
  const q = document.getElementById('bank-q')?.value || '';
  const res = await api('GET', `/bank?years=${encodeURIComponent(_bankYearsParam())}&q=${encodeURIComponent(q)}&page=${_bankPage}&sort_by=${_bankSortBy}&order=${_bankSortOrder}`);
  const canEdit = state.user.is_admin || hasPermission('finance');
  const total = res.total||0, pageSize = res.page_size||50;
  const totalPages = Math.ceil(total/pageSize)||1;
  const tbody = document.getElementById('bank-tbody');
  const info  = document.getElementById('bank-page-info');
  const btns  = document.getElementById('bank-page-btns');
  if (!tbody) return;

  const fmtAmt = n => n>0.001 ? '¥'+n.toLocaleString('zh-CN',{minimumFractionDigits:2}) : '';

  if (!res.data.length) {
    tbody.innerHTML = `<tr><td colspan="${canEdit?8:7}"><div class="empty-state"><div class="icon">🏦</div>暂无流水记录，请先导入Excel</div></td></tr>`;
    if (info) info.textContent='';
    if (btns) btns.innerHTML='';
    return;
  }

  tbody.innerHTML = res.data.map(r=>`
  <tr>
    <td class="mono" style="font-size:12px;white-space:nowrap">${(r.transaction_time||'').replace(' ','<br>')}</td>
    <td class="mono" style="color:var(--yellow);font-weight:600">${fmtAmt(r.debit_amount)}</td>
    <td class="mono" style="color:var(--green);font-weight:600">${fmtAmt(r.credit_amount)}</td>
    <td class="mono" style="font-size:12px" data-balance="${r.balance}">${_bankBalanceVisible ? (fmtAmt(r.balance)||'-') : '****'}</td>
    <td style="max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px" title="${r.counterpart_name||''}">${r.counterpart_name||'-'}</td>
    <td style="color:var(--text2);font-size:12px;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${r.summary||''}">${r.summary||'-'}</td>
    <td style="color:var(--text3);font-size:12px;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${r.remark||''}">${r.remark||'-'}</td>
    ${canEdit?`<td><button class="btn btn-sm btn-danger" data-delbank="${r.id}">删除</button></td>`:''}
  </tr>`).join('') + (() => {
    const sd = res.sum_debit || 0, sc = res.sum_credit || 0;
    const fmtSum = n => n > 0.001 ? '¥' + n.toLocaleString('zh-CN', {minimumFractionDigits:2}) : '¥0.00';
    return `<tr style="background:var(--bg3);border-top:2px solid var(--border);font-weight:700">
      <td style="font-size:13px;color:var(--text2);white-space:nowrap">📊 汇总（共${total}条）</td>
      <td class="mono" style="color:var(--yellow);font-size:14px">${fmtSum(sd)}</td>
      <td class="mono" style="color:var(--green);font-size:14px">${fmtSum(sc)}</td>
      <td class="mono" style="font-size:13px;color:${sc-sd>=0?'var(--green)':'var(--red)'}">${sc-sd>=0?'+':''}${fmtSum(Math.abs(sc-sd))}</td>
      <td colspan="${canEdit?3:2}" style="font-size:12px;color:var(--text3)">净收支（贷方 − 借方）</td>
      <td><button class="btn btn-sm" id="btn-bank-export-inline">📤 导出</button></td>
    </tr>`;
  })();

  if (info) info.textContent=`共 ${total} 条  第${_bankPage}/${totalPages}页`;

  if (btns) {
    let h='';
    if (_bankPage>1) h+=`<button class="btn btn-sm" data-bp="${_bankPage-1}">‹ 上一页</button>`;
    for (let p=Math.max(1,_bankPage-2); p<=Math.min(totalPages,_bankPage+2); p++)
      h+=`<button class="btn btn-sm${p===_bankPage?' btn-primary':''}" data-bp="${p}">${p}</button>`;
    if (_bankPage<totalPages) h+=`<button class="btn btn-sm" data-bp="${_bankPage+1}">下一页 ›</button>`;
    btns.innerHTML=h;
    btns.querySelectorAll('[data-bp]').forEach(b=>{
      b.addEventListener('click', ()=>{ _bankPage=parseInt(b.dataset.bp); bankLoadTable(); });
    });
  }
  // 更新排序箭头（每次渲染后刷新，不重复绑定事件）
  bankUpdateSortArrows();

  if (canEdit) {
    document.querySelectorAll('[data-delbank]').forEach(b=>{
      b.addEventListener('click', async ()=>{
        if (!confirm('确定删除该条记录？')) return;
        await api('DELETE', '/bank/'+b.dataset.delbank);
        bankRefreshAll();
      });
    });
  }

  document.getElementById('btn-bank-export-inline')?.addEventListener('click', ()=> bankExportExcel());

function renderBankBarChart(wrap, data, tip, card) {
  if (!data.length || data.every(d=>!d.income&&!d.expense)) {
    wrap.innerHTML='<div style="color:var(--text3);text-align:center;padding:120px 0;font-size:13px">暂无数据</div>';
    return;
  }
  const W=wrap.clientWidth||720, H=280;
  const PAD={top:24,right:20,bottom:32,left:72};
  const cW=W-PAD.left-PAD.right, cH=H-PAD.top-PAD.bottom;
  const N=data.length, gW=cW/N;
  const barW=Math.max(6,Math.floor(gW*0.28));
  const maxVal=Math.max(...data.flatMap(d=>[d.income||0,d.expense||0]),1);
  const mag=Math.pow(10,Math.floor(Math.log10(maxVal)));
  const niceMax=Math.ceil(maxVal/mag)*mag;
  const yS=v=>PAD.top+cH-(v/niceMax)*cH;
  const fmtY=n=>n>=1e4?'¥'+(n/1e4).toFixed(0)+'w':'¥'+n.toFixed(0);
  const fmtFull=n=>'¥'+n.toLocaleString('zh-CN',{minimumFractionDigits:2});

  let svg='';
  for (let i=0;i<=5;i++){
    const v=(niceMax/5)*i, y=yS(v).toFixed(1);
    svg+=`<line x1="${PAD.left}" y1="${y}" x2="${PAD.left+cW}" y2="${y}" stroke="var(--border)" stroke-width="1" opacity="0.5"/>
    <text x="${PAD.left-6}" y="${y}" text-anchor="end" dominant-baseline="middle" fill="var(--text3)" font-size="11">${fmtY(v)}</text>`;
  }

  data.forEach((d,i)=>{
    const cx=PAD.left+(i+0.5)*gW;
    const inc=d.income||0, exp=d.expense||0;
    const ibx=cx-barW-2, ibh=Math.max(1,(inc/niceMax)*cH), iby=yS(inc);
    const ebx=cx+2,      ebh=Math.max(1,(exp/niceMax)*cH), eby=yS(exp);
    svg+=`<rect x="${ibx.toFixed(1)}" y="${iby.toFixed(1)}" width="${barW}" height="${ibh.toFixed(1)}" fill="#3fb950" opacity="0.85" rx="2" class="bbar" data-bi="${i}"/>
    <rect x="${ebx.toFixed(1)}" y="${eby.toFixed(1)}" width="${barW}" height="${ebh.toFixed(1)}" fill="#d29922" opacity="0.85" rx="2" class="bbar" data-bi="${i}"/>`;
    const mLabel=(d.month||'').slice(5)+'月';
    svg+=`<text x="${cx.toFixed(1)}" y="${(PAD.top+cH+18).toFixed(1)}" text-anchor="middle" fill="var(--text3)" font-size="11">${mLabel}</text>`;
  });

  wrap.innerHTML=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:100%">${svg}</svg>`;
  wrap.querySelectorAll('.bbar').forEach(bar=>{
    bar.addEventListener('mouseenter', ()=>{
      const d=data[parseInt(bar.dataset.bi)];
      if (!tip||!card) return;
      tip.innerHTML=`<div class="tooltip-month">${d.month||''}</div>
        <div class="tooltip-row"><span style="color:#3fb950">收入</span><span>${fmtFull(d.income||0)}</span></div>
        <div class="tooltip-row"><span style="color:#d29922">支出</span><span>${fmtFull(d.expense||0)}</span></div>`;
      const cr=card.getBoundingClientRect(), br=bar.getBoundingClientRect();
      let left=br.left-cr.left+barW+6, top=br.top-cr.top-20;
      if (left+180>card.clientWidth) left=br.left-cr.left-190;
      tip.style.left=left+'px'; tip.style.top=top+'px';
      tip.classList.add('visible');
    });
    bar.addEventListener('mouseleave', ()=>tip?.classList.remove('visible'));
  });
}

function renderBankLineChart(wrap, data, tip, card) {
  if (!data.length || data.every(d=>!d.income&&!d.expense)) {
    wrap.innerHTML='<div style="color:var(--text3);text-align:center;padding:120px 0;font-size:13px">暂无数据</div>';
    return;
  }
  const W=wrap.clientWidth||720, H=280;
  const PAD={top:24,right:20,bottom:32,left:72};
  const cW=W-PAD.left-PAD.right, cH=H-PAD.top-PAD.bottom;
  const N=data.length;
  const maxVal=Math.max(...data.flatMap(d=>[d.income||0,d.expense||0]),1);
  const mag=Math.pow(10,Math.floor(Math.log10(maxVal)));
  const niceMax=Math.ceil(maxVal/mag)*mag;
  const xS=i=>PAD.left+(N===1?cW/2:i/(N-1)*cW);
  const yS=v=>PAD.top+cH-(v/niceMax)*cH;
  const fmtY=n=>n>=1e4?'¥'+(n/1e4).toFixed(0)+'w':'¥'+n.toFixed(0);
  const fmtFull=n=>'¥'+n.toLocaleString('zh-CN',{minimumFractionDigits:2});

  // Grid lines + Y labels
  let svg='';
  for(let i=0;i<=5;i++){
    const v=(niceMax/5)*i, y=yS(v).toFixed(1);
    svg+=`<line x1="${PAD.left}" y1="${y}" x2="${PAD.left+cW}" y2="${y}" stroke="var(--border)" stroke-width="1" opacity="0.4"/>
    <text x="${PAD.left-8}" y="${y}" text-anchor="end" dominant-baseline="middle" fill="var(--text3)" font-size="11">${fmtY(v)}</text>`;
  }

  // X labels (按数据点密度决定是否跳显)
  const step=Math.max(1,Math.ceil(N/10));
  data.forEach((d,i)=>{
    if(i%step!==0&&i!==N-1) return;
    const x=xS(i).toFixed(1);
    // 多年时显示完整 YYYY-MM，单年时显示 MM月
    const lbl=(_bankYears.length===1)?(parseInt((d.month||'').slice(5))+'月'):(d.month||'');
    svg+=`<text x="${x}" y="${(PAD.top+cH+20).toFixed(1)}" text-anchor="middle" fill="var(--text3)" font-size="11">${lbl}</text>`;
  });

  // 构建折线路径 + 填充区域
  const buildPath=(key,color)=>{
    if(N===1){
      const cx=xS(0),cy=yS(data[0][key]||0);
      return `<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="4" fill="${color}"/>`;
    }
    const pts=data.map((d,i)=>`${xS(i).toFixed(1)},${yS(d[key]||0).toFixed(1)}`).join(' ');
    const firstX=xS(0).toFixed(1), lastX=xS(N-1).toFixed(1), baseY=(PAD.top+cH).toFixed(1);
    const areaPts=`${firstX},${baseY} ${pts} ${lastX},${baseY}`;
    const dots=data.map((d,i)=>`<circle cx="${xS(i).toFixed(1)}" cy="${yS(d[key]||0).toFixed(1)}" r="3.5" fill="${color}" stroke="var(--bg2)" stroke-width="1.5" class="bline-dot" data-bi="${i}" style="cursor:crosshair"/>`).join('');
    return `<polygon points="${areaPts}" fill="${color}" opacity="0.07"/>
      <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
      ${dots}`;
  };

  svg+=buildPath('income','#3fb950')+buildPath('expense','#d29922');
  wrap.innerHTML=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:100%">${svg}</svg>`;

  // Tooltip on dots
  wrap.querySelectorAll('.bline-dot').forEach(dot=>{
    dot.addEventListener('mouseenter',()=>{
      const d=data[parseInt(dot.dataset.bi)];
      if(!tip||!card) return;
      tip.innerHTML=`<div class="tooltip-month">${d.month||''}</div>
        <div class="tooltip-row"><span style="color:#3fb950">收入</span><span>${fmtFull(d.income||0)}</span></div>
        <div class="tooltip-row"><span style="color:#d29922">支出</span><span>${fmtFull(d.expense||0)}</span></div>`;
      const cr=card.getBoundingClientRect(), dr=dot.getBoundingClientRect();
      let left=dr.left-cr.left+14, top=dr.top-cr.top-14;
      if(left+170>card.clientWidth) left=dr.left-cr.left-185;
      if(top<0) top=4;
      tip.style.left=left+'px'; tip.style.top=top+'px';
      tip.classList.add('visible');
    });
    dot.addEventListener('mouseleave',()=>tip?.classList.remove('visible'));
  });
}

function renderBankHBarChart(wrap, data, color, typeLabel, tip, card) {
  if (!data.length) {
    wrap.innerHTML='<div style="color:var(--text3);text-align:center;padding:120px 0;font-size:13px">暂无数据</div>';
    wrap.style.height='300px'; return;
  }
  const items=data.slice(0,20);
  const W=wrap.clientWidth||720, rowH=32;
  const PAD={top:10,right:110,bottom:10,left:200};
  const H=items.length*rowH+PAD.top+PAD.bottom;
  const cW=W-PAD.left-PAD.right;
  const maxVal=Math.max(...items.map(d=>d.total),1);
  const fmtFull=n=>'¥'+n.toLocaleString('zh-CN',{minimumFractionDigits:2});
  const fmtShort=n=>n>=1e8?'¥'+(n/1e8).toFixed(2)+'亿':n>=1e4?'¥'+(n/1e4).toFixed(1)+'w':'¥'+n.toFixed(0);

  let svg='';
  items.forEach((d,i)=>{
    const y=PAD.top+i*rowH, bw=Math.max(2,(d.total/maxVal)*cW);
    const by=y+6, bh=rowH-10;
    const label=d.name.length>14?d.name.slice(0,13)+'…':d.name;
    svg+=`<text x="${PAD.left-8}" y="${(y+rowH/2).toFixed(1)}" text-anchor="end" dominant-baseline="middle" fill="var(--text2)" font-size="12">${label}</text>
    <rect x="${PAD.left}" y="${by}" width="${bw.toFixed(1)}" height="${bh}" fill="${color}" opacity="0.82" rx="3" class="hbar" data-hi="${i}"/>
    <text x="${(PAD.left+bw+6).toFixed(1)}" y="${(by+bh/2).toFixed(1)}" dominant-baseline="middle" fill="var(--text3)" font-size="11">${fmtShort(d.total)}</text>`;
  });

  wrap.style.height=Math.max(300,H+20)+'px';
  wrap.innerHTML=`<svg viewBox="0 0 ${W} ${H+20}" style="width:100%;overflow:visible">${svg}</svg>`;
  wrap.querySelectorAll('.hbar').forEach(bar=>{
    bar.addEventListener('mouseenter', ()=>{
      const d=items[parseInt(bar.dataset.hi)];
      if (!tip||!card) return;
      tip.innerHTML=`<div class="tooltip-month">${d.name}</div>
        <div class="tooltip-row"><span style="color:${color}">${typeLabel==='income'?'收入':'支出'}</span><span>${fmtFull(d.total)}</span></div>`;
      const cr=card.getBoundingClientRect(), br=bar.getBoundingClientRect();
      let left=br.right-cr.left+8, top=br.top-cr.top-10;
      if (left+190>card.clientWidth) left=br.left-cr.left-200;
      tip.style.left=left+'px'; tip.style.top=top+'px';
      tip.classList.add('visible');
    });
    bar.addEventListener('mouseleave', ()=>tip?.classList.remove('visible'));
  });
}

// ── 通用后端 xlsx 下载函数 ────────────────────────────────────────────────────
function backendExport(url, filename) {
  const btn = event?.currentTarget;
  const origText = btn?.textContent;
  if (btn) { btn.disabled = true; btn.textContent = '导出中…'; }
  fetch('/api' + url, { headers: { 'Authorization': 'Bearer ' + state.token } })
    .then(res => {
      if (!res.ok) return res.json().then(d => { throw new Error(d.error || '导出失败'); });
      return res.blob();
    })
    .then(blob => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = filename;
      document.body.appendChild(a); a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(a.href);
    })
    .catch(e => alert('导出失败：' + e.message))
    .finally(() => { if (btn) { btn.disabled = false; btn.textContent = origText; } });
}

      return res.blob();
    })
    .then(blob => {
      const objUrl = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = objUrl;
      // 从当前筛选条件构造文件名
      const label = _bankYears.length ? _bankYears.join('-') : '全部';

      a.download = `银行流水_${label}${qLabel}.xlsx`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(objUrl);

    .catch(e => alert('导出失败：' + e.message))
    .finally(() => {
      if (btn) { btn.disabled = false; btn.textContent = '📤 <span class="btn-text">导出Excel</span>'; }

  </div>`);

  // 渲染交互：点击 label 切换选中状态
  document.querySelectorAll('#year-modal-list label').forEach(lbl => {
    lbl.addEventListener('click', () => {

        lbl.style.color = 'var(--text)';

      if (selLabel) selLabel.textContent = selected.length ? selected.join('、') + '年' : '（请至少选择一年）';
    });
  });

  // 确认按钮
  document.getElementById('year-modal-confirm').onclick = () => {
    const selected = [...document.querySelectorAll('#year-modal-list input:checked')].map(i=>i.value);
    if (!selected.length) { alert('请至少选择一个年份'); return; }
    _bankYears = selected;
    _bankPage = 1;

    // 更新或插入多年标签

    let tag = document.getElementById('bank-years-tag');
    if (_bankYears.length > 1) {
      if (!tag) {

        tag.style.cssText = 'font-size:12px;color:var(--accent);background:rgba(88,166,255,0.12);padding:2px 8px;border-radius:10px;white-space:nowrap';
        container?.appendChild(tag);
      }
      tag.textContent = _bankYearsLabel();
    } else {
      tag?.remove();
    }
    bankRefreshAll();
  };
}

// 构建格式编辑 Modal 的 HTML
function _bankFmtEditorHtml(f) {
  // 解析 col_map JSON 成行列表
  let pairs = [];
  try {
    const cm = JSON.parse(f.col_map || '{}');
    for (const [k, v] of Object.entries(cm)) pairs.push({ k, v });
  } catch {}
  if (pairs.length === 0) pairs.push({ k: '', v: 0 });

  const fieldOpts = BANK_FIELD_OPTIONS.map(o =>
    `<option value="${o.v}">${o.label}</option>`).join('');

  const pairRows = pairs.map((p, i) => `
    <div class="fmt-pair-row" style="display:flex;gap:8px;margin-bottom:6px;align-items:center">
      <input class="input fmt-col-title" placeholder="Excel列标题" value="${escHtml(p.k)}"
        style="flex:1;min-width:0" />
      <select class="input fmt-field-sel" style="flex:1;min-width:0">
        ${BANK_FIELD_OPTIONS.map(o =>
          `<option value="${o.v}"${o.v===p.v?' selected':''}>${o.label}</option>`).join('')}
      </select>
      <button class="btn btn-sm btn-danger" onclick="this.closest('.fmt-pair-row').remove()" title="删除此行">×</button>
    </div>`).join('');

  return `
    <div class="form-group"><label>格式名称 <span style="color:var(--red)">*</span></label>
      <input class="input" id="fmt-name" value="${escHtml(f.name || '')}" placeholder="如：招商银行标准格式" />
    </div>
    <div class="form-group"><label>说明（可选）</label>
      <input class="input" id="fmt-desc" value="${escHtml(f.description || '')}" placeholder="简短描述此格式来源" />
    </div>
    <div class="form-group">
      <label style="display:flex;align-items:center;gap:8px">
        <input type="checkbox" id="fmt-active" ${(f.is_active===undefined||f.is_active)?'checked':''} />
        启用（导入时自动尝试此格式）
      </label>
    </div>
    <div class="form-group">
      <label style="display:flex;align-items:center;justify-content:space-between">
        列标题映射 <button class="btn btn-sm" id="btn-add-pair">＋ 添加行</button>
      </label>
      <div style="font-size:12px;color:var(--text3);margin-bottom:8px">
        填写 Excel 中的<strong>列标题文字</strong>，选择对应的<strong>数据库字段</strong>
      </div>
      <div id="fmt-pairs-container">${pairRows}</div>
    </div>`;
}

function _bankFmtCollectColMap() {
  const rows = document.querySelectorAll('#fmt-pairs-container .fmt-pair-row');
  const cm = {};
  let valid = true;
  rows.forEach(row => {
    const title = row.querySelector('.fmt-col-title').value.trim();
    const fld = parseInt(row.querySelector('.fmt-field-sel').value);
    if (title) cm[title] = fld;
  });
  // 必须至少有 交易时间(0) + (借方或贷方)
  const vals = Object.values(cm);
  if (!vals.includes(0) || (!vals.includes(1) && !vals.includes(2))) {
    valid = false;
  }
  return valid ? JSON.stringify(cm) : null;
}

async function bankSaveFmt(id) {
  const name = document.getElementById('fmt-name')?.value.trim();
  const desc = document.getElementById('fmt-desc')?.value.trim() || '';
  const active = document.getElementById('fmt-active')?.checked ? 1 : 0;
  if (!name) { alert('请填写格式名称'); return; }
  const colMap = _bankFmtCollectColMap();
  if (!colMap) {
    alert('列映射必须包含「交易时间」，以及「借方金额」或「贷方金额」中至少一个');
    return;
  }
  const body = { name, description: desc, col_map: colMap, is_active: active };
  if (id) {
    await api('PUT', `/bank/formats/${id}`, body);
  } else {
    await api('POST', '/bank/formats', body);
  }
  closeModal();
  // 重新打开设置面板并刷新列表
  await bankOpenFmtSettings();
}

async function bankDeleteFmt(id) {

  await api('DELETE', `/bank/formats/${id}`);
  await bankRefreshFmtList();
}

async function bankToggleFmt(id, newActive) {
  // 先取当前格式数据，再 PUT 更新 is_active
  const res = await api('GET', '/bank/formats');
  const f = (res.data || []).find(x => x.id === id);
  if (!f) return;
  await api('PUT', `/bank/formats/${id}`, {
    name: f.name,
    description: f.description,
    col_map: f.col_map,
    is_active: newActive,
  });
  await bankRefreshFmtList();
}

async function bankImportFileFast(file) {
  // 金额格式化：保留两位小数，千分位
  const fmtAmt = v => {
    if (!v) return '0.00';
    return Number(v).toLocaleString('zh-CN', {minimumFractionDigits:2, maximumFractionDigits:2});
  };
  const fmtT = s => s >= 60 ? `${Math.floor(s/60)}m ${(s%60).toFixed(1)}s` : `${s.toFixed(1)}s`;

  showModal(`
  <div class="modal modal-lg">
    <div class="modal-header">⚡ 导入银行流水<span class="modal-close" id="modal-close" style="opacity:0.4;cursor:not-allowed">×</span></div>
    <div class="modal-body">
      <div style="font-size:13px;color:var(--text3);margin-bottom:14px">文件：${file.name}（${(file.size/1024/1024).toFixed(1)} MB）</div>
      <div id="imp-step" style="font-size:14px;font-weight:500;margin-bottom:10px">正在上传文件至服务器…</div>
      <div style="background:var(--bg3);border-radius:6px;overflow:hidden;height:8px;margin-bottom:8px">
        <div id="imp-bar" style="height:100%;width:0%;background:var(--accent);border-radius:6px;transition:width .5s ease"></div>
      </div>
      <div id="imp-sub" style="font-size:12px;color:var(--text3)">服务端直接解析，无需前端处理，大文件极速导入…</div>
      <div id="imp-preview" style="display:none;margin-top:18px"></div>
      <div id="imp-result"  style="display:none;margin-top:16px"></div>
    </div>
    <div class="modal-footer" id="imp-footer"></div>
  </div>`);

  const setStep = (text, pct, sub='') => {
    const el=document.getElementById('imp-step');
    const bar=document.getElementById('imp-bar');
    const sub_el=document.getElementById('imp-sub');
    if(el) el.textContent=text;
    if(bar) bar.style.width=pct+'%';
    if(sub_el) sub_el.textContent=sub;
  };

  const unlockClose = () => {
    const cx=document.getElementById('modal-close');
    if(cx){cx.style.opacity='1';cx.style.cursor='pointer';cx.onclick=closeModal;}
  };

  const setResult = (html, success) => {
    const r=document.getElementById('imp-result');
    const bar=document.getElementById('imp-bar');
    if(r){r.style.display='block';r.innerHTML=html;}
    if(bar){bar.style.width='100%';bar.style.background=success?'var(--green)':'var(--red)';}
    document.getElementById('imp-preview').style.display='none';
    document.getElementById('imp-footer').innerHTML =
      `<button class="btn" onclick="closeModal()">关闭</button>`;
    unlockClose();
  };

  try {
    const _t0 = Date.now();
    setStep('上传文件至服务器…', 5, `文件大小 ${(file.size/1024/1024).toFixed(1)} MB，正在传输…`);

    const formData = new FormData();
    formData.append('file', file);

    // ── 第一步：上传解析，获取预览统计 ────────────────────────────────────
    let _tUploadDone = 0;
    const preview = await new Promise((resolve, reject) => {
      const xhr = new XMLHttpRequest();
      xhr.open('POST', '/api/bank/import/file');
      if (state.token) xhr.setRequestHeader('Authorization', 'Bearer ' + state.token);
      xhr.upload.onprogress = e => {
        if (e.lengthComputable) {
          const pct = Math.round((e.loaded / e.total) * 50);
          setStep('上传文件至服务器…', pct,
            `已上传 ${(e.loaded/1024/1024).toFixed(1)} / ${(e.total/1024/1024).toFixed(1)} MB`);
        }
      };
      xhr.upload.onloadend = () => { _tUploadDone = Date.now(); };
      xhr.onload = () => {
        if (xhr.status >= 200 && xhr.status < 300) {
          try { resolve(JSON.parse(xhr.responseText)); }
          catch(e) { reject(new Error('服务器返回非 JSON 响应')); }
        } else {
          try {
            const err = JSON.parse(xhr.responseText);
            reject(new Error(err.error || `HTTP ${xhr.status}`));
          } catch { reject(new Error(`HTTP ${xhr.status}`)); }
        }
      };
      xhr.onerror = () => reject(new Error('网络错误'));
      xhr.send(formData);
    });

    const _tParseDone = Date.now();
    const uploadSec = _tUploadDone ? (_tUploadDone - _t0)/1000 : null;
    const parseSec  = _tUploadDone ? (_tParseDone - _tUploadDone)/1000 : (_tParseDone - _t0)/1000;

    // 如果解析结果为0条有效数据，直接结束
    if (!preview.token) {
      setStep('解析完成', 100, '');
      setResult(`
        <div style="color:var(--text2);font-size:14px;margin-bottom:10px">⚠ 文件解析完成，但未找到有效数据</div>
        <div style="padding:8px 12px;background:rgba(99,179,237,0.08);border:1px solid rgba(99,179,237,0.25);border-radius:6px;font-size:12px;color:var(--text2)">
          📐 格式识别：<strong>${preview.format || '未识别'}</strong>
        </div>`, false);
      return;
    }

    // ── 第二步：显示预览统计，等待用户确认 ───────────────────────────────
    setStep('解析完成，请确认导入', 60, '');

    const hasInvalid = (preview.invalid||0) > 0;
    const invalidHtml = hasInvalid
      ? `<div style="text-align:center;padding:12px 16px;background:rgba(239,68,68,0.07);border:1px solid rgba(239,68,68,0.2);border-radius:8px">
           <div style="font-size:26px;font-weight:700;color:var(--red)">${preview.invalid}</div>
           <div style="font-size:12px;color:var(--text3);margin-top:2px">数据无效</div>
         </div>`
      : '';

    const previewEl = document.getElementById('imp-preview');
    previewEl.style.display = 'block';
    previewEl.innerHTML = `
      <div style="font-size:13px;font-weight:600;color:var(--text2);margin-bottom:12px">📊 导入预览统计</div>

      <!-- 条数统计 -->
      <div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px">
        <div style="flex:1;min-width:80px;text-align:center;padding:12px 10px;background:var(--bg2);border-radius:8px;border:1px solid var(--border)">

        </div>` : ''}`;

    unlockClose();
  }
}

// ── 第三步：用户点「确认导入」，凭 token 真正写库 ─────────────────────────
async function bankDoConfirmImport(token) {
  const btn = document.getElementById('imp-confirm-btn');
  if(btn){ btn.disabled=true; btn.textContent='导入中…'; }

  const bar = document.getElementById('imp-bar');
  if(bar){ bar.style.width='80%'; bar.style.background='var(--accent)'; }

  const setStep = (text, pct, sub='') => {
    const el=document.getElementById('imp-step');
    const s=document.getElementById('imp-sub');
    if(el) el.textContent=text;
    if(bar) bar.style.width=pct+'%';
    if(s) s.textContent=sub;
  };

  const fmtT = s => s >= 60 ? `${Math.floor(s/60)}m ${(s%60).toFixed(1)}s` : `${s.toFixed(1)}s`;

  try {
    setStep('正在写入数据库…', 85, '');
    const _t0 = Date.now();
    const res = await api('POST', '/bank/import/confirm', { token });
    const elapsed = (Date.now() - _t0) / 1000;

    setStep('导入完成', 100, '');
    if(bar) bar.style.background = 'var(--green)';

    // 刷新年份列表和数据
    const yr = await api('GET', '/bank/years');
    _bankYearList = yr.years || [];
    const sel = document.getElementById('bank-year-sel');
    if(sel && _bankYearList.length){
      _bankYears = [];
      sel.innerHTML = _bankYearList.map(y=>`<option value="${y}">${y}年</option>`).join('')
        + `<option value="__more__">📅 更多…</option>
           <option value="__all__" selected>🔍 显示全部</option>`;
    }
    bankRefreshAll();

    const invalidHtml = (res.invalid||0) > 0
      ? `<div style="text-align:center;padding:10px;background:rgba(239,68,68,0.07);border:1px solid rgba(239,68,68,0.2);border-radius:8px">
           <div style="font-size:26px;font-weight:700;color:var(--red)">${res.invalid}</div>
           <div style="font-size:12px;color:var(--text3)">数据无效</div>
         </div>` : '';

    const previewEl = document.getElementById('imp-preview');
    if(previewEl) previewEl.style.display='none';
    const r = document.getElementById('imp-result');
    if(r){
      r.style.display='block';
      r.innerHTML=`
        <div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:12px">
          <div style="flex:1;min-width:80px;text-align:center;padding:12px 10px;background:rgba(72,199,142,0.07);border:1px solid rgba(72,199,142,0.3);border-radius:8px">
            <div style="font-size:26px;font-weight:700;color:var(--green)">${(res.imported||0).toLocaleString()}</div>
            <div style="font-size:12px;color:var(--text3);margin-top:2px">成功导入</div>
          </div>
          <div style="flex:1;min-width:80px;text-align:center;padding:12px 10px;background:var(--bg2);border-radius:8px;border:1px solid var(--border)">
            <div style="font-size:26px;font-weight:700;color:var(--text3)">${(res.skipped||0).toLocaleString()}</div>
            <div style="font-size:12px;color:var(--text3);margin-top:2px">跳过（重复）</div>
          </div>
          ${invalidHtml}
          <div style="flex:1;min-width:80px;text-align:center;padding:12px 10px;background:var(--bg2);border-radius:8px;border:1px solid var(--border)">
            <div style="font-size:26px;font-weight:700;color:var(--accent)">${fmtT(elapsed)}</div>
            <div style="font-size:12px;color:var(--text3);margin-top:2px">写库耗时</div>
          </div>
        </div>
        <div style="padding:8px 12px;background:rgba(99,179,237,0.06);border:1px solid rgba(99,179,237,0.2);border-radius:6px;font-size:12px;color:var(--text2)">
          📐 识别格式：<strong>${res.format || '按列位置'}</strong>
        </div>
        ${(res.invalid||0)>0 ? `<div style="margin-top:6px;padding:8px 12px;background:rgba(239,68,68,0.06);border:1px solid rgba(239,68,68,0.2);border-radius:6px;font-size:12px;color:var(--text2)">⚠ ${res.invalid} 条因交易时间无效或借贷金额均为空被忽略</div>` : ''}
      `;
    }
    document.getElementById('imp-footer').innerHTML = `<button class="btn" onclick="closeModal()">关闭</button>`;
    const cx=document.getElementById('modal-close');
    if(cx){cx.style.opacity='1';cx.style.cursor='pointer';cx.onclick=closeModal;}

  } catch(e) {
    console.error(e);
    if(bar) bar.style.background = 'var(--red)';
    if(btn){ btn.disabled=false; btn.textContent='重试'; }
    alert('导入失败：' + e.message);
  }
}

// ── 状态 ─────────────────────────────────────────────────────
let _rptSources   = [];          // 数据源元数据
let _rptSavedList = [];          // 已保存报表列表
let _rptChart     = null;        // 当前 ECharts 实例
let _rptEditingId = null;        // 正在编辑的报表 id（null=新建）
let _rptLoadingId = null;        // 当前正在加载的报表 id（并发保护）
const _RPT_LAST_KEY = 'erp_last_report_id';  // localStorage key：上次打开的报表 id

// 当前配置（与后端 reportConfig 对应）
const _rptCfg = {
  source: '',
  filters: [],
  filter_logic: [],  // 相邻筛选条件间的逻辑：'AND'|'OR'，长度 = filters.length - 1
  dimensions: [],
  values: [],
  chart: { type: 'bar', x: '', y: '', series: '', show_table: true },  // series: 系列维度别名；show_table: 是否显示数据明细
  sort: { field: '', dir: 'desc' },
  limit: 500,
  panelHeight: 0,
};

// ── 工具 ─────────────────────────────────────────────────────
function _rptGetTheme() {
  const s = getComputedStyle(document.documentElement);
  const g = v => s.getPropertyValue(v).trim();
  return {
    bg:      g('--bg2')   || '#1c2128',
    text:    g('--text')  || '#e6edf3',
    text2:   g('--text2') || '#8b949e',
    text3:   g('--text3') || '#6e7681',
    border:  g('--border')|| '#30363d',
    accent:  g('--accent')|| '#58a6ff',
    green:   g('--green') || '#3fb950',
    red:     g('--red')   || '#f85149',
    yellow:  g('--yellow')|| '#d29922',
  };
}

function _rptSourceMeta(sid) {
  return _rptSources.find(s => s.id === sid) || null;
}

function _rptFieldMeta(sid, fid) {
  const src = _rptSourceMeta(sid);
  return src ? (src.fields.find(f => f.id === fid) || null) : null;
}

function _rptCloneCfg() {
  return JSON.parse(JSON.stringify(_rptCfg));
}
