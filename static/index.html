// ── 客户 Excel 导入 ───────────────────────────────────────────
function customerImportClick() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.xlsx,.xls';
  input.onchange = e => { if (e.target.files[0]) customerImportPreview(e.target.files[0]); };
  input.click();
}

async function customerImportPreview(file) {
  showModal(`
  <div class="modal modal-lg">
    <div class="modal-header">📥 导入客户数据<span class="modal-close" id="modal-close" style="opacity:0.4;cursor:not-allowed">×</span></div>
    <div class="modal-body">
      <div style="font-size:13px;color:var(--text3);margin-bottom:14px">文件：${file.name}（${(file.size/1024/1024).toFixed(2)} MB）</div>
      <div id="cip-step" style="font-size:14px;font-weight:500;margin-bottom:10px">正在上传并解析…</div>
      <div style="background:var(--bg3);border-radius:6px;overflow:hidden;height:8px;margin-bottom:10px">
        <div id="cip-bar" style="height:100%;width:0%;background:var(--accent);border-radius:6px;transition:width .4s ease"></div>
      </div>
      <div style="margin-top:8px;padding:10px 14px;background:var(--bg2);border:1px solid var(--border);border-radius:6px;font-size:12px;color:var(--text3);line-height:1.9">
        支持列标题：<code>公司名称</code> <code>省市</code> <code>地址</code> <code>联系人</code> <code>电话</code> <code>快递地址</code> <code>税号</code><br>
        <strong>公司名称</strong>为唯一键：已存在的公司可选择跳过或覆盖更新。
      </div>
      <div id="cip-preview" style="display:none;margin-top:16px"></div>
      <div id="cip-result"  style="display:none;margin-top:16px"></div>
    </div>
    <div class="modal-footer" id="cip-footer"></div>
  </div>`);

  const setBar  = pct => { const b=document.getElementById('cip-bar'); if(b) b.style.width=pct+'%'; };
  const setStep = (txt,pct) => { const e=document.getElementById('cip-step'); if(e) e.textContent=txt; setBar(pct); };
  const unlockClose = () => { const cx=document.getElementById('modal-close'); if(cx){cx.style.opacity='1';cx.style.cursor='pointer';cx.onclick=closeModal;} };

  try {
    setStep('上传文件…', 10);
    const formData = new FormData();
    formData.append('file', file);

    let uploadDone = 0;
    const preview = await new Promise((resolve, reject) => {
      const xhr = new XMLHttpRequest();
      xhr.open('POST', '/api/customers/import/preview');
      if (state.token) xhr.setRequestHeader('Authorization', 'Bearer ' + state.token);
      xhr.upload.onprogress = e => { if (e.lengthComputable) setBar(Math.round(e.loaded/e.total*50)); };
      xhr.upload.onloadend = () => { uploadDone = Date.now(); setBar(55); };
      xhr.onload = () => {
        if (xhr.status >= 200 && xhr.status < 300) {
          try { resolve(JSON.parse(xhr.responseText)); }
          catch { reject(new Error('服务器返回非 JSON 响应')); }
        } else {
          try { reject(new Error(JSON.parse(xhr.responseText).error || `HTTP ${xhr.status}`)); }
          catch { reject(new Error(`HTTP ${xhr.status}`)); }
        }
      };
      xhr.onerror = () => reject(new Error('网络错误'));
      xhr.send(formData);
    });

    setStep('解析完成，请确认导入', 65);

    if (!preview.token) {
      setStep('文件中未找到有效客户数据', 100);
      document.getElementById('cip-bar').style.background = 'var(--red)';
      document.getElementById('cip-footer').innerHTML = `<button class="btn" onclick="closeModal()">关闭</button>`;
      unlockClose();
      return;
    }

    const parseSec = uploadDone ? ((Date.now()-uploadDone)/1000).toFixed(1) : '-';
    const invalidHtml = (preview.invalid||0) > 0
      ? `<div style="flex:1;min-width:80px;text-align:center;padding:12px 10px;background:rgba(239,68,68,0.07);border:1px solid rgba(239,68,68,0.2);border-radius:8px">
           <div style="font-size:26px;font-weight:700;color:var(--red)">${preview.invalid}</div>
           <div style="font-size:12px;color:var(--text3);margin-top:2px">数据无效</div>
         </div>` : '';

    document.getElementById('cip-preview').style.display = 'block';
    document.getElementById('cip-preview').innerHTML = `
      <div style="font-size:13px;font-weight:600;color:var(--text2);margin-bottom:12px">📊 导入预览</div>
      <div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px">
        <div style="flex:1;min-width:80px;text-align:center;padding:12px 10px;background:var(--bg2);border-radius:8px;border:1px solid var(--border)">
          <div style="font-size:26px;font-weight:700;color:var(--text1)">${(preview.total||0).toLocaleString()}</div>
          <div style="font-size:12px;color:var(--text3);margin-top:2px">文件总行数</div>
        </div>
        <div style="flex:1;min-width:80px;text-align:center;padding:12px 10px;background:rgba(72,199,142,0.07);border:1px solid rgba(72,199,142,0.3);border-radius:8px">
          <div style="font-size:26px;font-weight:700;color:var(--green)">${(preview.new_count||0).toLocaleString()}</div>
          <div style="font-size:12px;color:var(--text3);margin-top:2px">新增客户</div>
        </div>
        <div style="flex:1;min-width:80px;text-align:center;padding:12px 10px;background:rgba(99,179,237,0.07);border:1px solid rgba(99,179,237,0.3);border-radius:8px">
          <div style="font-size:26px;font-weight:700;color:var(--accent)">${(preview.update_count||0).toLocaleString()}</div>
          <div style="font-size:12px;color:var(--text3);margin-top:2px">公司名已存在</div>
        </div>
        ${invalidHtml}
      </div>
      ${(preview.update_count||0) > 0 ? `
      <div style="margin-bottom:14px;padding:12px 14px;background:var(--bg2);border:1px solid var(--border);border-radius:8px">
        <div style="font-size:13px;font-weight:500;margin-bottom:8px;color:var(--text2)">⚙️ 已存在公司处理方式</div>
        <label style="display:flex;align-items:center;gap:8px;cursor:pointer;margin-bottom:6px;font-size:13px">
          <input type="radio" name="cip-update-mode" value="skip" checked> 跳过（保留现有数据）
        </label>
        <label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13px">
          <input type="radio" name="cip-update-mode" value="overwrite"> 覆盖更新（用 Excel 数据覆盖现有客户信息）
        </label>
      </div>` : ''}
      <div style="padding:8px 12px;background:rgba(99,179,237,0.06);border:1px solid rgba(99,179,237,0.2);border-radius:6px;font-size:12px;color:var(--text2)">
        ⏱ 服务端解析耗时 ${parseSec}s &nbsp;·&nbsp; 📄 ${file.name}
      </div>
      ${(preview.invalid||0)>0 ? `<div style="margin-top:6px;padding:8px 12px;background:rgba(239,68,68,0.06);border:1px solid rgba(239,68,68,0.2);border-radius:6px;font-size:12px;color:var(--text2)">⚠ ${preview.invalid} 条因缺少公司名称被忽略</div>` : ''}
    `;

    document.getElementById('cip-footer').innerHTML = `
      <button class="btn btn-secondary" onclick="closeModal()" style="margin-right:8px">取消</button>
      <button class="btn btn-primary" id="cip-confirm-btn" onclick="customerImportConfirm('${preview.token}')">
        ✅ 确认导入 ${((preview.new_count||0)+(preview.update_count||0)).toLocaleString()} 条
      </button>`;
    unlockClose();

  } catch(e) {
    console.error(e);
    document.getElementById('cip-bar').style.background = 'var(--red)';
    document.getElementById('cip-step').textContent = '解析失败';
    const r = document.getElementById('cip-result');
    r.style.display = 'block';
    r.innerHTML = `<div style="color:var(--red);font-size:14px">❌ ${e.message}</div>`;
    document.getElementById('cip-footer').innerHTML = `<button class="btn" onclick="closeModal()">关闭</button>`;
    document.getElementById('modal-close').style.opacity='1';
    document.getElementById('modal-close').style.cursor='pointer';
    document.getElementById('modal-close').onclick=closeModal;
  }
}

async function customerImportConfirm(token) {
  const btn = document.getElementById('cip-confirm-btn');
  if(btn){ btn.disabled=true; btn.textContent='导入中…'; }
  const bar = document.getElementById('cip-bar');
  if(bar){ bar.style.width='85%'; bar.style.background='var(--accent)'; }

  const updateMode = document.querySelector('input[name="cip-update-mode"]:checked')?.value || 'skip';

  try {
    const t0 = Date.now();
    const res = await api('POST', '/customers/import/confirm', { token, update_mode: updateMode });
    const elapsed = ((Date.now()-t0)/1000).toFixed(1);

    if(bar){ bar.style.width='100%'; bar.style.background='var(--green)'; }
    document.getElementById('cip-step').textContent = '导入完成';
    document.getElementById('cip-preview').style.display = 'none';

    const invalidHtml = (res.invalid||0)>0
      ? `<div style="flex:1;min-width:80px;text-align:center;padding:12px 10px;background:rgba(239,68,68,0.07);border:1px solid rgba(239,68,68,0.2);border-radius:8px">
           <div style="font-size:26px;font-weight:700;color:var(--red)">${res.invalid}</div>
           <div style="font-size:12px;color:var(--text3)">无效行</div>
         </div>` : '';

    const r = document.getElementById('cip-result');
    r.style.display = 'block';
    r.innerHTML = `
      <div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:12px">
        <div style="flex:1;min-width:80px;text-align:center;padding:12px 10px;background:rgba(72,199,142,0.07);border:1px solid rgba(72,199,142,0.3);border-radius:8px">
          <div style="font-size:26px;font-weight:700;color:var(--green)">${res.inserted||0}</div>
          <div style="font-size:12px;color:var(--text3);margin-top:2px">新增成功</div>
        </div>
        <div style="flex:1;min-width:80px;text-align:center;padding:12px 10px;background:rgba(99,179,237,0.07);border:1px solid rgba(99,179,237,0.3);border-radius:8px">
          <div style="font-size:26px;font-weight:700;color:var(--accent)">${res.updated||0}</div>
          <div style="font-size:12px;color:var(--text3);margin-top:2px">覆盖更新</div>
        </div>
        <div style="flex:1;min-width:80px;text-align:center;padding:12px 10px;background:var(--bg2);border-radius:8px;border:1px solid var(--border)">
          <div style="font-size:26px;font-weight:700;color:var(--text3)">${res.skipped||0}</div>
          <div style="font-size:12px;color:var(--text3);margin-top:2px">跳过</div>
        </div>
        ${invalidHtml}
      </div>
      <div style="padding:8px 12px;background:rgba(99,179,237,0.06);border:1px solid rgba(99,179,237,0.2);border-radius:6px;font-size:12px;color:var(--text2)">
        ⏱ 写库耗时 ${elapsed}s
      </div>`;
    document.getElementById('cip-footer').innerHTML = `<button class="btn btn-primary" onclick="closeModal();loadPage()">完成并刷新</button>`;
    const cx=document.getElementById('modal-close'); if(cx){cx.style.opacity='1';cx.style.cursor='pointer';cx.onclick=()=>{closeModal();loadPage();};}

  } catch(e) {
    console.error(e);
    if(btn){ btn.disabled=false; btn.textContent='重试'; }
    alert('导入失败：' + e.message);
  }
}

function renderCustomerRows(customers, canEdit) {
  if (!customers.length) return '<tr><td colspan="7"><div class="empty-state"><div class="icon">🏢</div>暂无客户</div></td></tr>';
  return customers.map(c => `
  <tr>
    <td style="font-weight:500;cursor:pointer;color:var(--accent)" data-action="view-cust" data-id="${c.id}">${c.company_name}</td>
    <td style="color:var(--text2)">${c.province_city||'-'}</td>
    <td>${c.contact_name||'-'}</td>
    <td class="mono">${c.phone||'-'}</td>
    <td class="mono" style="color:var(--text3)">${c.tax_number||'-'}</td>
    <td style="color:var(--text2)">${c.related_company||'-'}</td>
    ${canEdit ? `<td>
      <button class="btn btn-sm" data-action="view-cust" data-id="${c.id}">查看</button>
      <button class="btn btn-sm" data-action="edit-cust" data-id="${c.id}" style="margin-left:4px">编辑</button>
      <button class="btn btn-sm btn-danger" data-action="del-cust" data-id="${c.id}" style="margin-left:4px">删除</button>
    </td>` : ''}
  </tr>`).join('');
}

function attachCustomerActions(canEdit) {
  if (!canEdit) return;
  document.querySelectorAll('[data-action=view-cust]').forEach(btn => {
    btn.addEventListener('click', () => {
      const c = (state.data.customers || []).find(x => x.id == btn.dataset.id);
      if (c) openCustomerViewModal(c);
    });
  });
  document.querySelectorAll('[data-action=edit-cust]').forEach(btn => {
    btn.addEventListener('click', () => {
      const c = (state.data.customers || []).find(x => x.id == btn.dataset.id);
      if (c) openCustomerModal(c);
    });
  });
  document.querySelectorAll('[data-action=del-cust]').forEach(btn => {
    btn.addEventListener('click', async () => {
      if (!confirm('确定删除？')) return;
      await api('DELETE', '/customers/' + btn.dataset.id);
      loadPage();
    });
  });
}

// ── 客户附件辅助函数 ─────────────────────────────────────────
async function cvLoadAttachments(custId) {
  const wrap = document.getElementById('cv-attachments');
  if (!wrap) return;
  try {
    const res = await api('GET', '/customers/' + custId + '/attachments');
    const list = res.attachments || [];
    if (!list.length) {
      wrap.innerHTML = '<div style="color:var(--text3);font-size:13px">暂无附件</div>';
      return;
    }
    const tk = state.token ? '?token=' + encodeURIComponent(state.token) : '';
    wrap.innerHTML = list.map(a => {
      const ext = (a.file_name||'').split('.').pop().toLowerCase();
      const previewable = ['pdf','png','jpg','jpeg','gif','webp','bmp','svg','txt'].includes(ext);
      const base = `/api/customers/${custId}/attachments/${a.id}`;
      return `<div style="display:flex;align-items:center;gap:8px;padding:7px 10px;background:var(--bg3);border-radius:6px;margin-bottom:6px">
        <span style="font-size:18px">${fileIcon(a.file_name||'')}</span>
        <div style="flex:1;min-width:0">
          <div style="font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${escHtml(a.file_name||'')}</div>
          <div style="font-size:11px;color:var(--text3)">${a.remark?escHtml(a.remark)+' · ':''}${fmtSize(a.file_size||0)} · ${(a.created_at||'').slice(0,10)}</div>
        </div>
        ${previewable ? `<a class="btn btn-sm" href="${base}/preview${tk}" target="_blank" style="text-decoration:none">查看</a>` : ''}
        <a class="btn btn-sm" href="${base}/download${tk}" target="_blank" style="text-decoration:none">下载</a>
        <button class="btn btn-sm btn-danger" onclick="cvDeleteAttachment(${custId},${a.id},this)">删除</button>
      </div>`;
    }).join('');
  } catch(e) {
    const wrap2 = document.getElementById('cv-attachments');
    if (wrap2) wrap2.innerHTML = `<div style="color:var(--red);font-size:13px">加载失败</div>`;
  }
}

async function cvUploadFiles(custId, files) {
  if (!files || !files.length) return;
  const wrap = document.getElementById('cv-attachments');
  if (wrap) wrap.innerHTML = '<div style="color:var(--text3);font-size:13px">上传中…</div>';
  for (const file of files) {
    const fd = new FormData();
    fd.append('file', file);
    await fetch('/api/customers/' + custId + '/attachments', {
      method: 'POST',
      headers: { Authorization: 'Bearer ' + state.token },
      body: fd,
    });
  }
  // 清空 input 以便重复上传同名文件
  const input = document.getElementById('cv-file-input');
  if (input) input.value = '';
  cvLoadAttachments(custId);
}

async function cvDeleteAttachment(custId, aid, btn) {
  if (!confirm('确认删除此附件？')) return;
  btn.disabled = true;
  try {
    await api('DELETE', '/customers/' + custId + '/attachments/' + aid);
    cvLoadAttachments(custId);
  } catch(e) { btn.disabled = false; alert('删除失败：' + e.message); }
}

const _quoteSort = { col: 'id', dir: 'desc' };
let _quoteData = [];
let _quoteStatusMap = {};
let _quoteStatusBadge = null;

async function loadQuotations(content, actions) {
  const canEdit = state.user.is_admin || hasPermission('quotations');
  actions.innerHTML = (canEdit ? `<button class="btn btn-primary" id="btn-add-quote">＋ <span class="btn-text">新增报价</span></button>` : '')
    + `<button class="btn" id="btn-export-quotes" onclick="exportQuotations()">📤 <span class="btn-text">导出Excel</span></button>`;
  if (canEdit) {
    document.getElementById('btn-add-quote')?.addEventListener('click', async () => {
      await preloadData();
      openQuotationModal(null);
    });
  }

  _quoteData = await api('GET', '/quotations');
  _quoteStatusMap = { draft: '草稿', sent: '已发送', negotiating: '议价中', accepted: '已接受', rejected: '已拒绝' };
  _quoteStatusBadge = s => ({
    draft: 'badge-gray', sent: 'badge-blue', negotiating: 'badge-yellow',
    accepted: 'badge-green', rejected: 'badge-red',
  }[s] || 'badge-gray');

  content.innerHTML = `
  <div class="search-bar">
    <input class="search-input" id="quote-search" placeholder="搜索报价单号、公司名…">

  </div>
  <div class="card">
    <div class="table-wrap">
      <table>
        <thead><tr>
          ${makeSortTh('报价单号','quote_number',_quoteSort,'quote')}
          ${makeSortTh('公司','company_name',_quoteSort,'quote')}
          ${makeSortTh('日期','date',_quoteSort,'quote')}
          ${makeSortTh('状态','status',_quoteSort,'quote')}
          ${makeSortTh('金额','total_amount',_quoteSort,'quote','color:var(--green)')}
          ${canEdit ? '<th>操作</th>' : ''}
        </tr></thead>
        <tbody id="quote-tbody"></tbody>
      </table>
    </div>
  </div>`;

  quoteRenderTable(canEdit);

  document.getElementById('quote-search')?.addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('btn-quote-search')?.click(); });
  document.getElementById('btn-quote-search')?.addEventListener('click', async () => {
    const q = document.getElementById('quote-search').value;
    _quoteData = await api('GET', '/quotations?q=' + encodeURIComponent(q));
    quoteRenderTable(canEdit);
  });

function quoteSetSort(col) {
  if (_quoteSort.col === col) _quoteSort.dir = _quoteSort.dir === 'asc' ? 'desc' : 'asc';
  else { _quoteSort.col = col; _quoteSort.dir = 'asc'; }
  const canEdit = state.user.is_admin || hasPermission('quotations');
  quoteRenderTable(canEdit);
}

function quoteRenderTable(canEdit) {
  const getter = (q, col) => col === 'total_amount' ? (q.total_amount || 0) : (q[col] || '');
  const sorted = clientSort(_quoteData, _quoteSort.col, _quoteSort.dir, getter);
  document.getElementById('quote-tbody').innerHTML = renderQuoteRows(sorted, canEdit, _quoteStatusMap, _quoteStatusBadge);
  updateSortArrows('quote', _quoteSort, ['quote_number','company_name','date','status','total_amount']);
  attachQuoteActions(canEdit);
}

function renderQuoteRows(quotes, canEdit, statusMap, statusBadge) {
  if (!quotes.length) return '<tr><td colspan="6"><div class="empty-state"><div class="icon">📋</div>暂无报价</div></td></tr>';
  return quotes.map(q => `
  <tr>
    <td class="mono" style="color:var(--accent)">${q.quote_number}</td>
    <td>${q.company_name||'-'}</td>
    <td>${q.date||'-'}</td>
    <td><span class="badge ${statusBadge(q.status)}">${statusMap[q.status]||q.status}</span></td>
    <td class="mono" style="color:var(--green)">¥${q.total_amount?.toFixed(2)||'0.00'}</td>
    ${canEdit ? `<td>
      <button class="btn btn-sm" data-action="edit-quote" data-id="${q.id}">编辑</button>
      <button class="btn btn-sm btn-danger" data-action="del-quote" data-id="${q.id}" style="margin-left:4px">删除</button>
    </td>` : ''}
  </tr>`).join('');
}

function attachQuoteActions(canEdit) {
  if (!canEdit) return;
  document.querySelectorAll('[data-action=edit-quote]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const q = await api('GET', '/quotations/' + btn.dataset.id);
      await preloadData();
      openQuotationModal(q);
    });
  });
  document.querySelectorAll('[data-action=del-quote]').forEach(btn => {
    btn.addEventListener('click', async () => {
      if (!confirm('确定删除？')) return;
      await api('DELETE', '/quotations/' + btn.dataset.id);
      loadPage();
    });
  });
}

async function preloadData() {
  if (!state.data.customers) state.data.customers = await api('GET', '/customers');
  if (!state.data.products) state.data.products = await api('GET', '/products');
}

function openQuotationModal(quote) {
  const q = quote || {};
  let items = [];
  try { items = JSON.parse(q.items || '[]'); } catch(e) { items = []; }
  if (!Array.isArray(items)) items = [];

  const customers = state.data.customers || [];

  const renderItems = (items) => items.map((item, idx) => `
  <div class="quote-item" id="qi-${idx}">
    <div class="quote-item-header">
      <span style="font-weight:600;color:var(--text2)">产品 #${idx+1}${item.name ? ' · <span style=\'color:var(--text)\'>'+item.name+'</span>' : ''}</span>
      <button class="btn btn-sm btn-danger" data-del-item="${idx}">删除</button>
    </div>
    <div class="form-row-3">
      <div class="form-group"><label>产品名称</label><input class="qi-name" value="${item.name||''}" data-idx="${idx}" placeholder="产品名称"></div>
      <div class="form-group"><label>品牌</label><input class="qi-brand" value="${item.brand||''}" data-idx="${idx}"></div>
      <div class="form-group"><label>型号</label><input class="qi-model" value="${item.model||''}" data-idx="${idx}"></div>
    </div>
    <div class="form-row-3">
      <div class="form-group"><label>类型</label><input class="qi-type" value="${item.type||''}" data-idx="${idx}"></div>
      <div class="form-group"><label>描述</label><input class="qi-desc" value="${item.description||''}" data-idx="${idx}"></div>
      <div class="form-group"><label>单位</label><input class="qi-unit" value="${item.unit||'PCS'}" data-idx="${idx}"></div>
    </div>
    <div class="form-row-3">
      <div class="form-group"><label>单价 (¥)</label><input class="qi-price" type="number" step="0.01" value="${item.unit_price||0}" data-idx="${idx}"></div>
      <div class="form-group"><label>数量</label><input class="qi-qty" type="number" value="${item.quantity||1}" data-idx="${idx}"></div>
      <div class="form-group"><label>总价</label><input class="qi-total" readonly value="${((item.unit_price||0)*(item.quantity||1)).toFixed(2)}" style="color:var(--green)"></div>
    </div>
  </div>`).join('');

  showModal(`
  <div class="modal modal-lg">
    <div class="modal-header">${q.id ? '编辑报价单' : '新建报价单'}<span class="modal-close" id="modal-close">×</span></div>
    <div class="modal-body">
      <div class="form-row">
        <div class="form-group"><label>客户</label>
          <select id="q-customer">
            <option value="">-- 手动输入 --</option>
            ${customers.map(c => `<option value="${c.id}|${c.company_name}" ${q.customer_id==c.id?'selected':''}>${c.company_name}</option>`).join('')}
          </select>
        </div>
        <div class="form-group"><label>公司名称</label><input id="q-company" value="${q.company_name||''}"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>日期</label><input id="q-date" type="date" value="${q.date||new Date().toISOString().split('T')[0]}"></div>
        <div class="form-group"><label>状态</label>
          <select id="q-status">
            <option value="draft" ${q.status==='draft'?'selected':''}>草稿</option>
            <option value="sent" ${q.status==='sent'?'selected':''}>已发送</option>
            <option value="negotiating" ${q.status==='negotiating'?'selected':''}>议价中</option>
            <option value="accepted" ${q.status==='accepted'?'selected':''}>已接受</option>
            <option value="rejected" ${q.status==='rejected'?'selected':''}>已拒绝</option>
          </select>
        </div>
      </div>
      <div class="form-group"><label>变更记录/备注</label><textarea id="q-log" rows="2">${q.change_log||''}</textarea></div>
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;margin-top:4px">
        <label style="margin:0;font-size:13px;font-weight:600">报价明细</label>
        <div style="display:flex;gap:8px">
          <select id="q-product-sel" style="width:200px">
            <option value="">从产品库添加…</option>
            ${(state.data.products||[]).map(p => `<option value="${p.id}">${p.name ? p.name+' · ' : ''}[${p.brand}] ${p.model} - ¥${p.unit_price}</option>`).join('')}
          </select>
          <button class="btn btn-sm btn-success" id="btn-add-item">＋ 添加产品</button>
        </div>
      </div>
      <div id="quote-items">${renderItems(items)}</div>
      <div style="text-align:right;padding-top:10px;border-top:1px solid var(--border);font-size:16px;font-weight:700">
        合计: <span id="q-total" style="color:var(--green);font-family:'JetBrains Mono',monospace">¥${q.total_amount?.toFixed(2)||'0.00'}</span>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn" id="modal-cancel">取消</button>
      <button class="btn btn-primary" id="modal-save">保存</button>
    </div>
  </div>`);

  let currentItems = [...items];

  const recalc = () => {
    currentItems.forEach((item, idx) => {
      const price = parseFloat(document.querySelector(`.qi-price[data-idx="${idx}"]`)?.value) || 0;
      const qty = parseFloat(document.querySelector(`.qi-qty[data-idx="${idx}"]`)?.value) || 0;
      const totalEl = document.querySelector(`.qi-total[data-idx="${idx}"]`) || 
                      document.getElementById('qi-'+idx)?.querySelector('.qi-total');
      if (totalEl) totalEl.value = (price * qty).toFixed(2);
      item.name = document.querySelector(`.qi-name[data-idx="${idx}"]`)?.value || '';
      item.brand = document.querySelector(`.qi-brand[data-idx="${idx}"]`)?.value || '';
      item.model = document.querySelector(`.qi-model[data-idx="${idx}"]`)?.value || '';
      item.type = document.querySelector(`.qi-type[data-idx="${idx}"]`)?.value || '';
      item.description = document.querySelector(`.qi-desc[data-idx="${idx}"]`)?.value || '';
      item.unit = document.querySelector(`.qi-unit[data-idx="${idx}"]`)?.value || 'PCS';
      item.unit_price = price;
      item.quantity = qty;
      item.total_price = price * qty;
    });
    const total = currentItems.reduce((s, i) => s + (i.total_price || 0), 0);
    const el = document.getElementById('q-total');
    if (el) el.textContent = '¥' + total.toFixed(2);
  };

  const rerenderItems = () => {
    document.getElementById('quote-items').innerHTML = renderItems(currentItems);
    attachItemEvents();
  };

  const attachItemEvents = () => {
    document.querySelectorAll('[data-del-item]').forEach(btn => {
      btn.addEventListener('click', () => {
        currentItems.splice(parseInt(btn.dataset.delItem), 1);
        rerenderItems();
        recalc();
      });
    });
    document.querySelectorAll('.qi-price,.qi-qty').forEach(inp => {
      inp.addEventListener('input', recalc);
    });
  };

  attachItemEvents();

  document.getElementById('btn-add-item')?.addEventListener('click', () => {
    const sel = document.getElementById('q-product-sel');
    const pid = sel.value;
    if (pid) {
      const p = (state.data.products||[]).find(x => x.id == pid);
      if (p) currentItems.push({ name: p.name||'', brand: p.brand, model: p.model, type: p.type, description: p.description, unit: p.unit, unit_price: p.unit_price, quantity: 1, total_price: p.unit_price });
    } else {
      currentItems.push({ brand: '', model: '', type: '', description: '', unit: 'PCS', unit_price: 0, quantity: 1, total_price: 0 });
    }
    rerenderItems();
    recalc();
  });

  document.getElementById('q-customer')?.addEventListener('change', e => {
    const val = e.target.value;
    if (val) {
      const [id, name] = val.split('|');
      document.getElementById('q-company').value = name;
    }
  });

  document.getElementById('modal-close').onclick = closeModal;
  document.getElementById('modal-cancel').onclick = closeModal;
  document.getElementById('modal-save').onclick = async () => {
    recalc();
    const custVal = document.getElementById('q-customer').value;
    const customerID = custVal ? parseInt(custVal.split('|')[0]) : null;
    const total = currentItems.reduce((s, i) => s + (i.total_price || 0), 0);
    const body = {
      customer_id: customerID,
      company_name: document.getElementById('q-company').value.trim(),
      date: document.getElementById('q-date').value,
      status: document.getElementById('q-status').value,
      change_log: document.getElementById('q-log').value,
      items: JSON.stringify(currentItems),
      total_amount: total,
    };
    try {
      if (q.id) await api('PUT', '/quotations/' + q.id, body);
      else await api('POST', '/quotations', body);
      closeModal();
    } catch (e) { alert(e.message); }
  };
}

const _contractSort = { col: 'id', dir: 'desc' };
let _contractData = [];
let _contractStatusRow = null;

async function loadContracts(content, actions) {
  const canEdit = state.user.is_admin || hasPermission('contracts');
  actions.innerHTML = (canEdit ? `<button class="btn btn-primary" id="btn-add-contract">＋ <span class="btn-text">新增合同</span></button>` : '')
    + `<button class="btn" id="btn-export-contracts" onclick="exportContracts()">📤 <span class="btn-text">导出Excel</span></button>`;
  if (canEdit) {
    document.getElementById('btn-add-contract')?.addEventListener('click', async () => {
      await preloadData();
      if (!state.data.quotations) state.data.quotations = await api('GET', '/quotations');
      const numRes = await api('GET', '/contracts/generate-number');
      openContractModal(null, numRes?.contract_number || '');
    });
  }

  _contractData = await api('GET', '/contracts');

  _contractStatusRow = c => {
    const flags = [
      { k: 'status_sent', label: '已发客户' },
      { k: 'status_replied', label: '已回复' },
      { k: 'status_paid', label: '已付款' },

      { k: 'status_invoiced', label: '已开票' },
      { k: 'status_completed', label: '已完成' },
    ];
    return flags.map(f => `<span class="status-dot ${c[f.k] ? 'on' : 'off'}" title="${f.label}"></span>`).join('');
  };

  content.innerHTML = `
  <div class="search-bar">
    <input class="search-input" id="contract-search" placeholder="搜索合同号、公司名、附件名…">
    <button class="btn" id="btn-contract-search">搜索</button>
  </div>
  <div class="card">
    <div class="table-wrap">
      <table>
        <thead><tr>
          ${makeSortTh('合同号','contract_number',_contractSort,'contract')}
          ${makeSortTh('客户','company_name',_contractSort,'contract')}
          ${makeSortTh('金额','amount',_contractSort,'contract')}
          ${makeSortTh('已付','paid_amount',_contractSort,'contract','color:var(--green)')}
          <th>进度</th>
          ${makeSortTh('创建时间','created_at',_contractSort,'contract')}

  document.getElementById('btn-contract-search')?.addEventListener('click', async () => {
    const q = document.getElementById('contract-search').value;

}

function contractSetSort(col) {
  if (_contractSort.col === col) _contractSort.dir = _contractSort.dir === 'asc' ? 'desc' : 'asc';
  else { _contractSort.col = col; _contractSort.dir = 'asc'; }
  const canEdit = state.user.is_admin || hasPermission('contracts');
  contractRenderTable(canEdit);
}

function contractRenderTable(canEdit) {
  const getter = (c, col) => {
    if (col === 'amount' || col === 'paid_amount') return c[col] || 0;
    if (col === 'company_name') return c.custom_company_name || c.company_name || '';
    return c[col] || '';
  };
  const sorted = clientSort(_contractData, _contractSort.col, _contractSort.dir, getter);
  document.getElementById('contract-tbody').innerHTML = renderContractRows(sorted, canEdit, _contractStatusRow);
  updateSortArrows('contract', _contractSort, ['contract_number','company_name','amount','paid_amount','created_at']);
  attachContractActions(canEdit, _contractStatusRow);
}

function attachContractActions(canEdit, statusRow) {

  document.querySelectorAll('[data-action=view-contract]').forEach(btn => {

      </div>

      <div style="margin-bottom:16px">

function openContractModal(contract, suggestedNum) {
  const c = contract || {};
  const customers = state.data.customers || [];
  const quotations = state.data.quotations || [];

  // 附件列表（编辑时从合同数据中取，新建时为空）
  let attachments = (c.attachments || []).map(a => ({ ...a, _saved: true }));

  const ATTACH_TYPES = ['合同正本', '补充协议', '报价单', '发票', '收据', '验收单', '其他'];

  const mkCheck = (id, label, val) => `
  <label class="status-check ${val ? 'checked' : ''}" id="lbl-${id}">
    <input type="checkbox" id="${id}" ${val ? 'checked' : ''}>${label}
  </label>`;

  // 客户 Autocomplete：一个输入框，打字过滤列表，选中绑定 customer_id，未选中则为手动输入
  // _custId: 当前选中的已有客户 id（null = 手动输入）
  let _custId = c.customer_id || null;
  const initCustName = _custId
    ? (customers.find(x => x.id == _custId)?.company_name || '')
    : (c.custom_company_name || '');
  const customerSection = `
    <div class="form-group" style="position:relative">
      <label>客户
        <span id="ct-cust-badge" style="margin-left:6px;font-size:11px;color:var(--green);display:${_custId?'inline':'none'}">✓ 已关联客户</span>
      </label>
      <input id="ct-cust-input" type="text" placeholder="输入关键字搜索，或直接输入新客户名" value="${initCustName}" autocomplete="off">
      <div id="ct-cust-dropdown" style="display:none;position:absolute;z-index:999;left:0;right:0;background:var(--bg2);border:1px solid var(--border);border-radius:6px;box-shadow:0 4px 16px rgba(0,0,0,.18);max-height:200px;overflow-y:auto"></div>
    </div>`;

  const renderAttachList = () => {
    if (!attachments.length) return `<div style="color:var(--text3);font-size:13px;padding:8px 0">暂无附件</div>`;
    return attachments.map((a, i) => `
      <div class="attach-item" data-idx="${i}" style="display:flex;align-items:center;gap:8px;padding:7px 8px;background:var(--bg3);border-radius:6px;margin-bottom:6px">
        <span style="font-size:18px">${fileIcon(a.file_name||a.name||'')}</span>
        <div style="flex:1;min-width:0">
          <div style="font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${a.file_name||a.name||''}</div>
          <div style="font-size:11px;color:var(--text3)">${a.attach_type||''}${a.remark ? ' · '+a.remark : ''}${a.file_size ? ' · '+fmtSize(a.file_size) : ''}</div>
        </div>
        ${a._saved ? (() => {
          const ext = (a.file_name||'').split('.').pop().toLowerCase();
          const previewable = ['pdf','png','jpg','jpeg','gif','webp','bmp','svg','txt'].includes(ext);
          const base = `/api/contracts/${c.id||0}/attachments/${a.id}`;
          const tk = state.token ? '?token=' + encodeURIComponent(state.token) : '';
          return (previewable ? `<a class="btn btn-sm" href="${base}/preview${tk}" target="_blank" style="text-decoration:none;margin-right:4px">查看</a>` : '')
               + `<a class="btn btn-sm" href="${base}/download${tk}" target="_blank" style="text-decoration:none">下载</a>`;
        })() : `<span style="font-size:11px;color:var(--accent)">待上传</span>`}
        <button class="btn btn-sm btn-danger" data-action="del-attach" data-idx="${i}" ${a._saved?`data-aid="${a.id}"`:''}>&times;</button>
      </div>`).join('');
  };

  showModal(`
  <div class="modal modal-lg">
    <div class="modal-header">${c.id ? '编辑合同' : '新建合同'}<span class="modal-close" id="modal-close">×</span></div>
    <div class="modal-body" style="max-height:70vh;overflow-y:auto">
      <div class="form-row">
        <div class="form-group">
          <label>合同号</label>
          <div style="display:flex;gap:6px;align-items:center">
            <input id="ct-number" type="text" value="${c.contract_number || suggestedNum || ''}"
              placeholder="自动生成，可修改"
              style="${c.id ? 'color:var(--text3);background:var(--bg3)' : ''}"
              ${c.id ? 'readonly' : ''}>
            ${!c.id ? `<button type="button" id="btn-regen-num" class="btn btn-sm" title="重新生成" style="flex-shrink:0">🔄</button>` : ''}
          </div>
        </div>
      </div>
      <div class="form-row">
        ${customerSection}
        <div class="form-group"><label>关联报价单</label>
          <select id="ct-quotation">
            <option value="">-- 无 --</option>
            ${quotations.map(q => `<option value="${q.id}" ${c.quotation_id==q.id?'selected':''}>${q.quote_number} - ${q.company_name}</option>`).join('')}
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>合同金额 (¥)</label><input id="ct-amount" type="number" step="0.01" value="${c.amount||0}"></div>
        <div class="form-group"><label>已付金额 (¥)</label><input id="ct-paid-amt" type="number" step="0.01" value="${c.paid_amount||0}"></div>
      </div>
      <div class="form-group"><label>合同内容</label><textarea id="ct-content" rows="5">${c.content||''}</textarea></div>
      <div class="form-group">
        <label>合同状态跟踪</label>
        <div class="status-checks">
          ${mkCheck('ct-sent', '✉️ 已发给客户', c.status_sent)}
          ${mkCheck('ct-replied', '↩️ 已收到回复', c.status_replied)}
          ${mkCheck('ct-status-paid', '💵 已收到汇款', c.status_paid)}
          ${mkCheck('ct-shipped', '🚚 已发货', c.status_shipped)}
          ${mkCheck('ct-invoiced', '🧾 已开票', c.status_invoiced)}
          ${mkCheck('ct-completed', '✅ 已完成', c.status_completed)}
        </div>
      </div>
      <div class="form-group">
        <label style="display:flex;align-items:center;justify-content:space-between">
          <span>合同附件</span>
          <button class="btn btn-sm" id="btn-add-attach">＋ 添加附件</button>
        </label>
        <div id="attach-list">${renderAttachList()}</div>
        <div id="attach-form" style="display:none;background:var(--bg3);border-radius:8px;padding:12px;margin-top:8px">
          <div class="form-row" style="margin-bottom:8px">
            <div class="form-group" style="margin-bottom:0">
              <label style="font-size:12px">附件类型</label>
              <select id="at-type">
                ${ATTACH_TYPES.map(t => `<option>${t}</option>`).join('')}
              </select>
            </div>
            <div class="form-group" style="margin-bottom:0">
              <label style="font-size:12px">备注</label>
              <input id="at-remark" type="text" placeholder="可选备注">
            </div>
          </div>
          <div style="display:flex;gap:8px;align-items:center">
            <input id="at-file" type="file" style="flex:1;font-size:13px">
            <button class="btn btn-primary btn-sm" id="btn-confirm-attach">确认添加</button>
            <button class="btn btn-sm" id="btn-cancel-attach">取消</button>
          </div>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn" id="modal-cancel">取消</button>
      <button class="btn btn-primary" id="modal-save">保存</button>
    </div>
  </div>`);

  // 🔄 重新生成合同号
  document.getElementById('btn-regen-num')?.addEventListener('click', async () => {
    const btn = document.getElementById('btn-regen-num');
    btn.disabled = true;
    btn.textContent = '…';
    const res = await api('GET', '/contracts/generate-number');
    if (res?.contract_number) document.getElementById('ct-number').value = res.contract_number;
    btn.disabled = false;
    btn.textContent = '🔄';
  });

  // ── 客户 Autocomplete 逻辑 ──────────────────────────────────
  const custInput    = document.getElementById('ct-cust-input');
  const custDropdown = document.getElementById('ct-cust-dropdown');
  const custBadge    = document.getElementById('ct-cust-badge');

  // 根据当前选中客户过滤报价单下拉
  const updateQuotationSelect = (custId) => {
    const sel = document.getElementById('ct-quotation');
    if (!sel) return;
    const prev = sel.value;
    sel.innerHTML = '<option value="">-- 无 --</option>' +
      quotations
        .filter(q => !custId || q.customer_id == custId)
        .map(q => `<option value="${q.id}" ${q.id == prev ? 'selected' : ''}>${q.quote_number} - ${q.company_name||''}</option>`)
        .join('');
    // 若之前选中的报价单不属于该客户则清空
    if (prev && !quotations.find(q => q.id == prev && (!custId || q.customer_id == custId))) {
      sel.value = '';
    }
  };

  const renderCustDropdown = (kw) => {
    const lkw = kw.toLowerCase();
    const matched = kw
      ? customers.filter(x => x.company_name.toLowerCase().includes(lkw))
      : customers;
    if (!matched.length) {
      custDropdown.style.display = 'none';
      return;
    }
    custDropdown.innerHTML = matched.map(x => `
      <div class="ct-cust-opt" data-id="${x.id}" data-name="${x.company_name.replace(/"/g,'&quot;')}"
        style="padding:9px 12px;cursor:pointer;font-size:13px;border-bottom:1px solid var(--border)">
        ${x.company_name}
      </div>`).join('');
    custDropdown.style.display = '';
    // 绑定点击选中
    custDropdown.querySelectorAll('.ct-cust-opt').forEach(opt => {
      opt.addEventListener('mousedown', e => {
        e.preventDefault(); // 防止 input blur 先触发关闭
        _custId = parseInt(opt.dataset.id);
        custInput.value = opt.dataset.name;
        custBadge.style.display = 'inline';
        custDropdown.style.display = 'none';
        updateQuotationSelect(_custId);
      });
      opt.addEventListener('mouseover', () => { if (!opt.classList.contains('kbfocus')) opt.style.background = 'rgba(88,166,255,0.12)'; });
      opt.addEventListener('mouseout',  () => { if (!opt.classList.contains('kbfocus')) opt.style.background = ''; });
    });
  };

  custInput.addEventListener('input', () => {
    _custId = null;
    custBadge.style.display = 'none';
    renderCustDropdown(custInput.value.trim());
    updateQuotationSelect(null); // 无关联客户时显示全部报价单
  });
  custInput.addEventListener('focus', () => renderCustDropdown(custInput.value.trim()));
  custInput.addEventListener('blur',  () => setTimeout(() => { custDropdown.style.display = 'none'; }, 150));

  // 键盘上下键导航 + Enter 选中
  custInput.addEventListener('keydown', e => {
    if (!['ArrowDown','ArrowUp','Enter','Escape'].includes(e.key)) return;
    const opts = custDropdown.querySelectorAll('.ct-cust-opt');
    if (!opts.length && e.key !== 'Escape') return;
    const active = custDropdown.querySelector('.ct-cust-opt.kbfocus');
    let idx = Array.from(opts).indexOf(active);
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      if (custDropdown.style.display === 'none') { renderCustDropdown(custInput.value.trim()); return; }
      idx = (idx + 1) % opts.length;
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      idx = (idx - 1 + opts.length) % opts.length;
    } else if (e.key === 'Enter') {
      e.preventDefault();
      if (active) {
        _custId = parseInt(active.dataset.id);
        custInput.value = active.dataset.name;
        custBadge.style.display = 'inline';
        custDropdown.style.display = 'none';
        updateQuotationSelect(_custId);
      }
      return;
    } else if (e.key === 'Escape') {
      custDropdown.style.display = 'none';
      return;
    }
    opts.forEach(o => { o.classList.remove('kbfocus'); o.style.background = ''; o.style.color = ''; });
    opts[idx].classList.add('kbfocus');
    opts[idx].style.background = 'rgba(88,166,255,0.22)';
    opts[idx].style.color = 'var(--accent)';
    opts[idx].scrollIntoView({ block: 'nearest' });
  });

  // 状态checkbox toggle
  document.querySelectorAll('.status-check').forEach(lbl => {
    lbl.addEventListener('click', () => {
      const cb = lbl.querySelector('input');
      setTimeout(() => lbl.classList.toggle('checked', cb.checked), 0);
    });
  });

  // 报价单自动填充
  document.getElementById('ct-quotation')?.addEventListener('change', async e => {
    const qid = e.target.value;
    if (qid) {
      const q = await api('GET', '/quotations/' + qid);
      document.getElementById('ct-amount').value = q.total_amount || 0;
      if (q.customer_id) {
        // 报价单关联客户 → 自动填入 autocomplete
        const cust = customers.find(x => x.id == q.customer_id);
        if (cust) {
          _custId = cust.id;
          document.getElementById('ct-cust-input').value = cust.company_name;
          document.getElementById('ct-cust-badge').style.display = 'inline';
          document.getElementById('ct-cust-dropdown').style.display = 'none';
          updateQuotationSelect(_custId);
        }
      }
    }
  });

  // 附件：展开表单
  document.getElementById('btn-add-attach').onclick = () => {
    document.getElementById('attach-form').style.display = '';
    document.getElementById('btn-add-attach').style.display = 'none';
  };
  document.getElementById('btn-cancel-attach').onclick = () => {
    document.getElementById('attach-form').style.display = 'none';
    document.getElementById('btn-add-attach').style.display = '';
    document.getElementById('at-file').value = '';
  };
  document.getElementById('btn-confirm-attach').onclick = () => {
    const fileInput = document.getElementById('at-file');
    if (!fileInput.files.length) { alert('请选择文件'); return; }
    const file = fileInput.files[0];
    attachments.push({
      _saved: false,
      _file: file,
      file_name: file.name,
      file_size: file.size,
      attach_type: document.getElementById('at-type').value,
      remark: document.getElementById('at-remark').value,
    });
    document.getElementById('attach-list').innerHTML = renderAttachList();
    document.getElementById('attach-form').style.display = 'none';
    document.getElementById('btn-add-attach').style.display = '';
    document.getElementById('at-file').value = '';
    bindAttachDelete();
  };

  const bindAttachDelete = () => {
    document.querySelectorAll('[data-action=del-attach]').forEach(btn => {
      btn.onclick = async () => {
        const idx = parseInt(btn.dataset.idx);
        const a = attachments[idx];
        if (a._saved && a.id && c.id) {
          if (!confirm('确定删除该附件？')) return;
          await api('DELETE', `/contracts/${c.id}/attachments/${a.id}`);
        }
        attachments.splice(idx, 1);
        document.getElementById('attach-list').innerHTML = renderAttachList();
        bindAttachDelete();
      };
    });
  };
  bindAttachDelete();

  document.getElementById('modal-close').onclick = closeModal;
  document.getElementById('modal-cancel').onclick = closeModal;
  document.getElementById('modal-save').onclick = async () => {
    const custInputVal = document.getElementById('ct-cust-input').value.trim();
    const ctNum = document.getElementById('ct-number').value.trim();
    if (!c.id && !ctNum) { alert('合同号不能为空'); return; }
    const body = {
      contract_number: ctNum,
      customer_id: _custId || null,
      custom_company_name: _custId ? '' : custInputVal,
      quotation_id: parseInt(document.getElementById('ct-quotation').value) || null,
      content: document.getElementById('ct-content').value,
      amount: parseFloat(document.getElementById('ct-amount').value) || 0,
      paid_amount: parseFloat(document.getElementById('ct-paid-amt').value) || 0,
      status_sent: document.getElementById('ct-sent').checked,
      status_replied: document.getElementById('ct-replied').checked,
      status_paid: document.getElementById('ct-status-paid').checked,
      status_shipped: document.getElementById('ct-shipped').checked,
      status_invoiced: document.getElementById('ct-invoiced').checked,
      status_completed: document.getElementById('ct-completed').checked,
    };
    try {
      let contractId = c.id;
      if (c.id) {
        await api('PUT', '/contracts/' + c.id, body);
      } else {
        const res = await api('POST', '/contracts', body);
        contractId = res.id;
      }
      // 上传待上传的附件
      for (const a of attachments) {
        if (!a._saved && a._file) {
          const fd = new FormData();
          fd.append('file', a._file);
          fd.append('attach_type', a.attach_type || '');
          fd.append('remark', a.remark || '');
          await fetch('/api/contracts/' + contractId + '/attachments', {
            method: 'POST',
            headers: { Authorization: 'Bearer ' + state.token },
            body: fd,
          });
        }
      }
      closeModal();
    } catch (e) { alert(e.message); }
  };
}

function fileIcon(name) {
  const ext = (name.split('.').pop() || '').toLowerCase();
  const map = { pdf: '📄', doc: '📝', docx: '📝', xls: '📊', xlsx: '📊', png: '🖼️', jpg: '🖼️', jpeg: '🖼️', zip: '🗜️', rar: '🗜️' };
  return map[ext] || '📎';
}
function fmtSize(bytes) {
  if (bytes < 1024) return bytes + 'B';
  if (bytes < 1024*1024) return (bytes/1024).toFixed(1) + 'KB';
  return (bytes/1024/1024).toFixed(1) + 'MB';
}

        <tbody>
          ${records.map(r => `
          <tr>
            <td class="mono" style="color:var(--accent)">${r.contract_number}</td>
            <td>${r.company_name||'-'}</td>
            <td class="mono">${fmt(r.amount)}</td>
            <td class="mono" style="color:var(--green)">${fmt(r.paid_amount)}</td>

}

// USERS
// ============================================================
async function loadUsers(content, actions) {
  const canEdit = state.user.is_admin || hasPermission('users');
  actions.innerHTML = canEdit
    ? `<button class="btn btn-primary" id="btn-add-emp">＋ <span class="btn-text">新增员工</span></button>` : '';
  if (canEdit) document.getElementById('btn-add-emp')?.addEventListener('click', () => openEmployeeModal(null));

  const users = await api('GET', '/users');

  const permLabels = {
    products: '产品管理', inventory: '库存管理', customers: '客户管理',
    quotations: '报价系统', contracts: '合同管理', finance: '财务管理',
    bank: '银行流水', chat: '即时通讯', users: '员工管理',
    reports: '报表中心', sharefiles: '企业网盘', datacenter: '数据中心',
  };

  const renderPerms = (perms) => {
    let p = {};
    try { p = JSON.parse(perms || '{}'); } catch(e) {}
    return Object.keys(permLabels).filter(k => p[k]).map(k =>
      `<span class="badge badge-blue" style="margin:1px">${permLabels[k]}</span>`
    ).join('') || '<span style="color:var(--text3);font-size:12px">无权限</span>';
  };

  const deptBadge = dept => dept
    ? `<span class="badge badge-gray">${dept}</span>` : '<span style="color:var(--text3)">-</span>';

  content.innerHTML = `
  <div class="card">
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>姓名</th><th>用户名</th><th>部门</th><th>职位</th><th>等级</th>
            <th>邮箱</th><th>角色</th><th>权限</th>
            ${canEdit ? '<th>操作</th>' : ''}
          </tr>
        </thead>
        <tbody>
          ${users.map(u => `
          <tr>
            <td style="font-weight:600">${u.full_name||'-'}</td>
            <td class="mono" style="color:var(--text3)">${u.username}</td>
            <td>${deptBadge(u.department)}</td>
            <td style="color:var(--text2)">${u.position||'-'}</td>
            <td>${u.level ? `<span class="badge badge-yellow">${u.level}</span>` : '<span style="color:var(--text3)">-</span>'}</td>
            <td style="color:var(--text2);font-size:12px">${u.email||'-'}</td>
            <td>${u.is_admin ? '<span class="badge badge-purple">管理员</span>' : '<span class="badge badge-gray">员工</span>'}</td>
            <td style="max-width:200px">${u.is_admin ? '<span class="badge badge-blue">全部权限</span>' : renderPerms(u.permissions)}</td>
            ${canEdit ? `<td>
              <button class="btn btn-sm" data-action="edit-emp" data-id="${u.id}">编辑</button>
              ${u.id != state.user.user_id ? `<button class="btn btn-sm btn-danger" data-action="del-emp" data-id="${u.id}" style="margin-left:4px">删除</button>` : ''}
            </td>` : ''}
          </tr>`).join('')}
        </tbody>
      </table>
    </div>
  </div>`;

  if (!canEdit) return;

  document.querySelectorAll('[data-action=edit-emp]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const all = await api('GET', '/users');
      const u = all.find(x => x.id == btn.dataset.id);
      if (u) openEmployeeModal(u);
    });
  });
  document.querySelectorAll('[data-action=del-emp]').forEach(btn => {
    btn.addEventListener('click', async () => {
      if (!confirm('确定删除该员工账户？')) return;
      await api('DELETE', '/users/' + btn.dataset.id);
      loadPage();
    });
  });
}

// ── Combobox helper: select with custom input fallback ─────────
function combobox(id, options, value, placeholder) {
  const safeVal = (value || '').replace(/"/g, '&quot;');
  const isCustom = value && !options.includes(value);
  return `
  <div class="combobox-wrap" id="${id}-wrap">
    <select id="${id}-sel" style="display:${isCustom ? 'none' : 'block'}">
      <option value="">-- ${placeholder} --</option>
      ${options.map(o => `<option value="${o}" ${o===value?'selected':''}>${o}</option>`).join('')}
      <option value="__custom__">✏️ 自行输入…</option>
    </select>
    <div style="display:${isCustom ? 'flex' : 'none'};gap:4px" id="${id}-custom-row">
      <input id="${id}-input" value="${safeVal}" placeholder="${placeholder}" style="flex:1">
      <button type="button" class="btn btn-sm" id="${id}-back" title="返回列表">↩</button>
    </div>
  </div>`;
}

function comboboxVal(id) {
  const sel = document.getElementById(id + '-sel');
  const inp = document.getElementById(id + '-input');
  if (sel && sel.style.display !== 'none') return sel.value === '__custom__' ? '' : sel.value;
  return inp ? inp.value.trim() : '';
}

function attachCombobox(id) {
  const sel   = document.getElementById(id + '-sel');
  const row   = document.getElementById(id + '-custom-row');
  const inp   = document.getElementById(id + '-input');
  const back  = document.getElementById(id + '-back');
  if (!sel) return;
  sel.addEventListener('change', () => {
    if (sel.value === '__custom__') {
      sel.style.display = 'none';
      row.style.display = 'flex';
      inp.focus();
    }
  });
  back?.addEventListener('click', () => {
    inp.value = '';
    row.style.display = 'none';
    sel.style.display = 'block';
    sel.value = '';
  });
}

      <div style="font-size:12px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:1px;margin:14px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--border)">职位信息</div>
      <div class="form-row">

let _bankYears = [];           // 当前选中的年份数组（多年支持）
let _bankPage = 1;
let _bankChartTab = 'monthly';
let _bankYearList = [];
let _bankBalanceVisible = false; // 余额默认隐藏，点击眼睛后显示
let _bankMonthlyChartStyle = 'bar'; // 'bar' | 'line'，月度收支图表样式，点击标题切换
let _bankSortBy    = 'transaction_time'; // 当前排序列
let _bankSortOrder = 'desc';             // 'asc' | 'desc'

// 返回当前年份参数字符串（逗号分隔），用于 API 请求；空数组表示全部
function _bankYearsParam() { return _bankYears.join(','); }
// 返回年份显示标签，如 "2024年" 或 "2023、2024年" 或 "全部"
function _bankYearsLabel() {
  if (!_bankYears.length) return '全部';
  return _bankYears.join('、') + '年';
}

async function loadBank(content, actions) {
  const canEdit = state.user.is_admin || hasPermission('bank');

  // 快速导入（服务端解析）file input
  let _fi2 = document.getElementById('_bank_file_fast');
  if (!_fi2) {
    _fi2 = document.createElement('input');
    _fi2.type = 'file';
    _fi2.id   = '_bank_file_fast';
    _fi2.accept = '.xlsx';
    _fi2.style.display = 'none';
    document.body.appendChild(_fi2);
    _fi2.addEventListener('change', async e => {
      const file = e.target.files[0];
      if (!file) return;
      e.target.value = '';
      await bankImportFileFast(file);
    });
  } else {
    _fi2.value = '';
  }

  actions.innerHTML = (canEdit
    ? `<button class="btn" id="btn-bank-new">＋ <span class="btn-text">新建流水</span></button>
       <button class="btn" id="btn-bank-fmt-settings" title="导入格式设置">⚙ <span class="btn-text">格式设置</span></button>
       <button class="btn btn-primary" id="btn-bank-upload-fast"
         onclick="document.getElementById('_bank_file_fast').click()">📥 <span class="btn-text">导入Excel</span></button>`
    : '')
    + `<button class="btn" id="btn-bank-export-top" onclick="bankExportExcel()">📤 <span class="btn-text">导出Excel</span></button>`;

  document.getElementById('btn-bank-fmt-settings')?.addEventListener('click', bankOpenFmtSettings);

  const yearsRes = await api('GET', '/bank/years');
  _bankYearList = yearsRes.years || [];
  if (!_bankYears.length && _bankYearList.length) _bankYears = [_bankYearList[0]];
  if (!_bankYears.length) _bankYears = [new Date().getFullYear().toString()];
  _bankPage = 1;
  _bankChartTab = 'monthly';

  // 单年直接选中，多年时选中 __more__，全部时选中 __all__
  const selVal = _bankYears.length === 0 ? '__all__'
               : _bankYears.length === 1 ? _bankYears[0] : '__more__';

  content.innerHTML = `
  <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap">
    <div style="display:flex;align-items:center;gap:6px">
      <span style="font-size:13px;color:var(--text3)">年份</span>
      <select id="bank-year-sel" style="min-width:100px;max-width:180px">
        ${_bankYearList.map(y=>`<option value="${y}"${y===selVal?' selected':''}>${y}年</option>`).join('')}
        ${!_bankYearList.length?`<option value="${new Date().getFullYear()}">${new Date().getFullYear()}年</option>`:''}
        <option value="__more__"${selVal==='__more__'?' selected':''}>📅 更多…</option>
        <option value="__all__"${selVal==='__all__'?' selected':''}>🔍 显示全部</option>
      </select>
      ${_bankYears.length > 1 ? `<span id="bank-years-tag" style="font-size:12px;color:var(--accent);background:rgba(88,166,255,0.12);padding:2px 8px;border-radius:10px;white-space:nowrap">${_bankYearsLabel()}</span>` : ''}
    </div>
    <div id="bank-stats-row" style="display:flex;gap:10px;flex-wrap:wrap"></div>
  </div>

  <div class="card" id="bank-chart-card" style="margin-bottom:16px;position:relative">
    <div class="chart-toolbar">
      <div>
        <div class="chart-toolbar-title" id="bank-chart-title">月度收支</div>
        <div id="bank-chart-legend" style="display:flex;flex-wrap:wrap;gap:10px;margin-top:6px;font-size:12px"></div>
      </div>
      <div class="chart-tabs" id="bank-chart-tabs">
        <button class="chart-tab active" data-btab="monthly" id="bank-tab-monthly">月度收支 <span id="bank-monthly-icon">📊</span></button>
        <button class="chart-tab" data-btab="income">收入来源</button>
        <button class="chart-tab" data-btab="expense">支出去向</button>
      </div>
    </div>
    <div id="bank-chart-wrap" style="height:300px;overflow:hidden"></div>
    <div class="chart-tooltip" id="bank-tooltip"></div>
  </div>

  <div class="search-bar">
    <input class="search-input" id="bank-q" placeholder="搜索对方户名、摘要、备注…">
    <button class="btn" id="btn-bank-search">搜索</button>
  </div>
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
      <div class="card-title" style="margin:0">流水明细</div>
      <div id="bank-page-info" style="font-size:12px;color:var(--text3)"></div>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th onclick="bankSetSort('transaction_time')" style="cursor:pointer;user-select:none;white-space:nowrap">交易时间 <span id="bsort-transaction_time"></span></th>
          <th onclick="bankSetSort('debit_amount')" style="cursor:pointer;user-select:none;color:var(--yellow)">借方（支出）<span id="bsort-debit_amount"></span></th>
          <th onclick="bankSetSort('credit_amount')" style="cursor:pointer;user-select:none;color:var(--green)">贷方（收入）<span id="bsort-credit_amount"></span></th>
          <th id="bank-balance-th" style="cursor:pointer;user-select:none;white-space:nowrap" title="点击显示/隐藏余额">余额 <span id="bank-eye" style="font-size:11px;opacity:0.6">👁</span></th>
          <th onclick="bankSetSort('counterpart_name')" style="cursor:pointer;user-select:none">对方户名 <span id="bsort-counterpart_name"></span></th>
          <th onclick="bankSetSort('summary')" style="cursor:pointer;user-select:none">摘要 <span id="bsort-summary"></span></th>
          <th onclick="bankSetSort('remark')" style="cursor:pointer;user-select:none">备注 <span id="bsort-remark"></span></th>
          ${canEdit?'<th>操作</th>':''}
        </tr></thead>
        <tbody id="bank-tbody"></tbody>
      </table>
    </div>
    <div id="bank-page-btns" style="display:flex;gap:6px;justify-content:center;padding:12px 0"></div>
  </div>`;

  const yearSel = document.getElementById('bank-year-sel');
  yearSel?.addEventListener('change', e=>{
    const val = e.target.value;
    if (val === '__more__') {
      e.target.value = _bankYears.length === 0 ? '__all__'
                     : _bankYears.length === 1 ? _bankYears[0] : '__more__';
      bankOpenYearModal();
    } else if (val === '__all__') {
      _bankYears = [];
      _bankPage = 1;
      const tag = document.getElementById('bank-years-tag');
      if (tag) tag.remove();
      bankRefreshAll();
    } else {
      _bankYears = [val];
      _bankPage = 1;
      const tag = document.getElementById('bank-years-tag');
      if (tag) tag.remove();
      bankRefreshAll();
    }
  });
  // 当已选多年（select 值固定为 __more__）时，change 不会触发，
  // 用 mousedown 检测用户点击了 __more__ 选项，直接弹 modal
  yearSel?.addEventListener('mousedown', e=>{
    if (yearSel.value === '__more__') {
      e.preventDefault();
      yearSel.blur();
      bankOpenYearModal();
    }
  });
  document.querySelectorAll('#bank-chart-tabs .chart-tab').forEach(tab=>{
    tab.addEventListener('click', ()=>{
      const newTab = tab.dataset.btab;
      if (newTab === 'monthly' && _bankChartTab === 'monthly') {
        // 已经在月度收支 tab，切换图表样式
        _bankMonthlyChartStyle = _bankMonthlyChartStyle === 'bar' ? 'line' : 'bar';
        const icon = document.getElementById('bank-monthly-icon');
        if (icon) icon.textContent = _bankMonthlyChartStyle === 'bar' ? '📊' : '📈';
      } else {
        _bankChartTab = newTab;
        document.querySelectorAll('#bank-chart-tabs .chart-tab').forEach(t=>t.classList.remove('active'));
        tab.classList.add('active');
      }
      renderBankChart();
    });
  });
  document.getElementById('bank-q')?.addEventListener('keydown', e=>{
    if (e.key==='Enter') { _bankPage=1; bankLoadTable(); }
  });
  document.getElementById('btn-bank-search')?.addEventListener('click', ()=>{
    _bankPage=1; bankLoadTable();
  });
  document.getElementById('btn-bank-new')?.addEventListener('click', ()=> bankOpenCreateModal());

  bankRefreshAll();
}

async function bankRefreshAll() {
  await Promise.all([bankLoadStats(), bankLoadTable(), renderBankChart()]);
}

async function bankLoadStats() {
  const s = await api('GET', `/bank/stats?years=${encodeURIComponent(_bankYearsParam())}`);
  const fmt = n => {
    const abs = Math.abs(n);
    const r = abs>=1e8 ? '¥'+(abs/1e8).toFixed(2)+'亿'
             : abs>=1e4 ? '¥'+(abs/1e4).toFixed(1)+'w'
             : '¥'+abs.toLocaleString('zh-CN',{minimumFractionDigits:2});
    return (n<0?'-':'')+r;
  };
  const el = document.getElementById('bank-stats-row');
  if (!el) return;
  el.innerHTML = `
    <div class="stat-card green"  style="flex:0 0 auto;min-width:120px"><div class="stat-value" style="font-size:17px">${fmt(s.total_income)}</div><div class="stat-label">总收入</div></div>
    <div class="stat-card"        style="flex:0 0 auto;min-width:120px;border-left:3px solid var(--yellow)"><div class="stat-value" style="font-size:17px;color:var(--yellow)">${fmt(s.total_expense)}</div><div class="stat-label">总支出</div></div>
    <div class="stat-card ${s.net>=0?'blue':''}" style="flex:0 0 auto;min-width:120px${s.net<0?';border-left:3px solid var(--yellow)':''}"><div class="stat-value" style="font-size:17px;color:${s.net>=0?'var(--accent)':'var(--yellow)'}">${fmt(s.net)}</div><div class="stat-label">净收支</div></div>
    <div class="stat-card"        style="flex:0 0 auto;min-width:80px"><div class="stat-value" style="font-size:17px">${s.total_rows}</div><div class="stat-label">条记录</div></div>`;
}

// 点击表头排序（onclick 直接调用，不重复绑定）
function bankSetSort(col) {
  if (_bankSortBy === col) {
    _bankSortOrder = _bankSortOrder === 'desc' ? 'asc' : 'desc';
  } else {
    _bankSortBy = col;
    _bankSortOrder = 'desc';
  }
  _bankPage = 1;
  bankLoadTable();
}

// 刷新排序箭头显示（用固定 id，避免重复绑定）
function bankUpdateSortArrows() {
  const cols = ['transaction_time','debit_amount','credit_amount','counterpart_name','summary','remark'];
  cols.forEach(col => {
    const span = document.getElementById('bsort-' + col);
    if (!span) return;
    if (col === _bankSortBy) {
      span.textContent = _bankSortOrder === 'asc' ? ' ↑' : ' ↓';
      span.style.cssText = 'color:var(--accent);font-weight:bold;font-size:12px';
    } else {
      span.textContent = ' ⇅';
      span.style.cssText = 'color:var(--text3);font-weight:normal;font-size:11px';
    }
  });
}

async function bankLoadTable() {
  const q = document.getElementById('bank-q')?.value || '';
  const res = await api('GET', `/bank?years=${encodeURIComponent(_bankYearsParam())}&q=${encodeURIComponent(q)}&page=${_bankPage}&sort_by=${_bankSortBy}&order=${_bankSortOrder}`);
  const canEdit = state.user.is_admin || hasPermission('finance');
  const total = res.total||0, pageSize = res.page_size||50;
  const totalPages = Math.ceil(total/pageSize)||1;
  const tbody = document.getElementById('bank-tbody');
  const info  = document.getElementById('bank-page-info');
  const btns  = document.getElementById('bank-page-btns');
  if (!tbody) return;

  const fmtAmt = n => n>0.001 ? '¥'+n.toLocaleString('zh-CN',{minimumFractionDigits:2}) : '';

  if (!res.data.length) {
    tbody.innerHTML = `<tr><td colspan="${canEdit?8:7}"><div class="empty-state"><div class="icon">🏦</div>暂无流水记录，请先导入Excel</div></td></tr>`;
    if (info) info.textContent='';
    if (btns) btns.innerHTML='';
    return;
  }

  tbody.innerHTML = res.data.map(r=>`
  <tr>
    <td class="mono" style="font-size:12px;white-space:nowrap">${(r.transaction_time||'').replace(' ','<br>')}</td>
    <td class="mono" style="color:var(--yellow);font-weight:600">${fmtAmt(r.debit_amount)}</td>
    <td class="mono" style="color:var(--green);font-weight:600">${fmtAmt(r.credit_amount)}</td>
    <td class="mono" style="font-size:12px" data-balance="${r.balance}">${_bankBalanceVisible ? (fmtAmt(r.balance)||'-') : '****'}</td>
    <td style="max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px" title="${r.counterpart_name||''}">${r.counterpart_name||'-'}</td>
    <td style="color:var(--text2);font-size:12px;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${r.summary||''}">${r.summary||'-'}</td>
    <td style="color:var(--text3);font-size:12px;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${r.remark||''}">${r.remark||'-'}</td>
    ${canEdit?`<td><button class="btn btn-sm btn-danger" data-delbank="${r.id}">删除</button></td>`:''}
  </tr>`).join('') + (() => {
    const sd = res.sum_debit || 0, sc = res.sum_credit || 0;
    const fmtSum = n => n > 0.001 ? '¥' + n.toLocaleString('zh-CN', {minimumFractionDigits:2}) : '¥0.00';
    return `<tr style="background:var(--bg3);border-top:2px solid var(--border);font-weight:700">
      <td style="font-size:13px;color:var(--text2);white-space:nowrap">📊 汇总（共${total}条）</td>
      <td class="mono" style="color:var(--yellow);font-size:14px">${fmtSum(sd)}</td>
      <td class="mono" style="color:var(--green);font-size:14px">${fmtSum(sc)}</td>
      <td class="mono" style="font-size:13px;color:${sc-sd>=0?'var(--green)':'var(--red)'}">${sc-sd>=0?'+':''}${fmtSum(Math.abs(sc-sd))}</td>
      <td colspan="${canEdit?3:2}" style="font-size:12px;color:var(--text3)">净收支（贷方 − 借方）</td>
      <td><button class="btn btn-sm" id="btn-bank-export-inline">📤 导出</button></td>
    </tr>`;
  })();

  if (info) info.textContent=`共 ${total} 条  第${_bankPage}/${totalPages}页`;

  if (btns) {
    let h='';
    if (_bankPage>1) h+=`<button class="btn btn-sm" data-bp="${_bankPage-1}">‹ 上一页</button>`;
    for (let p=Math.max(1,_bankPage-2); p<=Math.min(totalPages,_bankPage+2); p++)
      h+=`<button class="btn btn-sm${p===_bankPage?' btn-primary':''}" data-bp="${p}">${p}</button>`;
    if (_bankPage<totalPages) h+=`<button class="btn btn-sm" data-bp="${_bankPage+1}">下一页 ›</button>`;
    btns.innerHTML=h;
    btns.querySelectorAll('[data-bp]').forEach(b=>{
      b.addEventListener('click', ()=>{ _bankPage=parseInt(b.dataset.bp); bankLoadTable(); });
    });
  }
  // 更新排序箭头（每次渲染后刷新，不重复绑定事件）
  bankUpdateSortArrows();

  if (canEdit) {
    document.querySelectorAll('[data-delbank]').forEach(b=>{
      b.addEventListener('click', async ()=>{
        if (!confirm('确定删除该条记录？')) return;
        await api('DELETE', '/bank/'+b.dataset.delbank);
        bankRefreshAll();
      });
    });
  }

  document.getElementById('btn-bank-export-inline')?.addEventListener('click', ()=> bankExportExcel());

  // 余额眼睛切换：点击表头 切换显示/隐藏，直接操作 DOM 无需重新请求接口
  const balanceTh = document.getElementById('bank-balance-th');
  if (balanceTh) {
    balanceTh.onclick = () => {
      _bankBalanceVisible = !_bankBalanceVisible;
      const eye = document.getElementById('bank-eye');
      if (eye) eye.textContent = _bankBalanceVisible ? '🙈' : '👁';
      document.querySelectorAll('[data-balance]').forEach(td => {
        const val = parseFloat(td.dataset.balance) || 0;
        td.textContent = _bankBalanceVisible
          ? (val > 0.001 ? '¥' + val.toLocaleString('zh-CN', {minimumFractionDigits:2}) : '-')
          : '****';
      });
    };
  }
}

function renderBankBarChart(wrap, data, tip, card) {
  if (!data.length || data.every(d=>!d.income&&!d.expense)) {
    wrap.innerHTML='<div style="color:var(--text3);text-align:center;padding:120px 0;font-size:13px">暂无数据</div>';
    return;
  }
  const W=wrap.clientWidth||720, H=280;
  const PAD={top:24,right:20,bottom:32,left:72};
  const cW=W-PAD.left-PAD.right, cH=H-PAD.top-PAD.bottom;
  const N=data.length, gW=cW/N;
  const barW=Math.max(6,Math.floor(gW*0.28));
  const maxVal=Math.max(...data.flatMap(d=>[d.income||0,d.expense||0]),1);
  const mag=Math.pow(10,Math.floor(Math.log10(maxVal)));
  const niceMax=Math.ceil(maxVal/mag)*mag;
  const yS=v=>PAD.top+cH-(v/niceMax)*cH;
  const fmtY=n=>n>=1e4?'¥'+(n/1e4).toFixed(0)+'w':'¥'+n.toFixed(0);
  const fmtFull=n=>'¥'+n.toLocaleString('zh-CN',{minimumFractionDigits:2});

  let svg='';
  for (let i=0;i<=5;i++){
    const v=(niceMax/5)*i, y=yS(v).toFixed(1);
    svg+=`<line x1="${PAD.left}" y1="${y}" x2="${PAD.left+cW}" y2="${y}" stroke="var(--border)" stroke-width="1" opacity="0.5"/>
    <text x="${PAD.left-6}" y="${y}" text-anchor="end" dominant-baseline="middle" fill="var(--text3)" font-size="11">${fmtY(v)}</text>`;
  }

  data.forEach((d,i)=>{
    const cx=PAD.left+(i+0.5)*gW;
    const inc=d.income||0, exp=d.expense||0;
    const ibx=cx-barW-2, ibh=Math.max(1,(inc/niceMax)*cH), iby=yS(inc);
    const ebx=cx+2,      ebh=Math.max(1,(exp/niceMax)*cH), eby=yS(exp);
    svg+=`<rect x="${ibx.toFixed(1)}" y="${iby.toFixed(1)}" width="${barW}" height="${ibh.toFixed(1)}" fill="#3fb950" opacity="0.85" rx="2" class="bbar" data-bi="${i}"/>
    <rect x="${ebx.toFixed(1)}" y="${eby.toFixed(1)}" width="${barW}" height="${ebh.toFixed(1)}" fill="#d29922" opacity="0.85" rx="2" class="bbar" data-bi="${i}"/>`;
    const mLabel=(d.month||'').slice(5)+'月';
    svg+=`<text x="${cx.toFixed(1)}" y="${(PAD.top+cH+18).toFixed(1)}" text-anchor="middle" fill="var(--text3)" font-size="11">${mLabel}</text>`;
  });

  wrap.innerHTML=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:100%">${svg}</svg>`;
  wrap.querySelectorAll('.bbar').forEach(bar=>{
    bar.addEventListener('mouseenter', ()=>{
      const d=data[parseInt(bar.dataset.bi)];
      if (!tip||!card) return;
      tip.innerHTML=`<div class="tooltip-month">${d.month||''}</div>
        <div class="tooltip-row"><span style="color:#3fb950">收入</span><span>${fmtFull(d.income||0)}</span></div>
        <div class="tooltip-row"><span style="color:#d29922">支出</span><span>${fmtFull(d.expense||0)}</span></div>`;
      const cr=card.getBoundingClientRect(), br=bar.getBoundingClientRect();
      let left=br.left-cr.left+barW+6, top=br.top-cr.top-20;
      if (left+180>card.clientWidth) left=br.left-cr.left-190;
      tip.style.left=left+'px'; tip.style.top=top+'px';
      tip.classList.add('visible');
    });
    bar.addEventListener('mouseleave', ()=>tip?.classList.remove('visible'));
  });
}

function renderBankLineChart(wrap, data, tip, card) {
  if (!data.length || data.every(d=>!d.income&&!d.expense)) {
    wrap.innerHTML='<div style="color:var(--text3);text-align:center;padding:120px 0;font-size:13px">暂无数据</div>';
    return;
  }
  const W=wrap.clientWidth||720, H=280;
  const PAD={top:24,right:20,bottom:32,left:72};
  const cW=W-PAD.left-PAD.right, cH=H-PAD.top-PAD.bottom;
  const N=data.length;
  const maxVal=Math.max(...data.flatMap(d=>[d.income||0,d.expense||0]),1);
  const mag=Math.pow(10,Math.floor(Math.log10(maxVal)));
  const niceMax=Math.ceil(maxVal/mag)*mag;
  const xS=i=>PAD.left+(N===1?cW/2:i/(N-1)*cW);
  const yS=v=>PAD.top+cH-(v/niceMax)*cH;
  const fmtY=n=>n>=1e4?'¥'+(n/1e4).toFixed(0)+'w':'¥'+n.toFixed(0);
  const fmtFull=n=>'¥'+n.toLocaleString('zh-CN',{minimumFractionDigits:2});

  // Grid lines + Y labels
  let svg='';
  for(let i=0;i<=5;i++){
    const v=(niceMax/5)*i, y=yS(v).toFixed(1);
    svg+=`<line x1="${PAD.left}" y1="${y}" x2="${PAD.left+cW}" y2="${y}" stroke="var(--border)" stroke-width="1" opacity="0.4"/>
    <text x="${PAD.left-8}" y="${y}" text-anchor="end" dominant-baseline="middle" fill="var(--text3)" font-size="11">${fmtY(v)}</text>`;
  }

  // X labels (按数据点密度决定是否跳显)
  const step=Math.max(1,Math.ceil(N/10));
  data.forEach((d,i)=>{
    if(i%step!==0&&i!==N-1) return;
    const x=xS(i).toFixed(1);
    // 多年时显示完整 YYYY-MM，单年时显示 MM月
    const lbl=(_bankYears.length===1)?(parseInt((d.month||'').slice(5))+'月'):(d.month||'');
    svg+=`<text x="${x}" y="${(PAD.top+cH+20).toFixed(1)}" text-anchor="middle" fill="var(--text3)" font-size="11">${lbl}</text>`;
  });

  // 构建折线路径 + 填充区域
  const buildPath=(key,color)=>{
    if(N===1){
      const cx=xS(0),cy=yS(data[0][key]||0);
      return `<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="4" fill="${color}"/>`;
    }
    const pts=data.map((d,i)=>`${xS(i).toFixed(1)},${yS(d[key]||0).toFixed(1)}`).join(' ');
    const firstX=xS(0).toFixed(1), lastX=xS(N-1).toFixed(1), baseY=(PAD.top+cH).toFixed(1);
    const areaPts=`${firstX},${baseY} ${pts} ${lastX},${baseY}`;
    const dots=data.map((d,i)=>`<circle cx="${xS(i).toFixed(1)}" cy="${yS(d[key]||0).toFixed(1)}" r="3.5" fill="${color}" stroke="var(--bg2)" stroke-width="1.5" class="bline-dot" data-bi="${i}" style="cursor:crosshair"/>`).join('');
    return `<polygon points="${areaPts}" fill="${color}" opacity="0.07"/>
      <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
      ${dots}`;
  };

  svg+=buildPath('income','#3fb950')+buildPath('expense','#d29922');
  wrap.innerHTML=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:100%">${svg}</svg>`;

  // Tooltip on dots
  wrap.querySelectorAll('.bline-dot').forEach(dot=>{
    dot.addEventListener('mouseenter',()=>{
      const d=data[parseInt(dot.dataset.bi)];
      if(!tip||!card) return;
      tip.innerHTML=`<div class="tooltip-month">${d.month||''}</div>
        <div class="tooltip-row"><span style="color:#3fb950">收入</span><span>${fmtFull(d.income||0)}</span></div>
        <div class="tooltip-row"><span style="color:#d29922">支出</span><span>${fmtFull(d.expense||0)}</span></div>`;
      const cr=card.getBoundingClientRect(), dr=dot.getBoundingClientRect();
      let left=dr.left-cr.left+14, top=dr.top-cr.top-14;
      if(left+170>card.clientWidth) left=dr.left-cr.left-185;
      if(top<0) top=4;
      tip.style.left=left+'px'; tip.style.top=top+'px';
      tip.classList.add('visible');
    });
    dot.addEventListener('mouseleave',()=>tip?.classList.remove('visible'));
  });
}

function renderBankHBarChart(wrap, data, color, typeLabel, tip, card) {
  if (!data.length) {
    wrap.innerHTML='<div style="color:var(--text3);text-align:center;padding:120px 0;font-size:13px">暂无数据</div>';
    wrap.style.height='300px'; return;
  }
  const items=data.slice(0,20);
  const W=wrap.clientWidth||720, rowH=32;
  const PAD={top:10,right:110,bottom:10,left:200};
  const H=items.length*rowH+PAD.top+PAD.bottom;
  const cW=W-PAD.left-PAD.right;
  const maxVal=Math.max(...items.map(d=>d.total),1);
  const fmtFull=n=>'¥'+n.toLocaleString('zh-CN',{minimumFractionDigits:2});
  const fmtShort=n=>n>=1e8?'¥'+(n/1e8).toFixed(2)+'亿':n>=1e4?'¥'+(n/1e4).toFixed(1)+'w':'¥'+n.toFixed(0);

  let svg='';
  items.forEach((d,i)=>{
    const y=PAD.top+i*rowH, bw=Math.max(2,(d.total/maxVal)*cW);
    const by=y+6, bh=rowH-10;
    const label=d.name.length>14?d.name.slice(0,13)+'…':d.name;
    svg+=`<text x="${PAD.left-8}" y="${(y+rowH/2).toFixed(1)}" text-anchor="end" dominant-baseline="middle" fill="var(--text2)" font-size="12">${label}</text>
    <rect x="${PAD.left}" y="${by}" width="${bw.toFixed(1)}" height="${bh}" fill="${color}" opacity="0.82" rx="3" class="hbar" data-hi="${i}"/>
    <text x="${(PAD.left+bw+6).toFixed(1)}" y="${(by+bh/2).toFixed(1)}" dominant-baseline="middle" fill="var(--text3)" font-size="11">${fmtShort(d.total)}</text>`;
  });

  wrap.style.height=Math.max(300,H+20)+'px';
  wrap.innerHTML=`<svg viewBox="0 0 ${W} ${H+20}" style="width:100%;overflow:visible">${svg}</svg>`;
  wrap.querySelectorAll('.hbar').forEach(bar=>{
    bar.addEventListener('mouseenter', ()=>{
      const d=items[parseInt(bar.dataset.hi)];
      if (!tip||!card) return;
      tip.innerHTML=`<div class="tooltip-month">${d.name}</div>
        <div class="tooltip-row"><span style="color:${color}">${typeLabel==='income'?'收入':'支出'}</span><span>${fmtFull(d.total)}</span></div>`;
      const cr=card.getBoundingClientRect(), br=bar.getBoundingClientRect();
      let left=br.right-cr.left+8, top=br.top-cr.top-10;
      if (left+190>card.clientWidth) left=br.left-cr.left-200;
      tip.style.left=left+'px'; tip.style.top=top+'px';
      tip.classList.add('visible');
    });
    bar.addEventListener('mouseleave', ()=>tip?.classList.remove('visible'));
  });
}

    <div class="modal-footer">
      <button class="btn" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" id="bk-save">保存</button>

      credit_amount:     parseFloat(document.getElementById('bk-credit').value)||0,

// ── 通用后端 xlsx 下载函数 ────────────────────────────────────────────────────
function backendExport(url, filename) {
  const btn = event?.currentTarget;
  const origText = btn?.textContent;
  if (btn) { btn.disabled = true; btn.textContent = '导出中…'; }
  fetch('/api' + url, { headers: { 'Authorization': 'Bearer ' + state.token } })
    .then(res => {
      if (!res.ok) return res.json().then(d => { throw new Error(d.error || '导出失败'); });
      return res.blob();
    })
    .then(blob => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = filename;
      document.body.appendChild(a); a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(a.href);
    })
    .catch(e => alert('导出失败：' + e.message))
    .finally(() => { if (btn) { btn.disabled = false; btn.textContent = origText; } });
}
