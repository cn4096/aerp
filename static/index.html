function invSetSort(col) {
  if (_invSort.col === col) _invSort.dir = _invSort.dir === 'asc' ? 'desc' : 'asc';
  else { _invSort.col = col; _invSort.dir = 'asc'; }
  const canEdit = state.user.is_admin || hasPermission('inventory');
  invRenderTable(canEdit);
}

function invRenderTable(canEdit) {
  const sb = _invStatusBadge || (s => s);
  const getter = (i, col) => {
    if (col === 'warranty_months') return i.warranty_months || 0;
    return i[col] || '';
  };
  const sorted = clientSort(_invData, _invSort.col, _invSort.dir, getter);
  document.getElementById('inv-tbody').innerHTML = renderInventoryRows(sorted, canEdit, sb);
  updateSortArrows('inv', _invSort, ['product_name','product_model','manufacture_date','ship_date','customer_name','warranty_months','status']);
  attachInventoryActions(canEdit, sb);
}

function renderInventoryRows(items, canEdit, statusBadge) {
  if (!items.length) return `<tr><td colspan="${canEdit ? 10 : 9}"><div class="empty-state"><div class="icon">🏭</div>暂无库存明细</div></td></tr>`;
  return items.map(i => {
    // 有序列号：显示序列号；无序列号：显示数量
    const serialOrQty = i.serial_number
      ? `<span class="mono" style="color:var(--accent)">${i.serial_number}</span>`
      : `<span style="display:inline-flex;align-items:center;gap:4px">
           <span style="color:var(--text3);font-size:11px">数量</span>
           <span class="mono" style="color:var(--green);font-weight:700">${i.quantity ?? 1}</span>
         </span>`;
    return `
  <tr>
    <td style="font-weight:500">${i.product_name || '-'}</td>
    <td class="mono">${i.product_model}</td>
    <td>${serialOrQty}</td>
    <td style="color:var(--text2)">${i.qc_info || '-'}</td>
    <td>${i.manufacture_date || '-'}</td>
    <td>${i.ship_date || '-'}</td>
    <td>${i.customer_name || '-'}</td>
    <td class="mono">${i.warranty_months}</td>
    <td>${statusBadge(i.status)}</td>
    ${canEdit ? `<td>
      <button class="btn btn-sm" data-action="edit-inv" data-id="${i.id}">编辑</button>
      <button class="btn btn-sm btn-danger" data-action="del-inv" data-id="${i.id}" style="margin-left:4px">删除</button>
    </td>` : ''}
  </tr>`;
  }).join('');
}

function attachInventoryActions(canEdit, statusBadge) {
  if (!canEdit) return;
  document.querySelectorAll('[data-action=edit-inv]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const items = await api('GET', '/inventory');
      const item = items.find(x => x.id == btn.dataset.id);
      if (item) openInventoryModal(item);
    });
  });
  document.querySelectorAll('[data-action=del-inv]').forEach(btn => {
    btn.addEventListener('click', async () => {
      if (!confirm('确定删除此条库存记录？')) return;
      await api('DELETE', '/inventory/' + btn.dataset.id);
      loadPage();
    });
  });
}

function openInventoryModal(item) {
  const i = item || {};
  const products  = state.data.products  || [];
  const customers = state.data.customers || [];

  showModal(`
  <div class="modal">
    <div class="modal-header">${i.id ? '编辑库存' : '新增库存'}<span class="modal-close" id="modal-close">×</span></div>
    <div class="modal-body">
      <div class="form-group"><label>选择产品 *</label>
        <select id="i-product">
          <option value="">-- 请选择产品 --</option>
          ${products.map(p => `<option value="${p.id}|${p.model}|${p.warranty_months||12}" ${i.product_id==p.id?'selected':''}>${p.name ? p.name+' · ' : ''}[${p.brand}] ${p.model}</option>`).join('')}
        </select>
      </div>

      <div class="form-row">
        <div class="form-group"><label>序列号 <span style="color:var(--text3);font-size:11px">（有序列号时数量自动为1）</span></label>
          <input id="i-serial" value="${i.serial_number||''}" placeholder="无序列号则留空">
        </div>
        <div class="form-group"><label>数量 <span style="color:var(--text3);font-size:11px">（无序列号时填写）</span></label>
          <input id="i-qty" type="number" min="1" value="${i.quantity ?? 1}" placeholder="1">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group"><label>QC信息</label><input id="i-qc" value="${i.qc_info||''}"></div>
        <div class="form-group"><label>保修期(月)</label><input id="i-warranty" type="number" value="${i.warranty_months||12}"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>生产日期</label><input id="i-mfg" type="date" value="${i.manufacture_date||new Date().toISOString().split('T')[0]}"></div>
        <div class="form-group"><label>出库日期</label><input id="i-ship" type="date" value="${i.ship_date||''}"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>状态</label>
          <select id="i-status">
            <option value="in_stock" ${i.status==='in_stock'||!i.status?'selected':''}>在库</option>
            <option value="shipped"  ${i.status==='shipped' ?'selected':''}>已出库</option>
            <option value="reserved" ${i.status==='reserved'?'selected':''}>预留</option>
          </select>
        </div>
        <div class="form-group"><label>购买客户</label>
          <select id="i-customer">
            <option value="">-- 无 --</option>
            ${customers.map(c => `<option value="${c.id}" ${i.customer_id==c.id?'selected':''}>${c.company_name}</option>`).join('')}
          </select>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn" id="modal-cancel">取消</button>
      <button class="btn btn-primary" id="modal-save">保存</button>
    </div>
  </div>`);

  // 选择产品时自动填入保修期
  document.getElementById('i-product')?.addEventListener('change', e => {
    const val = e.target.value;
    if (val) {
      const parts = val.split('|');
      document.getElementById('i-warranty').value = parts[2] || '12';
    }
  });

  document.getElementById('modal-close').onclick  = closeModal;
  document.getElementById('modal-cancel').onclick = closeModal;
  document.getElementById('modal-save').onclick   = async () => {
    const productVal = document.getElementById('i-product').value;
    if (!productVal) return alert('请选择产品');
    const [productIdStr, productModel] = productVal.split('|');
    const customerID  = document.getElementById('i-customer').value;
    const serialValue = document.getElementById('i-serial').value.trim();
    const qtyValue    = parseInt(document.getElementById('i-qty').value) || 1;

    const body = {
      product_id:       parseInt(productIdStr),
      product_model:    productModel,
      serial_number:    serialValue,
      quantity:         serialValue ? 1 : qtyValue,
      qc_info:          document.getElementById('i-qc').value.trim(),
      manufacture_date: document.getElementById('i-mfg').value,
      ship_date:        document.getElementById('i-ship').value,
      customer_id:      customerID ? parseInt(customerID) : null,
      warranty_months:  parseInt(document.getElementById('i-warranty').value) || 12,
      status:           document.getElementById('i-status').value,
    };
    try {
      if (i.id) await api('PUT', '/inventory/' + i.id, body);
      else       await api('POST', '/inventory', body);
      closeModal();
    } catch (e) { alert(e.message); }
  };

  // 异步刷新产品和客户列表
  Promise.all([api('GET', '/products'), api('GET', '/customers')]).then(([ps, cs]) => {
    state.data.products  = ps;
    state.data.customers = cs;
    const pSel = document.getElementById('i-product');
    const cSel = document.getElementById('i-customer');
    if (pSel) {
      pSel.innerHTML = '<option value="">-- 请选择产品 --</option>' +
        ps.map(p => `<option value="${p.id}|${p.model}|${p.warranty_months||12}" ${i.product_id==p.id?'selected':''}>${p.name ? p.name+' · ' : ''}[${p.brand}] ${p.model}</option>`).join('');
    }
    if (cSel) {
      cSel.innerHTML = '<option value="">-- 无 --</option>' +
        cs.map(c => `<option value="${c.id}" ${i.customer_id==c.id?'selected':''}>${c.company_name}</option>`).join('');
    }
  });
}

// ── 客户 Excel 导入 ───────────────────────────────────────────
function customerImportClick() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.xlsx,.xls';
  input.onchange = e => { if (e.target.files[0]) customerImportPreview(e.target.files[0]); };
  input.click();
}

async function customerImportPreview(file) {
  showModal(`
  <div class="modal modal-lg">
    <div class="modal-header">📥 导入客户数据<span class="modal-close" id="modal-close" style="opacity:0.4;cursor:not-allowed">×</span></div>
    <div class="modal-body">
      <div style="font-size:13px;color:var(--text3);margin-bottom:14px">文件：${file.name}（${(file.size/1024/1024).toFixed(2)} MB）</div>
      <div id="cip-step" style="font-size:14px;font-weight:500;margin-bottom:10px">正在上传并解析…</div>
      <div style="background:var(--bg3);border-radius:6px;overflow:hidden;height:8px;margin-bottom:10px">
        <div id="cip-bar" style="height:100%;width:0%;background:var(--accent);border-radius:6px;transition:width .4s ease"></div>
      </div>
      <div style="margin-top:8px;padding:10px 14px;background:var(--bg2);border:1px solid var(--border);border-radius:6px;font-size:12px;color:var(--text3);line-height:1.9">
        支持列标题：<code>公司名称</code> <code>省市</code> <code>地址</code> <code>联系人</code> <code>电话</code> <code>快递地址</code> <code>税号</code><br>
        <strong>公司名称</strong>为唯一键：已存在的公司可选择跳过或覆盖更新。
      </div>
      <div id="cip-preview" style="display:none;margin-top:16px"></div>
      <div id="cip-result"  style="display:none;margin-top:16px"></div>
    </div>
    <div class="modal-footer" id="cip-footer"></div>
  </div>`);

  const setBar  = pct => { const b=document.getElementById('cip-bar'); if(b) b.style.width=pct+'%'; };
  const setStep = (txt,pct) => { const e=document.getElementById('cip-step'); if(e) e.textContent=txt; setBar(pct); };
  const unlockClose = () => { const cx=document.getElementById('modal-close'); if(cx){cx.style.opacity='1';cx.style.cursor='pointer';cx.onclick=closeModal;} };

  try {
    setStep('上传文件…', 10);
    const formData = new FormData();
    formData.append('file', file);

    let uploadDone = 0;
    const preview = await new Promise((resolve, reject) => {
      const xhr = new XMLHttpRequest();
      xhr.open('POST', '/api/customers/import/preview');
      if (state.token) xhr.setRequestHeader('Authorization', 'Bearer ' + state.token);
      xhr.upload.onprogress = e => { if (e.lengthComputable) setBar(Math.round(e.loaded/e.total*50)); };
      xhr.upload.onloadend = () => { uploadDone = Date.now(); setBar(55); };
      xhr.onload = () => {
        if (xhr.status >= 200 && xhr.status < 300) {
          try { resolve(JSON.parse(xhr.responseText)); }
          catch { reject(new Error('服务器返回非 JSON 响应')); }
        } else {
          try { reject(new Error(JSON.parse(xhr.responseText).error || `HTTP ${xhr.status}`)); }
          catch { reject(new Error(`HTTP ${xhr.status}`)); }
        }
      };
      xhr.onerror = () => reject(new Error('网络错误'));
      xhr.send(formData);
    });

async function customerImportConfirm(token) {
  const btn = document.getElementById('cip-confirm-btn');
  if(btn){ btn.disabled=true; btn.textContent='导入中…'; }
  const bar = document.getElementById('cip-bar');
  if(bar){ bar.style.width='85%'; bar.style.background='var(--accent)'; }

  const updateMode = document.querySelector('input[name="cip-update-mode"]:checked')?.value || 'skip';

  try {
    const t0 = Date.now();
    const res = await api('POST', '/customers/import/confirm', { token, update_mode: updateMode });
    const elapsed = ((Date.now()-t0)/1000).toFixed(1);

    if(bar){ bar.style.width='100%'; bar.style.background='var(--green)'; }
    document.getElementById('cip-step').textContent = '导入完成';
    document.getElementById('cip-preview').style.display = 'none';

    const invalidHtml = (res.invalid||0)>0
      ? `<div style="flex:1;min-width:80px;text-align:center;padding:12px 10px;background:rgba(239,68,68,0.07);border:1px solid rgba(239,68,68,0.2);border-radius:8px">
           <div style="font-size:26px;font-weight:700;color:var(--red)">${res.invalid}</div>
           <div style="font-size:12px;color:var(--text3)">无效行</div>
         </div>` : '';

    const r = document.getElementById('cip-result');
    r.style.display = 'block';
    r.innerHTML = `
      <div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:12px">
        <div style="flex:1;min-width:80px;text-align:center;padding:12px 10px;background:rgba(72,199,142,0.07);border:1px solid rgba(72,199,142,0.3);border-radius:8px">
          <div style="font-size:26px;font-weight:700;color:var(--green)">${res.inserted||0}</div>
          <div style="font-size:12px;color:var(--text3);margin-top:2px">新增成功</div>
        </div>
        <div style="flex:1;min-width:80px;text-align:center;padding:12px 10px;background:rgba(99,179,237,0.07);border:1px solid rgba(99,179,237,0.3);border-radius:8px">
          <div style="font-size:26px;font-weight:700;color:var(--accent)">${res.updated||0}</div>
          <div style="font-size:12px;color:var(--text3);margin-top:2px">覆盖更新</div>
        </div>
        <div style="flex:1;min-width:80px;text-align:center;padding:12px 10px;background:var(--bg2);border-radius:8px;border:1px solid var(--border)">
          <div style="font-size:26px;font-weight:700;color:var(--text3)">${res.skipped||0}</div>
          <div style="font-size:12px;color:var(--text3);margin-top:2px">跳过</div>
        </div>
        ${invalidHtml}
      </div>
      <div style="padding:8px 12px;background:rgba(99,179,237,0.06);border:1px solid rgba(99,179,237,0.2);border-radius:6px;font-size:12px;color:var(--text2)">
        ⏱ 写库耗时 ${elapsed}s
      </div>`;
    document.getElementById('cip-footer').innerHTML = `<button class="btn btn-primary" onclick="closeModal();loadPage()">完成并刷新</button>`;
    const cx=document.getElementById('modal-close'); if(cx){cx.style.opacity='1';cx.style.cursor='pointer';cx.onclick=()=>{closeModal();loadPage();};}

  } catch(e) {
    console.error(e);
    if(btn){ btn.disabled=false; btn.textContent='重试'; }
    alert('导入失败：' + e.message);
  }
}

function renderCustomerRows(customers, canEdit) {
  if (!customers.length) return '<tr><td colspan="7"><div class="empty-state"><div class="icon">🏢</div>暂无客户</div></td></tr>';
  return customers.map(c => `
  <tr>
    <td style="font-weight:500;cursor:pointer;color:var(--accent)" data-action="view-cust" data-id="${c.id}">${c.company_name}</td>
    <td style="color:var(--text2)">${c.province_city||'-'}</td>
    <td>${c.contact_name||'-'}</td>
    <td class="mono">${c.phone||'-'}</td>
    <td class="mono" style="color:var(--text3)">${c.tax_number||'-'}</td>
    <td style="color:var(--text2)">${c.related_company||'-'}</td>
    ${canEdit ? `<td>
      <button class="btn btn-sm" data-action="view-cust" data-id="${c.id}">查看</button>
      <button class="btn btn-sm" data-action="edit-cust" data-id="${c.id}" style="margin-left:4px">编辑</button>
      <button class="btn btn-sm btn-danger" data-action="del-cust" data-id="${c.id}" style="margin-left:4px">删除</button>
    </td>` : ''}
  </tr>`).join('');
}

function attachCustomerActions(canEdit) {
  if (!canEdit) return;
  document.querySelectorAll('[data-action=view-cust]').forEach(btn => {
    btn.addEventListener('click', () => {
      const c = (state.data.customers || []).find(x => x.id == btn.dataset.id);
      if (c) openCustomerViewModal(c);
    });
  });
  document.querySelectorAll('[data-action=edit-cust]').forEach(btn => {
    btn.addEventListener('click', () => {
      const c = (state.data.customers || []).find(x => x.id == btn.dataset.id);
      if (c) openCustomerModal(c);
    });
  });
  document.querySelectorAll('[data-action=del-cust]').forEach(btn => {
    btn.addEventListener('click', async () => {
      if (!confirm('确定删除？')) return;
      await api('DELETE', '/customers/' + btn.dataset.id);
      loadPage();
    });
  });
}

// ── 客户附件辅助函数 ─────────────────────────────────────────
async function cvLoadAttachments(custId) {
  const wrap = document.getElementById('cv-attachments');
  if (!wrap) return;
  try {
    const res = await api('GET', '/customers/' + custId + '/attachments');
    const list = res.attachments || [];
    if (!list.length) {
      wrap.innerHTML = '<div style="color:var(--text3);font-size:13px">暂无附件</div>';
      return;
    }
    const tk = state.token ? '?token=' + encodeURIComponent(state.token) : '';
    wrap.innerHTML = list.map(a => {
      const ext = (a.file_name||'').split('.').pop().toLowerCase();
      const previewable = ['pdf','png','jpg','jpeg','gif','webp','bmp','svg','txt'].includes(ext);
      const base = `/api/customers/${custId}/attachments/${a.id}`;
      return `<div style="display:flex;align-items:center;gap:8px;padding:7px 10px;background:var(--bg3);border-radius:6px;margin-bottom:6px">
        <span style="font-size:18px">${fileIcon(a.file_name||'')}</span>
        <div style="flex:1;min-width:0">
          <div style="font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${escHtml(a.file_name||'')}</div>
          <div style="font-size:11px;color:var(--text3)">${a.remark?escHtml(a.remark)+' · ':''}${fmtSize(a.file_size||0)} · ${(a.created_at||'').slice(0,10)}</div>
        </div>
        ${previewable ? `<a class="btn btn-sm" href="${base}/preview${tk}" target="_blank" style="text-decoration:none">查看</a>` : ''}
        <a class="btn btn-sm" href="${base}/download${tk}" target="_blank" style="text-decoration:none">下载</a>
        <button class="btn btn-sm btn-danger" onclick="cvDeleteAttachment(${custId},${a.id},this)">删除</button>
      </div>`;
    }).join('');
  } catch(e) {
    const wrap2 = document.getElementById('cv-attachments');
    if (wrap2) wrap2.innerHTML = `<div style="color:var(--red);font-size:13px">加载失败</div>`;
  }
}

// ── 拖拽上传 ─────────────────────────────────────────────────
function cvDragOver(e) {
  e.preventDefault();
  e.stopPropagation();
  const zone = document.getElementById('cv-drop-zone');
  const hint = document.getElementById('cv-drop-hint');
  if (zone) { zone.style.borderColor = 'var(--accent)'; zone.style.background = 'var(--bg3)'; }
  if (hint) hint.style.display = '';
}

function cvDragLeave(e) {
  e.stopPropagation();
  // 只在真正离开拖拽区时才还原（避免子元素触发 leave）
  const zone = document.getElementById('cv-drop-zone');
  if (zone && e.relatedTarget && zone.contains(e.relatedTarget)) return;
  if (zone) { zone.style.borderColor = ''; zone.style.background = ''; }
  const hint = document.getElementById('cv-drop-hint');
  if (hint) hint.style.display = 'none';
}

function cvDrop(e) {
  e.preventDefault();
  e.stopPropagation();
  const zone = document.getElementById('cv-drop-zone');
  const hint = document.getElementById('cv-drop-hint');
  if (zone) { zone.style.borderColor = ''; zone.style.background = ''; }
  if (hint) hint.style.display = 'none';
  const custId = zone?.dataset?.custid;
  if (!custId) return;
  const files = e.dataTransfer?.files;
  if (files && files.length) cvUploadFiles(parseInt(custId), files);
}

async function cvUploadFiles(custId, files) {
  if (!files || !files.length) return;
  const wrap = document.getElementById('cv-attachments');
  if (wrap) wrap.innerHTML = '<div style="color:var(--text3);font-size:13px">上传中…</div>';
  for (const file of files) {
    const fd = new FormData();
    fd.append('file', file);
    await fetch('/api/customers/' + custId + '/attachments', {
      method: 'POST',
      headers: { Authorization: 'Bearer ' + state.token },
      body: fd,
    });
  }
  // 清空 input 以便重复上传同名文件
  const input = document.getElementById('cv-file-input');
  if (input) input.value = '';
  cvLoadAttachments(custId);
}

async function cvDeleteAttachment(custId, aid, btn) {
  if (!confirm('确认删除此附件？')) return;
  btn.disabled = true;
  try {
    await api('DELETE', '/customers/' + custId + '/attachments/' + aid);
    cvLoadAttachments(custId);
  } catch(e) { btn.disabled = false; alert('删除失败：' + e.message); }
}

function openCustomerModal(customer) {
  const c = customer || {};
  showModal(`
  <div class="modal">
    <div class="modal-header">${c.id ? '编辑客户' : '新增客户'}<span class="modal-close" id="modal-close">×</span></div>
    <div class="modal-body">
      <div class="form-row">
        <div class="form-group"><label>公司名称 *</label><input id="c-company" value="${c.company_name||''}"></div>
        <div class="form-group"><label>省市</label><input id="c-city" value="${c.province_city||''}"></div>
      </div>
      <div class="form-group"><label>地址</label><input id="c-addr" value="${c.address||''}"></div>
      <div class="form-row">
        <div class="form-group"><label>联系人</label><input id="c-contact" value="${c.contact_name||''}"></div>
        <div class="form-group"><label>电话</label><input id="c-phone" value="${c.phone||''}"></div>
      </div>
      <div class="form-group"><label>快递地址</label><textarea id="c-express">${c.express_address||''}</textarea></div>
      <div class="form-row">
        <div class="form-group"><label>税号</label><input id="c-tax" value="${c.tax_number||''}"></div>
        <div class="form-group"><label>关联公司</label><input id="c-related" value="${c.related_company||''}"></div>
      </div>
      <div class="form-group"><label>备注</label><textarea id="c-remarks" style="min-height:80px">${c.remarks||''}</textarea></div>
    </div>
    <div class="modal-footer">
      <button class="btn" id="modal-cancel">取消</button>
      <button class="btn btn-primary" id="modal-save">保存</button>
    </div>
  </div>`);
  document.getElementById('modal-close').onclick = closeModal;
  document.getElementById('modal-cancel').onclick = closeModal;
  document.getElementById('modal-save').onclick = async () => {
    const body = {
      company_name:    document.getElementById('c-company').value.trim(),
      province_city:   document.getElementById('c-city').value.trim(),
      address:         document.getElementById('c-addr').value.trim(),
      contact_name:    document.getElementById('c-contact').value.trim(),
      phone:           document.getElementById('c-phone').value.trim(),
      express_address: document.getElementById('c-express').value.trim(),
      tax_number:      document.getElementById('c-tax').value.trim(),
      related_company: document.getElementById('c-related').value.trim(),
      remarks:         document.getElementById('c-remarks').value.trim(),
    };
    if (!body.company_name) return alert('请填写公司名称');
    try {
      if (c.id) await api('PUT', '/customers/' + c.id, body);
      else await api('POST', '/customers', body);
      closeModal();
    } catch (e) { alert(e.message); }
  };
}

const _quoteSort = { col: 'id', dir: 'desc' };
let _quoteData = [];
let _quoteStatusMap = {};
let _quoteStatusBadge = null;

async function loadQuotations(content, actions) {
  const canEdit = state.user.is_admin || hasPermission('quotations');
  actions.innerHTML = (canEdit ? `<button class="btn btn-primary" id="btn-add-quote">＋ <span class="btn-text">新增报价</span></button>` : '')
    + `<button class="btn" onclick="qtOpenTemplateManager()">📋 <span class="btn-text">模板管理</span></button>`
    + `<button class="btn" id="btn-export-quotes" onclick="exportQuotations()">📤 <span class="btn-text">导出列表</span></button>`;
  if (canEdit) {
    document.getElementById('btn-add-quote')?.addEventListener('click', async () => {
      await preloadData();
      openQuotationModal(null);
    });
  }

  _quoteData = await api('GET', '/quotations');
  _quoteStatusMap = { draft: '草稿', sent: '已发送', negotiating: '议价中', accepted: '已接受', rejected: '已拒绝' };
  _quoteStatusBadge = s => ({
    draft: 'badge-gray', sent: 'badge-blue', negotiating: 'badge-yellow',
    accepted: 'badge-green', rejected: 'badge-red',
  }[s] || 'badge-gray');

  content.innerHTML = `
  <div class="search-bar">
    <input class="search-input" id="quote-search" placeholder="搜索报价单号、公司名…">
    <button class="btn" id="btn-quote-search">搜索</button>
  </div>
  <div class="card">
    <div class="table-wrap">
      <table>
        <thead><tr>
          ${makeSortTh('报价单号','quote_number',_quoteSort,'quote')}
          ${makeSortTh('公司','company_name',_quoteSort,'quote')}
          ${makeSortTh('日期','date',_quoteSort,'quote')}
          ${makeSortTh('状态','status',_quoteSort,'quote')}
          ${makeSortTh('金额','total_amount',_quoteSort,'quote','color:var(--green)')}
          ${canEdit ? '<th>操作</th>' : ''}
        </tr></thead>
        <tbody id="quote-tbody"></tbody>
      </table>
    </div>
  </div>`;

  quoteRenderTable(canEdit);

  document.getElementById('quote-search')?.addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('btn-quote-search')?.click(); });
  document.getElementById('btn-quote-search')?.addEventListener('click', async () => {
    const q = document.getElementById('quote-search').value;
    _quoteData = await api('GET', '/quotations?q=' + encodeURIComponent(q));
    quoteRenderTable(canEdit);
  });
}

function quoteSetSort(col) {
  if (_quoteSort.col === col) _quoteSort.dir = _quoteSort.dir === 'asc' ? 'desc' : 'asc';
  else { _quoteSort.col = col; _quoteSort.dir = 'asc'; }
  const canEdit = state.user.is_admin || hasPermission('quotations');
  quoteRenderTable(canEdit);
}

function quoteRenderTable(canEdit) {
  const getter = (q, col) => col === 'total_amount' ? (q.total_amount || 0) : (q[col] || '');
  const sorted = clientSort(_quoteData, _quoteSort.col, _quoteSort.dir, getter);
  document.getElementById('quote-tbody').innerHTML = renderQuoteRows(sorted, canEdit, _quoteStatusMap, _quoteStatusBadge);
  updateSortArrows('quote', _quoteSort, ['quote_number','company_name','date','status','total_amount']);
  attachQuoteActions(canEdit);
}

function renderQuoteRows(quotes, canEdit, statusMap, statusBadge) {
  if (!quotes.length) return '<tr><td colspan="6"><div class="empty-state"><div class="icon">📋</div>暂无报价</div></td></tr>';
  return quotes.map(q => `
  <tr>
    <td class="mono" style="color:var(--accent);cursor:pointer;text-decoration:underline dotted" onclick="qtPreviewQuote(${q.id})" title="点击查看报价清单">${q.quote_number}</td>
    <td>${q.company_name||'-'}</td>
    <td>${q.date||'-'}</td>
    <td><span class="badge ${statusBadge(q.status)}">${statusMap[q.status]||q.status}</span></td>
    <td class="mono" style="color:var(--green)">¥${q.total_amount?.toFixed(2)||'0.00'}</td>
    ${canEdit ? `<td>
      <button class="btn btn-sm" data-action="view-quote" data-id="${q.id}">查看</button>
      <button class="btn btn-sm" data-action="edit-quote" data-id="${q.id}" style="margin-left:4px">编辑</button>
      <button class="btn btn-sm" data-action="copy-quote" data-id="${q.id}" style="margin-left:4px">📋 复制</button>
      <button class="btn btn-sm" data-action="export-quote" data-id="${q.id}" style="margin-left:4px">📥 导出</button>
      <button class="btn btn-sm btn-danger" data-action="del-quote" data-id="${q.id}" style="margin-left:4px">删除</button>
    </td>` : `<td>
      <button class="btn btn-sm" data-action="view-quote" data-id="${q.id}">查看</button>
      <button class="btn btn-sm" data-action="export-quote" data-id="${q.id}" style="margin-left:4px">📥 导出</button>
    </td>`}
  </tr>`).join('');
}

function attachQuoteActions(canEdit) {
  if (canEdit) {
    document.querySelectorAll('[data-action=edit-quote]').forEach(btn => {
      btn.addEventListener('click', async () => {
        const q = await api('GET', '/quotations/' + btn.dataset.id);
        await preloadData();
        openQuotationModal(q);
      });
    });
    document.querySelectorAll('[data-action=del-quote]').forEach(btn => {
      btn.addEventListener('click', async () => {
        if (!confirm('确定删除？')) return;
        await api('DELETE', '/quotations/' + btn.dataset.id);
        loadPage();
      });
    });
  }
  document.querySelectorAll('[data-action=view-quote]').forEach(btn => {
    btn.addEventListener('click', () => qtPreviewQuote(btn.dataset.id));
  });
  document.querySelectorAll('[data-action=copy-quote]').forEach(btn => {
    btn.addEventListener('click', () => qtCopyQuote(btn.dataset.id));
  });
  document.querySelectorAll('[data-action=export-quote]').forEach(btn => {
    btn.addEventListener('click', () => qtOpenExportModal(btn.dataset.id));
  });
}

async function preloadData() {
  if (!state.data.customers) state.data.customers = await api('GET', '/customers');
  if (!state.data.products) state.data.products = await api('GET', '/products');
}

function openQuotationModal(quote) {
  const q = quote || {};
  let currentItems = [];
  try { currentItems = JSON.parse(q.items || '[]'); } catch(e) { currentItems = []; }
  if (!Array.isArray(currentItems)) currentItems = [];

  const customers = state.data.customers || [];
  const products  = state.data.products  || [];

  // ── 表格样式 ──
  const thS = 'background:var(--accent);color:#fff;padding:7px 6px;font-size:11px;font-weight:600;' +
              'text-align:center;border:1px solid var(--border);white-space:nowrap';
  const tdS = 'padding:0;border:1px solid var(--border);vertical-align:middle';
  const inpS = 'width:100%;padding:5px 6px;font-size:12px;border:none;outline:none;' +
               'background:transparent;color:var(--text);box-sizing:border-box';
  const numS = inpS + ';text-align:right';

  // ── 产品 datalist ──
  const datalistHtml = `<datalist id="qm-prod-list">
    ${products.map(p => `<option value="${escHtml(p.name||'')}"`+
      ` data-brand="${escHtml(p.brand||'')}"`+
      ` data-model="${escHtml(p.model||p.type||'')}"`+
      ` data-price="${p.unit_price||0}"`+
      ` data-unit="${escHtml(p.unit||'PCS')}">`)
    .join('')}
  </datalist>`;

  // ── 渲染表格 ──
  const renderTable = () => {
    const rows = currentItems.map((item, i) => {
      const sub = ((item.unit_price||0)*(item.quantity||1)).toFixed(2);
      return `<tr id="qm-row-${i}"
        onmouseenter="this.style.background='var(--bg3)'"
        onmouseleave="this.style.background=''">
        <td style="${tdS};text-align:center;color:var(--text3);font-size:11px;width:30px;padding:4px">${i+1}</td>
        <td style="${tdS};width:1%;white-space:nowrap">
          <input list="qm-prod-list" value="${escHtml(item.name||'')} "
            data-row="${i}" data-f="name" style="${inpS};min-width:100px" placeholder="输入或选择产品…"
            oninput="qmProdInput(this)" onchange="qmProdChange(this)">
        </td>
        <td style="${tdS};width:1%;white-space:nowrap"><input value="${escHtml(item.brand||'')} " data-row="${i}" data-f="brand" style="${inpS};min-width:60px" onchange="qmField(this)"></td>
        <td style="${tdS};width:1%;white-space:nowrap"><input value="${escHtml(item.model||'')} " data-row="${i}" data-f="model" style="${inpS};min-width:70px" onchange="qmField(this)"></td>
        <td style="${tdS}"><input value="${escHtml(item.description||'')} " data-row="${i}" data-f="description" style="${inpS};min-width:60px" onchange="qmField(this)"></td>
        <td style="${tdS};width:52px"><input value="${escHtml(item.unit||'PCS')} " data-row="${i}" data-f="unit" style="${inpS};text-align:center" onchange="qmField(this)"></td>
        <td style="${tdS};width:60px"><input type="number" min="0" step="any" value="${item.quantity||1}" data-row="${i}" data-f="quantity" style="${numS}" oninput="qmCalc(${i})"></td>
        <td style="${tdS};width:80px"><input type="number" min="0" step="0.01" value="${item.unit_price||0}" data-row="${i}" data-f="unit_price" style="${numS}" oninput="qmCalc(${i})"></td>
        <td style="${tdS};width:82px;text-align:right;padding:5px 7px;font-size:12px;color:var(--green);font-family:monospace" id="qm-sub-${i}">${sub}</td>
        <td style="${tdS};width:28px;text-align:center">
          <button onclick="qmDel(${i})"
            style="background:none;border:none;color:var(--red);cursor:pointer;font-size:16px;padding:2px 5px;line-height:1">×</button>
        </td>
      </tr>`;
    }).join('');

    const total = currentItems.reduce((s,it) => s + (it.unit_price||0)*(it.quantity||1), 0);
    return `${datalistHtml}
      <div style="overflow-x:auto;border:1px solid var(--border);border-radius:8px;overflow:hidden">
        <table style="width:100%;border-collapse:collapse;min-width:680px">
          <thead><tr>
            <th style="${thS};width:30px;white-space:nowrap">#</th>
            <th style="${thS};white-space:nowrap">产品名称</th>
            <th style="${thS};white-space:nowrap">品牌</th>
            <th style="${thS};white-space:nowrap">型号</th>
            <th style="${thS};min-width:80px">规格/描述</th>
            <th style="${thS};width:52px;white-space:nowrap">单位</th>
            <th style="${thS};width:60px;white-space:nowrap">数量</th>
            <th style="${thS};width:80px;white-space:nowrap">单价(¥)</th>
            <th style="${thS};width:82px;white-space:nowrap">小计(¥)</th>
            <th style="${thS};width:28px"></th>
          </tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
      <div style="display:flex;align-items:center;justify-content:space-between;margin-top:8px">
        <button onclick="qmAdd()"
          style="padding:5px 14px;border:1px dashed var(--accent);border-radius:6px;
                 background:transparent;color:var(--accent);cursor:pointer;font-size:12px">
          ＋ 新增行
        </button>
        <div style="font-size:15px;font-weight:700;color:var(--text)">
          合计：<span id="qm-total" style="color:var(--green);font-family:monospace">¥${total.toFixed(2)}</span>
        </div>
      </div>`;
  };

  showModal(`
  <div class="modal modal-lg">
    <div class="modal-header">${q.id ? '编辑报价单' : '新建报价单'}<span class="modal-close" id="modal-close">×</span></div>
    <div class="modal-body">
      <div class="form-row">
        <div class="form-group" style="position:relative">
          <label>客户名称
            <span id="q-cust-badge" style="margin-left:6px;font-size:11px;color:var(--green);display:${q.customer_id?'inline':'none'}">✓ 已关联</span>
          </label>
          <input id="q-cust-input" type="text" autocomplete="off"
            value="${q.company_name||''}"
            placeholder="输入关键字搜索客户，或直接输入公司名">
          <div id="q-cust-dropdown" style="display:none;position:absolute;z-index:999;left:0;right:0;
            background:var(--bg2);border:1px solid var(--border);border-radius:6px;
            box-shadow:0 4px 16px rgba(0,0,0,.18);max-height:200px;overflow-y:auto"></div>
        </div>
        <div class="form-group"><label>日期</label><input id="q-date" type="date" value="${q.date||new Date().toISOString().split('T')[0]}"></div>
      </div>
      <div class="form-row">
        <div class="form-group" style="position:relative">
          <label>税率情况</label>
          <div style="display:flex;gap:0">
            <input id="q-tax" value="${q.tax_info||'增值税专用发票(13%)'}"
              autocomplete="off" placeholder="选择或输入税率情况"
              style="flex:1;border-radius:var(--radius) 0 0 var(--radius)">
            <button type="button" onclick="qTaxToggle()"
              style="padding:0 10px;border:1px solid var(--border);border-left:none;
                     border-radius:0 var(--radius) var(--radius) 0;background:var(--bg3);
                     cursor:pointer;color:var(--text2);font-size:11px">▼</button>
          </div>
          <div id="q-tax-dropdown" style="display:none;position:absolute;z-index:999;
            left:0;right:0;background:var(--bg2);border:1px solid var(--border);
            border-radius:6px;box-shadow:0 4px 16px rgba(0,0,0,.18);margin-top:2px">
            ${['增值税专用发票(13%)','增值税普通发票(3%)','未税','税前'].map(v =>
              `<div class="q-tax-opt" data-val="${v}"
                style="padding:9px 12px;cursor:pointer;font-size:13px;border-bottom:1px solid var(--border)"
                onmousedown="qTaxSelect('${v}')"
                onmouseover="this.style.background='rgba(88,166,255,0.12)'"
                onmouseout="this.style.background=''">${v}</div>`
            ).join('')}
          </div>
        </div>
        <div class="form-group"><label>状态</label>
          <select id="q-status">
            <option value="draft" ${q.status==='draft'?'selected':''}>草稿</option>
            <option value="sent" ${q.status==='sent'?'selected':''}>已发送</option>
            <option value="negotiating" ${q.status==='negotiating'?'selected':''}>议价中</option>
            <option value="accepted" ${q.status==='accepted'?'selected':''}>已接受</option>
            <option value="rejected" ${q.status==='rejected'?'selected':''}>已拒绝</option>
          </select>
        </div>
      </div>
      <div class="form-group"><label>变更记录/备注</label><textarea id="q-log" rows="2">${q.change_log||''}</textarea></div>
      <div style="font-size:13px;font-weight:600;margin:8px 0 8px;color:var(--text)">报价明细</div>
      <div id="qm-table-wrap"></div>
    </div>
    <div class="modal-footer">
      <button class="btn" id="modal-cancel">取消</button>
      <button class="btn btn-primary" id="modal-save">💾 保存</button>
    </div>
  </div>`);

  // ── 挂载辅助函数 ──
  window.qmDel = (i) => {
    currentItems.splice(i, 1);
    document.getElementById('qm-table-wrap').innerHTML = renderTable();
  };
  window.qmAdd = () => {
    currentItems.push({ name:'', brand:'', model:'', description:'', unit:'PCS', unit_price:0, quantity:1 });
    document.getElementById('qm-table-wrap').innerHTML = renderTable();
    setTimeout(() => document.querySelector(`input[data-row="${currentItems.length-1}"][data-f="name"]`)?.focus(), 20);
  };
  window.qmField = (inp) => {
    const i = parseInt(inp.dataset.row), f = inp.dataset.f;
    if (currentItems[i] !== undefined) currentItems[i][f] = inp.value.trim();
  };
  window.qmCalc = (i) => {
    const qty   = parseFloat(document.querySelector(`input[data-row="${i}"][data-f="quantity"]`)?.value)   || 0;
    const price = parseFloat(document.querySelector(`input[data-row="${i}"][data-f="unit_price"]`)?.value) || 0;
    if (currentItems[i]) { currentItems[i].quantity = qty; currentItems[i].unit_price = price; }
    const sub = document.getElementById(`qm-sub-${i}`);
    if (sub) sub.textContent = (qty * price).toFixed(2);
    const tot = document.getElementById('qm-total');
    if (tot) tot.textContent = '¥' + currentItems.reduce((s,it) => s + (it.unit_price||0)*(it.quantity||1), 0).toFixed(2);
  };
  window.qmProdInput = (inp) => {
    const i = parseInt(inp.dataset.row);
    if (currentItems[i]) currentItems[i].name = inp.value;
  };
  window.qmProdChange = (inp) => {
    const i = parseInt(inp.dataset.row);
    if (currentItems[i]) currentItems[i].name = inp.value;
    const opt = document.querySelector(`#qm-prod-list option[value="${CSS.escape(inp.value.trim())}"]`);
    if (!opt) return;
    const set = (f, v) => {
      const el = document.querySelector(`input[data-row="${i}"][data-f="${f}"]`);
      if (el) { el.value = v; if (currentItems[i]) currentItems[i][f] = f==='unit_price'?parseFloat(v)||0:v; }
    };
    set('brand',      opt.dataset.brand || '');
    set('model',      opt.dataset.model || '');
    set('unit',       opt.dataset.unit  || 'PCS');
    set('unit_price', opt.dataset.price || '0');
    qmCalc(i);
  };

  document.getElementById('qm-table-wrap').innerHTML = renderTable();

  // ── 客户 Autocomplete ──────────────────────────────────────
  let _qCustId = q.customer_id || null;
  const qCustInput    = document.getElementById('q-cust-input');
  const qCustDropdown = document.getElementById('q-cust-dropdown');
  const qCustBadge    = document.getElementById('q-cust-badge');

  const qRenderDrop = (kw) => {
    const lkw = kw.toLowerCase();
    const matched = kw ? customers.filter(x => x.company_name.toLowerCase().includes(lkw)) : customers;
    if (!matched.length) { qCustDropdown.style.display = 'none'; return; }
    qCustDropdown.innerHTML = matched.map(x => `
      <div class="q-cust-opt" data-id="${x.id}" data-name="${x.company_name.replace(/"/g,'&quot;')}"
        style="padding:9px 12px;cursor:pointer;font-size:13px;border-bottom:1px solid var(--border)">
        ${x.company_name}
      </div>`).join('');
    qCustDropdown.style.display = '';
    qCustDropdown.querySelectorAll('.q-cust-opt').forEach(opt => {
      opt.addEventListener('mousedown', e => {
        e.preventDefault();
        _qCustId = parseInt(opt.dataset.id);
        qCustInput.value = opt.dataset.name;
        qCustBadge.style.display = 'inline';
        qCustDropdown.style.display = 'none';
      });
      opt.addEventListener('mouseover', () => opt.style.background = 'rgba(88,166,255,0.12)');
      opt.addEventListener('mouseout',  () => opt.style.background = '');
    });
  };

  qCustInput.addEventListener('input',  () => { _qCustId = null; qCustBadge.style.display = 'none'; qRenderDrop(qCustInput.value.trim()); });
  qCustInput.addEventListener('focus',  () => qRenderDrop(qCustInput.value.trim()));
  qCustInput.addEventListener('blur',   () => setTimeout(() => { qCustDropdown.style.display = 'none'; }, 150));
  // ── 税率下拉 ──────────────────────────────────────────────
  window.qTaxToggle = () => {
    const dd = document.getElementById('q-tax-dropdown');
    if (!dd) return;
    dd.style.display = dd.style.display === 'none' ? '' : 'none';
  };
  window.qTaxSelect = (val) => {
    const inp = document.getElementById('q-tax');
    if (inp) inp.value = val;
    const dd = document.getElementById('q-tax-dropdown');
    if (dd) dd.style.display = 'none';
  };
  document.getElementById('q-tax')?.addEventListener('blur', () => {
    setTimeout(() => {
      const dd = document.getElementById('q-tax-dropdown');
      if (dd) dd.style.display = 'none';
    }, 200);
  });
  document.getElementById('q-tax')?.addEventListener('focus', () => {
    const dd = document.getElementById('q-tax-dropdown');
    if (dd) dd.style.display = '';
  });

  qCustInput.addEventListener('keydown', e => {
    const opts = qCustDropdown.querySelectorAll('.q-cust-opt');
    if (!opts.length) return;
    const active = qCustDropdown.querySelector('.q-cust-opt.kbfocus');
    let idx = Array.from(opts).indexOf(active);
    if (e.key === 'ArrowDown') { e.preventDefault(); idx = (idx+1)%opts.length; }
    else if (e.key === 'ArrowUp') { e.preventDefault(); idx = (idx-1+opts.length)%opts.length; }
    else if (e.key === 'Enter' && active) {
      e.preventDefault();
      _qCustId = parseInt(active.dataset.id);
      qCustInput.value = active.dataset.name;
      qCustBadge.style.display = 'inline';
      qCustDropdown.style.display = 'none';
      return;
    } else if (e.key === 'Escape') { qCustDropdown.style.display = 'none'; return; }
    opts.forEach(o => { o.classList.remove('kbfocus'); o.style.background = ''; });
    if (opts[idx]) { opts[idx].classList.add('kbfocus'); opts[idx].style.background = 'rgba(88,166,255,0.12)'; }
  });

  document.getElementById('modal-close').onclick = closeModal;
  document.getElementById('modal-cancel').onclick = closeModal;
  document.getElementById('modal-save').onclick = async () => {
    // 收集最新输入值
    currentItems.forEach((item, i) => {
      ['name','brand','model','description','unit'].forEach(f => {
        const el = document.querySelector(`input[data-row="${i}"][data-f="${f}"]`);
        if (el) item[f] = el.value.trim();
      });
      item.quantity   = parseFloat(document.querySelector(`input[data-row="${i}"][data-f="quantity"]`)?.value)   || 0;
      item.unit_price = parseFloat(document.querySelector(`input[data-row="${i}"][data-f="unit_price"]`)?.value) || 0;
      item.total_price = item.unit_price * item.quantity;
    });
    const validItems = currentItems.filter(it => it.name || it.unit_price);
    const total = validItems.reduce((s,it) => s + it.total_price, 0);
    const body = {
      customer_id:  _qCustId || null,
      company_name: document.getElementById('q-cust-input').value.trim(),
      date:         document.getElementById('q-date').value,
      status:       document.getElementById('q-status').value,
      tax_info:     document.getElementById('q-tax').value.trim(),
      change_log:   document.getElementById('q-log').value,
      items:        JSON.stringify(validItems),
      total_amount: total,
    };
    try {
      if (q.id) await api('PUT', '/quotations/' + q.id, body);
      else      await api('POST', '/quotations', body);
      closeModal();
    } catch(e) { alert(e.message); }
  };
}

const _contractSort = { col: 'id', dir: 'desc' };
let _contractData = [];
let _contractStatusRow = null;

async function loadContracts(content, actions) {
  const canEdit = state.user.is_admin || hasPermission('contracts');
  actions.innerHTML = (canEdit ? `<button class="btn btn-primary" id="btn-add-contract">＋ <span class="btn-text">新增合同</span></button>` : '')
    + `<button class="btn" onclick="ctOpenTemplateManager()">📋 <span class="btn-text">模板管理</span></button>`
    + `<button class="btn" id="btn-export-contracts" onclick="exportContracts()">📤 <span class="btn-text">导出Excel</span></button>`;
  if (canEdit) {
    document.getElementById('btn-add-contract')?.addEventListener('click', async () => {
      await preloadData();
      if (!state.data.quotations) state.data.quotations = await api('GET', '/quotations');
      const numRes = await api('GET', '/contracts/generate-number');
      openContractModal(null, numRes?.contract_number || '');
    });

    const flags = [

      { k: 'status_invoiced', label: '已开票' },
      { k: 'status_completed', label: '已完成' },
    ];
    return flags.map(f => `<span class="status-dot ${c[f.k] ? 'on' : 'off'}" title="${f.label}"></span>`).join('');
  };

  content.innerHTML = `
  <div class="search-bar">
    <input class="search-input" id="contract-search" placeholder="搜索合同号、公司名、附件名…">
    <button class="btn" id="btn-contract-search">搜索</button>
  </div>
  <div class="card">
    <div class="table-wrap">
      <table>
        <thead><tr>
          ${makeSortTh('合同号','contract_number',_contractSort,'contract')}
          ${makeSortTh('客户','company_name',_contractSort,'contract')}
          ${makeSortTh('金额','amount',_contractSort,'contract')}
          ${makeSortTh('已付','paid_amount',_contractSort,'contract','color:var(--green)')}
          <th>进度</th>
          ${makeSortTh('创建时间','created_at',_contractSort,'contract')}
          <th>操作</th>

  document.getElementById('btn-contract-search')?.addEventListener('click', async () => {

function contractSetSort(col) {
  if (_contractSort.col === col) _contractSort.dir = _contractSort.dir === 'asc' ? 'desc' : 'asc';
  else { _contractSort.col = col; _contractSort.dir = 'asc'; }
  const canEdit = state.user.is_admin || hasPermission('contracts');
  contractRenderTable(canEdit);
}

function contractRenderTable(canEdit) {
  const getter = (c, col) => {
    if (col === 'amount' || col === 'paid_amount') return c[col] || 0;
    if (col === 'company_name') return c.custom_company_name || c.company_name || '';
    return c[col] || '';
  };
  const sorted = clientSort(_contractData, _contractSort.col, _contractSort.dir, getter);
  document.getElementById('contract-tbody').innerHTML = renderContractRows(sorted, canEdit, _contractStatusRow);
  updateSortArrows('contract', _contractSort, ['contract_number','company_name','amount','paid_amount','created_at']);
  attachContractActions(canEdit, _contractStatusRow);
}

function renderContractRows(contracts, canEdit, statusRow) {
  if (!contracts.length) return '<tr><td colspan="7"><div class="empty-state"><div class="icon">📝</div>暂无合同</div></td></tr>';
  const fmt = n => '¥' + Number(n).toLocaleString('zh-CN', { minimumFractionDigits: 2 });
  return contracts.map(c => `
  <tr>
    <td class="mono">
      <span style="color:var(--accent);cursor:pointer;text-decoration:underline dotted"
        data-action="view-contract" data-id="${c.id}">${c.contract_number}</span>
    </td>
    <td>${c.custom_company_name||c.company_name||'-'}</td>
    <td class="mono">${fmt(c.amount)}</td>
    <td class="mono" style="color:var(--green)">${fmt(c.paid_amount)}</td>
    <td><div class="contract-status-row">${statusRow(c)}</div></td>
    <td style="color:var(--text3)">${c.created_at?.split('T')[0]||''}</td>
    <td>
      <button class="btn btn-sm" data-action="view-contract" data-id="${c.id}">查看</button>
      <button class="btn btn-sm" data-action="export-contract" data-id="${c.id}" style="margin-left:4px">📥 导出</button>
      ${canEdit ? `
      <button class="btn btn-sm" data-action="edit-contract" data-id="${c.id}" style="margin-left:4px">编辑</button>
      <button class="btn btn-sm btn-danger" data-action="del-contract" data-id="${c.id}" style="margin-left:4px">删除</button>` : ''}
    </td>
  </tr>`).join('');
}

function attachContractActions(canEdit, statusRow) {
  // 查看（所有人可用）
  document.querySelectorAll('[data-action=view-contract]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const c = await api('GET', '/contracts/' + btn.dataset.id);
      viewContractModal(c);
    });
  });
  // 导出合同
  document.querySelectorAll('[data-action=export-contract]').forEach(btn => {
    btn.addEventListener('click', () => ctOpenExportModal(btn.dataset.id));
  });
  if (!canEdit) return;
  document.querySelectorAll('[data-action=edit-contract]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const c = await api('GET', '/contracts/' + btn.dataset.id);
      await preloadData();
      if (!state.data.quotations) state.data.quotations = await api('GET', '/quotations');
      openContractModal(c);
    });
  });
  document.querySelectorAll('[data-action=del-contract]').forEach(btn => {
    btn.addEventListener('click', async () => {
      if (!confirm('确定删除？')) return;
      await api('DELETE', '/contracts/' + btn.dataset.id);
      loadPage();
    });
  });
}

          const base = `/api/contracts/${c.id||0}/attachments/${a.id}`;
          const tk = state.token ? '?token=' + encodeURIComponent(state.token) : '';
          return (previewable ? `<a class="btn btn-sm" href="${base}/preview${tk}" target="_blank" style="text-decoration:none;margin-right:4px">查看</a>` : '')
               + `<a class="btn btn-sm" href="${base}/download${tk}" target="_blank" style="text-decoration:none">下载</a>`;
        })() : `<span style="font-size:11px;color:var(--accent)">待上传</span>`}
        <button class="btn btn-sm btn-danger" data-action="del-attach" data-idx="${i}" ${a._saved?`data-aid="${a.id}"`:''}>&times;</button>
      </div>`).join('');
  };

  showModal(`
  <div class="modal modal-lg">
    <div class="modal-header">${c.id ? '编辑合同' : '新建合同'}<span class="modal-close" id="modal-close">×</span></div>
    <div class="modal-body" style="max-height:70vh;overflow-y:auto">
      <div class="form-row">
        <div class="form-group">
          <label>合同号</label>
          <div style="display:flex;gap:6px;align-items:center">
            <input id="ct-number" type="text" value="${c.contract_number || suggestedNum || ''}"
              placeholder="自动生成，可修改"
              style="${c.id ? 'color:var(--text3);background:var(--bg3)' : ''}"
              ${c.id ? 'readonly' : ''}>
            ${!c.id ? `<button type="button" id="btn-regen-num" class="btn btn-sm" title="重新生成" style="flex-shrink:0">🔄</button>` : ''}
          </div>
        </div>
      </div>
      <div class="form-row">
        ${customerSection}
        <div class="form-group"><label>关联报价单</label>
          <select id="ct-quotation">
            <option value="">-- 无 --</option>
            ${quotations.map(q => `<option value="${q.id}" ${c.quotation_id==q.id?'selected':''}>${q.quote_number} - ${q.company_name}</option>`).join('')}
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>合同金额 (¥)</label><input id="ct-amount" type="number" step="0.01" value="${c.amount||0}"></div>
        <div class="form-group"><label>已付金额 (¥)</label><input id="ct-paid-amt" type="number" step="0.01" value="${c.paid_amount||0}"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>签订日期</label><input id="ct-sign-date" type="date" value="${c.sign_date||new Date().toISOString().slice(0,10)}"></div>
        <div class="form-group"><label>乙方公司</label><input id="ct-party-b" value="${escHtml(c.party_b||'')}" placeholder="留空则使用系统公司名称"></div>
      </div>
      <div class="form-group"><label>备注/条款补充</label><textarea id="ct-remarks" rows="3" placeholder="可填写付款条款、特殊约定等内容，将插入合同模板的 {{remarks}} 位置">${escHtml(c.remarks||'')}</textarea></div>
      <div class="form-group"><label>合同内容（旧字段）</label><textarea id="ct-content" rows="3">${c.content||''}</textarea></div>
      <div class="form-group">
        <label>合同状态跟踪</label>
        <div class="status-checks">
          ${mkCheck('ct-sent', '✉️ 已发给客户', c.status_sent)}
          ${mkCheck('ct-replied', '↩️ 已收到回复', c.status_replied)}
          ${mkCheck('ct-status-paid', '💵 已收到汇款', c.status_paid)}
          ${mkCheck('ct-shipped', '🚚 已发货', c.status_shipped)}
          ${mkCheck('ct-invoiced', '🧾 已开票', c.status_invoiced)}
          ${mkCheck('ct-completed', '✅ 已完成', c.status_completed)}
        </div>
      </div>
      <div class="form-group">
        <label style="display:flex;align-items:center;justify-content:space-between">
          <span>合同附件</span>
          <button class="btn btn-sm" id="btn-add-attach">＋ 添加附件</button>
        </label>
        <div id="attach-list">${renderAttachList()}</div>
        <div id="attach-form" style="display:none;background:var(--bg3);border-radius:8px;padding:12px;margin-top:8px">
          <div class="form-row" style="margin-bottom:8px">
            <div class="form-group" style="margin-bottom:0">
              <label style="font-size:12px">附件类型</label>
              <select id="at-type">
                ${ATTACH_TYPES.map(t => `<option>${t}</option>`).join('')}
              </select>
            </div>
            <div class="form-group" style="margin-bottom:0">
              <label style="font-size:12px">备注</label>
              <input id="at-remark" type="text" placeholder="可选备注">
            </div>
          </div>
          <div style="display:flex;gap:8px;align-items:center">
            <input id="at-file" type="file" style="flex:1;font-size:13px">
            <button class="btn btn-primary btn-sm" id="btn-confirm-attach">确认添加</button>
            <button class="btn btn-sm" id="btn-cancel-attach">取消</button>
          </div>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn" id="modal-cancel">取消</button>
      <button class="btn btn-primary" id="modal-save">保存</button>
    </div>
  </div>`);

  // 🔄 重新生成合同号
  document.getElementById('btn-regen-num')?.addEventListener('click', async () => {
    const btn = document.getElementById('btn-regen-num');
    btn.disabled = true;
    btn.textContent = '…';
    const res = await api('GET', '/contracts/generate-number');
    if (res?.contract_number) document.getElementById('ct-number').value = res.contract_number;
    btn.disabled = false;
    btn.textContent = '🔄';
  });

  // ── 客户 Autocomplete 逻辑 ──────────────────────────────────
  const custInput    = document.getElementById('ct-cust-input');
  const custDropdown = document.getElementById('ct-cust-dropdown');
  const custBadge    = document.getElementById('ct-cust-badge');

  // 根据当前选中客户过滤报价单下拉
  const updateQuotationSelect = (custId) => {
    const sel = document.getElementById('ct-quotation');
    if (!sel) return;
    const prev = sel.value;
    sel.innerHTML = '<option value="">-- 无 --</option>' +
      quotations
        .filter(q => !custId || q.customer_id == custId)
        .map(q => `<option value="${q.id}" ${q.id == prev ? 'selected' : ''}>${q.quote_number} - ${q.company_name||''}</option>`)
        .join('');
    // 若之前选中的报价单不属于该客户则清空
    if (prev && !quotations.find(q => q.id == prev && (!custId || q.customer_id == custId))) {
      sel.value = '';
    }
  };

  const renderCustDropdown = (kw) => {
    const lkw = kw.toLowerCase();
    const matched = kw
      ? customers.filter(x => x.company_name.toLowerCase().includes(lkw))
      : customers;
    if (!matched.length) {
      custDropdown.style.display = 'none';
      return;
    }
    custDropdown.innerHTML = matched.map(x => `
      <div class="ct-cust-opt" data-id="${x.id}" data-name="${x.company_name.replace(/"/g,'&quot;')}"
        style="padding:9px 12px;cursor:pointer;font-size:13px;border-bottom:1px solid var(--border)">
        ${x.company_name}
      </div>`).join('');
    custDropdown.style.display = '';
    // 绑定点击选中
    custDropdown.querySelectorAll('.ct-cust-opt').forEach(opt => {
      opt.addEventListener('mousedown', e => {
        e.preventDefault(); // 防止 input blur 先触发关闭
        _custId = parseInt(opt.dataset.id);
        custInput.value = opt.dataset.name;
        custBadge.style.display = 'inline';
        custDropdown.style.display = 'none';
        updateQuotationSelect(_custId);
      });
      opt.addEventListener('mouseover', () => { if (!opt.classList.contains('kbfocus')) opt.style.background = 'rgba(88,166,255,0.12)'; });
      opt.addEventListener('mouseout',  () => { if (!opt.classList.contains('kbfocus')) opt.style.background = ''; });
    });
  };

  custInput.addEventListener('input', () => {
    _custId = null;
    custBadge.style.display = 'none';
    renderCustDropdown(custInput.value.trim());
    updateQuotationSelect(null); // 无关联客户时显示全部报价单
  });
  custInput.addEventListener('focus', () => renderCustDropdown(custInput.value.trim()));
  custInput.addEventListener('blur',  () => setTimeout(() => { custDropdown.style.display = 'none'; }, 150));

  // 键盘上下键导航 + Enter 选中
  custInput.addEventListener('keydown', e => {
    if (!['ArrowDown','ArrowUp','Enter','Escape'].includes(e.key)) return;
    const opts = custDropdown.querySelectorAll('.ct-cust-opt');
    if (!opts.length && e.key !== 'Escape') return;
    const active = custDropdown.querySelector('.ct-cust-opt.kbfocus');
    let idx = Array.from(opts).indexOf(active);
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      if (custDropdown.style.display === 'none') { renderCustDropdown(custInput.value.trim()); return; }
      idx = (idx + 1) % opts.length;
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      idx = (idx - 1 + opts.length) % opts.length;
    } else if (e.key === 'Enter') {
      e.preventDefault();
      if (active) {
        _custId = parseInt(active.dataset.id);
        custInput.value = active.dataset.name;
        custBadge.style.display = 'inline';
        custDropdown.style.display = 'none';
        updateQuotationSelect(_custId);
      }
      return;
    } else if (e.key === 'Escape') {
      custDropdown.style.display = 'none';
      return;
    }
    opts.forEach(o => { o.classList.remove('kbfocus'); o.style.background = ''; o.style.color = ''; });
    opts[idx].classList.add('kbfocus');
    opts[idx].style.background = 'rgba(88,166,255,0.22)';
    opts[idx].style.color = 'var(--accent)';
    opts[idx].scrollIntoView({ block: 'nearest' });
  });

  // 状态checkbox toggle
  document.querySelectorAll('.status-check').forEach(lbl => {
    lbl.addEventListener('click', () => {
      const cb = lbl.querySelector('input');
      setTimeout(() => lbl.classList.toggle('checked', cb.checked), 0);
    });
  });

  // 报价单自动填充
  document.getElementById('ct-quotation')?.addEventListener('change', async e => {
    const qid = e.target.value;
    if (qid) {
      const q = await api('GET', '/quotations/' + qid);
      document.getElementById('ct-amount').value = q.total_amount || 0;
      if (q.customer_id) {
        // 报价单关联客户 → 自动填入 autocomplete
        const cust = customers.find(x => x.id == q.customer_id);
        if (cust) {
          _custId = cust.id;
          document.getElementById('ct-cust-input').value = cust.company_name;
          document.getElementById('ct-cust-badge').style.display = 'inline';
          document.getElementById('ct-cust-dropdown').style.display = 'none';
          updateQuotationSelect(_custId);
        }
      }
    }
  });

  // 附件：展开表单
  document.getElementById('btn-add-attach').onclick = () => {
    document.getElementById('attach-form').style.display = '';
    document.getElementById('btn-add-attach').style.display = 'none';
  };
  document.getElementById('btn-cancel-attach').onclick = () => {
    document.getElementById('attach-form').style.display = 'none';
    document.getElementById('btn-add-attach').style.display = '';
    document.getElementById('at-file').value = '';
  };
  document.getElementById('btn-confirm-attach').onclick = () => {
    const fileInput = document.getElementById('at-file');
    if (!fileInput.files.length) { alert('请选择文件'); return; }
    const file = fileInput.files[0];
    attachments.push({
      _saved: false,
      _file: file,
      file_name: file.name,
      file_size: file.size,
      attach_type: document.getElementById('at-type').value,
      remark: document.getElementById('at-remark').value,
    });
    document.getElementById('attach-list').innerHTML = renderAttachList();
    document.getElementById('attach-form').style.display = 'none';
    document.getElementById('btn-add-attach').style.display = '';
    document.getElementById('at-file').value = '';
    bindAttachDelete();
  };

  const bindAttachDelete = () => {
    document.querySelectorAll('[data-action=del-attach]').forEach(btn => {
      btn.onclick = async () => {
        const idx = parseInt(btn.dataset.idx);
        const a = attachments[idx];
        if (a._saved && a.id && c.id) {
          if (!confirm('确定删除该附件？')) return;
          await api('DELETE', `/contracts/${c.id}/attachments/${a.id}`);
        }
        attachments.splice(idx, 1);
        document.getElementById('attach-list').innerHTML = renderAttachList();
        bindAttachDelete();
      };
    });
  };
  bindAttachDelete();

  document.getElementById('modal-close').onclick = closeModal;
  document.getElementById('modal-cancel').onclick = closeModal;
  document.getElementById('modal-save').onclick = async () => {
    const custInputVal = document.getElementById('ct-cust-input').value.trim();
    const ctNum = document.getElementById('ct-number').value.trim();
    if (!c.id && !ctNum) { alert('合同号不能为空'); return; }
    const body = {
      contract_number: ctNum,
      customer_id: _custId || null,
      custom_company_name: _custId ? '' : custInputVal,
      quotation_id: parseInt(document.getElementById('ct-quotation').value) || null,
      content:   document.getElementById('ct-content').value,
      sign_date: document.getElementById('ct-sign-date')?.value || '',
      party_b:   document.getElementById('ct-party-b')?.value.trim() || '',
      remarks:   document.getElementById('ct-remarks')?.value.trim() || '',
      amount: parseFloat(document.getElementById('ct-amount').value) || 0,
      paid_amount: parseFloat(document.getElementById('ct-paid-amt').value) || 0,
      status_sent: document.getElementById('ct-sent').checked,
      status_replied: document.getElementById('ct-replied').checked,
      status_paid: document.getElementById('ct-status-paid').checked,
      status_shipped: document.getElementById('ct-shipped').checked,
      status_invoiced: document.getElementById('ct-invoiced').checked,
      status_completed: document.getElementById('ct-completed').checked,
    };
    try {
      let contractId = c.id;
      if (c.id) {
        await api('PUT', '/contracts/' + c.id, body);
      } else {
        const res = await api('POST', '/contracts', body);
        contractId = res.id;
      }
      // 上传待上传的附件
      for (const a of attachments) {
        if (!a._saved && a._file) {
          const fd = new FormData();
          fd.append('file', a._file);
          fd.append('attach_type', a.attach_type || '');
          fd.append('remark', a.remark || '');
          await fetch('/api/contracts/' + contractId + '/attachments', {
            method: 'POST',
            headers: { Authorization: 'Bearer ' + state.token },
            body: fd,
          });
        }
      }
      closeModal();
    } catch (e) { alert(e.message); }
  };
}

function fileIcon(name) {
  const ext = (name.split('.').pop() || '').toLowerCase();
  const map = { pdf: '📄', doc: '📝', docx: '📝', xls: '📊', xlsx: '📊', png: '🖼️', jpg: '🖼️', jpeg: '🖼️', zip: '🗜️', rar: '🗜️' };
  return map[ext] || '📎';
}
function fmtSize(bytes) {
  if (bytes < 1024) return bytes + 'B';
  if (bytes < 1024*1024) return (bytes/1024).toFixed(1) + 'KB';
  return (bytes/1024/1024).toFixed(1) + 'MB';
}

async function loadUsers(content, actions) {
  const canEdit = state.user.is_admin || hasPermission('users');
  actions.innerHTML = canEdit
    ? `<button class="btn btn-primary" id="btn-add-emp">＋ <span class="btn-text">新增员工</span></button>` : '';
  if (canEdit) document.getElementById('btn-add-emp')?.addEventListener('click', () => openEmployeeModal(null));

  const users = await api('GET', '/users');

  const permLabels = {
    products: '产品管理', inventory: '库存管理', customers: '客户管理',
    quotations: '报价系统', contracts: '合同管理', finance: '财务管理',
    bank: '银行流水', chat: '即时通讯', users: '员工管理',
    reports: '报表中心', sharefiles: '企业网盘', datacenter: '数据中心',
  };

  const renderPerms = (perms) => {
    let p = {};
    try { p = JSON.parse(perms || '{}'); } catch(e) {}
    return Object.keys(permLabels).filter(k => p[k]).map(k =>
      `<span class="badge badge-blue" style="margin:1px">${permLabels[k]}</span>`
    ).join('') || '<span style="color:var(--text3);font-size:12px">无权限</span>';
  };

  const deptBadge = dept => dept
    ? `<span class="badge badge-gray">${dept}</span>` : '<span style="color:var(--text3)">-</span>';

  content.innerHTML = `
  <div class="card">
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>姓名</th><th>用户名</th><th>部门</th><th>职位</th><th>等级</th>
            <th>邮箱</th><th>角色</th><th>权限</th>
            ${canEdit ? '<th>操作</th>' : ''}
          </tr>
        </thead>
        <tbody>
          ${users.map(u => `
          <tr>
            <td style="font-weight:600">${u.full_name||'-'}</td>
            <td class="mono" style="color:var(--text3)">${u.username}</td>
            <td>${deptBadge(u.department)}</td>
            <td style="color:var(--text2)">${u.position||'-'}</td>
            <td>${u.level ? `<span class="badge badge-yellow">${u.level}</span>` : '<span style="color:var(--text3)">-</span>'}</td>
            <td style="color:var(--text2);font-size:12px">${u.email||'-'}</td>
            <td>${u.is_admin ? '<span class="badge badge-purple">管理员</span>' : '<span class="badge badge-gray">员工</span>'}</td>
            <td style="max-width:200px">${u.is_admin ? '<span class="badge badge-blue">全部权限</span>' : renderPerms(u.permissions)}</td>
            ${canEdit ? `<td>
              <button class="btn btn-sm" data-action="edit-emp" data-id="${u.id}">编辑</button>
              ${u.id != state.user.user_id ? `<button class="btn btn-sm btn-danger" data-action="del-emp" data-id="${u.id}" style="margin-left:4px">删除</button>` : ''}
            </td>` : ''}
          </tr>`).join('')}
        </tbody>
      </table>
    </div>
  </div>`;

  if (!canEdit) return;

  document.querySelectorAll('[data-action=edit-emp]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const all = await api('GET', '/users');
      const u = all.find(x => x.id == btn.dataset.id);
      if (u) openEmployeeModal(u);
    });
  });
  document.querySelectorAll('[data-action=del-emp]').forEach(btn => {
    btn.addEventListener('click', async () => {
      if (!confirm('确定删除该员工账户？')) return;
      await api('DELETE', '/users/' + btn.dataset.id);
      loadPage();
    });
  });
}

// ── Combobox helper: select with custom input fallback ─────────
function combobox(id, options, value, placeholder) {
  const safeVal = (value || '').replace(/"/g, '&quot;');
  const isCustom = value && !options.includes(value);
  return `
  <div class="combobox-wrap" id="${id}-wrap">
    <select id="${id}-sel" style="display:${isCustom ? 'none' : 'block'}">
      <option value="">-- ${placeholder} --</option>
      ${options.map(o => `<option value="${o}" ${o===value?'selected':''}>${o}</option>`).join('')}
      <option value="__custom__">✏️ 自行输入…</option>
    </select>
    <div style="display:${isCustom ? 'flex' : 'none'};gap:4px" id="${id}-custom-row">
      <input id="${id}-input" value="${safeVal}" placeholder="${placeholder}" style="flex:1">
      <button type="button" class="btn btn-sm" id="${id}-back" title="返回列表">↩</button>
    </div>
  </div>`;
}

function comboboxVal(id) {
  const sel = document.getElementById(id + '-sel');
  const inp = document.getElementById(id + '-input');
  if (sel && sel.style.display !== 'none') return sel.value === '__custom__' ? '' : sel.value;
  return inp ? inp.value.trim() : '';
}

function attachCombobox(id) {
  const sel   = document.getElementById(id + '-sel');
  const row   = document.getElementById(id + '-custom-row');
  const inp   = document.getElementById(id + '-input');
  const back  = document.getElementById(id + '-back');
  if (!sel) return;
  sel.addEventListener('change', () => {
    if (sel.value === '__custom__') {
      sel.style.display = 'none';
      row.style.display = 'flex';
      inp.focus();
    }
  });
  back?.addEventListener('click', () => {
    inp.value = '';
    row.style.display = 'none';
    sel.style.display = 'block';
    sel.value = '';
  });
}

function openEmployeeModal(emp) {
  const e = emp || {};
  let perms = e.id
    ? (() => { try { return JSON.parse(e.permissions || '{}'); } catch(_) { return {}; } })()
    : { chat: true }; // 新用户默认开启即时通讯

  const DEPTS = ['技术部','销售部','市场部','产品部','财务部','人事部','行政部','运营部','客服部','采购部','法务部','研发部'];
  const POSITIONS = ['总经理','副总经理','总监','经理','主管','工程师','设计师','销售员','会计','出纳','行政专员','运营专员','客服专员','采购专员'];
  const LEVELS = ['P1','P2','P3','P4','P5','P6','P7','M1','M2','M3','实习生','高级','资深','专家'];
  const permLabels = {
    products: '产品管理', inventory: '库存管理', customers: '客户管理',
    quotations: '报价系统', contracts: '合同管理', finance: '财务管理',
    bank: '银行流水', chat: '即时通讯', users: '员工管理',
    reports: '报表中心', sharefiles: '企业网盘', datacenter: '数据中心',
  };

  showModal(`
  <div class="modal" style="max-width:560px">
    <div class="modal-header">${e.id ? '编辑员工' : '新增员工'}<span class="modal-close" id="modal-close">×</span></div>
    <div class="modal-body">

      <div style="font-size:12px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--border)">基本信息</div>
      <div class="form-row">
        <div class="form-group"><label>姓名</label><input id="e-fullname" value="${e.full_name||''}" placeholder="真实姓名"></div>
        <div class="form-group"><label>用户名 *</label><input id="e-username" value="${e.username||''}" placeholder="登录账号" ${e.id ? 'readonly style="opacity:0.6"' : ''}></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>邮箱</label><input id="e-email" type="email" value="${e.email||''}" placeholder="work@company.com"></div>
        <div class="form-group"><label>${e.id ? '新密码（留空不修改）' : '密码 *'}</label><input id="e-password" type="password" placeholder="${e.id ? '留空则不修改' : '请设置登录密码'}" autocomplete="new-password" value=""></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>工号 <span style="font-size:11px;color:var(--text3)">（留空则自动使用 ID）</span></label><input id="e-empid" value="${e.employee_id||''}" placeholder="如：EMP001、A2024"></div>
      </div>

      <div style="font-size:12px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:1px;margin:14px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--border)">职位信息</div>
      <div class="form-row">
        <div class="form-group"><label>所在部门</label>${combobox('e-dept', DEPTS, e.department||'', '选择部门')}</div>
        <div class="form-group"><label>职位</label>${combobox('e-pos', POSITIONS, e.position||'', '选择职位')}</div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>等级</label>${combobox('e-lvl', LEVELS, e.level||'', '选择等级')}</div>
        <div class="form-group"><label>角色</label>
          <select id="e-admin">
            <option value="0" ${!e.is_admin?'selected':''}>普通员工</option>
            <option value="1" ${e.is_admin?'selected':''}>管理员</option>
          </select>
        </div>
      </div>

      <div style="font-size:12px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:1px;margin:14px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--border)">模块权限</div>
      <div class="perm-grid">
        ${Object.keys(permLabels).map(k => `
        <label class="perm-item"><input type="checkbox" id="ep-${k}" ${perms[k]?'checked':''}> ${permLabels[k]}</label>`).join('')}

    </div>
    <div class="modal-footer">
      <button class="btn" id="modal-cancel">取消</button>
      <button class="btn btn-primary" id="modal-save">保存</button>
    </div>
  </div>`);

  attachCombobox('e-dept');
  attachCombobox('e-pos');
  attachCombobox('e-lvl');
  // 强制清空密码框，防止浏览器自动填充
  setTimeout(() => {
    const pw = document.getElementById('e-password');
    if (pw) pw.value = '';
  }, 50);

  document.getElementById('modal-close').onclick  = closeModal;
  document.getElementById('modal-cancel').onclick = closeModal;

    const username = document.getElementById('e-username').value.trim();
    if (!username) return alert('请输入用户名');
    const password = document.getElementById('e-password').value;
    if (!e.id && !password) return alert('请设置登录密码');

    const isAdmin = document.getElementById('e-admin').value === '1';
    const newPerms = {};
    Object.keys(permLabels).forEach(k => { newPerms[k] = document.getElementById('ep-' + k).checked; });

    const body = {
      username,
      full_name:   document.getElementById('e-fullname').value.trim(),
      email:       document.getElementById('e-email').value.trim(),
      department:  comboboxVal('e-dept'),
      position:    comboboxVal('e-pos'),
      level:       comboboxVal('e-lvl'),
      is_admin:    isAdmin,
      permissions: JSON.stringify(newPerms),
      employee_id: document.getElementById('e-empid')?.value.trim() || '',
    };
    if (password) body.password = password;

    try {
      if (e.id) await api('PUT', '/users/' + e.id, body);
      else       await api('POST', '/users', body);
      closeModal();
      loadPage();
    } catch(err) { alert(err.message); }
  };
}
