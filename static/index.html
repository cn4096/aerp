    ${!isDirect?`<button class="btn btn-sm" onclick="chatAddMember(${gid})" title="邀请成员">➕</button>`:''}
  </div>
  <div id="chat-msg-list" style="flex:1;overflow-y:auto;padding:12px 16px;display:flex;flex-direction:column;gap:2px"></div>
  <div id="chat-typing-hint" style="padding:0 16px 2px;font-size:12px;color:var(--text3);height:16px"></div>
  <div style="padding:8px 14px 10px;border-top:1px solid var(--border);background:var(--bg2)">

// ── Message rendering ─────────────────────────────────────────
function chatRenderMsgList() {
  const el = document.getElementById('chat-msg-list');
  if (!el || !_chat.activeGid) return;
  const msgs = _chat.msgs[_chat.activeGid] || [];
  if (!msgs.length) {
    el.innerHTML = `<div style="text-align:center;color:var(--text3);font-size:13px;padding:40px 0">暂无消息</div>`;
    return;
  }
  // load more button
  const hasMore = msgs.length >= 50;
  let html = hasMore
    ? `<div style="text-align:center;padding:4px 0 8px">
         <button class="btn btn-sm" onclick="chatLoadMore(${_chat.activeGid})" style="font-size:12px">加载更多</button>
       </div>`
    : '';
  let prevDate = '';
  msgs.forEach(m => {
    const _d = chatToCST(m.created_at);
    const d = _d ? `${_d.getFullYear()}-${String(_d.getMonth()+1).padStart(2,'0')}-${String(_d.getDate()).padStart(2,'0')}` : m.created_at.slice(0,10);
    if (d !== prevDate) {
      html += `<div style="text-align:center;margin:10px 0 6px"><span style="font-size:11px;color:var(--text3);background:var(--bg3);padding:2px 10px;border-radius:10px">${chatFmtDate(m.created_at)}</span></div>`;
      prevDate = d;
    }
    html += chatMsgHtml(m);
  });
  el.innerHTML = html;
}

function chatAppendMsg(msg) {
  const el = document.getElementById('chat-msg-list');
  if (!el) return;
  const empty = el.querySelector('[data-empty]');
  if (empty) empty.remove();
  // date separator
  const lastDate = el.querySelector('.chat-date-sep:last-of-type');
  const _md = chatToCST(msg.created_at);
  const msgDate = _md ? `${_md.getFullYear()}-${String(_md.getMonth()+1).padStart(2,'0')}-${String(_md.getDate()).padStart(2,'0')}` : msg.created_at.slice(0,10);
  if (!lastDate || lastDate.dataset.date !== msgDate) {
    const sep = document.createElement('div');
    sep.className = 'chat-date-sep';
    sep.dataset.date = msgDate;
    sep.style.cssText = 'text-align:center;margin:10px 0 6px';
    sep.innerHTML = `<span style="font-size:11px;color:var(--text3);background:var(--bg3);padding:2px 10px;border-radius:10px">${chatFmtDate(msg.created_at)}</span>`;
    el.appendChild(sep);
  }
  el.insertAdjacentHTML('beforeend', chatMsgHtml(msg));
}

function chatMsgHtml(m) {
  if (m.msg_type === 'system') {
    return `<div style="text-align:center;margin:4px 0">
      <span style="font-size:12px;color:var(--text3);background:var(--bg3);padding:2px 12px;border-radius:10px">${escHtml(m.content)}</span>
    </div>`;
  }
  const isMine = m.sender_id === state.user?.user_id;
  const name = chatDispNameFromMsg(m);
  const _cst = chatToCST(m.created_at);
  const time = _cst ? `${String(_cst.getHours()).padStart(2,'0')}:${String(_cst.getMinutes()).padStart(2,'0')}` : '';
  // 优先用 created_unix（Unix时间戳，无时区问题），fallback 到字符串解析
  const _msgTs = m.created_unix
    ? m.created_unix * 1000
    : new Date(m.created_at.replace(' ','T')).getTime();
  const canRevoke = isMine && !m.is_revoked
    && (Date.now() - _msgTs < 3600000);
  const bubble = m.is_revoked
    ? `<span style="font-style:italic;color:var(--text3);font-size:13px">消息已撤回</span>`
    : chatBubbleContent(m);
  const revokeBtn = canRevoke
    ? `<button onclick="chatRevoke(${m.id})" style="background:none;border:none;cursor:pointer;color:var(--text3);font-size:11px;padding:2px 4px;opacity:0.6" title="撤回">↩</button>`
    : '';
  if (isMine) {
    const myName = state.user?.full_name || state.user?.username || '我';
    return `<div class="chat-msg" data-id="${m.id}" style="display:flex;justify-content:flex-end;gap:8px;margin:3px 0;align-items:flex-end">
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:2px;max-width:65%">
        <div style="display:flex;align-items:center;gap:6px">
          <span style="font-size:11px;color:var(--text3)">${time}</span>
          ${revokeBtn}
          <span style="font-size:11px;color:var(--text3);font-weight:500">${escHtml(myName)}</span>
        </div>
        <div style="background:#2d333b;color:#e6edf3;border:1px solid #444c56;padding:8px 12px;border-radius:14px 14px 4px 14px;font-size:14px;line-height:1.5;word-break:break-word">${bubble}</div>
      </div>
      ${chatAvatar(myName, 32)}
    </div>`;
  } else {
    return `<div class="chat-msg" data-id="${m.id}" style="display:flex;gap:8px;margin:3px 0;align-items:flex-end">
      ${chatAvatar(name, 32)}
      <div style="display:flex;flex-direction:column;gap:2px;max-width:65%">
        <span style="font-size:11px;color:var(--text3);padding-left:4px">${escHtml(name)}</span>
        <div style="display:flex;align-items:center;gap:4px">
          <div style="background:var(--accent2);color:#e6edf3;padding:8px 12px;border-radius:14px 14px 14px 4px;font-size:14px;line-height:1.5;word-break:break-word">${bubble}</div>
          <span style="font-size:11px;color:var(--text3)">${time}</span>
        </div>
      </div>
    </div>`;
  }
}

let _emojiActiveCat = 0;

function chatToggleEmoji(gid) {
  const panel = document.getElementById('emoji-panel-' + gid);
  if (!panel) return;
  if (panel.style.display === 'none') {
    chatRenderEmojiPanel(gid);
    panel.style.display = 'block';
    // 点面板外部关闭，用 mousedown 避免与内部点击冲突
    setTimeout(() => {
      function _close(e) {
        const btn = document.getElementById('emoji-btn-' + gid);
        if (!panel.contains(e.target) && e.target !== btn && !btn?.contains(e.target)) {
          panel.style.display = 'none';
          document.removeEventListener('mousedown', _close);
        }
      }
      document.addEventListener('mousedown', _close);
    }, 0);
  } else {
    panel.style.display = 'none';
  }
}

function chatRenderEmojiPanel(gid) {
  const panel = document.getElementById('emoji-panel-' + gid);
  if (!panel) return;
  const cat = _EMOJI_CATS[_emojiActiveCat];
  const emojis = _EMOJI_LIST.slice(cat.start, cat.start + cat.count);

  // Category tabs —— 用 onmousedown + stopPropagation 阻止冒泡触发关闭
  const tabs = _EMOJI_CATS.map((cat, i) =>
    `<button onmousedown="event.stopPropagation();event.preventDefault();chatSwitchEmojiCat(${i},${gid})"
      style="background:${i===_emojiActiveCat?'var(--bg3)':'none'};border:none;border-radius:6px;
             padding:4px 8px;cursor:pointer;font-size:12px;color:${i===_emojiActiveCat?'var(--accent)':'var(--text3)'};white-space:nowrap">
      ${cat.name}
     </button>`
  ).join('');

  // Emoji grid —— 插入到输入框，不直接发送
  const grid = emojis.map(e =>
    `<button onmousedown="event.stopPropagation();event.preventDefault();chatInsertEmoji(${gid},'${e}')"
      style="background:none;border:none;cursor:pointer;font-size:22px;padding:3px;border-radius:6px;line-height:1.2"
      title="${e}"
      onmouseover="this.style.background='var(--bg3)'" onmouseout="this.style.background='none'">${e}</button>`
  ).join('');

  panel.innerHTML = `
    <div style="display:flex;gap:2px;flex-wrap:wrap;border-bottom:1px solid var(--border);padding-bottom:6px;margin-bottom:6px;overflow-x:auto">${tabs}</div>
    <div style="display:flex;flex-wrap:wrap;max-height:180px;overflow-y:auto">${grid}</div>`;
}

// 切换分类，不关闭面板
function chatSwitchEmojiCat(idx, gid) {
  _emojiActiveCat = idx;
  chatRenderEmojiPanel(gid);
}

// 把表情插入输入框光标位置，不发送
function chatInsertEmoji(gid, emoji) {
  const inp = document.getElementById('chat-input');
  if (!inp) return;
  const start = inp.selectionStart ?? inp.value.length;
  const end   = inp.selectionEnd   ?? inp.value.length;
  inp.value = inp.value.slice(0, start) + emoji + inp.value.slice(end);
  // 移动光标到插入点之后
  const pos = start + emoji.length;
  inp.setSelectionRange(pos, pos);
  inp.focus();
}

// ── 图片 / 附件上传 ────────────────────────────────────────────
function chatPickImage(gid) {
  const el = document.getElementById('chat-img-input');
  if (el) { el.dataset.gid = gid; el.value = ''; el.click(); }
}
function chatPickFile(gid) {
  const el = document.getElementById('chat-file-input');
  if (el) { el.dataset.gid = gid; el.value = ''; el.click(); }
}
async function chatUploadFile(gid, inputEl) {
  const file = inputEl.files[0];
  if (!file) return;
  await chatDoUpload(gid, file);
  inputEl.value = '';
}
function chatHandlePaste(e, gid) {
  const items = e.clipboardData?.items;
  if (!items) return;
  for (const item of items) {
    if (item.type.startsWith('image/')) {
      e.preventDefault();
      const file = item.getAsFile();
      if (file) chatDoUpload(gid, file);
      return;
    }
  }
}
async function chatDoUpload(gid, file) {
  const msgList = document.getElementById('chat-msg-list');
  const pid = 'upload-' + Date.now();
  if (msgList) {
    msgList.insertAdjacentHTML('beforeend',
      '<div id="' + pid + '" style="display:flex;justify-content:flex-end;margin:4px 0">' +
      '<div style="background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:8px 14px;font-size:13px;color:var(--text3)">' +
      '⏳ 上传中… ' + escHtml(file.name || '图片') + '</div></div>');
    chatScrollBottom();
  }
  try {
    const fd = new FormData();
    fd.append('group_id', gid);
    fd.append('file', file, file.name || ('paste_' + Date.now() + '.png'));
    const res = await fetch('/api/chat/upload', {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + state.token },
      body: fd
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.error || '上传失败');
    }
  } catch(err) {
    chatShowErr('上传失败：' + err.message);
  } finally {
    document.getElementById(pid)?.remove();
  }
}


function chatBubbleContent(m) {
  if (m.msg_type === 'image') {
    return `<img src="${escHtml(m.content)}" onclick="window.open('${escHtml(m.content)}','_blank')"
      style="max-width:240px;max-height:240px;border-radius:8px;display:block;cursor:pointer">`;
  }
  if (m.msg_type === 'file') {
    const parts = m.content.split('/');
    const fname = decodeURIComponent(parts[parts.length-1].replace(/^\d+_/, ''));
    return `<a href="${escHtml(m.content)}" target="_blank" download
      style="display:flex;align-items:center;gap:8px;color:inherit;text-decoration:none">
      <span style="font-size:22px">📎</span>
      <span style="font-size:13px;text-decoration:underline;word-break:break-all">${escHtml(fname)}</span>
    </a>`;
  }
  return escHtml(m.content).replace(/\n/g, '<br>');
}

function chatDispNameFromMsg(m) {
  if (m.full_name && m.full_name.trim()) return m.full_name;
  return m.username || m.sender_name || ('用户' + m.sender_id);
}

// ── Send & input ─────────────────────────────────────────────
function chatInputKeydown(e, gid) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    chatSend(gid);
  }
}

let _chatTypingTimer = null;
function chatOnInput(gid) {
  chatWsSend('typing', { group_id: gid, typing: true });
  clearTimeout(_chatTypingTimer);
  _chatTypingTimer = setTimeout(() => chatWsSend('typing', { group_id: gid, typing: false }), 2000);
}

function chatSend(gid) {
  const inp = document.getElementById('chat-input');
  if (!inp) return;
  const txt = inp.value.trim();
  if (!txt) return;
  chatWsSend('send_msg', { group_id: gid, content: txt, msg_type: 'text' });
  inp.value = '';
  inp.style.height = '';
  chatWsSend('typing', { group_id: gid, typing: false });
}

function chatRevoke(msgId) {
  if (!confirm('确认撤回该消息？（60分钟内可撤回）')) return;
  chatWsSend('revoke_msg', { msg_id: msgId });
}

function chatUpdateTypingHint() {
  const el = document.getElementById('chat-typing-hint');
  if (!el || !_chat.activeGid) return;
  const t = _chat.typing[_chat.activeGid];
  if (!t) { el.textContent = ''; return; }
  const names = Object.values(t).map(x => x.name).filter(Boolean);
  el.textContent = names.length ? names.join('、') + ' 正在输入…' : '';
}

function chatUpdateHeaderStatus() {
  if (!_chat.activeGid) return;
  const info = _chat.groupInfo[_chat.activeGid];
  if (!info || !info.is_direct) return;
  const peer = info.members?.find(m => m.user_id !== state.user?.user_id);
  if (!peer) return;
  const online = _chat.onlineSet.has(peer.user_id);
  const el = document.getElementById('chat-header');
  if (!el) return;
  const span = el.querySelector('.online-status');
  if (span) {
    span.style.color = online ? 'var(--green)' : 'var(--text3)';
    span.textContent = online ? '● 在线' : '○ 离线';
  }
}

// ── Load more ─────────────────────────────────────────────────
async function chatLoadMore(gid) {
  const existing = _chat.msgs[gid] || [];
  if (!existing.length) return;
  const oldest = existing[0].id;
  const more = await chatLoadMsgs(gid, oldest);
  _chat.msgs[gid] = [...more, ...existing];
  chatRenderMsgList();
  // restore scroll
  const el = document.getElementById('chat-msg-list');
  if (el) el.scrollTop = 60;
}

// ── Scroll ────────────────────────────────────────────────────
function chatScrollBottom() {
  const el = document.getElementById('chat-msg-list');
  if (el) requestAnimationFrame(() => { el.scrollTop = el.scrollHeight; });
}

// ── New direct chat ───────────────────────────────────────────
function chatNewDirect() {
  const contacts = _chat.contacts;
  _chatShowModal(`
  <div class="modal">
    <div class="modal-header"><span>发起私聊</span><button class="btn-close" onclick="chatCloseModal()">×</button></div>

      <div id="contact-list" style="max-height:320px;overflow-y:auto">
        ${chatContactListHtml(contacts)}
      </div>
    </div>
  </div>`);
}

function chatAvatar(name, size) {
  const n = (name || '?').trim();
  const ch = n.slice(-2);  // last 1-2 chars (works for Chinese names)
  const colors = ['#1f6feb','#388bfd','#7c3aed','#d97706','#059669','#dc2626','#0891b2'];
  let hash = 0;
  for (let i = 0; i < n.length; i++) hash = (hash * 31 + n.charCodeAt(i)) & 0xffff;
  const bg = colors[hash % colors.length];
  return `<div style="width:${size}px;height:${size}px;border-radius:50%;background:${bg};display:flex;align-items:center;justify-content:center;font-size:${Math.max(10,size*0.35)}px;color:#fff;font-weight:600;flex-shrink:0;user-select:none">${escHtml(ch)}</div>`;
}

// 将 UTC 时间字符串解析为本地 Date 对象（自动跟随用户电脑时区）
function chatToCST(dt) {
  if (!dt) return null;
  // 末尾加 Z 确保浏览器按 UTC 解析，再由 Date 对象自动转本地时区
  return new Date(dt.replace(' ', 'T') + (dt.includes('+') || dt.endsWith('Z') ? '' : 'Z'));
}

function chatFmtTime(dt) {
  if (!dt) return '';
  const d = chatToCST(dt);
  const now = new Date();
  // 今天本地0点
  const todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const diffDays = Math.floor((now - d) / 86400000);
  const hh = String(d.getHours()).padStart(2, '0');
  const mm = String(d.getMinutes()).padStart(2, '0');
  if (d >= todayStart) return `${hh}:${mm}`;
  if (diffDays === 1) return '昨天';
  if (diffDays < 7) return ['周日','周一','周二','周三','周四','周五','周六'][d.getDay()];
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function chatFmtDate(dt) {
  if (!dt) return '';
  const d = chatToCST(dt);
  const now = new Date();
  const todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const yesterdayStart = new Date(todayStart.getTime() - 86400000);
  if (d >= todayStart) return '今天';
  if (d >= yesterdayStart) return '昨天';
  if (d.getFullYear() === now.getFullYear()) return `${d.getMonth()+1}月${d.getDate()}日`;
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

// ── 加载目录 ──────────────────────────────────────────────────────────────
async function sfLoadDir(dirID) {
  _sf.dirID = dirID;
  _sf.selected.clear();
  _sf.lastClickedIdx = -1;
  _sf.multiSelect = false;
  _sf.searchQuery = '';
  const se = document.getElementById('sf-search');
  if (se) { se.value = ''; }
  const sc = document.getElementById('sf-search-clear');
  if (sc) sc.style.display = 'none';

  let data;
  try { data = await api('GET', `/share/dirs/${dirID}`); }
  catch(e) {
    const el = document.getElementById('sf-list');
    if (el) el.innerHTML = `<div class="sf-empty"><div class="icon">🔒</div>${escHtml(e.message||'无访问权限')}</div>`;
    sfRenderToolbar();
    return;
  }
  _sf.canWrite = data.can_write;
  _sf.currentData = data;

  sfRenderBreadcrumb(data.breadcrumb);
  sfRenderToolbar();
  sfBuildAndRender('');
}

// ── 构建 allItems 并渲染 ──────────────────────────────────────────────────
function sfBuildAndRender(query) {
  const data = _sf.currentData;
  if (!data) return;
  const dirs = data.dirs || [];
  const files = data.files || [];
  const q = query.trim().toLowerCase();

  let filteredDirs  = q ? dirs.filter(d  => d.name.toLowerCase().includes(q))  : dirs;
  let filteredFiles = q ? files.filter(f => f.name.toLowerCase().includes(q)) : files;

  // 构建 allItems 供 Shift 多选使用
  _sf.allItems = [
    ...filteredDirs.map(d  => ({ type:'d', ...d })),
    ...filteredFiles.map(f => ({ type:'f', ...f })),
  ];

  const el = document.getElementById('sf-list');
  if (!el) return;

  if (_sf.allItems.length === 0) {
    el.innerHTML = q
      ? `<div class="sf-empty"><div class="icon">🔍</div>未找到"${escHtml(query)}"</div>`
      : `<div class="sf-empty"><div class="icon">📂</div>此目录为空</div>`;
    return;
  }

  const hl = (name) => {
    if (!q) return escHtml(name);
    const i = name.toLowerCase().indexOf(q);
    if (i < 0) return escHtml(name);
    return escHtml(name.slice(0,i)) + `<mark class="sf-hl">${escHtml(name.slice(i,i+q.length))}</mark>` + escHtml(name.slice(i+q.length));
  };

  if (_sf.viewMode === 'grid') sfRenderGrid(hl);
  else sfRenderList(hl);
}

// ── 列表视图 ─────────────────────────────────────────────────────────────
function sfRenderList(hl) {
  const el = document.getElementById('sf-list');
  const isAdmin = !!state.user?.is_admin;
  const thW   = _sf.multiSelect ? '28px' : '0';
  const thPad = _sf.multiSelect ? '6px 4px 6px 10px' : '0';
  const thChk = _sf.multiSelect ? '<input type="checkbox" class="sf-chk" id="sf-chk-all" onchange="sfToggleAll(this.checked)" title="全选">' : '';
  let html = `<table class="sf-list-table">
    <thead><tr>
      <th style="width:${thW};padding:${thPad};overflow:hidden">
        ${thChk}
      </th>
      <th style="width:80px;text-align:right">大小</th>
      <th style="width:90px">上传人</th>
      <th style="width:110px">时间</th>
    </tr></thead><tbody>`;

  _sf.allItems.forEach((item, idx) => {
    const key = `${item.type}:${item.id}`;
    const isSel = _sf.selected.has(key);
    const selCls = isSel ? 'sf-sel' : '';
    const chk = _sf.multiSelect
      ? `<input type="checkbox" class="sf-chk sf-row-chk" data-key="${key}" data-idx="${idx}"
         ${isSel?'checked':''} onclick="event.stopPropagation();sfRowChkClick(event,${idx})" title="选择">`
      : '';

    if (item.type === 'd') {
      const canEnter = item.can_read;
      const gray = canEnter ? '' : 'sf-noperm';
      const noPermTip = canEnter ? '' : `<span style="font-size:11px;color:var(--text3)">(无权限)</span>`;
      const adminOps = isAdmin ? `
        <button class="btn btn-xs" onclick="event.stopPropagation();sfEditDirModal(${item.id},\`${escHtml(item.name)}\`,${item.max_file_mb})" title="编辑">✏️</button>
        <button class="btn btn-xs" onclick="event.stopPropagation();sfPermModal(${item.id},\`${escHtml(item.name)}\`)" title="权限">🔐</button>` : '';
      html += `<tr class="sf-row ${selCls} ${gray}" data-key="${key}" data-idx="${idx}"
          onclick="sfRowClick(event,${idx})"
          ondblclick="sfDirEnter(${item.id},${!canEnter})">
        ${_sf.multiSelect ? '<td style="padding:6px 4px 6px 10px">' + chk + '</td>' : ''}
        <td><div class="sf-name-cell">
          <span class="sf-file-icon">📁</span>
          <span class="nm">${hl(item.name)}</span>${noPermTip}
          <span style="margin-left:4px">${adminOps}</span>
        </div></td>
        <td style="text-align:right;color:var(--text3)">—</td>
        <td style="color:var(--text3)">—</td>
        <td style="color:var(--text3);font-size:12px">${(item.created_at||'').slice(0,10)}</td>
      </tr>`;
    } else {
      const icon = sfFileIcon(item.mime_type, item.name);
      const badge = item.is_shared ? `<span class="sf-shared-badge">分享</span>` : '';
      html += `<tr class="sf-row ${selCls}" data-key="${key}" data-idx="${idx}"
          onclick="sfRowClick(event,${idx})">
        ${_sf.multiSelect ? '<td style="padding:6px 4px 6px 10px">' + chk + '</td>' : ''}
        <td><div class="sf-name-cell">
          <span class="sf-file-icon">${icon}</span>
          <span class="nm">${hl(item.name)}</span>${badge}
        </div></td>
        <td style="text-align:right;color:var(--text3);white-space:nowrap">${sfFmtSize(item.size)}</td>
        <td style="color:var(--text3);overflow:hidden;text-overflow:ellipsis;max-width:90px;white-space:nowrap">${escHtml(item.uploader_name||'')}</td>
        <td style="color:var(--text3);font-size:12px;white-space:nowrap">${(item.created_at||'').slice(0,16)}</td>
      </tr>`;
    }
  });
  html += `</tbody></table>`;
  el.innerHTML = html;
  sfSyncCheckAll();
}

// ── 选中逻辑 ─────────────────────────────────────────────────────────────
function sfRowClick(event, idx) {
  // 点击 checkbox 由 sfRowChkClick 处理，这里忽略
  if (event.target.type === 'checkbox') return;
  const item = _sf.allItems[idx];
  if (!item) return;
  const key = `${item.type}:${item.id}`;

  if (_sf.multiSelect) {
    // 多选模式：支持 Shift 范围选、Ctrl 切换
    if (event.shiftKey && _sf.lastClickedIdx >= 0) {
      const lo = Math.min(_sf.lastClickedIdx, idx);
      const hi = Math.max(_sf.lastClickedIdx, idx);
      for (let i = lo; i <= hi; i++) {
        const it = _sf.allItems[i];
        _sf.selected.add(`${it.type}:${it.id}`);
      }
    } else if (event.ctrlKey || event.metaKey) {
      if (_sf.selected.has(key)) _sf.selected.delete(key);
      else _sf.selected.add(key);
      _sf.lastClickedIdx = idx;
    } else {
      // 多选模式下普通点击 = 切换该项
      if (_sf.selected.has(key)) _sf.selected.delete(key);
      else _sf.selected.add(key);
      _sf.lastClickedIdx = idx;
    }
  } else {
    // 单选模式：点击 = 选中，再次点击同一项 = 取消
    if (_sf.selected.size === 1 && _sf.selected.has(key)) {
      _sf.selected.clear();
      _sf.lastClickedIdx = -1;
    } else {
      _sf.selected.clear();
      _sf.selected.add(key);
      _sf.lastClickedIdx = idx;
    }
  }
  sfRefreshSelection();
}

function sfRowChkClick(event, idx) {
  const item = _sf.allItems[idx];
  if (!item) return;
  const key = `${item.type}:${item.id}`;
  if (event.target.checked) {
    _sf.selected.add(key);
    _sf.lastClickedIdx = idx;
  } else {
    _sf.selected.delete(key);
  }
  sfRefreshSelection();
}

function sfToggleAll(checked) {
  if (checked) {
    _sf.allItems.forEach(item => _sf.selected.add(`${item.type}:${item.id}`));
  } else {
    _sf.selected.clear();
  }
  sfRefreshSelection();
}

function sfSyncCheckAll() {
  const ca = document.getElementById('sf-chk-all');
  if (!ca) return;
  const total = _sf.allItems.length;
  const selCnt = _sf.selected.size;
  ca.indeterminate = selCnt > 0 && selCnt < total;
  ca.checked = total > 0 && selCnt === total;
}

// 不重新渲染整个列表，只更新 class 和 checkbox 状态
function sfRefreshSelection() {
  // 更新行 class 和 checkbox
  document.querySelectorAll('[data-key]').forEach(el => {
    const key = el.dataset.key;
    const sel = _sf.selected.has(key);
    if (el.type === 'checkbox') {
      el.checked = sel;
    } else {
      el.classList.toggle('sf-sel', sel);
    }
  });
  sfSyncCheckAll();
  sfRenderToolbar();
}

// 切换多选模式
function sfSetMultiSelect(on) {
  _sf.multiSelect = on;
  if (!on) {
    _sf.selected.clear();
    _sf.lastClickedIdx = -1;
  }
  // 重新渲染列表以显示/隐藏 checkbox 列
  sfBuildAndRender(document.getElementById('sf-search')?.value || '');
  sfRenderToolbar();
}

// 操作完毕后关闭多选并清空选中
function sfEndMultiSelect() {
  _sf.multiSelect = false;
  _sf.selected.clear();
  _sf.lastClickedIdx = -1;
}

function sfDirEnter(dirID, noPerm) {
  if (noPerm) { sfToast('您没有该目录的访问权限', 'error'); return; }
  _sf.selected.clear();
  sfLoadDir(dirID);
}

// ── 工具栏操作 ────────────────────────────────────────────────────────────
function sfGetSelectedFiles() {
  return _sf.allItems.filter(it => it.type === 'f' && _sf.selected.has(`f:${it.id}`));
}
function sfGetSelectedDirs() {
  return _sf.allItems.filter(it => it.type === 'd' && _sf.selected.has(`d:${it.id}`));
}

async function sfActDownload() {
  sfGetSelectedFiles().forEach(f => {
    const a = document.createElement('a');
    a.href = `/api/share/files/${f.id}/download?token=${state.token}`;
    a.download = f.name; a.click();
  });
}

async function sfActRename() {
  const files = sfGetSelectedFiles();
  if (files.length !== 1) return;
  const f = files[0];
  const n = prompt('重命名', f.name);
  if (!n || n.trim() === f.name) return;
  await api('PUT', `/share/files/${f.id}/rename`, { name: n.trim() });
  sfEndMultiSelect();
  sfLoadDir(_sf.dirID);
}

function sfActCopy() {
  const files = sfGetSelectedFiles();
  if (!files.length) return;
  _sf.clipboard = { type:'copy', items: files.map(f=>({type:'f',id:f.id,name:f.name})) };
  sfToast(`已复制 ${files.length} 个文件，进入目标目录后点击粘贴`);
  sfEndMultiSelect();
  sfRenderToolbar();
}

function sfActCut() {
  const files = sfGetSelectedFiles();
  if (!files.length) return;
  _sf.clipboard = { type:'cut', items: files.map(f=>({type:'f',id:f.id,name:f.name})) };
  sfToast(`已剪切 ${files.length} 个文件，进入目标目录后点击粘贴`);
  sfEndMultiSelect();
  sfRenderToolbar();
}

async function sfPaste() {
  if (!_sf.clipboard) return;
  const { type, items } = _sf.clipboard;
  const endpoint = type === 'copy' ? 'copy' : 'move';
  let ok = 0, fail = 0;
  for (const item of items) {
    try {
      await api('POST', `/share/files/${item.id}/${endpoint}`, { target_dir_id: _sf.dirID });
      ok++;
    } catch(e) { fail++; sfToast(`${item.name}: ${e.message}`, 'error'); }
  }
  if (ok) sfToast(`已${type==='copy'?'复制':'移动'} ${ok} 个文件到当前目录`);
  sfEndMultiSelect();
  if (type === 'cut') _sf.clipboard = null;
  sfLoadDir(_sf.dirID);
}

async function sfActShare() {
  const files = sfGetSelectedFiles();
  if (files.length !== 1) return;
  const f = files[0];
  if (!confirm(`将"${f.name}"分享到公共盘根目录？（不复制文件，仅添加引用）`)) return;
  await api('POST', `/share/files/${f.id}/share`);
  sfEndMultiSelect();
  sfToast('已分享到公共盘根目录');
}

async function sfActDelete() {
  const files = sfGetSelectedFiles();
  const dirs  = sfGetSelectedDirs();
  const total = files.length + dirs.length;
  if (!total) return;
  const msg = total === 1
    ? `将"${(files[0]||dirs[0]).name}"移入回收站？`
    : `将 ${total} 个项目移入回收站？`;
  if (!confirm(msg)) return;
  for (const f of files) await api('DELETE', `/share/files/${f.id}`);
  for (const d of dirs) {
    try { await api('DELETE', `/share/dirs/${d.id}`); }
    catch(e) { sfToast(`"${d.name}": ${e.message}`, 'error'); }
  }
  sfEndMultiSelect();
  sfLoadDir(_sf.dirID);
}

// ── 面包屑 ────────────────────────────────────────────────────────────────
function sfRenderBreadcrumb(crumbs) {
  const el = document.getElementById('sf-breadcrumb');
  if (!el) return;
  let html = `<span class="sf-crumb" onclick="sfLoadDir(0)">🏠 根目录</span>`;
  if (crumbs && crumbs.length) {
    crumbs.forEach((c, i) => {
      html += `<span class="sf-crumb-sep">/</span>`;
      if (i === crumbs.length - 1)
        html += `<span class="sf-crumb-cur">${escHtml(c.name)}</span>`;
      else
        html += `<span class="sf-crumb" onclick="sfLoadDir(${c.id})">${escHtml(c.name)}</span>`;
    });
  }
  el.innerHTML = html;
}

// ── 上传 ──────────────────────────────────────────────────────────────────
function sfTriggerUpload() { document.getElementById('sf-file-input')?.click(); }
async function sfDoUpload(input) {
  const files = input.files;
  if (!files || !files.length) return;
  let ok = 0;
  for (const file of files) {
    const fd = new FormData();
    fd.append('file', file);
    try {
      const r = await fetch(`/api/share/dirs/${_sf.dirID}/upload`, {
        method:'POST', headers:{ Authorization:'Bearer '+state.token }, body:fd });
      const j = await r.json();
      if (!r.ok) throw new Error(j.error||'上传失败');
      ok++;
    } catch(e) { sfToast('上传失败: '+e.message,'error'); }
  }
  input.value = '';
  if (ok) sfToast(`成功上传 ${ok} 个文件`);
  sfLoadDir(_sf.dirID);
}

// ── Toast ─────────────────────────────────────────────────────────────────
function sfToast(msg, type) {
  const el = document.createElement('div');
  el.style.cssText = `position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
    background:${type==='error'?'#c62828':'#1b5e20'};color:#fff;padding:9px 22px;
    border-radius:8px;font-size:13px;z-index:9999;white-space:nowrap;
    box-shadow:0 4px 16px rgba(0,0,0,.35)`;
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), 2800);
}

// ── 辅助 ──────────────────────────────────────────────────────────────────
function sfFileIcon(mime, name) {
  if (!mime) mime='';
  const n=(name||'').toLowerCase();
  if (mime.startsWith('image/')) return '🖼️';
  if (mime.startsWith('video/')) return '🎬';
  if (mime.startsWith('audio/')) return '🎵';
  if (mime.includes('pdf')) return '📕';
  if (mime.includes('word')||/\.docx?$/.test(n)) return '📘';
  if (mime.includes('excel')||mime.includes('spreadsheet')||/\.xlsx?$/.test(n)) return '📗';
  if (mime.includes('presentation')||/\.pptx?$/.test(n)) return '📙';
  if (mime.includes('zip')||/\.(zip|rar|7z|tar|gz)$/.test(n)) return '📦';
  if (mime.includes('text')||/\.(txt|md|csv|log)$/.test(n)) return '📄';
  if (/\.(js|ts|go|py|java|c|cpp|sh|json|yaml|xml|html|css)$/.test(n)) return '💻';
  return '📎';
}
function sfFmtSize(b) {
  if (!b) return '—';
  if (b<1024) return b+' B';
  if (b<1048576) return (b/1024).toFixed(1)+' KB';
  if (b<1073741824) return (b/1048576).toFixed(1)+' MB';
  return (b/1073741824).toFixed(2)+' GB';
}

// ── 部门权限 ──────────────────────────────────────────────────────────────
function sfDeptPermsHtml(allDepts, currentPerms) {
  const deptMap={};
  (currentPerms||[]).forEach(p=>{ deptMap[p.department]=p; });
  const mkRow=(key,label)=>{
    const p=deptMap[key]||{};
    return `<label style="display:flex;align-items:center;gap:10px;padding:7px 8px;
        border-bottom:1px solid var(--border);cursor:pointer;user-select:none">
      <input type="checkbox" class="sfp-read" data-dept="${escHtml(key)}"
        ${p.department!==undefined?'checked':''} style="width:15px;height:15px;flex-shrink:0;accent-color:var(--accent)">
      <span style="flex:1;font-size:13px">${escHtml(label)}</span>
      <span style="font-size:11px;color:var(--text3)">可上传/删除</span>
      <input type="checkbox" class="sfp-write" data-dept="${escHtml(key)}"
        ${p.can_write?'checked':''} style="width:15px;height:15px;flex-shrink:0;accent-color:var(--accent)">
    </label>`;
  };
  let rows=mkRow('*','🌐 全员');
  allDepts.forEach(d=>{ rows+=mkRow(d,d); });
  return rows||'<div style="padding:10px;color:var(--text3);font-size:13px">暂无部门数据（请先在员工管理中填写部门）</div>';
}
function sfCollectPerms() {
  const perms=[];
  document.querySelectorAll('#sf-modal-overlay .sfp-read').forEach(el=>{
    if (el.checked) {
      const dept=el.dataset.dept;
      const we=document.querySelector(`#sf-modal-overlay .sfp-write[data-dept="${dept}"]`);
      perms.push({department:dept, can_write:we?.checked||false});
    }
  });
  return perms;
}

// ── 新建/编辑/删除文件夹 ─────────────────────────────────────────────────
async function sfNewDirModal() {
  const isAdmin = !!state.user?.is_admin;
  let allDepts=[];
  if (isAdmin) {
    try { const d=await api('GET','/share/departments'); allDepts=d.departments||[]; } catch(e){}
  }

  // 非管理员：只显示文件夹名称
  const adminFields = isAdmin ? `
    <div class="form-row" style="margin-top:20px">
      <label class="form-label" style="margin-bottom:6px">单文件大小限制（MB）</label>
      <input id="sfm-maxmb" class="form-input" type="number" value="100" min="1" max="10240">
    </div>
    <div class="form-row" style="margin-top:20px">
      <label class="form-label" style="margin-bottom:8px">访问权限</label>
      <div style="border:1px solid var(--border);border-radius:6px;max-height:220px;overflow-y:auto;background:var(--bg3)">
        ${sfDeptPermsHtml(allDepts,[])}
      </div>
      <div style="font-size:11px;color:var(--text3);margin-top:6px">勾选可访问；右侧勾选可上传/删除</div>
    </div>` : '';

  sfModal(`
    <div style="font-size:16px;font-weight:600;margin-bottom:20px">📁 新建文件夹</div>
    <div class="form-row">
      <label class="form-label" style="margin-bottom:6px">文件夹名称</label>
      <input id="sfm-name" class="form-input" placeholder="请输入名称" onkeydown="if(event.key==='Enter')sfDoCreateDir()">
    </div>
    ${adminFields}
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:24px">
      <button class="btn" onclick="sfCloseModal()">取消</button>
      <button class="btn btn-primary" onclick="sfDoCreateDir()">创建</button>
    </div>`);
  setTimeout(()=>document.getElementById('sfm-name')?.focus(),50);
}
async function sfDoCreateDir() {
  const name=document.getElementById('sfm-name')?.value.trim();
  const maxMB=parseInt(document.getElementById('sfm-maxmb')?.value)||100;
  if (!name){ sfToast('请输入文件夹名称','error'); return; }
  const res=await api('POST','/share/dirs',{name,parent_id:_sf.dirID,max_file_mb:maxMB});
  const perms=sfCollectPerms();
  if (perms.length>0) await api('PUT',`/share/dirs/${res.id}/perms`,{perms});
  sfCloseModal(); sfLoadDir(_sf.dirID);
}
async function sfEditDirModal(id,name,maxMB) {
  let allDepts=[],currentPerms=[];
  try {
    const [dd,dird]=await Promise.all([api('GET','/share/departments'),api('GET',`/share/dirs/${id}`)]);
    allDepts=dd.departments||[]; currentPerms=dird.perms||[];
  } catch(e){}
  sfModal(`
    <div style="font-size:16px;font-weight:600;margin-bottom:16px">✏️ 编辑文件夹</div>
    <div class="form-row"><label class="form-label">文件夹名称</label>
      <input id="sfm-name" class="form-input" value="${escHtml(name)}"></div>
    <div class="form-row"><label class="form-label">单文件大小限制（MB）</label>
      <input id="sfm-maxmb" class="form-input" type="number" value="${maxMB}" min="1" max="10240"></div>
    <div class="form-row"><label class="form-label">访问权限</label>
      <div style="border:1px solid var(--border);border-radius:6px;max-height:200px;overflow-y:auto;background:var(--bg3)">
        ${sfDeptPermsHtml(allDepts,currentPerms)}
      </div>
    </div>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:20px">
      <button class="btn" onclick="sfCloseModal()">取消</button>
      <button class="btn btn-primary" onclick="sfDoUpdateDir(${id})">保存</button>
    </div>`);
}
async function sfDoUpdateDir(id) {
  const name=document.getElementById('sfm-name')?.value.trim();
  const maxMB=parseInt(document.getElementById('sfm-maxmb')?.value)||100;
  if (!name){ sfToast('请输入名称','error'); return; }
  await api('PUT',`/share/dirs/${id}`,{name,max_file_mb:maxMB});
  await api('PUT',`/share/dirs/${id}/perms`,{perms:sfCollectPerms()});
  sfToast('保存成功'); sfCloseModal(); sfLoadDir(_sf.dirID);
}
async function sfDeleteDir(id,name) {
  if (!confirm(`删除文件夹"${name}"？（目录必须为空）`)) return;
  try { await api('DELETE',`/share/dirs/${id}`); sfLoadDir(_sf.dirID); }
  catch(e){ sfToast(e.message,'error'); }
}
async function sfPermModal(dirID,dirName) {
  let allDepts=[],currentPerms=[];
  try {
    const [dd,dird]=await Promise.all([api('GET','/share/departments'),api('GET',`/share/dirs/${dirID}`)]);
    allDepts=dd.departments||[]; currentPerms=dird.perms||[];
  } catch(e){}
  sfModal(`
    <div style="font-size:16px;font-weight:600;margin-bottom:4px">🔐 目录权限</div>
    <div style="color:var(--text3);font-size:13px;margin-bottom:14px">${escHtml(dirName)}</div>
    <div style="border:1px solid var(--border);border-radius:6px;max-height:320px;overflow-y:auto;background:var(--bg3)">
      ${sfDeptPermsHtml(allDepts,currentPerms)}
    </div>
    <div style="font-size:11px;color:var(--text3);margin-top:6px">勾选可访问；右侧勾选可上传/删除</div>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:20px">
      <button class="btn" onclick="sfCloseModal()">取消</button>
      <button class="btn btn-primary" onclick="sfSavePerms(${dirID})">保存</button>
    </div>`,'lg');
}
async function sfSavePerms(dirID) {
  await api('PUT',`/share/dirs/${dirID}/perms`,{perms:sfCollectPerms()});
  sfToast('权限已保存'); sfCloseModal(); sfLoadDir(_sf.dirID);
}

// ── 回收站 ────────────────────────────────────────────────────────────────
async function sfOpenTrash() {
  const data=await api('GET','/share/trash');
  const items=data.items||[];
  sfModal(`
    <div style="font-size:16px;font-weight:600;margin-bottom:4px">🗑 回收站</div>
    <div style="color:var(--text3);font-size:12px;margin-bottom:10px">文件保留30天后自动彻底删除</div>
    ${state.user?.is_admin ? '<div style="text-align:right;margin-bottom:10px"><button class="btn btn-danger btn-sm" onclick="sfTrashClearAll()">清空回收站</button></div>' : ''}
    <div style="max-height:400px;overflow-y:auto">
      ${items.length===0 ? '<div class="sf-empty" style="padding:30px 0"><div class="icon">✨</div>回收站为空</div>'
        : `<table class="sf-list-table">
          <thead><tr><th>文件名</th><th>原目录</th>
            <th style="text-align:center;width:60px">剩余</th>
            <th style="width:70px">删除人</th>
            <th style="text-align:right;width:130px">操作</th>
          </tr></thead><tbody>
          ${items.map(t=>`<tr class="sf-row">
            <td>${escHtml(t.name)}</td>
            <td style="color:var(--text3)">${escHtml(t.dir_name)}</td>
            <td style="text-align:center;color:${t.days_left<=5?'var(--red)':'var(--text3)'}">${t.days_left}天</td>
            <td style="color:var(--text3)">${escHtml(t.deleted_by_name)}</td>
            <td style="text-align:right">
              <button class="btn btn-xs" onclick="sfTrashRestore(${t.id})">↩ 还原</button>
              ${state.user?.is_admin ? '<button class="btn btn-xs btn-danger" onclick="sfTrashDeleteOne(' + t.id + ')">彻底删除</button>' : ''}

            </td>
          </tr>`).join('')}
          </tbody></table>`}
    </div>
    <div style="text-align:right;margin-top:14px">
      <button class="btn" onclick="sfCloseModal()">关闭</button>
    </div>`,'lg');
}
async function sfTrashRestore(id) {
  await api('POST',`/share/trash/${id}/restore`);
  sfToast('文件已还原'); sfOpenTrash(); sfLoadDir(_sf.dirID);
}
async function sfTrashDeleteOne(id) {
  if (!confirm('彻底删除？无法恢复！')) return;
  await api('DELETE',`/share/trash/${id}`); sfOpenTrash();
}
async function sfTrashClearAll() {
  if (!confirm('清空所有回收站文件？操作不可撤销！')) return;
  await api('DELETE','/share/trash');
  sfToast('回收站已清空'); sfCloseModal();
}

// ── 弹窗 ──────────────────────────────────────────────────────────────────
function sfModal(html,size) {
  document.getElementById('sf-modal-overlay')?.remove();
  const ov=document.createElement('div');
  ov.id='sf-modal-overlay';
  ov.style.cssText=`position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:8000;
    display:flex;align-items:center;justify-content:center;padding:16px`;
  ov.innerHTML=`<div style="background:var(--bg2);border-radius:12px;padding:24px;width:100%;
    max-width:${size==='lg'?'700px':'500px'};max-height:90vh;overflow-y:auto;
    box-shadow:0 20px 60px rgba(0,0,0,.5)">${html}</div>`;
  ov.addEventListener('click',e=>{ if(e.target===ov)sfCloseModal(); });
  document.body.appendChild(ov);
  return ov;
}
function sfCloseModal() { document.getElementById('sf-modal-overlay')?.remove(); }


// ============================================================
// INIT
// ============================================================
render();
if (state.token && state.user) loadPage();

</script>
</body>
</html>
