// ── 渲染工具栏 ────────────────────────────────────────────────────────────
function sfRenderToolbar() {
  const tb = document.getElementById('sf-toolbar');
  if (!tb) return;
  const sel = _sf.selected;
  const cnt = sel.size;
  const onlyFiles = cnt > 0 && [...sel].every(k => k.startsWith('f:'));
  const singleFile = onlyFiles && cnt === 1;
  const hasDirs = cnt > 0 && [...sel].some(k => k.startsWith('d:'));
  const hasClip = !!_sf.clipboard;
  const isAdmin = !!state.user?.is_admin;

  // 按钮启用逻辑
  const canDownload  = onlyFiles && cnt >= 1;
  const canRename    = singleFile && !_sf.isWebDir;
  const canCopy      = onlyFiles && cnt >= 1;
  const canCut       = onlyFiles && cnt >= 1;
  const canPaste     = hasClip && _sf.canWrite;
  const canShare     = singleFile && _sf.dirID !== 0;
  const canDelete    = (onlyFiles && cnt >= 1 && _sf.canWrite) || (hasDirs && isAdmin);

  // 剪贴板信息
  let clipInfo = '';
  if (_sf.clipboard) {
    const t = _sf.clipboard.type === 'copy' ? '📋' : '✂️';
    const n = _sf.clipboard.items.length;
    clipInfo = `<span class="sf-sel-badge" style="margin-right:2px">${t} ${n}个</span>`;
  }

  // 选中计数 + 多选切换
  const selBadge = cnt > 0 ? `<span class="sf-sel-badge">${cnt} 已选</span>` : '';
  const multiChk = `<label style="display:inline-flex;align-items:center;gap:5px;cursor:pointer;font-size:12px;color:var(--text3);user-select:none">
    <input type="checkbox" id="sf-multi-chk" ${_sf.multiSelect?'checked':''}
      style="width:13px;height:13px;accent-color:var(--accent);cursor:pointer"
      onchange="sfSetMultiSelect(this.checked)">多选</label>`;

  tb.innerHTML = `
    <div class="sf-search-wrap">
      <span class="sf-search-icon">🔍</span>
      <input id="sf-search" class="form-input" placeholder="搜索..." style="height:32px"
        oninput="sfSearchInput(this.value)" onkeydown="if(event.key==='Escape')sfSearchClear()">
      <span class="sf-search-clear" id="sf-search-clear" onclick="sfSearchClear()" style="display:none">✕</span>
    </div>
    <div class="sf-tb-sep"></div>
    ${(isAdmin || _sf.canWrite) ? `<button class="sf-act" onclick="sfNewDirModal()">📁 新建</button>` : ''}
    <button class="sf-act" onclick="sfActDownload()" ${canDownload?'':'disabled'} title="下载">⬇ 下载</button>
    <button class="sf-act" onclick="sfActRename()" ${canRename?'':'disabled'} title="重命名">✏️ 重命名</button>
    <div class="sf-tb-sep"></div>
    <button class="sf-act" onclick="sfActCopy()" ${canCopy?'':'disabled'} title="复制">📋 复制</button>
    <button class="sf-act" onclick="sfActCut()" ${canCut?'':'disabled'} title="剪切">✂️ 剪切</button>
    <button class="sf-act" onclick="sfPaste()" ${canPaste?'':'disabled'} title="粘贴${_sf.clipboard?'（'+(_sf.clipboard.items.length)+'个文件）':''}">📌 粘贴</button>
    ${_sf.dirID !== 0 ? `<button class="sf-act" onclick="sfActShare()" ${canShare?'':'disabled'} title="分享到公共盘">🔗 分享</button>` : ''}
    <div class="sf-tb-sep"></div>
    <button class="sf-act danger" onclick="sfActDelete()" ${canDelete?'':'disabled'} title="删除">🗑 删除</button>
    <div style="flex:1"></div>
    ${clipInfo}${selBadge}${multiChk}
    <div class="sf-tb-sep"></div>
    <button class="sf-view-btn ${_sf.viewMode==='list'?'active':''}" id="sf-btn-list" onclick="sfSetView('list')" title="列表">☰</button>
    <button class="sf-view-btn ${_sf.viewMode==='grid'?'active':''}" id="sf-btn-grid" onclick="sfSetView('grid')" title="图标">⊞</button>
    <div class="sf-tb-sep"></div>
    <button class="sf-act" onclick="sfOpenTrash()" title="回收站">🗑 回收站</button>
  `;
  // 上传按钮
  const uploadBtn = document.getElementById('sf-upload-btn');
  if (uploadBtn) uploadBtn.style.display = _sf.canWrite ? '' : 'none';
}

// ── 加载目录 ──────────────────────────────────────────────────────────────
async function sfLoadDir(dirID) {
  _sf.dirID = dirID;
  _sf.selected.clear();
  _sf.lastClickedIdx = -1;
  _sf.multiSelect = false;
  _sf.searchQuery = '';
  const se = document.getElementById('sf-search');
  if (se) { se.value = ''; }
  const sc = document.getElementById('sf-search-clear');
  if (sc) sc.style.display = 'none';

  let data;
  try { data = await api('GET', `/share/dirs/${dirID}`); }
  catch(e) {
    const el = document.getElementById('sf-list');
    if (el) el.innerHTML = `<div class="sf-empty"><div class="icon">🔒</div>${escHtml(e.message||'无访问权限')}</div>`;
    sfRenderToolbar();
    return;
  }
  _sf.canWrite = data.can_write;
  _sf.currentData = data;
  // 检查面包屑中是否有 name='web' 的顶层目录（即在 /web 树下）
  _sf.isWebDir = !!(data.breadcrumb || []).some(b => b.name === 'web') ||
    (data.dirs || []).concat(data.files || []).length === 0 && dirID !== 0 &&
    false; // 保守：仅靠面包屑判断
  // 更可靠：通过目录id对应的admin_only标志判断（后端已返回当前目录信息）
  // 面包屑中第一个条目如果 name=web 则在web树
  if (dirID === 0) {
    _sf.isWebDir = false;
  } else {
    const crumbs = data.breadcrumb || [];
    _sf.isWebDir = crumbs.length > 0 && crumbs[0].name === 'web';
    // 如果面包屑为空（直接进了web根目录），检查 can_write && admin_only
    if (!_sf.isWebDir && data.admin_only) _sf.isWebDir = true;
  }

  sfRenderBreadcrumb(data.breadcrumb);
  sfRenderToolbar();
  sfBuildAndRender('');
}

// ── 构建 allItems 并渲染 ──────────────────────────────────────────────────
function sfBuildAndRender(query) {
  const data = _sf.currentData;
  if (!data) return;
  const dirs = data.dirs || [];
  const files = data.files || [];
  const q = query.trim().toLowerCase();

  let filteredDirs  = q ? dirs.filter(d  => d.name.toLowerCase().includes(q))  : dirs;
  let filteredFiles = q ? files.filter(f => f.name.toLowerCase().includes(q)) : files;

  // 构建 allItems 供 Shift 多选使用
  _sf.allItems = [
    ...filteredDirs.map(d  => ({ type:'d', ...d })),
    ...filteredFiles.map(f => ({ type:'f', ...f })),
  ];

  const el = document.getElementById('sf-list');
  if (!el) return;

  if (_sf.allItems.length === 0) {
    el.innerHTML = q
      ? `<div class="sf-empty"><div class="icon">🔍</div>未找到"${escHtml(query)}"</div>`
      : `<div class="sf-empty"><div class="icon">📂</div>此目录为空</div>`;
    return;
  }

  const hl = (name) => {
    if (!q) return escHtml(name);
    const i = name.toLowerCase().indexOf(q);
    if (i < 0) return escHtml(name);
    return escHtml(name.slice(0,i)) + `<mark class="sf-hl">${escHtml(name.slice(i,i+q.length))}</mark>` + escHtml(name.slice(i+q.length));
  };

  if (_sf.viewMode === 'grid') sfRenderGrid(hl);
  else sfRenderList(hl);
}

// ── 列表视图 ─────────────────────────────────────────────────────────────
function sfRenderList(hl) {
  const el = document.getElementById('sf-list');
  const isAdmin = !!state.user?.is_admin;
  const thW   = _sf.multiSelect ? '28px' : '0';
  const thPad = _sf.multiSelect ? '6px 4px 6px 10px' : '0';
  const thChk = _sf.multiSelect ? '<input type="checkbox" class="sf-chk" id="sf-chk-all" onchange="sfToggleAll(this.checked)" title="全选">' : '';
  let html = `<table class="sf-list-table">
    <thead><tr>
      <th style="width:${thW};padding:${thPad};overflow:hidden">
        ${thChk}
      </th>
      <th style="width:80px;text-align:right">大小</th>
      <th style="width:90px">上传人</th>
      <th style="width:110px">时间</th>
    </tr></thead><tbody>`;

  _sf.allItems.forEach((item, idx) => {
    const key = `${item.type}:${item.id}`;
    const isSel = _sf.selected.has(key);
    const selCls = isSel ? 'sf-sel' : '';
    const chk = _sf.multiSelect
      ? `<input type="checkbox" class="sf-chk sf-row-chk" data-key="${key}" data-idx="${idx}"
         ${isSel?'checked':''} onclick="event.stopPropagation();sfRowChkClick(event,${idx})" title="选择">`
      : '';

    if (item.type === 'd') {
      const canEnter = item.can_read;
      const gray = canEnter ? '' : 'sf-noperm';
      const noPermTip = canEnter ? '' : `<span style="font-size:11px;color:var(--text3)">(无权限)</span>`;
      const adminOnlyBadge = item.admin_only
        ? `<span style="font-size:10px;color:var(--accent);margin-left:4px;border:1px solid var(--accent);border-radius:3px;padding:0 3px">仅管理员</span>` : '';
      const webLinkTip = item.admin_only && item.name === 'web'
        ? `<span style="font-size:10px;color:var(--text3);margin-left:4px">→ 静态访问: /web/文件名</span>` : '';
      const adminOps = isAdmin ? `
        <button class="btn btn-xs" onclick="event.stopPropagation();sfEditDirModal(${item.id},\`${escHtml(item.name)}\`,${item.max_file_mb})" title="编辑">✏️</button>
        <button class="btn btn-xs" onclick="event.stopPropagation();sfPermModal(${item.id},\`${escHtml(item.name)}\`)" title="权限">🔐</button>` : '';
      html += `<tr class="sf-row ${selCls} ${gray}" data-key="${key}" data-idx="${idx}"
          onclick="sfRowClick(event,${idx})"
          ondblclick="sfDirEnter(${item.id},${!canEnter})">
        ${_sf.multiSelect ? '<td style="padding:6px 4px 6px 10px">' + chk + '</td>' : ''}
        <td><div class="sf-name-cell">
          <span class="sf-file-icon">${item.admin_only ? '🔒' : '📁'}</span>
          <span class="nm">${hl(item.name)}</span>${noPermTip}${adminOnlyBadge}${webLinkTip}
          <span style="margin-left:4px">${adminOps}</span>
        </div></td>
        <td style="text-align:right;color:var(--text3)">—</td>
        <td style="color:var(--text3)">—</td>
        <td style="color:var(--text3);font-size:12px">${(item.created_at||'').slice(0,10)}</td>
      </tr>`;
    } else {
      const icon = sfFileIcon(item.mime_type, item.name);
      const badge = item.is_shared ? `<span class="sf-shared-badge">分享</span>` : '';
      html += `<tr class="sf-row ${selCls}" data-key="${key}" data-idx="${idx}"
          onclick="sfRowClick(event,${idx})">
        ${_sf.multiSelect ? '<td style="padding:6px 4px 6px 10px">' + chk + '</td>' : ''}
        <td><div class="sf-name-cell">
          <span class="sf-file-icon">${icon}</span>
          <span class="nm">${hl(item.name)}</span>${badge}
        </div></td>
        <td style="text-align:right;color:var(--text3);white-space:nowrap">${sfFmtSize(item.size)}</td>
        <td style="color:var(--text3);overflow:hidden;text-overflow:ellipsis;max-width:90px;white-space:nowrap">${escHtml(item.uploader_name||'')}</td>
        <td style="color:var(--text3);font-size:12px;white-space:nowrap">${(item.created_at||'').slice(0,16)}</td>
      </tr>`;
    }
  });
  html += `</tbody></table>`;
  el.innerHTML = html;
  sfSyncCheckAll();
}

// ── 图标视图 ─────────────────────────────────────────────────────────────
function sfRenderGrid(hl) {
  const el = document.getElementById('sf-list');
  const isAdmin = !!state.user?.is_admin;
  let html = `<div class="sf-grid">`;
  _sf.allItems.forEach((item, idx) => {
    const key = `${item.type}:${item.id}`;
    const isSel = _sf.selected.has(key);
    const selCls = isSel ? 'sf-sel' : '';

    if (item.type === 'd') {
      const canEnter = item.can_read;
      const gray = canEnter ? '' : 'sf-noperm';
      const adminOps = isAdmin ? `
        <button class="btn btn-xs" style="font-size:10px;padding:1px 4px" onclick="event.stopPropagation();sfEditDirModal(${item.id},\`${escHtml(item.name)}\`,${item.max_file_mb})" title="编辑">✏️</button>
        <button class="btn btn-xs" style="font-size:10px;padding:1px 4px" onclick="event.stopPropagation();sfPermModal(${item.id},\`${escHtml(item.name)}\`)" title="权限">🔐</button>` : '';
      html += `<div class="sf-grid-item ${selCls} ${gray}" data-key="${key}" data-idx="${idx}"
          onclick="sfRowClick(event,${idx})"
          ondblclick="sfDirEnter(${item.id},${!canEnter})"

        <div class="sf-grid-icon">${icon}</div>

// ── 选中逻辑 ─────────────────────────────────────────────────────────────
function sfRowClick(event, idx) {
  // 点击 checkbox 由 sfRowChkClick 处理，这里忽略
  if (event.target.type === 'checkbox') return;
  const item = _sf.allItems[idx];
  if (!item) return;
  const key = `${item.type}:${item.id}`;

  if (_sf.multiSelect) {
    // 多选模式：支持 Shift 范围选、Ctrl 切换
    if (event.shiftKey && _sf.lastClickedIdx >= 0) {
      const lo = Math.min(_sf.lastClickedIdx, idx);
      const hi = Math.max(_sf.lastClickedIdx, idx);
      for (let i = lo; i <= hi; i++) {
        const it = _sf.allItems[i];
        _sf.selected.add(`${it.type}:${it.id}`);
      }
    } else if (event.ctrlKey || event.metaKey) {
      if (_sf.selected.has(key)) _sf.selected.delete(key);
      else _sf.selected.add(key);
      _sf.lastClickedIdx = idx;
    } else {
      // 多选模式下普通点击 = 切换该项
      if (_sf.selected.has(key)) _sf.selected.delete(key);
      else _sf.selected.add(key);
      _sf.lastClickedIdx = idx;
    }
  } else {
    // 单选模式：点击 = 选中，再次点击同一项 = 取消
    if (_sf.selected.size === 1 && _sf.selected.has(key)) {
      _sf.selected.clear();
      _sf.lastClickedIdx = -1;
    } else {
      _sf.selected.clear();
      _sf.selected.add(key);
      _sf.lastClickedIdx = idx;
    }
  }
  sfRefreshSelection();
}

function sfRowChkClick(event, idx) {
  const item = _sf.allItems[idx];
  if (!item) return;
  const key = `${item.type}:${item.id}`;
  if (event.target.checked) {
    _sf.selected.add(key);
    _sf.lastClickedIdx = idx;
  } else {
    _sf.selected.delete(key);
  }
  sfRefreshSelection();
}

function sfToggleAll(checked) {
  if (checked) {
    _sf.allItems.forEach(item => _sf.selected.add(`${item.type}:${item.id}`));
  } else {
    _sf.selected.clear();
  }
  sfRefreshSelection();
}

function sfSyncCheckAll() {
  const ca = document.getElementById('sf-chk-all');
  if (!ca) return;
  const total = _sf.allItems.length;
  const selCnt = _sf.selected.size;
  ca.indeterminate = selCnt > 0 && selCnt < total;
  ca.checked = total > 0 && selCnt === total;
}

// 不重新渲染整个列表，只更新 class 和 checkbox 状态
function sfRefreshSelection() {
  // 更新行 class 和 checkbox
  document.querySelectorAll('[data-key]').forEach(el => {
    const key = el.dataset.key;
    const sel = _sf.selected.has(key);
    if (el.type === 'checkbox') {
      el.checked = sel;
    } else {
      el.classList.toggle('sf-sel', sel);
    }
  });
  sfSyncCheckAll();
  sfRenderToolbar();
}

// 切换多选模式
function sfSetMultiSelect(on) {
  _sf.multiSelect = on;
  if (!on) {
    _sf.selected.clear();
    _sf.lastClickedIdx = -1;
  }
  // 重新渲染列表以显示/隐藏 checkbox 列
  sfBuildAndRender(document.getElementById('sf-search')?.value || '');
  sfRenderToolbar();
}

// 操作完毕后关闭多选并清空选中
function sfEndMultiSelect() {
  _sf.multiSelect = false;
  _sf.selected.clear();
  _sf.lastClickedIdx = -1;
}

function sfDirEnter(dirID, noPerm) {
  if (noPerm) { sfToast('您没有该目录的访问权限', 'error'); return; }
  _sf.selected.clear();
  sfLoadDir(dirID);
}

// ── 工具栏操作 ────────────────────────────────────────────────────────────
function sfGetSelectedFiles() {
  return _sf.allItems.filter(it => it.type === 'f' && _sf.selected.has(`f:${it.id}`));
}
function sfGetSelectedDirs() {
  return _sf.allItems.filter(it => it.type === 'd' && _sf.selected.has(`d:${it.id}`));
}

async function sfActDownload() {
  sfGetSelectedFiles().forEach(f => {
    const a = document.createElement('a');
    a.href = `/api/share/files/${f.id}/download?token=${state.token}`;
    a.download = f.name; a.click();
  });
}

async function sfActRename() {
  const files = sfGetSelectedFiles();
  if (files.length !== 1) return;
  const f = files[0];
  const n = prompt('重命名', f.name);
  if (!n || n.trim() === f.name) return;
  await api('PUT', `/share/files/${f.id}/rename`, { name: n.trim() });
  sfEndMultiSelect();
  sfLoadDir(_sf.dirID);
}

function sfActCopy() {
  const files = sfGetSelectedFiles();
  if (!files.length) return;
  _sf.clipboard = { type:'copy', items: files.map(f=>({type:'f',id:f.id,name:f.name})) };
  sfToast(`已复制 ${files.length} 个文件，进入目标目录后点击粘贴`);
  sfEndMultiSelect();
  sfRenderToolbar();
}

function sfActCut() {
  const files = sfGetSelectedFiles();
  if (!files.length) return;
  _sf.clipboard = { type:'cut', items: files.map(f=>({type:'f',id:f.id,name:f.name})) };
  sfToast(`已剪切 ${files.length} 个文件，进入目标目录后点击粘贴`);
  sfEndMultiSelect();
  sfRenderToolbar();
}

async function sfPaste() {
  if (!_sf.clipboard) return;
  const { type, items } = _sf.clipboard;
  const endpoint = type === 'copy' ? 'copy' : 'move';
  let ok = 0, fail = 0;
  for (const item of items) {
    try {
      await api('POST', `/share/files/${item.id}/${endpoint}`, { target_dir_id: _sf.dirID });
      ok++;
    } catch(e) { fail++; sfToast(`${item.name}: ${e.message}`, 'error'); }
  }
  if (ok) sfToast(`已${type==='copy'?'复制':'移动'} ${ok} 个文件到当前目录`);
  sfEndMultiSelect();
  if (type === 'cut') _sf.clipboard = null;
  sfLoadDir(_sf.dirID);
}

async function sfActShare() {
  const files = sfGetSelectedFiles();
  if (files.length !== 1) return;
  const f = files[0];
  if (!confirm(`将"${f.name}"分享到公共盘根目录？（不复制文件，仅添加引用）`)) return;
  await api('POST', `/share/files/${f.id}/share`);
  sfEndMultiSelect();
  sfToast('已分享到公共盘根目录');
}

async function sfActDelete() {
  const files = sfGetSelectedFiles();
  const dirs  = sfGetSelectedDirs();
  const total = files.length + dirs.length;
  if (!total) return;
  const msg = total === 1
    ? `将"${(files[0]||dirs[0]).name}"移入回收站？`
    : `将 ${total} 个项目移入回收站？`;
  if (!confirm(msg)) return;
  for (const f of files) await api('DELETE', `/share/files/${f.id}`);
  for (const d of dirs) {
    try { await api('DELETE', `/share/dirs/${d.id}`); }
    catch(e) { sfToast(`"${d.name}": ${e.message}`, 'error'); }
  }
  sfEndMultiSelect();
  sfLoadDir(_sf.dirID);
}

function sfRenderBreadcrumb(crumbs) {

// ── 上传 ──────────────────────────────────────────────────────────────────
function sfTriggerUpload() { document.getElementById('sf-file-input')?.click(); }

// 创建/更新进度弹窗；返回控制句柄
function sfProgressModal(total) {
  // 若已有弹窗则复用
  let overlay = document.getElementById('sf-progress-overlay');
  if (!overlay) {
    overlay = document.createElement('div');
    overlay.id = 'sf-progress-overlay';
    overlay.style.cssText = `position:fixed;inset:0;background:rgba(0,0,0,.45);
      display:flex;align-items:center;justify-content:center;z-index:10000`;
    overlay.innerHTML = `
      <div id="sf-progress-box" style="background:var(--bg2);border-radius:12px;
        padding:28px 32px;min-width:320px;max-width:480px;width:90%;
        box-shadow:0 8px 32px rgba(0,0,0,.4)">
        <div style="font-size:14px;font-weight:600;color:var(--text);margin-bottom:16px" id="sf-prog-title">正在上传...</div>
        <div style="background:var(--bg3);border-radius:6px;height:10px;overflow:hidden;margin-bottom:10px">
          <div id="sf-prog-bar" style="height:100%;width:0%;background:var(--accent);transition:width .2s;border-radius:6px"></div>
        </div>
        <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--text3)">
          <span id="sf-prog-file">-</span>
          <span id="sf-prog-pct">0%</span>
        </div>
        <div style="margin-top:16px;text-align:right">
          <button onclick="sfProgressClose(true)" style="padding:6px 16px;background:var(--bg3);border:1px solid var(--border);
            border-radius:6px;color:var(--text2);font-size:13px;cursor:pointer">关闭</button>
        </div>
      </div>`;
    document.body.appendChild(overlay);
  }
  window._sfProgAutoClose = null;

  return {
    // 更新单文件进度（0-100）
    setFile(name, pct, idx) {
      const title = document.getElementById('sf-prog-title');
      const bar   = document.getElementById('sf-prog-bar');
      const file  = document.getElementById('sf-prog-file');
      const pctEl = document.getElementById('sf-prog-pct');
      if (title) title.textContent = `正在上传 ${idx}/${total}：${name}`;
      if (bar)   bar.style.width = pct + '%';
      if (file)  file.textContent = name;
      if (pctEl) pctEl.textContent = pct + '%';
    },
    // 全部完成
    done(ok, fail) {
      const title = document.getElementById('sf-prog-title');
      const bar   = document.getElementById('sf-prog-bar');
      const pctEl = document.getElementById('sf-prog-pct');
      if (bar)   { bar.style.width = '100%'; bar.style.background = fail ? '#e53935' : '#43a047'; }
      if (pctEl) pctEl.textContent = '100%';
      if (title) title.textContent = fail
        ? `上传完成：${ok} 成功，${fail} 失败`
        : `✅ 全部上传成功（共 ${ok} 个文件）`;
      // 3秒后无操作自动关闭
      window._sfProgAutoClose = setTimeout(() => sfProgressClose(false), 3000);
    }
  };
}

function sfProgressClose(byUser) {
  if (window._sfProgAutoClose) { clearTimeout(window._sfProgAutoClose); window._sfProgAutoClose = null; }
  const el = document.getElementById('sf-progress-overlay');
  if (el) el.remove();
}

async function sfDoUpload(input) {
  const files = Array.from(input.files || []);
  if (!files.length) return;
  input.value = '';

  const prog = sfProgressModal(files.length);
  let ok = 0, fail = 0;

  for (let i = 0; i < files.length; i++) {
    const file = files[i];
    prog.setFile(file.name, 0, i + 1);
    await new Promise(resolve => {
      const fd = new FormData();
      fd.append('file', file);
      const xhr = new XMLHttpRequest();
      xhr.open('POST', `/api/share/dirs/${_sf.dirID}/upload`);
      xhr.setRequestHeader('Authorization', 'Bearer ' + state.token);
      xhr.upload.onprogress = e => {
        if (e.lengthComputable) prog.setFile(file.name, Math.round(e.loaded / e.total * 100), i + 1);
      };
      xhr.onload = () => {
        prog.setFile(file.name, 100, i + 1);
        try {
          const j = JSON.parse(xhr.responseText);
          if (xhr.status >= 200 && xhr.status < 300) ok++;
          else { fail++; sfToast('上传失败: ' + (j.error || xhr.status), 'error'); }
        } catch { fail++; }
        resolve();
      };
      xhr.onerror = () => { fail++; sfToast('上传失败: 网络错误', 'error'); resolve(); };
      xhr.send(fd);
    });
  }

  prog.done(ok, fail);
  sfLoadDir(_sf.dirID);
}

// ── 拖拽上传 ──────────────────────────────────────────────────────────────
function sfDragEnter(e) {
  e.preventDefault();
  e.stopPropagation();
  if (!_sf.canWrite) return;
  const el = document.getElementById('sf-list');
  if (el && !document.getElementById('sf-drop-overlay')) {
    const ov = document.createElement('div');
    ov.id = 'sf-drop-overlay';
    ov.style.cssText = `position:absolute;inset:0;background:rgba(46,117,182,.18);
      border:2px dashed #2E75B6;border-radius:8px;z-index:100;
      display:flex;align-items:center;justify-content:center;pointer-events:none`;
    ov.innerHTML = `<div style="font-size:28px;color:#2E75B6;font-weight:600;text-align:center">
      📂<br><span style="font-size:14px">松开鼠标上传到当前目录</span>
    </div>`;
    el.appendChild(ov);
  }
}

function sfDragOver(e) {
  e.preventDefault();
  e.stopPropagation();
  if (e.dataTransfer) e.dataTransfer.dropEffect = _sf.canWrite ? 'copy' : 'none';
}

function sfDragLeave(e) {
  e.stopPropagation();
  // 只有真正离开 sf-list 才移除遮罩（relatedTarget 不在 sf-list 内）
  const el = document.getElementById('sf-list');
  if (el && !el.contains(e.relatedTarget)) {
    document.getElementById('sf-drop-overlay')?.remove();
  }
}

async function sfDrop(e) {
  e.preventDefault();
  e.stopPropagation();
  document.getElementById('sf-drop-overlay')?.remove();
  if (!_sf.canWrite) {
    sfToast('当前目录无上传权限', 'error');
    return;
  }

  // 用 webkitGetAsEntry 支持目录递归，兼容 fallback 到 files
  const items = Array.from(e.dataTransfer?.items || []);
  const entries = items.map(it => it.webkitGetAsEntry?.()).filter(Boolean);

  if (!entries.length) {
    // 旧浏览器 fallback：只处理文件
    const files = Array.from(e.dataTransfer?.files || []);
    if (!files.length) return;
    await sfUploadFileList(files, _sf.dirID);
    sfLoadDir(_sf.dirID);
    return;
  }

  // 先统计总文件数（显示进度用）
  const counter = { total: 0, ok: 0, fail: 0 };
  await sfCountEntries(entries, counter);

  // 显示进度弹窗
  const prog = sfProgressModal(counter.total);
  prog._counter = counter;
  prog._seq = 0;

  // 递归处理所有条目
  for (const entry of entries) {
    await sfProcessEntry(entry, _sf.dirID, prog);
  }

  prog.done(counter.ok, counter.fail);
  sfLoadDir(_sf.dirID);
}

// 统计所有文件数量（递归）
async function sfCountEntries(entries, counter) {
  for (const entry of entries) {
    if (entry.isFile) {
      counter.total++;
    } else if (entry.isDirectory) {
      const children = await sfReadAllEntries(entry.createReader());
      await sfCountEntries(children, counter);
    }
  }
}

// 递归处理一个条目（文件或目录）
async function sfProcessEntry(entry, parentDirId, prog) {
  if (entry.isFile) {
    // 读取文件对象
    const file = await new Promise((res, rej) => entry.file(res, rej));
    prog._seq++;
    prog.setFile(entry.fullPath || entry.name, 0, prog._seq);
    await new Promise(resolve => {
      const fd = new FormData();
      fd.append('file', file);
      const xhr = new XMLHttpRequest();
      xhr.open('POST', `/api/share/dirs/${parentDirId}/upload`);
      xhr.setRequestHeader('Authorization', 'Bearer ' + state.token);
      xhr.upload.onprogress = ev => {
        if (ev.lengthComputable)
          prog.setFile(entry.fullPath || entry.name, Math.round(ev.loaded / ev.total * 100), prog._seq);
      };
      xhr.onload = () => {
        prog.setFile(entry.fullPath || entry.name, 100, prog._seq);
        try {
          const j = JSON.parse(xhr.responseText);
          if (xhr.status >= 200 && xhr.status < 300) prog._counter.ok++;
          else { prog._counter.fail++; sfToast('上传失败: ' + (j.error || xhr.status), 'error'); }
        } catch { prog._counter.fail++; }
        resolve();
      };
      xhr.onerror = () => { prog._counter.fail++; sfToast('上传失败: 网络错误', 'error'); resolve(); };
      xhr.send(fd);
    });

  } else if (entry.isDirectory) {
    // 在网盘创建对应子目录
    let newDirId = parentDirId;
    try {
      const res = await api('POST', '/share/dirs', {
        name: entry.name,
        parent_id: parentDirId,
        max_file_mb: 100,
      });
      newDirId = res.id;
    } catch(err) {
      sfToast(`创建目录 ${entry.name} 失败`, 'error');
      return;
    }
    // 读取目录内所有条目（readEntries 每次最多100，需循环）
    const children = await sfReadAllEntries(entry.createReader());
    for (const child of children) {
      await sfProcessEntry(child, newDirId, prog);
    }
  }
}

// 循环调用 reader.readEntries 直到返回空（解决每次最多100条限制）
function sfReadAllEntries(reader) {
  return new Promise(resolve => {
    const all = [];
    function readBatch() {
      reader.readEntries(batch => {
        if (!batch.length) { resolve(all); return; }
        all.push(...batch);
        readBatch(); // 继续读下一批
      }, () => resolve(all)); // 出错时返回已读到的
    }
    readBatch();
  });
}

// 普通文件列表上传（fallback）
async function sfUploadFileList(files, dirId) {
  const prog = sfProgressModal(files.length);
  let ok = 0, fail = 0;
  for (let i = 0; i < files.length; i++) {
    const file = files[i];
    prog.setFile(file.name, 0, i + 1);
    await new Promise(resolve => {
      const fd = new FormData();
      fd.append('file', file);
      const xhr = new XMLHttpRequest();
      xhr.open('POST', `/api/share/dirs/${dirId}/upload`);
      xhr.setRequestHeader('Authorization', 'Bearer ' + state.token);
      xhr.upload.onprogress = ev => {
        if (ev.lengthComputable) prog.setFile(file.name, Math.round(ev.loaded / ev.total * 100), i + 1);
      };
      xhr.onload = () => {
        prog.setFile(file.name, 100, i + 1);
        try {
          const j = JSON.parse(xhr.responseText);
          if (xhr.status >= 200 && xhr.status < 300) ok++;
          else { fail++; sfToast('上传失败: ' + (j.error || xhr.status), 'error'); }
        } catch { fail++; }
        resolve();
      };
      xhr.onerror = () => { fail++; sfToast('上传失败: 网络错误', 'error'); resolve(); };
      xhr.send(fd);
    });
  }
  prog.done(ok, fail);
}

function sfToast(msg, type) {

  el.style.cssText = `position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
    background:${type==='error'?'#c62828':'#1b5e20'};color:#fff;padding:9px 22px;

// ── 辅助 ──────────────────────────────────────────────────────────────────
function sfFileIcon(mime, name) {
  if (!mime) mime='';
  const n=(name||'').toLowerCase();
  if (mime.startsWith('image/')) return '🖼️';
  if (mime.startsWith('video/')) return '🎬';
  if (mime.startsWith('audio/')) return '🎵';
  if (mime.includes('pdf')) return '📕';
  if (mime.includes('word')||/\.docx?$/.test(n)) return '📘';
  if (mime.includes('excel')||mime.includes('spreadsheet')||/\.xlsx?$/.test(n)) return '📗';
  if (mime.includes('presentation')||/\.pptx?$/.test(n)) return '📙';
  if (mime.includes('zip')||/\.(zip|rar|7z|tar|gz)$/.test(n)) return '📦';
  if (mime.includes('text')||/\.(txt|md|csv|log)$/.test(n)) return '📄';
  if (/\.(js|ts|go|py|java|c|cpp|sh|json|yaml|xml|html|css)$/.test(n)) return '💻';
  return '📎';
}
function sfFmtSize(b) {
  if (!b) return '—';
  if (b<1024) return b+' B';
  if (b<1048576) return (b/1024).toFixed(1)+' KB';
  if (b<1073741824) return (b/1048576).toFixed(1)+' MB';
  return (b/1073741824).toFixed(2)+' GB';
}

// 搜索回车：只剩一条时直接打开
function bkSearchKey(e) {
  if (e.key !== 'Enter') return;
  let list = _bkList;
  if (_bkCategory) list = list.filter(b => b.category === _bkCategory);
  const kw = document.getElementById('bk-search')?.value.toLowerCase() || '';
  if (kw) list = list.filter(b =>
    (b.name||'').toLowerCase().includes(kw) ||
    (b.url||'').toLowerCase().includes(kw)  ||
    (b.remark||'').toLowerCase().includes(kw));

}

// 显示模式切换
function bkToggleView() {

  _bkCategory = '';
  try { localStorage.setItem('bk_view', _bkView); } catch(e) {}

// 编辑模式切换
function bkToggleEdit() {

async function bkReload() {
  const res = await api('GET', '/bookmarks');
  _bkList = res.bookmarks || [];
  bkRenderCats();
  bkRender();
}

function bkFilter() {
  _bkSearch = document.getElementById('bk-search')?.value.toLowerCase() || '';
  bkRender();
}

function bkSetCat(cat) {
  _bkCategory = cat;
  bkRenderCats();
  bkRender();
}

function bkRenderCats() {
  const el = document.getElementById('bk-cats');
  if (!el) return;
  // 方式B：隐藏tabs，分组标题直接显示在卡片区域
  if (_bkView === 'cat') {
    el.style.display = 'none';
    return;
  }
  // 方式A：显示分类tabs
  el.style.display = 'flex';
  const cats = ['', ...new Set(_bkList.map(b => b.category).filter(Boolean))];
  el.innerHTML = cats.map(c => `
    <button onclick="bkSetCat('${escHtml(c)}')"
      style="padding:4px 12px;border-radius:20px;font-size:12px;cursor:pointer;border:1px solid var(--border);
             background:${_bkCategory===c?'var(--accent)':'var(--bg2)'};
             color:${_bkCategory===c?'#fff':'var(--text2)'}">
      ${c || '全部'}
    </button>`).join('');
}

function bkRender() {
  const grid  = document.getElementById('bk-grid');
  const empty = document.getElementById('bk-empty');
  if (!grid) return;

  let list = _bkList;
  // 搜索过滤（两种模式都支持）
  if (_bkSearch) list = list.filter(b =>
    (b.name||'').toLowerCase().includes(_bkSearch) ||
    (b.url||'').toLowerCase().includes(_bkSearch)  ||
    (b.remark||'').toLowerCase().includes(_bkSearch));

  // 方式A：还需按分类tab过滤
  if (_bkView === 'list' && _bkCategory) {
    list = list.filter(b => b.category === _bkCategory);
  }

  if (!list.length) {
    grid.innerHTML = '';
    if (empty) empty.style.display = '';
    return;
  }
  if (empty) empty.style.display = 'none';

  if (_bkView === 'cat') {
    // 方式B：按分类分组显示（bkRenderByCat 内部处理 grid.style.display）
    bkRenderByCat(grid, list);
  } else {
    // 方式A：恢复 grid display，平铺所有卡片
    grid.style.display = 'grid';
    grid.innerHTML = list.map(b => bkCardHtml(b)).join('');
    bkBindCardEvents(grid);
  }
}

// 分类模式渲染
function bkRenderByCat(grid, list) {
  // 收集分类顺序：按第一次出现的分类顺序排列，无分类归入末尾
  const catOrder = [];
  const catMap = new Map();
  list.forEach(b => {
    const cat = b.category || '';
    if (!catMap.has(cat)) { catOrder.push(cat); catMap.set(cat, []); }
    catMap.get(cat).push(b);
  });
  // 有分类的在前，空分类（未分类）在最后
  catOrder.sort((a, b) => a === '' ? 1 : b === '' ? -1 : 0);

  // 重置 grid 的 display，让分组容器自己管理布局
  grid.style.display = 'block';

  let html = '';
  for (const cat of catOrder) {
    const items = catMap.get(cat);
    html += `
      <div style="margin-bottom:28px">
        <div style="font-size:18px;font-weight:600;color:var(--text);
                    margin-bottom:12px">${escHtml(cat || '未分类')}</div>
        <div style="display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:12px">
          ${items.map(b => bkCardHtml(b)).join('')}
        </div>
      </div>`;
  }
  grid.innerHTML = html;
  bkBindCardEvents(grid);
}

// 抽取单个卡片 HTML
function bkCardHtml(b) {

    ondragstart="bkDragStart(event,${b.id})"

           border-radius:12px;padding:14px 10px 10px;text-align:center;
           cursor:${_bkEditMode?'grab':'pointer'};

                       max-width:90px;margin:0 auto">${escHtml(b.name)}</div>
           ${b.category?`<div style="font-size:10px;color:var(--text3);margin-top:3px">${escHtml(b.category)}</div>`:''}
         </div>`
      : `<a href="${bkIsPage(b)?`/pages/user/${b.id}`:escHtml(b.url)}" target="_blank" rel="noopener"
            style="display:block;text-decoration:none;color:inherit"
            onclick="event.stopPropagation()">
           <div style="font-size:32px;margin-bottom:6px;line-height:1">${icon}</div>
           <div style="font-size:12px;color:var(--text);font-weight:500;
                       overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
                       max-width:90px;margin:0 auto">${escHtml(b.name)}</div>
           ${b.category?`<div style="font-size:10px;color:var(--text3);margin-top:3px">${escHtml(b.category)}</div>`:''}

        style="background:var(--bg3);border:none;border-radius:4px;cursor:pointer;
               font-size:11px;padding:2px 5px;color:var(--red)">🗑</button>
    </div>
  </div>`;
}

// hover 事件绑定（普通模式hover显示按钮）
function bkBindCardEvents(container) {
  // 显示/隐藏逻辑已改用 CSS .bk-card:hover .bk-actions-hover，无需 JS 事件绑定
}

// 判断是否为 HTML 页面（is_page=1，优先字段判断；兼容旧数据用长度规则）
function bkIsPage(b) {
  if (b.is_page === 1) return true;
  // 兼容旧数据（is_page 字段不存在时）
  return b.url && b.url.length > 255 &&
    !b.url.startsWith('http://') && !b.url.startsWith('https://');
}

function bkIcon(b) {
  // 用户设置的图标最优先（包括页面类型用户自定义的图标）
  if (b.icon && b.icon.trim()) return escHtml(b.icon);
  // 页面类型默认图标
  if (bkIsPage(b)) return '📄';
  // 普通书签：尝试拉取 favicon
  const domain = (() => { try { return new URL(b.url).hostname; } catch(e) { return ''; } })();
  if (!domain) return '🌐';
  const fallback = BK_EMOJIS[Math.abs(b.id * 7) % BK_EMOJIS.length];
  return `<img src="https://www.google.com/s2/favicons?domain=${domain}&sz=32"
    style="width:32px;height:32px;border-radius:6px;object-fit:contain"
    onerror="this.outerHTML='${fallback}'"
    loading="lazy">`;
}

// ── 拖拽排序 ──────────────────────────────────────────────────
function bkDragStart(e, id) {
  _bkDragId = id;
  e.dataTransfer.effectAllowed = 'move';
  setTimeout(() => {
    const el = document.getElementById(`bk-card-${id}`);
    if (el) el.style.opacity = '0.4';
  }, 0);
}

function bkDragOver(e, id) {
  e.preventDefault();
  _bkDragOver = id;
  document.querySelectorAll('[id^=bk-card-]').forEach(el => el.style.outline = '');
  const t = document.getElementById(`bk-card-${id}`);
  if (t && id !== _bkDragId) t.style.outline = '2px solid var(--accent)';
}

function bkDrop(e, toId) {
  e.preventDefault();
  const fromId = _bkDragId;
  if (!fromId || fromId === toId) return;
  // 在内存里重排
  const fromIdx = _bkList.findIndex(b => b.id === fromId);
  const toIdx   = _bkList.findIndex(b => b.id === toId);
  if (fromIdx < 0 || toIdx < 0) return;
  const [moved] = _bkList.splice(fromIdx, 1);
  _bkList.splice(toIdx, 0, moved);
  // 更新 sort_order
  _bkList.forEach((b, i) => b.sort_order = i);
  bkRender();
  // 持久化
  api('PUT', '/bookmarks/reorder', {
    orders: _bkList.map((b, i) => ({ id: b.id, order: i }))
  }).catch(() => {});
}

function bkDragEnd() {
  _bkDragId = null; _bkDragOver = null;
  document.querySelectorAll('[id^=bk-card-]').forEach(el => {
    el.style.opacity = '';
    el.style.outline = '';
  });
}

function bkpPreview() {
  const html = document.getElementById('bkp-html')?.value || '';
  const frame = document.getElementById('bkp-preview-frame');
  const iframe = document.getElementById('bkp-iframe');
  if (!frame || !iframe) return;
  frame.style.display = '';
  iframe.srcdoc = html;
}

async function bkSavePage(id) {
  const name   = document.getElementById('bkp-name')?.value.trim();
  const cat    = document.getElementById('bkp-cat')?.value.trim();
  const icon   = document.getElementById('bkp-icon')?.value.trim() || '📄';
  const remark = document.getElementById('bkp-remark')?.value.trim() || '';
  const html   = document.getElementById('bkp-html')?.value || '';
  if (!name) { alert('请填写页面名称'); return; }
  if (!html.trim()) { alert('请填写 HTML 代码'); return; }
  const payload = { name, url: html, category: cat, icon, remark, is_page: 1,
                    sort_order: id ? (_bkList.find(b=>b.id===id)?.sort_order||0) : _bkList.length };
  try {
    if (id) {
      await api('PUT', `/bookmarks/${id}`, payload);
    } else {
      await api('POST', '/bookmarks', payload);
    }
    closeModal();
    await bkReload();
  } catch(e) { alert('保存失败：' + e.message); }
}

async function bkSave(id) {
  const name   = document.getElementById('bk-f-name')?.value.trim();
  const url    = document.getElementById('bk-f-url')?.value.trim();
  const cat    = document.getElementById('bk-f-cat')?.value.trim();
  const icon   = document.getElementById('bk-f-icon')?.value.trim();
  const remark = document.getElementById('bk-f-remark')?.value.trim();
  if (!name) { alert('请填写名称'); return; }
  if (!url)  { alert('请填写网址'); return; }
  // url 不以 http 开头且不是 HTML 内容，自动补 https://
  let finalUrl = url;
  if (url.length <= 255 && !url.startsWith('http://') && !url.startsWith('https://')) {
    finalUrl = 'https://' + url;
  }
  const payload = { name, url: finalUrl, category: cat, icon, remark, is_page: 0,
                    sort_order: id ? (_bkList.find(b=>b.id===id)?.sort_order||0) : _bkList.length };
  try {
    if (id) {
      await api('PUT', `/bookmarks/${id}`, payload);
    } else {
      await api('POST', '/bookmarks', payload);
    }
    closeModal();
    await bkReload();
  } catch(e) { alert('保存失败：' + e.message); }
}

// 编辑入口：根据类型分流到书签编辑或页面编辑
function bkEdit(id) {
  const b = _bkList.find(x => x.id === id);
  if (!b) return;
  if (bkIsPage(b)) {
    if (!state.user?.is_admin) { alert('只有管理员可以编辑自定义页面'); return; }
    bkOpenPage(id);
  } else {
    bkOpenEdit(id);
  }
}

async function bkDelete(id) {
  const b = _bkList.find(x => x.id === id);
  if (!confirm(`确认删除「${b?.name}」？`)) return;
  await api('DELETE', `/bookmarks/${id}`);
  await bkReload();
}

async function nbSave() {
  const content = document.getElementById('nb-content')?.value ?? '';
  const st = document.getElementById('nb-status');
  try {
    await api('POST', '/notebook', { content });
    if (st) st.textContent = '已保存 ✓';

  } catch(e) {
    if (st) st.textContent = '保存失败';
    return false;
  }

  nbSave().finally(() => closeModal());
}

// 选中模板项：更新所有 item 的边框和标题颜色，勾选对应 radio
function qtSelectTpl(el, val) {
  // 重置所有项
  document.querySelectorAll('.qt-tpl-item').forEach(item => {
    item.style.borderColor = 'var(--border)';
    item.style.borderWidth = '2px';
    const radio = item.querySelector('input[type=radio]');
    if (radio) radio.checked = false;
    const title = item.querySelector('div > div:first-child');
    if (title) title.style.color = 'var(--text)';
  });
  // 选中当前项
  el.style.borderColor = 'var(--accent)';
  const radio = el.querySelector('input[type=radio]');
  if (radio) radio.checked = true;
  const title = el.querySelector('div > div:first-child');
  if (title) title.style.color = 'var(--accent)';
}

async function qtDoExport(quoteId) {
  const radio = document.querySelector('input[name="qt-tpl"]:checked');
  const templateId = radio ? radio.value : '0';
  qtSetLastTpl(templateId); // 记住本次选择（localStorage）
  const url = `/api/quotations/${quoteId}/export` + (templateId !== '0' ? `?template_id=${templateId}` : '');
  closeModal();
  // 触发下载
  const a = document.createElement('a');
  a.href = url;
  a.style.display = 'none';
  // 带认证头需要用 fetch
  try {
    const res = await fetch(url, {
      headers: { 'Authorization': 'Bearer ' + state.token }
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      alert('导出失败：' + (err.error || res.statusText));
      return;
    }
    const blob = await res.blob();
    const objUrl = URL.createObjectURL(blob);
    a.href = objUrl;
    const cd = res.headers.get('Content-Disposition') || '';
    const matchStar = cd.match(/filename\*=UTF-8''([^;]+)/i);
    const matchPlain = cd.match(/filename="([^"]+)"/);
    a.download = matchStar
      ? decodeURIComponent(matchStar[1])
      : matchPlain
        ? matchPlain[1]
        : `报价单_${quoteId}.xlsx`;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(objUrl); a.remove(); }, 1000);
  } catch(e) {
    alert('导出失败：' + e.message);
  }
}

async function qtUploadTemplate() {
  const name = document.getElementById('qt-new-name')?.value.trim();
  const desc = document.getElementById('qt-new-desc')?.value.trim() || '';
  const fileInput = document.getElementById('qt-new-file');
  const file = fileInput?.files?.[0];
  if (!name) { alert('请填写模板名称'); return; }
  if (!file) { alert('请选择 .xlsx 文件'); return; }

  const fd = new FormData();
  fd.append('name', name);
  fd.append('description', desc);
  fd.append('file', file);

  try {
    const res = await fetch('/api/quote-templates', {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + state.token },
      body: fd,
    });
    const data = await res.json();
    if (!res.ok) { alert('上传失败：' + (data.error || res.statusText)); return; }
    closeModal();
    qtOpenTemplateManager(); // 重新打开刷新列表
  } catch(e) { alert('上传失败：' + e.message); }
}

  await api('DELETE', `/quote-templates/${id}`);

function qtDownloadTemplate(id, name) {
  const a = document.createElement('a');
  a.href = `/api/quote-templates/${id}/download`;
  a.download = name + '.xlsx';
  // 带认证
  fetch(a.href, { headers: { 'Authorization': 'Bearer ' + state.token } })
    .then(r => r.blob())
    .then(blob => {
      a.href = URL.createObjectURL(blob);
      document.body.appendChild(a);
      a.click();
      setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    });
}

async function qtCopyQuote(quoteId) {
  // 拉取原报价单完整数据
  const q = await api('GET', '/quotations/' + quoteId);
  if (!q) return;

  // 生成新单号：Q + 当天日期 + 4位随机数
  const today = new Date();
  const dateStr = today.getFullYear().toString()
    + String(today.getMonth()+1).padStart(2,'0')
    + String(today.getDate()).padStart(2,'0');
  const newNum = 'Q' + dateStr + String(Math.floor(Math.random()*9000)+1000);
  const newDate = today.toISOString().slice(0,10);

  // 预填数据，日期改今天，单号改新的，状态改草稿
  const copy = {
    ...q,
    id: undefined,
    quote_number: newNum,
    date: newDate,
    status: 'draft',
    tax_info: q.tax_info || '',
  };

  await preloadData();
  openQuotationModal(copy);
}

// ── 产品下拉选中：自动填充同行字段 ──
function qtRowProdChange(input) {
  const row = parseInt(input.dataset.row);
  const val = input.value;
  _qtPreviewItems[row].name = val;
  // 从 datalist 找匹配项
  const opt = document.querySelector(`#qt-prod-list option[value="${CSS.escape(val)}"]`);
  if (opt) {
    const brand = opt.dataset.brand || '';
    const model = opt.dataset.model || '';
    const price = parseFloat(opt.dataset.price) || 0;
    const unit  = opt.dataset.unit  || '';
    // 回填到同行输入框
    const r = row;
    const setField = (field, val) => {
      const el = document.querySelector(`input[data-row="${r}"][data-field="${field}"]`);
      if (el) { el.value = val; _qtPreviewItems[r][field] = val; }
    };
    setField('brand', brand);
    setField('model', model);
    setField('unit',  unit);
    const priceEl = document.querySelector(`input[data-row="${r}"][data-field="unit_price"]`);
    if (priceEl) { priceEl.value = price; _qtPreviewItems[r].unit_price = price; }
    qtRowCalc(r);
  }
}

// ── 普通字段变更 ──
function qtRowChange(input) {
  const row = parseInt(input.dataset.row);
  const field = input.dataset.field;
  _qtPreviewItems[row][field] = input.value;
}

// ── 重算小计和合计 ──
function qtRowCalc(row) {
  const qtyEl   = document.querySelector(`input[data-row="${row}"][data-field="quantity"]`);
  const priceEl = document.querySelector(`input[data-row="${row}"][data-field="unit_price"]`);
  if (!qtyEl || !priceEl) return;
  const qty   = parseFloat(qtyEl.value)   || 0;
  const price = parseFloat(priceEl.value) || 0;
  _qtPreviewItems[row].quantity   = qty;
  _qtPreviewItems[row].unit_price = price;
  const subtotal = (qty * price).toFixed(2);
  const el = document.getElementById(`qt-subtotal-${row}`);
  if (el) el.textContent = subtotal;
  // 更新合计
  const total = _qtPreviewItems.reduce((s,it) => s + (it.unit_price||0)*(it.quantity??1), 0);
  const tc = document.getElementById('qt-total-cell');
  if (tc) tc.textContent = total.toFixed(2);
}

// ── 删除行 ──
function qtRowDelete(row) {
  _qtPreviewItems.splice(row, 1);
  qtRenderPreview(true);
}

// ── 新增行 ──
function qtRowAdd() {
  _qtPreviewItems.push({ name:'', brand:'', model:'', description:'', unit:'PCS', unit_price:0, quantity:1 });
  qtRenderPreview(true);
  // 聚焦新行的产品名称输入框
  setTimeout(() => {
    const idx = _qtPreviewItems.length - 1;
    document.querySelector(`input[data-row="${idx}"][data-field="name"]`)?.focus();
  }, 30);
}

// ── 保存 ──
async function qtPreviewSave() {
  // 从 DOM 收集最新数据（防止未触发 change 的输入框）
  _qtPreviewItems.forEach((item, i) => {
    ['name','brand','model','description','unit'].forEach(f => {
      const el = document.querySelector(`input[data-row="${i}"][data-field="${f}"]`);
      if (el) item[f] = el.value;
    });
    const qtyEl   = document.querySelector(`input[data-row="${i}"][data-field="quantity"]`);
    const priceEl = document.querySelector(`input[data-row="${i}"][data-field="unit_price"]`);
    if (qtyEl)   item.quantity   = parseFloat(qtyEl.value)   || 0;
    if (priceEl) item.unit_price = parseFloat(priceEl.value) || 0;
  });
  // 过滤掉完全空白的行
  const validItems = _qtPreviewItems.filter(it => it.name || it.unit_price);
  const total = validItems.reduce((s,it) => s + (it.unit_price||0)*(it.quantity??1), 0);
  const newDate = document.getElementById('qt-edit-date')?.value || _qtPreviewQuote.date;
  const newTax  = document.getElementById('qt-edit-tax')?.value  || _qtPreviewQuote.tax_info || '';

  const saveBtn = document.querySelector('#qt-preview-footer button[onclick*="qtPreviewSave"]');
  if (saveBtn) { saveBtn.disabled = true; saveBtn.textContent = '保存中…'; }

  try {
    await api('PUT', '/quotations/' + _qtPreviewQuoteId, {
      ..._qtPreviewQuote,
      date:         newDate,
      tax_info:     newTax,
      items:        JSON.stringify(validItems),
      total_amount: total,
    });
    _qtPreviewItems   = validItems;
    _qtPreviewQuote   = { ..._qtPreviewQuote, date: newDate, tax_info: newTax, items: JSON.stringify(validItems), total_amount: total };
    qtRenderPreview(false); // 切回查看模式
    loadPage();             // 刷新列表
  } catch(e) {
    alert('保存失败：' + e.message);
    if (saveBtn) { saveBtn.disabled = false; saveBtn.textContent = '💾 保存'; }
  }
}

async function ctOpenExportModal(contractId) {
  const res = await api('GET', '/contract-templates').catch(() => ({ templates: [] }));

                 border:2px solid ${lastTpl===String(t.id)?'var(--accent)':'var(--border)'};
                 border-radius:8px;margin-bottom:6px;cursor:pointer;background:var(--bg2)"
          onclick="ctSelectTpl(this,'${t.id}')">
          <input type="radio" name="ct-tpl" value="${t.id}" ${lastTpl===String(t.id)?'checked':''}
            style="margin-top:2px;flex-shrink:0;pointer-events:none">
          <div>
            <div style="font-size:13px;font-weight:500;color:${lastTpl===String(t.id)?'var(--accent)':'var(--text)'}">

            ${t.description?`<div style="font-size:11px;color:var(--text3);margin-top:2px">${escHtml(t.description)}</div>`:''}
            <div style="font-size:11px;color:var(--text3);margin-top:2px">
              ${t.file_type==='html'?'HTML模板（可打印PDF）':'Word模板（.docx）'} · ${t.is_public?'📢 公共':'🔒 私有'}
            </div>
          </div>
        </div>`).join('')
    : '<div style="padding:20px;text-align:center;color:var(--text3);font-size:13px">暂无模板，请先在模板管理中上传</div>';

  showModal(`
  <div class="modal">
    <div class="modal-header">📥 导出合同<span class="modal-close" onclick="closeModal()">×</span></div>
    <div class="modal-body">
      <div style="font-size:12px;color:var(--text3);margin-bottom:12px">
        选择导出模板：Word模板导出 .docx，HTML模板可在浏览器打印为 PDF
      </div>
      ${tplList}
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" onclick="ctDoExport(${contractId})">📥 导出</button>
    </div>
  </div>`);
  document.getElementById('modal-close').onclick = closeModal;
}

function ctSelectTpl(el, val) {
  document.querySelectorAll('.ct-tpl-item').forEach(item => {
    item.style.borderColor = 'var(--border)';
    const r = item.querySelector('input[type=radio]');
    if (r) r.checked = false;
    const t = item.querySelector('div > div:first-child');
    if (t) t.style.color = 'var(--text)';
  });
  el.style.borderColor = 'var(--accent)';
  const r = el.querySelector('input[type=radio]');
  if (r) r.checked = true;
  const t = el.querySelector('div > div:first-child');
  if (t) t.style.color = 'var(--accent)';
}

async function ctDoExport(contractId) {
  const radio = document.querySelector('input[name="ct-tpl"]:checked');
  const templateId = radio ? radio.value : '0';
  if (!templateId || templateId === '0') { alert('请选择导出模板'); return; }
  localStorage.setItem('ct_last_tpl', templateId);
  closeModal();

  // 判断是否 HTML 模板（从模板数据的 file_type 判断）
  const allTpls = (await api('GET', '/contract-templates').catch(() => ({ templates: [] }))).templates || [];
  const selectedTpl = allTpls.find(t => String(t.id) === String(templateId));
  const isHtml = selectedTpl?.file_type === 'html';

  if (isHtml) {
    // HTML 模板：新标签页打开，用户可直接 Ctrl+P 另存 PDF
    window.open(`/pages/contract/${contractId}?template=${templateId}&token=${encodeURIComponent(state.token)}`, '_blank');
    return;
  }

  // Word 模板：fetch 下载 .docx
  try {
    const res = await fetch(`/api/contracts/${contractId}/export?template_id=${templateId}`, {
      headers: { 'Authorization': 'Bearer ' + state.token }
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      alert('导出失败：' + (err.error || res.statusText));
      return;
    }
    const blob = await res.blob();
    const cd = res.headers.get('Content-Disposition') || '';
    const matchStar = cd.match(/filename\*=UTF-8''([^;]+)/i);
    const matchPlain = cd.match(/filename="([^"]+)"/);
    const filename = matchStar
      ? decodeURIComponent(matchStar[1])
      : matchPlain ? matchPlain[1] : `合同_${contractId}.docx`;
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  } catch(e) { alert('导出失败：' + e.message); }
}

              💡 无关联报价单时明细行输出"详见明细"<br>
              Word模板：在表格数据行写字段标记即可<br>
              HTML模板：支持直接打印为PDF
            </div>
          </div>
        </div>
      </details>

      <!-- 上传 -->
      <div style="border:1px dashed var(--border);border-radius:8px;padding:14px;margin-bottom:14px">
        <div style="font-size:12px;font-weight:600;color:var(--text2);margin-bottom:10px">
          ＋ 上传模板 ${isAdmin?'<span style="font-size:11px;color:var(--text3)">（管理员上传为公共模板）</span>':'<span style="font-size:11px;color:var(--text3)">（普通用户上传为私有模板）</span>'}
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px">
          <div><label style="font-size:12px;color:var(--text3)">模板名称 *</label>
            <input id="ct-new-name" placeholder="如：标准合同模板" style="width:100%;margin-top:4px"></div>
          <div><label style="font-size:12px;color:var(--text3)">说明</label>
            <input id="ct-new-desc" placeholder="可选" style="width:100%;margin-top:4px"></div>
        </div>
        <div style="display:flex;gap:8px;align-items:center">
          <input type="file" id="ct-new-file" accept=".docx,.html,.htm"
            style="flex:1;font-size:12px;color:var(--text2)">
          <button class="btn btn-primary btn-sm" onclick="ctUploadTemplate()">上传</button>
        </div>
        <div style="font-size:11px;color:var(--text3);margin-top:6px">支持 .docx（Word模板）和 .html（HTML模板）</div>
      </div>

      <!-- 列表 -->
      <div style="font-size:12px;font-weight:600;color:var(--text2);margin-bottom:8px">已有模板（${templates.length} 个）</div>
      <div id="ct-tpl-list">${renderList(templates)}</div>
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeModal()">关闭</button>
    </div>
  </div>`);
  document.getElementById('modal-close').onclick = closeModal;
}

async function ctUploadTemplate() {
  const name = document.getElementById('ct-new-name')?.value.trim();
  const desc = document.getElementById('ct-new-desc')?.value.trim() || '';
  const fileInput = document.getElementById('ct-new-file');
  const file = fileInput?.files?.[0];
  if (!name) { alert('请填写模板名称'); return; }
  if (!file) { alert('请选择文件'); return; }

  const fd = new FormData();
  fd.append('name', name);
  fd.append('description', desc);
  fd.append('file', file);

  try {
    const res = await fetch('/api/contract-templates', {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + state.token },
      body: fd,
    });
    const data = await res.json();
    if (!res.ok) { alert('上传失败：' + (data.error || res.statusText)); return; }
    closeModal();
    ctOpenTemplateManager();
  } catch(e) { alert('上传失败：' + e.message); }
}

async function ctDeleteTemplate(id) {
  if (!confirm('确认删除此模板？')) return;
  await api('DELETE', `/contract-templates/${id}`);
  closeModal();
  ctOpenTemplateManager();
}

function ctDownloadTemplate(id, name, fileType) {
  const ext = fileType === 'html' ? '.html' : '.docx';
  fetch(`/api/contract-templates/${id}/download`, {
    headers: { 'Authorization': 'Bearer ' + state.token }
  }).then(r => r.blob()).then(blob => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name + ext;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  });
}

// ============================================================
// 数据中心：高级筛选
// ============================================================

const DC_OPS = {
  text: [
    { v: 'contains',     l: '包含' },
    { v: 'not_contains', l: '不包含' },
    { v: 'eq',           l: '等于' },
    { v: 'neq',          l: '不等于' },
    { v: 'starts',       l: '开头是' },
    { v: 'empty',        l: '为空' },
    { v: 'not_empty',    l: '不为空' },
  ],
  number: [
    { v: 'eq',      l: '等于' },
    { v: 'neq',     l: '不等于' },
    { v: 'gt',      l: '大于' },
    { v: 'lt',      l: '小于' },
    { v: 'gte',     l: '≥' },
    { v: 'lte',     l: '≤' },
    { v: 'between', l: '范围' },
    { v: 'empty',   l: '为空' },
    { v: 'not_empty', l: '不为空' },
  ],
  date: [
    { v: 'eq',      l: '等于' },
    { v: 'gt',      l: '晚于' },
    { v: 'lt',      l: '早于' },
    { v: 'between', l: '范围' },
    { v: 'empty',   l: '为空' },
    { v: 'not_empty', l: '不为空' },
  ],
};

function dcFieldType(fid) {
  if (!_dcActiveTable) return 'text';
  if (fid === 'id') return 'number';
  if (fid === 'created_at') return 'date';
  const f = (_dcActiveTable.fields || []).find(f => f.id === fid);
  return f?.type || 'text';
}

// 列头 ▼ 弹出单列筛选面板
function dcOpenColFilter(fid) {
  const fields = dcGetVisibleFields();
  const field = fid === 'id'
    ? { id: 'id', name: '#', type: 'number' }
    : fields.find(f => f.id === fid) || { id: fid, name: fid, type: 'text' };

  const existing = (_dcFilters || []).find(f => f.field === fid) || {};
  const ftype = field.type || 'text';
  const ops = DC_OPS[ftype] || DC_OPS.text;
  const curOp = existing.op || ops[0].v;

  dcShowModal(`
  <div class="modal">
    <div class="modal-header">筛选：${escHtml(field.name)}<span class="modal-close" onclick="dcCloseModal()">×</span></div>
    <div class="modal-body">
      <div class="form-group">
        <label>筛选方式</label>
        <select id="dcf-op" onchange="dcfOpChange(this.value)">
          ${ops.map(o=>`<option value="${o.v}" ${curOp===o.v?'selected':''}>${o.l}</option>`).join('')}
        </select>
      </div>
      <div id="dcf-val-wrap">
        ${dcfValHtml(curOp, existing.value||'', existing.value2||'')}
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="dcColFilterClear('${fid}')">清除此列</button>
      <button class="btn" onclick="dcCloseModal()">取消</button>
      <button class="btn btn-primary" onclick="dcColFilterApply('${fid}')">应用</button>
    </div>
  </div>`);
}

function dcfValHtml(op, val, val2) {
  if (op === 'empty' || op === 'not_empty') return '';
  if (op === 'between') return `
    <div class="form-row">
      <div class="form-group"><label>从</label><input id="dcf-val" value="${escHtml(val)}" placeholder="起始值"></div>
      <div class="form-group"><label>到</label><input id="dcf-val2" value="${escHtml(val2)}" placeholder="结束值"></div>
    </div>`;
  return `<div class="form-group"><label>值</label><input id="dcf-val" value="${escHtml(val)}" placeholder="输入筛选值"></div>`;
}

function dcfOpChange(op) {
  const wrap = document.getElementById('dcf-val-wrap');
  if (wrap) wrap.innerHTML = dcfValHtml(op, '', '');
}

function dcColFilterApply(fid) {
  const op = document.getElementById('dcf-op')?.value;
  const val = document.getElementById('dcf-val')?.value?.trim() || '';
  const val2 = document.getElementById('dcf-val2')?.value?.trim() || '';
  if (!op) return;
  if (op !== 'empty' && op !== 'not_empty' && !val) {
    alert('请输入筛选值'); return;
  }
  _dcFilters = (_dcFilters || []).filter(f => f.field !== fid);
  _dcFilters.push({ field: fid, op, value: val, value2: val2 });
  dcCloseModal();
  _dcPage = 1;
  dcRenderFilterTags();
  dcLoadRows();
}

function dcColFilterClear(fid) {
  _dcFilters = (_dcFilters || []).filter(f => f.field !== fid);
  dcCloseModal();
  _dcPage = 1;
  dcRenderFilterTags();
  dcLoadRows();
}

// 高级筛选弹窗（多条件）
function dcAdvRowHtml(f, i) {
  const fields = dcGetVisibleFields();
  const allFields = [{ id: 'id', name: '#', type: 'number' }, ...fields];
  const ftype = dcFieldType(f.field || 'id');
  const ops = DC_OPS[ftype] || DC_OPS.text;
  const needVal = f.op !== 'empty' && f.op !== 'not_empty';
  const isBetween = f.op === 'between';
  return `
  <div id="adv-row-${i}" style="display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap">
    <select style="flex:1;min-width:100px" onchange="dcAdvRowFieldChange(${i},this.value)">
      ${allFields.map(af=>`<option value="${af.id}" ${f.field===af.id?'selected':''}>${escHtml(af.name)}</option>`).join('')}
    </select>
    <select id="adv-op-${i}" style="flex:1;min-width:90px" onchange="dcAdvRowOpChange(${i},this.value)">
      ${ops.map(o=>`<option value="${o.v}" ${f.op===o.v?'selected':''}>${o.l}</option>`).join('')}
    </select>
    <span id="adv-val-wrap-${i}" style="display:contents">
      ${needVal && !isBetween ? `<input id="adv-val-${i}" style="flex:2;min-width:120px" value="${escHtml(f.value||'')}" placeholder="值">` : ''}
      ${isBetween ? `<input id="adv-val-${i}" style="flex:1;min-width:80px" value="${escHtml(f.value||'')}" placeholder="从"><input id="adv-val2-${i}" style="flex:1;min-width:80px" value="${escHtml(f.value2||'')}" placeholder="到">` : ''}
      ${!needVal ? `<span style="flex:2;font-size:12px;color:var(--text3)">(无需填值)</span>` : ''}
    </span>
    <button onclick="dcAdvRemoveRow(${i})" style="background:none;border:none;cursor:pointer;color:var(--red);font-size:16px;padding:2px 4px">✕</button>
  </div>`;
}

function dcOpenAdvFilter() {
  const fields = dcGetVisibleFields();
  const allFields = [{ id: 'id', name: '#', type: 'number' }, ...fields];
  const existingFilters = _dcFilters?.length
    ? _dcFilters
    : [{ field: allFields[0]?.id || 'id', op: 'contains', value: '', value2: '' }];
  window._dcAdvFilters = existingFilters.map(f => ({ ...f }));

  showModal(`
  <div class="modal modal-lg">
    <div class="modal-header">🔍 高级筛选<span class="modal-close" onclick="closeModal()">×</span></div>
    <div class="modal-body">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:14px">
        <span style="font-size:12px;color:var(--text2);font-weight:600">条件组合：</span>
        <label style="display:flex;align-items:center;gap:4px;cursor:pointer;font-size:12px">
          <input type="radio" name="dc-logic" value="AND" ${(_dcFilterLogic||'AND')==='AND'?'checked':''}> AND（全部满足）
        </label>
        <label style="display:flex;align-items:center;gap:4px;cursor:pointer;font-size:12px">
          <input type="radio" name="dc-logic" value="OR" ${_dcFilterLogic==='OR'?'checked':''}> OR（任一满足）
        </label>
      </div>
      <div id="adv-filter-rows">
        ${window._dcAdvFilters.map((f, i) => dcAdvRowHtml(f, i)).join('')}
      </div>
      <button class="btn btn-sm" onclick="dcAdvAddRow()" style="margin-top:8px">＋ 添加条件</button>
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="dcClearFilters();closeModal()">清除全部</button>
      <button class="btn" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" onclick="dcAdvApply()">应用筛选</button>
    </div>
  </div>`);
}

function dcAdvAddRow() {
  const fields = dcGetVisibleFields();
  const allFields = [{ id: 'id', name: '#', type: 'number' }, ...fields];
  dcAdvSaveCurrent();
  const newF = { field: allFields[0]?.id || 'id', op: 'contains', value: '', value2: '' };
  window._dcAdvFilters = window._dcAdvFilters || [];
  window._dcAdvFilters.push(newF);
  const container = document.getElementById('adv-filter-rows');
  if (container) {
    const tmp = document.createElement('div');
    tmp.innerHTML = dcAdvRowHtml(newF, window._dcAdvFilters.length - 1);
    container.appendChild(tmp.firstElementChild);
  }
}

function dcAdvRemoveRow(i) {
  dcAdvSaveCurrent();
  window._dcAdvFilters = (window._dcAdvFilters || []).filter((_, idx) => idx !== i);
  const container = document.getElementById('adv-filter-rows');
  if (container) {
    container.innerHTML = window._dcAdvFilters.map((f, idx) => dcAdvRowHtml(f, idx)).join('');
  }
}

function dcAdvSaveCurrent() {
  (window._dcAdvFilters || []).forEach((f, i) => {
    const op = document.getElementById(`adv-op-${i}`)?.value;
    const val = document.getElementById(`adv-val-${i}`)?.value || '';
    const val2 = document.getElementById(`adv-val2-${i}`)?.value || '';
    if (op) f.op = op;
    f.value = val;
    f.value2 = val2;
  });
}

function dcAdvRowFieldChange(i, fid) {
  dcAdvSaveCurrent();
  if (window._dcAdvFilters?.[i]) {
    window._dcAdvFilters[i].field = fid;
    const ftype = dcFieldType(fid);
    window._dcAdvFilters[i].op = (DC_OPS[ftype] || DC_OPS.text)[0].v;
    window._dcAdvFilters[i].value = '';
    window._dcAdvFilters[i].value2 = '';
  }
  // 只更新 op select 和 value wrap，不重建整个弹窗
  const f = window._dcAdvFilters?.[i];
  if (!f) return;
  const ftype = dcFieldType(f.field);
  const ops = DC_OPS[ftype] || DC_OPS.text;
  const opSel = document.getElementById(`adv-op-${i}`);
  if (opSel) {
    opSel.innerHTML = ops.map(o=>`<option value="${o.v}" ${f.op===o.v?'selected':''}>${o.l}</option>`).join('');
  }
  dcAdvRowOpChange(i, f.op);
}

function dcAdvRowOpChange(i, op) {
  if (window._dcAdvFilters?.[i]) window._dcAdvFilters[i].op = op;
  const valWrap = document.getElementById(`adv-val-wrap-${i}`);
  if (!valWrap) return;
  const needVal = op !== 'empty' && op !== 'not_empty';
  const isBetween = op === 'between';
  const curVal = window._dcAdvFilters?.[i]?.value || '';
  const curVal2 = window._dcAdvFilters?.[i]?.value2 || '';
  valWrap.innerHTML = needVal && !isBetween
    ? `<input id="adv-val-${i}" style="flex:2;min-width:120px" value="${escHtml(curVal)}" placeholder="值">`
    : isBetween
      ? `<input id="adv-val-${i}" style="flex:1;min-width:80px" value="${escHtml(curVal)}" placeholder="从"><input id="adv-val2-${i}" style="flex:1;min-width:80px" value="${escHtml(curVal2)}" placeholder="到">`
      : `<span style="flex:2;font-size:12px;color:var(--text3)">(无需填值)</span>`;
}

function dcAdvApply() {
  dcAdvSaveCurrent();
  const rows = window._dcAdvFilters || [];
  const logic = document.querySelector('input[name="dc-logic"]:checked')?.value || 'AND';
  const filters = [];
  rows.forEach((f, i) => {
    const op = f.op;
    const val = f.value?.trim() || '';
    const val2 = f.value2?.trim() || '';
    if (op === 'empty' || op === 'not_empty' || val) {
      filters.push({ field: f.field, op, value: val, value2: val2 });
    }
  });
  _dcFilters = filters;
  _dcFilterLogic = logic;
  closeModal();
  _dcPage = 1;
  dcRenderFilterTags();
  dcLoadRows();
}


function dcClearFilters() {
  _dcFilters = [];
  dcRenderFilterTags();
  _dcPage = 1;
  dcLoadRows();
}

function dcRenderFilterTags() {
  const tags = document.getElementById('dc-filter-tags');
  const clearBtn = document.getElementById('dc-clear-filter-btn');
  const advBtn = document.getElementById('dc-adv-filter-btn');
  if (!tags) return;

  if (!_dcFilters?.length) {
    tags.innerHTML = '';
    if (clearBtn) clearBtn.style.display = 'none';
    if (advBtn) advBtn.style.color = '';
    return;
  }

  if (clearBtn) clearBtn.style.display = '';
  if (advBtn) advBtn.style.color = 'var(--accent)';

  const opLabel = { eq:'=', neq:'≠', contains:'包含', not_contains:'不含',
    starts:'开头', gt:'>', lt:'<', gte:'≥', lte:'≤', between:'范围', empty:'为空', not_empty:'不为空' };

  const fields = [...dcGetVisibleFields(), { id:'id', name:'#', type:'number' }];
  tags.innerHTML = _dcFilters.map((f, i) => {
    const field = fields.find(ff => ff.id === f.field);
    const fname = field?.name || f.field;
    const label = f.op === 'between'
      ? `${fname} ${f.value}~${f.value2}`
      : f.op === 'empty' || f.op === 'not_empty'
        ? `${fname} ${opLabel[f.op]||f.op}`
        : `${fname} ${opLabel[f.op]||f.op} "${f.value}"`;
    return `<span style="display:inline-flex;align-items:center;gap:4px;padding:2px 8px;
      background:rgba(46,117,182,.12);color:var(--accent);border:1px solid var(--accent);
      border-radius:20px;font-size:11px">
      ${escHtml(label)}
      <span onclick="dcColFilterClear('${f.field}')" style="cursor:pointer;font-size:13px;line-height:1;opacity:.7">×</span>
    </span>`;
  }).join('');
}

async function dcOpenTemplateExport() {
  if (!_dcActiveTable) return;
  const tableId = _dcActiveTable.id;
  const res = await api('GET', `/dc/templates?table_id=${tableId}`).catch(() => ({ templates: [] }));
  const templates = res.templates || [];
  const lastTpl = localStorage.getItem(`dc_last_tpl_${tableId}`) || '0';

  const tplHtml = templates.length
    ? templates.map(t => {
        const icon = t.file_type === 'html' ? '🌐' : t.file_type === 'docx' ? '📄' : '📊';
        const scope = t.table_id > 0 ? '📌 本表' : '🌍 全局';
        return `
        <div class="dc-tpl-item" data-id="${t.id}" data-type="${t.file_type}"
          style="display:flex;align-items:flex-start;gap:10px;padding:10px 12px;
            border:2px solid ${lastTpl===String(t.id)?'var(--accent)':'var(--border)'};
            border-radius:8px;margin-bottom:6px;cursor:pointer;background:var(--bg2)"
          onclick="dcSelectTpl(this,'${t.id}')">
          <input type="radio" name="dc-tpl" value="${t.id}" ${lastTpl===String(t.id)?'checked':''}
            style="margin-top:2px;flex-shrink:0;pointer-events:none">
          <div>
            <div style="font-size:13px;font-weight:500;color:${lastTpl===String(t.id)?'var(--accent)':'var(--text)'}">
              ${icon} ${escHtml(t.name)}
            </div>
            ${t.description?`<div style="font-size:11px;color:var(--text3);margin-top:2px">${escHtml(t.description)}</div>`:''}
            <div style="font-size:11px;color:var(--text3);margin-top:2px">
              ${t.file_type.toUpperCase()} · ${scope} · ${t.is_public?'📢 公共':'🔒 私有'}
            </div>
          </div>
        </div>`;
      }).join('')
    : '<div style="padding:20px;text-align:center;color:var(--text3);font-size:13px">暂无模板，请先在模板管理中上传</div>';

  const filterCount = (_dcFilters||[]).length;
  showModal(`
  <div class="modal">
    <div class="modal-header">📋 模板导出 — ${escHtml(_dcActiveTable.name)}<span class="modal-close" onclick="closeModal()">×</span></div>
    <div class="modal-body">
      ${filterCount ? `<div style="padding:8px 12px;background:rgba(46,117,182,.08);border-radius:6px;font-size:12px;color:var(--accent);margin-bottom:12px">
        📌 当前有 ${filterCount} 个筛选条件，将导出过滤后的数据
      </div>` : ''}
      ${tplHtml}
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" onclick="dcDoTemplateExport(${tableId})">📥 导出</button>
    </div>
  </div>`);
}

function dcSelectTpl(el, val) {
  document.querySelectorAll('.dc-tpl-item').forEach(item => {
    item.style.borderColor = 'var(--border)';
    const r = item.querySelector('input[type=radio]');
    if (r) r.checked = false;
    const t = item.querySelector('div>div:first-child');
    if (t) t.style.color = 'var(--text)';
  });
  el.style.borderColor = 'var(--accent)';
  const r = el.querySelector('input[type=radio]');
  if (r) r.checked = true;
  const t = el.querySelector('div>div:first-child');
  if (t) t.style.color = 'var(--accent)';
}

async function dcDoTemplateExport(tableId) {
  const radio = document.querySelector('input[name="dc-tpl"]:checked');
  const templateId = radio?.value || '0';
  if (!templateId || templateId === '0') { alert('请选择导出模板'); return; }
  localStorage.setItem(`dc_last_tpl_${tableId}`, templateId);

  const fileType = document.querySelector(`.dc-tpl-item[data-id="${templateId}"]`)?.dataset?.type || 'xlsx';
  closeModal();

  if (fileType === 'html') {
    // HTML 模板：直接在浏览器打开 /pages/datacenter/:id，用户可 Ctrl+P 打印为 PDF
    const filtersParam = encodeURIComponent(JSON.stringify(_dcFilters || []));
    const logic = _dcFilterLogic || 'AND';
    const url = `/pages/datacenter/${tableId}?template=${templateId}&filters=${filtersParam}&logic=${logic}&sort_by=${_dcSortBy}&sort_dir=${_dcSortDir}&token=${encodeURIComponent(state.token)}`;
    window.open(url, '_blank');
    return;
  }

  // xlsx / docx：下载
  try {
    const body = {
      filters: _dcFilters || [],
      logic: _dcFilterLogic || 'AND',
      sort_by: _dcSortBy,
      sort_dir: _dcSortDir,
    };
    const res = await fetch(`/api/dc/tables/${tableId}/export?template_id=${templateId}`, {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + state.token, 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    if (!res.ok) { const e = await res.json().catch(()=>{}); alert('导出失败：' + (e?.error||res.statusText)); return; }
    const blob = await res.blob();
    const cd = res.headers.get('Content-Disposition') || '';
    const m = cd.match(/filename\*=UTF-8''([^;]+)/i);
    const filename = m ? decodeURIComponent(m[1]) : `导出_${tableId}.${fileType}`;
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  } catch(e) { alert('导出失败：' + e.message); }
}

    <div class="modal-body">

        <div>
          <div style="font-size:13px;font-weight:500;color:var(--text)">📥 下载骨架模板</div>

        <div style="font-size:12px;font-weight:600;color:var(--text2);margin-bottom:10px">
          ＋ 上传新模板 ${isAdmin?'<span style="font-size:11px;color:var(--text3)">（管理员上传为公共）</span>':'<span style="font-size:11px;color:var(--text3)">（上传为私有）</span>'}

async function dcTplUpload(tableId) {
  const name = document.getElementById('dctpl-name')?.value.trim();
  const desc = document.getElementById('dctpl-desc')?.value.trim() || '';
  const scope = document.getElementById('dctpl-scope')?.value || '0';
  const file = document.getElementById('dctpl-file')?.files?.[0];
  if (!name) { alert('请填写模板名称'); return; }
  if (!file) { alert('请选择文件'); return; }

  const fd = new FormData();
  fd.append('name', name);
  fd.append('description', desc);
  fd.append('table_id', scope);
  fd.append('file', file);

  try {
    const res = await fetch('/api/dc/templates', {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + state.token },
      body: fd,
    });
    const data = await res.json();
    if (!res.ok) { alert('上传失败：' + (data.error || res.statusText)); return; }
    closeModal();
    dcOpenTemplateManager();
  } catch(e) { alert('上传失败：' + e.message); }
}

async function dcTplDelete(id) {
  if (!confirm('确认删除此模板？')) return;
  await api('DELETE', `/dc/templates/${id}`);
  closeModal();
  dcOpenTemplateManager();
}

function dcTplDownload(id, name, fileType) {
  const ext = { xlsx: '.xlsx', docx: '.docx', html: '.html' }[fileType] || '.xlsx';
  fetch(`/api/dc/templates/${id}/download`, {
    headers: { 'Authorization': 'Bearer ' + state.token }
  }).then(r => r.blob()).then(blob => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name + ext;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  });
}

function dcDownloadSkeleton(tableId) {
  fetch(`/api/dc/templates/skeleton?table_id=${tableId}`, {
    headers: { 'Authorization': 'Bearer ' + state.token }
  }).then(r => r.blob()).then(blob => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = (_dcActiveTable?.name || '数据') + '_模板骨架.xlsx';
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  });
}

function acRenderAppCards() {

// 拖拽排序
function acDragStart(e, id) {
  _acDragId = id;
  e.dataTransfer.effectAllowed = 'move';
  setTimeout(() => {
    const el = document.querySelector(`.ac-app-card[data-id="${id}"]`);
    if (el) el.style.opacity = '0.4';
  }, 0);
}
function acDragOver(e, id) {
  e.preventDefault();
  document.querySelectorAll('.ac-app-card').forEach(el => el.style.outline = '');
  const t = document.querySelector(`.ac-app-card[data-id="${id}"]`);
  if (t && id !== _acDragId) t.style.outline = '2px solid var(--accent)';
}
function acDrop(e, toId) {
  e.preventDefault();
  const fromId = _acDragId;
  if (!fromId || fromId === toId) return;
  const fi = _acApps.findIndex(a => a.id === fromId);
  const ti = _acApps.findIndex(a => a.id === toId);
  if (fi < 0 || ti < 0) return;
  const [moved] = _acApps.splice(fi, 1);
  _acApps.splice(ti, 0, moved);
  _acApps.forEach((a, i) => a.sort_order = i);
  acRenderAppCards();
  api('PUT', '/plus/apps/reorder', { orders: _acApps.map((a, i) => ({ id: a.id, order: i })) }).catch(() => {});
}
function acDragEnd() {
  _acDragId = null;
  document.querySelectorAll('.ac-app-card').forEach(el => {
    el.style.opacity = '';
    el.style.outline = '';
  });
}

async function acSaveApp(id) {
  const name   = document.getElementById('ac-app-name')?.value.trim();
  const url    = document.getElementById('ac-app-url')?.value.trim();
  const icon   = document.getElementById('ac-app-icon')?.value.trim();
  const cat    = document.getElementById('ac-app-cat')?.value.trim();
  const remark = document.getElementById('ac-app-remark')?.value.trim();
  const mode   = document.getElementById('ac-app-mode')?.value || 'iframe';
  if (!name) { alert('请填写应用名称'); return; }
  if (!url)  { alert('请填写 URL'); return; }
  const payload = { name, url, icon, category: cat, remark, open_mode: mode };
  if (id) {
    await api('PUT', `/plus/apps/${id}`, payload);
  } else {
    await api('POST', '/plus/apps', payload);
  }
  closeModal();
  await acLoadApps();
  acRenderAppCards();

async function acDeleteTable(name) {
  if (!confirm(`确认删除数据表「${name}」及其所有数据？此操作不可恢复！`)) return;
  await api('DELETE', `/plus/tables/${name}`);

// ── 新建数据表弹窗（复用数据中心相同交互）───────────────────
function acNewTable() {
  _acPendingFields = [{ name: '', type: 'text', required: false }];

function acShowTableModal(t) {
  const isEdit = !!t;
  if (isEdit) _acPendingFields = t.fields ? t.fields.map(f => ({ ...f })) : [];
  acShowModal(`<div class="modal" style="max-width:700px;width:95vw">

            style="${isEdit?'opacity:.6;cursor:not-allowed':''}" oninput="this.value=this.value.toLowerCase().replace(/[^a-z0-9_]/g,'')">
        </div>
        <div class="form-group" style="flex:1">

function acRenderFields() {
  const wrap = document.getElementById('ac-fields-wrap');
  if (!wrap) return;
  wrap.innerHTML = _acPendingFields.map((f, i) => `
    <div style="display:flex;gap:8px;align-items:center;margin-bottom:6px">
      <input value="${escHtml(f.name||'')}" placeholder="字段名称"
        oninput="_acPendingFields[${i}].name=this.value"
        style="flex:2;padding:6px 10px;background:var(--bg1);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:13px">
      <select onchange="_acPendingFields[${i}].type=this.value"
        style="flex:1;padding:6px 8px;background:var(--bg1);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:13px">
        ${['text','number','date','datetime'].map(tp =>
          `<option value="${tp}" ${f.type===tp?'selected':''}>${{text:'文本',number:'数字',date:'日期',datetime:'日期时间'}[tp]}</option>`
        ).join('')}
      </select>
      <label style="font-size:12px;color:var(--text2);display:flex;align-items:center;gap:4px;white-space:nowrap">
        <input type="checkbox" ${f.required?'checked':''} onchange="_acPendingFields[${i}].required=this.checked"> 必填
      </label>
      <button onclick="acRemoveField(${i})"
        style="background:none;border:none;color:var(--red);cursor:pointer;font-size:18px;padding:0 4px;line-height:1">×</button>
    </div>`).join('');
}

function acAddField() {
  _acPendingFields.push({ name: '', type: 'text', required: false });
  acRenderFields();
}

function acRemoveField(i) {
  _acPendingFields.splice(i, 1);
  acRenderFields();
}

async function acSaveTable(existingName) {
  // Sync field values from DOM before saving
  document.querySelectorAll('#ac-fields-wrap input[placeholder="字段名称"]').forEach((el, i) => {
    if (_acPendingFields[i]) _acPendingFields[i].name = el.value;
  });

  const name  = document.getElementById('ac-tbl-name')?.value.trim();
  const label = document.getElementById('ac-tbl-label')?.value.trim();
  const desc  = document.getElementById('ac-tbl-desc')?.value.trim();
  if (!existingName && !name) { alert('请输入表名'); return; }
  if (!label) { alert('请输入显示名'); return; }
  const fields = _acPendingFields.filter(f => f.name.trim());
  if (!fields.length) { alert('至少需要一个字段'); return; }

  try {
    if (existingName) {
      await api('PUT', `/plus/tables/${existingName}`, { label, description: desc, fields });
      // 编辑表结构：关闭弹窗，刷新元数据，留在表详情页
      acDismissModal();
      await acLoadTables();
      const updated = _acTables.find(x => x.name === existingName);
      if (updated) _acActiveTable = updated;
      acLoadRows();
    } else {
      await api('POST', '/plus/tables', { name, label, description: desc, fields });
      // 新建表：关闭弹窗，回到数据库管理列表显示新表
      acDismissModal();
      await acLoadTables();
      acRenderTableCards();
    }
  } catch(e) {
    alert('保存失败: ' + (e.message || e));
  }
}
