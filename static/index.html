      const sqlType = f.type === 'number' ? 'REAL' : 'TEXT';
      const notNull = f.required ? ' NOT NULL DEFAULT \'\'' : '';
      return `  \`${f.id}\`${' '.repeat(Math.max(1, 12 - f.id.length))}${sqlType}${notNull}  -- ${f.name}`;
    }),
    '  `created_by` INTEGER NOT NULL DEFAULT 0  -- 创建人用户ID',

function acBuildPrompt(t, fields, apis, ddl) {
  const fieldDesc = fields.map(f =>
    `  - ${f.id} (${f.type==='number'?'REAL':'TEXT'})：${f.name}${f.required?' [必填]':''}`
  ).join('\n');
  const host = window.location.origin;
  return `## 数据表：app_${t.name}（${t.label}）
${t.description ? '\n描述：' + t.description + '\n' : ''}
### 数据库
- 文件：data/db/plus.db（SQLite）
- 物理表名：app_${t.name}

### 字段
${fieldDesc}
  - id         (INTEGER)：自增主键 [系统字段]
  - created_by (INTEGER)：创建人用户 ID，0 = 未知 [系统字段，自动记录]
  - created_at (DATETIME)：创建时间 [系统字段]
  - updated_at (DATETIME)：更新时间 [系统字段]

### 获取 Token（在 ERP 系统页面的浏览器控制台执行）
  erpToken = localStorage.getItem('erp_token') || '';

### REST API（Base URL: ${host}/api/plus/${t.name}）
所有请求需携带 Header：Authorization: Bearer <token>

1. 查询数据
   POST /query
   Body: { "q": "", "sort_by": "id", "sort_dir": "desc", "page": 1, "page_size": 50 }
   返回: { "data": [...], "total": N, "fields": [...] }

2. 新增一行（系统自动记录 created_by = 当前登录用户 ID）
   POST /rows
   Body: { ${fields.slice(0,3).map(f=>`"${f.id}": ...`).join(', ')} }
   返回: { "id": N, "ok": true }

3. 修改一行
   PUT /rows/{id}
   Body: { ${fields.slice(0,3).map(f=>`"${f.id}": ...`).join(', ')} }
   返回: { "ok": true }

4. 删除一行
   DELETE /rows/{id}
   返回: { "ok": true }

### 用户信息接口（所有登录用户可访问）

5. 获取用户列表（将 created_by 映射为姓名）
   GET ${host}/api/users/simple
   返回: [{ "id": 1, "full_name": "张三" }, ...]

   JS 示例：
   const users = await fetch('${host}/api/users/simple', {
     headers: { Authorization: 'Bearer ' + erpToken }
   }).then(r => r.json());
   const userName = uid => users.find(u => u.id === uid)?.full_name || \`#\${uid}\`;
   // 使用：userName(row.created_by)  →  "张三"

6. 获取当前登录用户完整信息（除密码）
   GET ${host}/api/users/self
   返回: {
     id, username, full_name, email, department, position, level,
     is_admin, permissions, employee_id,  // employee_id 未填时自动为数据库 ID
     created_at
   }

   JS 示例：
   const me = await fetch('${host}/api/users/self', {
     headers: { Authorization: 'Bearer ' + erpToken }
   }).then(r => r.json());
   // me.full_name → "张三"
   // me.employee_id → "EMP001"（或 "1"）
   // me.department → "技术部"
   // JSON.parse(me.permissions) → {"products": true, ...}

### 模板与导出 API

7. 获取模板列表（含通用模板 + 此表专属模板）
   GET ${host}/api/plus/templates?table_name=${t.name}
   返回: { "templates": [{ "id": N, "name": "...", "file_type": "xlsx|docx|html" }] }

8. 用模板导出数据（xlsx/docx → 触发文件下载）
   POST ${host}/api/plus/${t.name}/export?template_id={模板ID}
   Body（可选）: { "filters": [], "sort_by": "id", "sort_dir": "desc" }
   - template_id=0 → 使用默认样式导出 xlsx

9. HTML 模板网页预览
   GET ${host}/pages/appcenter/${t.name}?template={模板ID}&token=<token>

### SQL DDL
${ddl}`;
}

function acCopyText(elementId, btnLabel) {
  const el = document.getElementById(elementId);
  if (!el) return;
  const text = el.textContent || el.innerText;
  navigator.clipboard.writeText(text).then(() => {
    // find the button that triggered this and show feedback
    document.querySelectorAll('.modal button').forEach(btn => {
      if (btn.textContent.includes(btnLabel.replace('复制 ', ''))) {
        const orig = btn.textContent;
        btn.textContent = '✓ 已复制';
        btn.style.color = 'var(--green)';
        setTimeout(() => { btn.textContent = orig; btn.style.color = ''; }, 1500);
      }
    });
  }).catch(() => {
    // fallback
    const range = document.createRange();
    range.selectNode(el);
    window.getSelection().removeAllRanges();
    window.getSelection().addRange(range);
    document.execCommand('copy');
    window.getSelection().removeAllRanges();
  });
}

async function acShowPerms(t) {
  if (!t) return;
  const [permRes, usersRes, deptRes, groupRes] = await Promise.all([
    api('GET', `/plus/${t.name}/perms`),
    _acUserCache  ? Promise.resolve(_acUserCache)  : api('GET', '/users/simple').then(u => { _acUserCache = u; return u; }),
    _acDeptCache  ? Promise.resolve(_acDeptCache)  : api('GET', '/share/departments').then(r => { _acDeptCache = r.departments||[]; return _acDeptCache; }).catch(()=>[]),
    _acGroupCache ? Promise.resolve(_acGroupCache) : api('GET', '/plus/groups').then(r => { _acGroupCache = r.groups||[]; return _acGroupCache; }),
  ]);
  _acPermData = permRes;
  if (!Array.isArray(_acUserCache)) _acUserCache = usersRes;
  acRenderPermsModal(t);
}

  const res = await api('GET', `/plus/${t.name}/perms`);
  _acPermData = res;
  acRenderPermsModal(t);
}

async function acSavePerms(tname) {
  const perm = {
    user_read_all: document.getElementById('acp-def-user_read_all')?.checked  ? 1 : 0,
    user_read_own: document.getElementById('acp-def-user_read_own')?.checked  ? 1 : 0,
    user_write:    document.getElementById('acp-def-user_write')?.checked     ? 1 : 0,
    user_edit_own: document.getElementById('acp-def-user_edit_own')?.checked  ? 1 : 0,
    user_edit_all: document.getElementById('acp-def-user_edit_all')?.checked  ? 1 : 0,
  };
  await api('PUT', `/plus/${tname}/perms`, perm);
  if (_acPermData) _acPermData.perm = perm;
  acCloseModal();
}

async function acAddGroupMember(gid, gname) {
  const uid = parseInt(document.getElementById('ac-add-member-sel')?.value);

  await api('POST', `/plus/groups/${gid}/members`, { user_id: uid });

  // 本地更新，不重新打开弹窗
  const u = window._acGAllUsers?.find(x => x.id === uid);
  if (u) {
    window._acGMemberIds.add(uid);
    window._acGMembers    = window._acGAllUsers.filter(x => window._acGMemberIds.has(x.id));
    window._acGNonMembers = window._acGAllUsers.filter(x => !window._acGMemberIds.has(x.id));
    const userName = x => escHtml(x.full_name || `#${x.id}`);
    const memberList = document.getElementById('ac-member-list');
    const addArea    = document.getElementById('ac-add-area');
    const countEl    = document.getElementById('ac-member-count');
    if (memberList) memberList.innerHTML = window._acGMembers.length
      ? window._acGMembers.map(x => `<div style="display:flex;align-items:center;gap:10px;padding:7px 12px;
          background:var(--bg3);border-radius:6px;margin-bottom:4px">
          <span style="flex:1;font-size:13px;color:var(--text)">👤 ${userName(x)}</span>
          <button onclick="acRemoveGroupMember(${gid},${x.id},'${escHtml(gname)}')"
            style="background:none;border:1px solid var(--border);border-radius:4px;
                   color:var(--red);font-size:12px;padding:3px 8px;cursor:pointer">移除</button>
        </div>`).join('')
      : `<div style="color:var(--text3);font-size:13px;padding:8px 0">暂无成员</div>`;
    if (addArea) addArea.innerHTML = window._acGNonMembers.length
      ? `<div>
          <div style="font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px">添加成员</div>
          <div style="display:flex;gap:8px">
            <select id="ac-add-member-sel" style="flex:1;padding:7px 10px;background:var(--bg1);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:13px">
              <option value="">-- 选择用户 --</option>
              ${window._acGNonMembers.map(x => `<option value="${x.id}">${userName(x)}</option>`).join('')}
            </select>
            <button onclick="acAddGroupMember(${gid},'${escHtml(gname)}')" class="btn btn-primary btn-sm">添加</button>
          </div>
        </div>`
      : `<div style="color:var(--text3);font-size:13px">所有用户已在组内</div>`;
    if (countEl) countEl.textContent = window._acGMembers.length;
  }
}

async function acRemoveGroupMember(gid, uid, gname) {
  if (!confirm('确认从组中移除该成员？')) return;
  await api('DELETE', `/plus/groups/${gid}/members/${uid}`);

  // 本地更新，不重新打开弹窗
  window._acGMemberIds?.delete(uid);
  window._acGMembers    = window._acGAllUsers?.filter(x => window._acGMemberIds?.has(x.id)) || [];
  window._acGNonMembers = window._acGAllUsers?.filter(x => !window._acGMemberIds?.has(x.id)) || [];
  const userName = x => escHtml(x.full_name || `#${x.id}`);
  const memberList = document.getElementById('ac-member-list');
  const addArea    = document.getElementById('ac-add-area');
  const countEl    = document.getElementById('ac-member-count');
  if (memberList) memberList.innerHTML = window._acGMembers.length
    ? window._acGMembers.map(x => `<div style="display:flex;align-items:center;gap:10px;padding:7px 12px;
        background:var(--bg3);border-radius:6px;margin-bottom:4px">
        <span style="flex:1;font-size:13px;color:var(--text)">👤 ${userName(x)}</span>
        <button onclick="acRemoveGroupMember(${gid},${x.id},'${escHtml(gname)}')"
          style="background:none;border:1px solid var(--border);border-radius:4px;
                 color:var(--red);font-size:12px;padding:3px 8px;cursor:pointer">移除</button>
      </div>`).join('')
    : `<div style="color:var(--text3);font-size:13px;padding:8px 0">暂无成员</div>`;
  if (addArea) addArea.innerHTML = window._acGNonMembers.length
    ? `<div>
        <div style="font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px">添加成员</div>
        <div style="display:flex;gap:8px">
          <select id="ac-add-member-sel" style="flex:1;padding:7px 10px;background:var(--bg1);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:13px">
            <option value="">-- 选择用户 --</option>
            ${window._acGNonMembers.map(x => `<option value="${x.id}">${userName(x)}</option>`).join('')}
          </select>
          <button onclick="acAddGroupMember(${gid},'${escHtml(gname)}')" class="btn btn-primary btn-sm">添加</button>
        </div>
      </div>`
    : `<div style="color:var(--text3);font-size:13px">所有用户已在组内</div>`;
  if (countEl) countEl.textContent = window._acGMembers.length;
}

// ── 模板管理 ─────────────────────────────────────────────────
let _acTemplates = [];

}

            style="background:var(--bg2);border:1px solid var(--border);border-radius:5px;
                   color:var(--text3);font-size:12px;padding:4px 10px;cursor:pointer;

    <div class="modal-header" style="flex-shrink:0">

// 默认 xlsx 导出（无模板）
async function acExportDefault() {
  if (!_acActiveTable) return;
  acDownloadExport(_acActiveTable.name, 0);
}

// 用模板导出 Excel/Word
async function acExportDownload(templateId) {
  if (!_acActiveTable) return;
  acDownloadExport(_acActiveTable.name, templateId);
}

// 触发文件下载的通用函数
async function acDownloadExport(tableName, templateId) {
  const url = `/api/plus/${tableName}/export?template_id=${templateId}`;
  try {
    const res = await fetch(url, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + state.token
      },
      body: JSON.stringify({
        sort_by: _acRowSort,
        sort_dir: _acRowDir,
        filters: []
      })
    });
    if (!res.ok) {
      const err = await res.json();
      alert(err.error || '导出失败');
      return;
    }
    const blob = await res.blob();
    const cd = res.headers.get('Content-Disposition') || '';
    // 从 Content-Disposition 解码文件名
    let filename = '导出文件';
    const fnMatch = cd.match(/filename\*=UTF-8''(.+)/i) || cd.match(/filename="?([^"]+)"?/i);
    if (fnMatch) {
      try { filename = decodeURIComponent(fnMatch[1]); } catch(e) { filename = fnMatch[1]; }
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    a.click();
    URL.revokeObjectURL(a.href);
  } catch(e) {
    alert('导出失败: ' + e.message);
  }
}

// HTML 模板：新标签页预览
function acExportHTML(templateId) {
  if (!_acActiveTable) return;
  const url = `/pages/appcenter/${_acActiveTable.name}?template=${templateId}&sort_by=${_acRowSort}&sort_dir=${_acRowDir}&token=${encodeURIComponent(state.token)}`;
  window.open(url, '_blank');
}

// 下载骨架模板（管理员）
function acDownloadSkeleton() {
  if (!_acActiveTable) return;
  const url = `/api/plus/templates/skeleton?table_name=${encodeURIComponent(_acActiveTable.name)}`;
  // 需要携带 token，用 fetch + blob
  fetch(url, { headers: { 'Authorization': 'Bearer ' + state.token } })
    .then(r => {
      if (!r.ok) return r.json().then(e => Promise.reject(e.error || '下载失败'));
      return r.blob().then(blob => {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = (_acActiveTable.label || _acActiveTable.name) + '_模板骨架.xlsx';
        a.click();
        URL.revokeObjectURL(a.href);
      });
    })
    .catch(e => alert(String(e)));
}

// 上传模板弹窗
function acOpenUploadTemplate() {
  if (!_acActiveTable) return;
  const t = _acActiveTable;
  acShowModal(`<div class="modal" style="max-width:500px;width:95vw">
    <div class="modal-header">上传模板<span class="modal-close" onclick="acShowTemplates(_acActiveTable)">×</span></div>
    <div class="modal-body">
      <div class="form-group">
        <label>模板名称 *</label>
        <input id="ac-tpl-name" placeholder="如：报销月报">
      </div>
      <div class="form-group">
        <label>模板文件 * <span style="font-size:11px;color:var(--text3)">（.xlsx / .docx / .html）</span></label>
        <input type="file" id="ac-tpl-file" accept=".xlsx,.docx,.html,.htm" style="color:var(--text)">
      </div>
      <div class="form-group">
        <label>适用范围</label>
        <select id="ac-tpl-scope" style="width:100%;padding:8px 10px;background:var(--bg1);
          border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:13px">

        </select>
      </div>
      <div class="form-group">

        <input id="ac-tpl-desc" placeholder="模板用途说明">
      </div>
      <div style="background:var(--bg3);border-radius:6px;padding:10px 12px;font-size:12px;color:var(--text3);line-height:1.7">
        💡 模板标记说明：<br>
        <code style="color:var(--accent)">{{table_name}}</code> 表显示名 &nbsp;
        <code style="color:var(--accent)">{{export_date}}</code> 导出日期 &nbsp;
        <code style="color:var(--accent)">{{total_rows}}</code> 总行数<br>
        数据行区域：<code style="color:var(--green)">{{#ROW}}</code>
        &nbsp;<code style="color:var(--accent)">{{col.字段名}}</code>&nbsp;或&nbsp;
        <code style="color:var(--accent)">{{col.f_0}}</code>&nbsp;
        <code style="color:var(--green)">{{/ROW}}</code>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="acShowTemplates(_acActiveTable)">取消</button>
      <button class="btn btn-primary" onclick="acUploadTemplate()">上传</button>
    </div>
  </div>`);
}

async function acUploadTemplate() {
  const name  = document.getElementById('ac-tpl-name')?.value.trim();
  const file  = document.getElementById('ac-tpl-file')?.files[0];
  const scope = document.getElementById('ac-tpl-scope')?.value;
  const desc  = document.getElementById('ac-tpl-desc')?.value.trim();
  if (!name) { alert('请填写模板名称'); return; }
  if (!file) { alert('请选择模板文件'); return; }

  const fd = new FormData();
  fd.append('file', file);
  fd.append('name', name);
  fd.append('table_name', scope);
  fd.append('description', desc || '');

  try {
    const res = await fetch('/api/plus/templates', {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + state.token },
      body: fd
    });
    const data = await res.json();
    if (!res.ok) { alert(data.error || '上传失败'); return; }
    // 刷新模板列表
    await acShowTemplates(_acActiveTable);
  } catch(e) {
    alert('上传失败: ' + e.message);
  }
}

async function acDeleteTemplate(id) {
  if (!confirm('确认删除此模板？')) return;
  await api('DELETE', `/plus/templates/${id}`);
  await acShowTemplates(_acActiveTable);
}

let _acRowPage = 1;
let _acRowSort = 'id';
let _acRowDir  = 'desc';
let _acRowData = [];
let _acRowTotal = 0;

async function acLoadRows() {
  if (!_acActiveTable) return;
  const q = document.getElementById('ac-row-search')?.value || '';
  const res = await api('POST', `/plus/${_acActiveTable.name}/query`, {
    q, sort_by: _acRowSort, sort_dir: _acRowDir, page: _acRowPage, page_size: 50
  });
  _acRowData  = res.data  || [];
  _acRowTotal = res.total || 0;
  if (res.fields) _acActiveTable.fields = res.fields;
  acRenderRowTable();
  acRenderRowPagination();
}

function acRenderRowTable() {
  const wrap = document.getElementById('ac-row-wrap');
  if (!wrap) return;
  const fields = _acActiveTable?.fields || [];
  if (!_acRowData.length) {
    wrap.innerHTML = '<div style="padding:40px;text-align:center;color:var(--text3)">暂无数据</div>';
    return;
  }
  const thStyle = 'padding:10px 12px;text-align:left;font-size:12px;font-weight:600;color:var(--text3);white-space:nowrap;cursor:pointer;user-select:none;border-bottom:1px solid var(--border)';
  const tdStyle = 'padding:9px 12px;font-size:13px;border-bottom:1px solid var(--border);vertical-align:middle;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap';
  const arrow = fid => {
    if (_acRowSort !== fid) return ' <span style="color:var(--text3);font-size:10px">⇅</span>';
    return _acRowDir === 'asc' ? ' <span style="color:var(--accent);font-size:11px">↑</span>' : ' <span style="color:var(--accent);font-size:11px">↓</span>';
  };
  // 用户姓名查找（_acUserCache 可能异步还未就绪，降级显示 id）
  const userName = uid => {
    if (!uid && uid !== 0) return '—';
    const u = (_acUserCache || []).find(x => x.id === Number(uid));
    return u ? (u.full_name || `#${uid}`) : `#${uid}`;
  };
  const thOpStyle = 'padding:10px 8px;text-align:center;font-size:12px;font-weight:600;color:var(--text3);white-space:nowrap;border-bottom:1px solid var(--border);width:84px;background:var(--bg2)';
  const thCreatorStyle = 'padding:10px 12px;text-align:left;font-size:12px;font-weight:600;color:var(--text3);white-space:nowrap;border-bottom:1px solid var(--border);background:var(--bg2);min-width:80px';
  const thead = `<tr>
    <th style="${thStyle};background:var(--bg2)" onclick="acSetSort('id')">#${arrow('id')}</th>
    ${fields.map(f => `<th style="${thStyle};background:var(--bg2)" onclick="acSetSort('${f.id}')">${escHtml(f.name)}${arrow(f.id)}</th>`).join('')}
    <th style="${thCreatorStyle}">创建人</th>
    <th style="${thOpStyle}">操作</th>
  </tr>`;
  const tbody = _acRowData.map(row => `
    <tr onmouseenter="this.style.background='var(--bg3)'" onmouseleave="this.style.background=''">
      <td style="${tdStyle};color:var(--text3);font-size:11px">${row.id}</td>
      ${fields.map(f => {
        const v = row[f.id] ?? '';
        return `<td style="${tdStyle}" title="${escHtml(String(v))}">${escHtml(String(v))}</td>`;
      }).join('')}
      <td style="${tdStyle};color:var(--text3);font-size:12px" title="uid: ${row.created_by}">${escHtml(userName(row.created_by))}</td>
      <td style="padding:6px 8px;border-bottom:1px solid var(--border);text-align:center;white-space:nowrap;width:84px">
        <button onclick="acEditRow(${row.id})" title="编辑"
          style="background:none;border:none;cursor:pointer;font-size:15px;padding:2px 5px;opacity:.7"
          onmouseenter="this.style.opacity='1'" onmouseleave="this.style.opacity='.7'">✏️</button>
        <button onclick="acDeleteRow(${row.id})" title="删除"
          style="background:none;border:none;cursor:pointer;font-size:15px;padding:2px 5px;opacity:.7;color:var(--red)"
          onmouseenter="this.style.opacity='1'" onmouseleave="this.style.opacity='.7'">🗑️</button>
      </td>
    </tr>`).join('');
  wrap.innerHTML = `<table style="width:100%;border-collapse:collapse">
    <thead style="position:sticky;top:0;background:var(--bg2);z-index:1">${thead}</thead>
    <tbody>${tbody}</tbody>
  </table>`;
}

function acSetSort(col) {
  if (_acRowSort === col) _acRowDir = _acRowDir === 'asc' ? 'desc' : 'asc';
  else { _acRowSort = col; _acRowDir = 'desc'; }
  _acRowPage = 1;
  acLoadRows();
}

function acRenderRowPagination() {
  const el = document.getElementById('ac-row-pagination');
  if (!el) return;
  const totalPages = Math.max(1, Math.ceil(_acRowTotal / 50));
  el.innerHTML = `
    <span style="font-size:12px;color:var(--text3)">共 ${_acRowTotal} 条</span>
    <div style="display:flex;align-items:center;gap:8px">
      <button class="btn btn-sm" onclick="_acRowPage=Math.max(1,_acRowPage-1);acLoadRows()" ${_acRowPage<=1?'disabled':''}>‹ 上一页</button>
      <span style="font-size:12px;color:var(--text2)">${_acRowPage} / ${totalPages}</span>
      <button class="btn btn-sm" onclick="_acRowPage=Math.min(${totalPages},_acRowPage+1);acLoadRows()" ${_acRowPage>=totalPages?'disabled':''}>下一页 ›</button>
    </div>`;
}

function acAddRow() { acOpenRowModal(null); }
function acEditRow(id) {
  const row = _acRowData.find(r => r.id === id);
  if (row) acOpenRowModal(row);
}

function acOpenRowModal(row) {
  const fields = _acActiveTable?.fields || [];
  const isEdit = !!row;
  acShowModal(`<div class="modal" style="max-width:560px;width:95vw">
    <div class="modal-header">${isEdit ? '编辑数据' : '新增数据'}<span class="modal-close" onclick="acCloseModal()">×</span></div>
    <div class="modal-body">
      ${fields.map(f => `
        <div class="form-group">
          <label>${escHtml(f.name)}${f.required ? ' *' : ''}</label>
          <input id="ac-row-${f.id}" value="${escHtml(String(row?.[f.id]??''))}" placeholder="${escHtml(f.name)}"
            type="${f.type==='number'?'number':'text'}">
        </div>`).join('')}
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="acCloseModal()">取消</button>
      <button class="btn btn-primary" onclick="acSaveRow(${row?.id||0})">${isEdit?'保存':'添加'}</button>
    </div>
  </div>`);
}

async function acSaveRow(id) {
  const fields = _acActiveTable?.fields || [];
  const body = {};
  for (const f of fields) {
    const el = document.getElementById(`ac-row-${f.id}`);
    if (el) body[f.id] = f.type === 'number' ? parseFloat(el.value)||0 : el.value;
  }
  if (id) {
    await api('PUT', `/plus/${_acActiveTable.name}/rows/${id}`, body);
  } else {
    await api('POST', `/plus/${_acActiveTable.name}/rows`, body);
  }
  acCloseModal();
  _acRowPage = 1;
  await acLoadRows();
}

async function acDeleteRow(id) {
  if (!confirm('确认删除这条数据？')) return;
  await api('DELETE', `/plus/${_acActiveTable.name}/rows/${id}`);
  await acLoadRows();
}

render();

  setTimeout(() => {

}
