<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>无痕聊天室</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#f0f0f0;--sidebar:#2e3440;--sidebar-hover:#3b4252;--sidebar-active:#4c566a;
  --header:#ffffff;--chat-bg:#e8e8e8;--mine:#95ec69;--mine-text:#000;
  --other-bg:#fff;--other-text:#222;--input-bg:#fff;--border:#d0d0d0;
  --accent:#07c160;--accent-dark:#06ad56;--online:#07c160;
  --sys:#aaa;--time:#bbb;--sidebar-text:#d8dee9;--sidebar-sub:#8896a8;
  --unread:#ff4040;--nick-color:#1a7fd4;
}
html,body{height:100%;overflow:hidden;font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg)}

/* ── 布局 ── */
.app{display:flex;height:100vh}
.sidebar{width:240px;flex-shrink:0;background:var(--sidebar);display:flex;flex-direction:column;overflow:hidden}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}

/* ── 左侧侧边栏 ── */
.sb-header{padding:16px 14px 12px;border-bottom:1px solid rgba(255,255,255,.08)}
.sb-title{color:#fff;font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px}
.sb-title svg{flex-shrink:0}
.sb-subtitle{color:var(--sidebar-sub);font-size:11px;margin-top:4px}
.sb-search{margin:10px 10px 0;position:relative}
.sb-search input{width:100%;padding:6px 10px 6px 30px;background:rgba(255,255,255,.1);border:none;border-radius:6px;color:#fff;font-size:13px;outline:none}
.sb-search input::placeholder{color:rgba(255,255,255,.35)}
.sb-search svg{position:absolute;left:8px;top:7px;opacity:.4}
.room-list{flex:1;overflow-y:auto;padding:8px 0}
.room-list::-webkit-scrollbar{width:4px}.room-list::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:2px}
.room-item{display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer;position:relative;transition:background .15s}
.room-item:hover{background:var(--sidebar-hover)}
.room-item.active{background:var(--sidebar-active)}
.room-avatar{width:40px;height:40px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;position:relative;font-weight:700;color:#fff}
.room-info{flex:1;min-width:0}
.room-name{color:var(--sidebar-text);font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.room-preview{color:var(--sidebar-sub);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.room-meta{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0}
.room-time{color:var(--sidebar-sub);font-size:11px}
.unread-badge{background:var(--unread);color:#fff;font-size:10px;font-weight:700;min-width:18px;height:18px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 4px}
.sb-add-btn{margin:10px;padding:8px;background:rgba(255,255,255,.08);border:1px dashed rgba(255,255,255,.2);border-radius:8px;color:var(--sidebar-sub);font-size:13px;cursor:pointer;text-align:center;transition:all .15s}
.sb-add-btn:hover{background:rgba(255,255,255,.14);color:#fff}
.sb-profile{padding:12px 14px;border-top:1px solid rgba(255,255,255,.08);display:flex;align-items:center;gap:10px;cursor:pointer}
.sb-profile:hover{background:rgba(255,255,255,.06)}
.profile-avatar{width:36px;height:36px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:14px;flex-shrink:0;position:relative}
.online-dot{position:absolute;bottom:0;right:0;width:10px;height:10px;background:var(--online);border-radius:50%;border:2px solid var(--sidebar)}
.profile-info{flex:1;min-width:0}
.profile-nick{color:#fff;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.profile-status{color:var(--sidebar-sub);font-size:11px}

/* ── 右侧聊天区 ── */
.chat-header{background:var(--header);padding:0 16px;height:54px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);flex-shrink:0;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.chat-title{font-size:16px;font-weight:700;color:#222}
.chat-title small{font-size:12px;color:#888;font-weight:400;margin-left:8px}
.header-actions{display:flex;gap:8px}
.icon-btn{width:32px;height:32px;border-radius:6px;border:none;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#888;transition:all .15s}
.icon-btn:hover{background:#f0f0f0;color:#333}

.chat-msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;background:var(--chat-bg)}
.chat-msgs::-webkit-scrollbar{width:5px}.chat-msgs::-webkit-scrollbar-thumb{background:#ccc;border-radius:3px}

/* ── 消息气泡 ── */
.msg-wrap{display:flex;gap:10px;max-width:75%;animation:fadeIn .2s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.msg-wrap.mine{align-self:flex-end;flex-direction:row-reverse}
.msg-wrap.other{align-self:flex-start}
.msg-wrap.sys{align-self:center;max-width:100%}
.msg-avatar{width:38px;height:38px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:#fff;flex-shrink:0;cursor:pointer}
.msg-body{display:flex;flex-direction:column;gap:3px}
.msg-nick{font-size:12px;color:var(--nick-color);font-weight:600}
.mine .msg-nick{text-align:right;color:#888}
.bubble{padding:9px 13px;border-radius:10px;font-size:14px;line-height:1.55;word-break:break-word;position:relative;max-width:100%;white-space:pre-wrap}
.mine .bubble{background:var(--mine);color:var(--mine-text);border-radius:10px 2px 10px 10px}
.other .bubble{background:var(--other-bg);color:var(--other-text);border-radius:2px 10px 10px 10px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.bubble img.emoji{width:28px;height:28px;vertical-align:middle;margin:0 1px;pointer-events:none}
.bubble img.img-msg{max-width:220px;max-height:220px;border-radius:6px;display:block;margin-top:4px;cursor:pointer}
.msg-time{font-size:11px;color:var(--time)}
.mine .msg-time{text-align:right}
/* 系统消息 */
.sys-msg{background:rgba(0,0,0,.08);color:#666;font-size:12px;padding:4px 14px;border-radius:20px;text-align:center}
/* 日期分割线 */
.date-divider{text-align:center;color:#aaa;font-size:11px;position:relative;margin:4px 0}
.date-divider span{background:var(--chat-bg);padding:0 10px;position:relative;z-index:1}
.date-divider::before{content:'';position:absolute;left:0;right:0;top:50%;border-top:1px solid #d0d0d0}

/* ── 输入区 ── */
.input-area{background:var(--input-bg);border-top:1px solid var(--border);flex-shrink:0}
.input-toolbar{padding:6px 12px 0;display:flex;gap:4px;align-items:center}
.tool-btn{width:30px;height:30px;border-radius:5px;border:none;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#666;font-size:16px;transition:all .15s;position:relative}
.tool-btn:hover{background:#f0f0f0;color:#333}
.input-box{display:flex;align-items:flex-end;padding:6px 12px 10px;gap:8px}
#msgInput{flex:1;border:none;outline:none;resize:none;font-size:14px;line-height:1.5;max-height:120px;min-height:36px;padding:8px 10px;background:#f5f5f5;border-radius:8px;color:#222;font-family:inherit}
#msgInput::placeholder{color:#aaa}
.send-btn{padding:8px 20px;background:var(--accent);color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;flex-shrink:0;transition:background .15s;align-self:flex-end}
.send-btn:hover{background:var(--accent-dark)}
.send-btn:disabled{background:#ccc;cursor:not-allowed}

/* ── 表情面板 ── */
.emoji-panel{position:absolute;bottom:100%;left:0;width:340px;background:#fff;border:1px solid #ddd;border-radius:10px;box-shadow:0 4px 20px rgba(0,0,0,.15);z-index:100;overflow:hidden}
.emoji-tabs{display:flex;border-bottom:1px solid #eee;padding:6px 8px 0;gap:4px}
.etab{padding:5px 10px;border-radius:6px 6px 0 0;font-size:12px;cursor:pointer;color:#888;border:none;background:none;transition:all .15s}
.etab.active{background:#f5f5f5;color:#333;font-weight:600}
.emoji-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:3px;padding:10px;max-height:200px;overflow-y:auto}
.emoji-grid::-webkit-scrollbar{width:4px}.emoji-grid::-webkit-scrollbar-thumb{background:#ddd;border-radius:2px}
.eg-item{width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:6px;cursor:pointer;font-size:22px;transition:background .1s;border:none;background:none}
.eg-item:hover{background:#f0f0f0;transform:scale(1.2)}

/* ── 图片预览 ── */
.img-preview{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:200;display:none;align-items:center;justify-content:center;cursor:zoom-out}
.img-preview.show{display:flex}
.img-preview img{max-width:90vw;max-height:90vh;border-radius:8px;box-shadow:0 8px 32px rgba(0,0,0,.5)}

/* ── 新建房间弹窗 ── */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:150;display:none;align-items:center;justify-content:center}
.modal.show{display:flex}
.modal-box{background:#fff;border-radius:12px;padding:24px;width:320px;box-shadow:0 8px 32px rgba(0,0,0,.2)}
.modal-title{font-size:16px;font-weight:700;margin-bottom:16px;color:#222}
.modal-input{width:100%;padding:10px 12px;border:1px solid #ddd;border-radius:8px;font-size:14px;outline:none;transition:border-color .15s}
.modal-input:focus{border-color:var(--accent)}
.modal-footer{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.btn-cancel{padding:8px 18px;border:1px solid #ddd;border-radius:6px;background:#fff;font-size:13px;cursor:pointer}
.btn-ok{padding:8px 18px;border:none;border-radius:6px;background:var(--accent);color:#fff;font-size:13px;font-weight:600;cursor:pointer}

/* ── 昵称设置弹窗 ── */
#nickModal{z-index:200}
.nick-emoji-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.nick-emoji{font-size:24px;cursor:pointer;width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:8px;border:2px solid transparent;transition:all .15s}
.upload-progress{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.75);color:#fff;font-size:13px;padding:8px 18px;border-radius:20px;z-index:200;pointer-events:none;display:none}
.upload-progress.show{display:block}
.nick-emoji:hover,.nick-emoji.sel{border-color:var(--accent);background:#f0fff4}
.room-lock{font-size:10px;vertical-align:middle;opacity:.7}
.room-shortid{font-size:10px;color:var(--sidebar-sub);font-family:monospace;letter-spacing:.5px}
.join-result-item{display:flex;align-items:center;gap:10px;padding:10px;border-radius:8px;cursor:pointer;border:1px solid #eee;margin-bottom:6px;transition:background .15s}
.join-result-item:hover{background:#f5f5f5}
.join-result-avatar{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;color:#fff;font-weight:700}
.join-result-info{flex:1;min-width:0}
.join-result-name{font-weight:600;font-size:14px}
.join-result-meta{font-size:12px;color:#888;margin-top:2px}
.join-result-btn{padding:5px 14px;border-radius:6px;font-size:12px;font-weight:600;border:none;cursor:pointer}
.join-result-btn.joined{background:#eee;color:#888;cursor:default}
.join-result-btn.join{background:var(--accent);color:#fff}

/* ── 连接状态 ── */

/* ── 空状态 ── */
.empty-chat{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#bbb;gap:12px}
.empty-chat svg{opacity:.3}

/* ── 移动端适配 ── */
@media(max-width:600px){
  .sidebar{width:200px}
  .msg-wrap{max-width:88%}
  .emoji-panel{width:280px}
}
@media(max-width:420px){
  .sidebar{position:fixed;inset:0;width:100%;z-index:50;display:flex}
  .sidebar.mob-hide{display:none}
  .main{display:none}
  .main.mob-show{display:flex}
}
</style>
</head>
<body>

<div class="app">
  <!-- ── 左侧群聊列表 ── -->
  <div class="sidebar" id="sidebar">
    <div class="sb-header">
      <div class="sb-title">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M20 2H4C2.9 2 2 2.9 2 4v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z" fill="#fff"/></svg>
        无痕聊天室
      </div>
      <div class="sb-subtitle" id="sbSubtitle">关闭即销毁</div>
    </div>
    <div class="sb-search">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="#fff"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
      <input type="text" placeholder="搜索群聊" oninput="filterRooms(this.value)">
    </div>
    <div class="room-list" id="roomList"></div>
    <div style="display:flex;gap:6px;margin:0 10px 0">
      <div class="sb-add-btn" style="flex:1" onclick="showNewRoom()">＋ 新建</div>
      <div class="sb-add-btn" style="flex:1" onclick="showJoinModal()">🔍 搜索</div>
    </div>
    <div class="sb-profile" onclick="showNickModal()">
      <div class="profile-avatar" id="myAvatarSb">
        <span id="myAvatarText">?</span>
        <div class="online-dot" id="onlineDot"></div>
      </div>
      <div class="profile-info">
        <div class="profile-nick" id="myNickDisplay">点击设置昵称</div>
        <div class="profile-status" id="myStatus">正在连接...</div>
      </div>
    </div>
  </div>

  <!-- ── 右侧聊天区 ── -->
  <div class="main" id="main-area">
    <div class="chat-header">
      <div style="display:flex;align-items:center;gap:10px">
        <button class="icon-btn" id="btnBack" onclick="toggleSidebar()" style="display:none">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
        </button>
        <div>
          <div class="chat-title" id="chatTitle">选择一个群聊</div>
        </div>
      </div>
      <div class="header-actions">
        <button class="icon-btn" title="刷新在线人数" onclick="refreshMembers()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M17.65 6.35A7.958 7.958 0 0 0 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0 1 12 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
        </button>
      </div>
    </div>
    <div class="chat-msgs" id="chatMsgs">
      <div class="empty-chat">
        <svg width="64" height="64" viewBox="0 0 24 24" fill="#ccc"><path d="M20 2H4C2.9 2 2 2.9 2 4v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>
        <div>从左侧选择一个群聊开始聊天</div>
      </div>
    </div>
    <div class="input-area" id="inputArea" style="display:none">
      <div class="input-toolbar">
        <div style="position:relative">
          <button class="tool-btn" title="表情" id="emojiBtn" onclick="toggleEmojiPanel()">😊</button>
          <div class="emoji-panel" id="emojiPanel" style="display:none">
            <div class="emoji-tabs" id="emojiTabs"></div>
            <div class="emoji-grid" id="emojiGrid"></div>
          </div>
        </div>
        <button class="tool-btn" title="发送图片" onclick="document.getElementById('imgInput').click()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>
        </button>
        <button class="tool-btn" title="发送文件" onclick="document.getElementById('fileInput').click()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M16.5 6v11.5c0 2.21-1.79 4-4 4s-4-1.79-4-4V5c0-1.38 1.12-2.5 2.5-2.5s2.5 1.12 2.5 2.5v10.5c0 .55-.45 1-1 1s-1-.45-1-1V6H10v9.5c0 1.38 1.12 2.5 2.5 2.5s2.5-1.12 2.5-2.5V5c0-2.21-1.79-4-4-4S7 2.79 7 5v12.5c0 3.04 2.46 5.5 5.5 5.5s5.5-2.46 5.5-5.5V6h-1.5z"/></svg>
        </button>
        <input type="file" id="imgInput" accept="image/*" style="display:none" onchange="uploadAndSend(this,'image')">
        <input type="file" id="fileInput" style="display:none" onchange="uploadAndSend(this,'file')">
        <div style="flex:1"></div>
        <span style="font-size:11px;color:#aaa" id="memberCount"></span>
      </div>
      <div class="input-box">
        <textarea id="msgInput" placeholder="输入消息... (Enter 发送，Shift+Enter 换行，可粘贴图片)" rows="1"
          oninput="autoResize(this)" onkeydown="onInputKeydown(event)" onpaste="onPasteInput(event)"></textarea>
        <button class="send-btn" onclick="sendMsg()" id="sendBtn">发送</button>
      </div>
    </div>
  </div>
</div>

<!-- 表情预览 -->
<div class="img-preview" id="imgPreview" onclick="this.classList.remove('show')">
  <img id="imgPreviewEl" src="">
</div>

<!-- 上传进度提示 -->
<div class="upload-progress" id="uploadProgress">上传中...</div>

<!-- 新建群聊弹窗 -->
<div class="modal" id="newRoomModal">
  <div class="modal-box">
    <div class="modal-title">新建群聊</div>
    <div style="margin-bottom:10px">
      <label style="font-size:13px;color:#666;display:block;margin-bottom:6px">群聊名称</label>
      <input class="modal-input" id="newRoomName" placeholder="例：技术交流" maxlength="20">
    </div>
    <div style="margin-bottom:10px">
      <label style="font-size:13px;color:#666;display:block;margin-bottom:6px">选择图标</label>
      <div style="display:flex;flex-wrap:wrap;gap:8px" id="roomIconPicker"></div>
    </div>
    <div style="margin-bottom:10px">
      <label style="font-size:13px;color:#666;display:block;margin-bottom:8px">群聊类型</label>
      <div style="display:flex;gap:8px">
        <label style="flex:1;border:1px solid #ddd;border-radius:8px;padding:10px;cursor:pointer;display:flex;align-items:center;gap:8px;transition:border-color .15s" id="typePublicLabel">
          <input type="radio" name="roomType" value="public" id="typePublic" checked onchange="onRoomTypeChange()">
          <span style="font-size:18px">🔓</span>
          <div><div style="font-weight:600;font-size:13px">公开</div><div style="font-size:11px;color:#999">所有人可见可加入</div></div>
        </label>
        <label style="flex:1;border:1px solid #ddd;border-radius:8px;padding:10px;cursor:pointer;display:flex;align-items:center;gap:8px;transition:border-color .15s" id="typePrivateLabel">
          <input type="radio" name="roomType" value="private" id="typePrivate" onchange="onRoomTypeChange()">
          <span style="font-size:18px">🔒</span>
          <div><div style="font-weight:600;font-size:13px">私密</div><div style="font-size:11px;color:#999">需要密码才能加入</div></div>
        </label>
      </div>
    </div>
    <div id="passwordRow" style="display:none;margin-bottom:10px">
      <label style="font-size:13px;color:#666;display:block;margin-bottom:6px">群聊密码</label>
      <input class="modal-input" id="newRoomPassword" type="password" placeholder="设置进入密码" maxlength="32">
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeNewRoom()">取消</button>
      <button class="btn-ok" onclick="createRoom()">创建</button>
    </div>
  </div>
</div>

<!-- 密码验证弹窗 -->
<div class="modal" id="pwdModal">
  <div class="modal-box">
    <div class="modal-title" id="pwdModalTitle">🔒 私密群聊</div>
    <div style="color:#888;font-size:13px;margin-bottom:12px" id="pwdModalDesc">请输入密码以加入</div>
    <input class="modal-input" id="pwdInput" type="password" placeholder="输入群聊密码" maxlength="32">

<script>

};

var ROOM_ICONS = ['💬','🎮','🎵','📚','🏠','🎯','⚡','🌟','🔥','💎','🌈','🎪','🚀','🎭','🏆','🎨'];
var AVATAR_EMOJIS = ['😀','😎','🥳','🤩','😺','🐶','🦊','🐼','🐨','🦁','🐸','🦋','🌟','⚡','🎯','🏆'];

// ══════════════════════════════════════════════════════════
// 状态
// ══════════════════════════════════════════════════════════
var ws = null;
var myNick = '';
var myAvatar = '😀';
var myDeviceId = '';
var currentRoom = null;
var rooms = []; // 我加入的房间 [{id,name,icon,topic,shortId,private,pwdHash,unread,lastMsg,lastTime}]
var allKnownRooms = {}; // shortId → roomDef，从 chat/_rooms 同步的全量数据
var unreadCounts = {};
var memberCounts = {};
var seqCache = {};     // topic → afterSeq
var lastDates = {};    // topic → 最后显示的日期字符串
var _pwdCallback = null; // 密码验证成功后的回调

// ══════════════════════════════════════════════════════════
// 初始化
// ══════════════════════════════════════════════════════════
window.addEventListener('load', function(){
  // 加载本地配置
  myNick   = localStorage.getItem('chat_nick') || '';
  myAvatar = localStorage.getItem('chat_avatar') || '😀';
  myDeviceId = localStorage.getItem('chat_device_id') || '';

    myDeviceId = 'user-' + Math.random().toString(36).slice(2,8);
    localStorage.setItem('chat_device_id', myDeviceId);
  }

  // 加载房间列表
  try{ rooms = JSON.parse(localStorage.getItem('chat_rooms')||'[]'); }catch(e){ rooms=[]; }
  if(!rooms.length){
    rooms = [
      {id:'lobby',name:'大厅',icon:'💬',topic:'chat/lobby',shortId:'1001',private:false,pwdHash:'',unread:0,lastMsg:'',lastTime:''},
      {id:'tech',name:'技术交流',icon:'⚡',topic:'chat/tech',shortId:'1002',private:false,pwdHash:'',unread:0,lastMsg:'',lastTime:''},
      {id:'off',name:'闲聊水区',icon:'🌈',topic:'chat/off-topic',shortId:'1003',private:false,pwdHash:'',unread:0,lastMsg:'',lastTime:''},
    ];
  }
  try{ allKnownRooms = JSON.parse(localStorage.getItem('chat_all_rooms')||'{}'); }catch(e){ allKnownRooms={}; }

  seqCache = JSON.parse(localStorage.getItem('chat_seqs')||'{}');
  unreadCounts = JSON.parse(localStorage.getItem('chat_unreads')||'{}');

  buildEmojiPanel();
  buildRoomIconPicker();
  buildAvatarPicker();
  renderRoomList();
  updateMyProfile();

  else connectHub();

function saveRooms(){ localStorage.setItem('chat_rooms', JSON.stringify(rooms)); }
function saveSeqs(){ localStorage.setItem('chat_seqs', JSON.stringify(seqCache)); }
function saveUnreads(){ localStorage.setItem('chat_unreads', JSON.stringify(unreadCounts)); }
function saveAllKnownRooms(){ localStorage.setItem('chat_all_rooms', JSON.stringify(allKnownRooms)); }

// SHA-256 工具（浏览器原生 crypto）
function sha256(str){
  return crypto.subtle.digest('SHA-256', new TextEncoder().encode(str))
    .then(function(buf){
      return Array.from(new Uint8Array(buf)).map(function(b){
        return b.toString(16).padStart(2,'0');
      }).join('');
    });
}

// 处理收到的群聊定义消息（来自 chat/_rooms topic）
function handleRoomDef(def){
  if(!def.id || !def.shortId) return;
  allKnownRooms[def.shortId] = def;
  saveAllKnownRooms();
  // 如果我还没加入且是公开群聊，不自动加入，只加入索引
  // 如果我已加入，更新本地信息（名称/图标可能被修改）
  var existing = rooms.find(function(r){ return r.id===def.id; });
  if(existing){
    existing.name = def.name;
    existing.icon = def.icon;
    existing.shortId = def.shortId;
    existing.private = def.private;
    existing.pwdHash = def.pwdHash;
    saveRooms();
    renderRoomList();
  }
}

// 内置默认频道 ID，永远有效，不做清理
var DEFAULT_ROOM_IDS = ['lobby', 'tech', 'off'];

// 拉取 _rooms 历史，获取所有群聊定义，并清理失效房间
function fetchRoomDefs(){
  fetch(HUB_HOST + '/hub/history?topic=chat/_rooms&after_seq=0')
    .then(function(r){return r.json();})
    .then(function(data){
      // 先重建 allKnownRooms
      var freshKnown = {};
      if(data.messages){
        data.messages.forEach(function(msg){
          if(msg.payload && msg.payload.type==='room_def'){
            var def = msg.payload;
            if(def.shortId) freshKnown[def.shortId] = def;
          }
        });
      }
      allKnownRooms = freshKnown;
      saveAllKnownRooms();

      // 清理本地失效房间：非默认且不在 Hub 里的
      var validIds = Object.values(allKnownRooms).map(function(d){ return d.id; });
      var before = rooms.length;
      rooms = rooms.filter(function(r){
        if(DEFAULT_ROOM_IDS.indexOf(r.id) >= 0) return true; // 默认频道保留
        return validIds.indexOf(r.id) >= 0;                  // Hub 里存在的保留
      });
      if(rooms.length < before){
        saveRooms();
        // 如果当前打开的房间被清理了，回到列表
        if(currentRoom && !rooms.find(function(r){ return r.id===currentRoom.id; })){
          currentRoom = null;
          document.getElementById('chatTitle').textContent = '选择一个群聊';
          document.getElementById('chatMsgs').innerHTML='<div class="empty-chat"><svg width="64" height="64" viewBox="0 0 24 24" fill="#ccc"><path d="M20 2H4C2.9 2 2 2.9 2 4v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg><div>从左侧选择一个群聊开始聊天</div></div>';
          document.getElementById('inputArea').style.display='none';
          showListOnMobile();
        }
        renderRoomList();
      }

      // 更新 handleRoomDef（合并新数据到本地已加入房间）
      Object.values(allKnownRooms).forEach(function(def){ handleRoomDef(def); });
    }).catch(function(){});
}

// 加入群聊（本地 rooms 列表 + 订阅 topic）
function joinRoom(def){
  var existing = rooms.find(function(r){ return r.id===def.id; });
  if(existing) return; // 已加入
  var room = {
    id:def.id, name:def.name, icon:def.icon, topic:def.topic,
    shortId:def.shortId, private:def.private||false, pwdHash:def.pwdHash||'',
    unread:0, lastMsg:'', lastTime:''
  };
  rooms.push(room);
  saveRooms();
  wsSend({action:'sub', topic:def.topic});
  fetchHistory(def.topic);
  renderRoomList();
}

// ── 密码验证弹窗 ──
var _pwdRoom = null;
function showPwdModal(room, callback){
  _pwdRoom = room;
  _pwdCallback = callback;
  document.getElementById('pwdModalTitle').textContent = room.icon + ' ' + room.name;
  document.getElementById('pwdModalDesc').textContent = '该群聊为私密群聊，请输入密码加入';
  document.getElementById('pwdInput').value='';
  document.getElementById('pwdError').style.display='none';
  document.getElementById('pwdModal').classList.add('show');
  setTimeout(function(){ document.getElementById('pwdInput').focus(); },50);
}
function closePwdModal(){
  document.getElementById('pwdModal').classList.remove('show');
  _pwdRoom=null; _pwdCallback=null;
}
function submitPwd(){
  var pwd = document.getElementById('pwdInput').value;
  if(!pwd){ document.getElementById('pwdError').style.display=''; document.getElementById('pwdError').textContent='请输入密码'; return; }
  sha256(pwd).then(function(h){
    if(h === _pwdRoom.pwdHash){
      var cb = _pwdCallback; // 先保存回调，closePwdModal 会把它清空
      closePwdModal();
      if(cb) cb();
    } else {
      document.getElementById('pwdError').style.display='';
      document.getElementById('pwdError').textContent='密码错误，请重试';
      document.getElementById('pwdInput').value='';
      document.getElementById('pwdInput').focus();
    }
  });
}

// ── 搜索/加入群聊 ──
function showJoinModal(){
  document.getElementById('joinSearchInput').value='';
  document.getElementById('joinResults').innerHTML='';
  document.getElementById('joinModal').classList.add('show');
  setTimeout(function(){ document.getElementById('joinSearchInput').focus(); },50);
  // 先展示所有公开群聊
  onJoinSearch('');
}
function closeJoinModal(){ document.getElementById('joinModal').classList.remove('show'); }

function onJoinSearch(q){
  q = q.trim().toUpperCase();
  var results = Object.values(allKnownRooms).filter(function(def){
    if(!def.id || !def.shortId) return false;
    if(q==='') return true; // 无输入时显示全部
    return def.shortId.indexOf(q)>=0 || def.name.toUpperCase().indexOf(q)>=0;
  });
  var el = document.getElementById('joinResults');
  if(!results.length){
    el.innerHTML='<div style="text-align:center;color:#aaa;padding:20px;font-size:13px">未找到相关群聊</div>';
    return;
  }
  el.innerHTML = results.map(function(def){
    var alreadyJoined = !!rooms.find(function(r){ return r.id===def.id; });
    var lockBadge = def.private ? '<span style="font-size:11px;background:#ffeaa7;color:#d35400;padding:1px 6px;border-radius:3px;font-weight:600">私密</span>' : '<span style="font-size:11px;background:#d5f5e3;color:#1e8449;padding:1px 6px;border-radius:3px;font-weight:600">公开</span>';
    var btn = alreadyJoined
      ? '<button class="join-result-btn joined">已加入</button>'
      : '<button class="join-result-btn join" onclick="doJoinRoom(\''+def.shortId+'\')">加入</button>';
    return '<div class="join-result-item">'
      + '<div class="join-result-avatar" style="background:'+strToColor(def.name)+'">'+def.icon+'</div>'
      + '<div class="join-result-info">'
      +   '<div class="join-result-name">'+escHtml(def.name)+' <span style="font-size:11px;color:#aaa;font-family:monospace">'+def.shortId+'</span></div>'
      +   '<div class="join-result-meta">'+lockBadge+(def.creator?' · 由 '+escHtml(def.creator)+' 创建':'')+'</div>'
      + '</div>'
      + btn
      + '</div>';
  }).join('');
}

function doJoinRoom(shortId){
  var def = allKnownRooms[shortId];
  if(!def){ alert('群聊不存在'); return; }
  var alreadyJoined = !!rooms.find(function(r){ return r.id===def.id; });
  if(alreadyJoined){ closeJoinModal(); selectRoom(def.id); return; }

  if(def.private && def.pwdHash){
    // 先关闭搜索框，再弹密码框，避免两个弹窗叠加
    closeJoinModal();
    showPwdModal(def, function(){
      joinRoom(def);
      sessionStorage.setItem('chat_pwd_ok_'+def.id,'1');
      renderRoomList();
      selectRoom(def.id, true);
    });
  } else {
    joinRoom(def);
    closeJoinModal();
    renderRoomList();
    setTimeout(function(){ selectRoom(def.id,true); },100);
  }
}

// ══════════════════════════════════════════════════════════
// Hub WebSocket
// ══════════════════════════════════════════════════════════
var _hubDisabled = false;  // Hub 未启用标志，避免无限重连

function connectHub(){
  if(_hubDisabled) return;
  if(ws) ws.close();
  setStatus('ing','正在连接...');

  // 先探测 Hub 是否启用（/hub/count 无需认证，503=未启用，其他=已启用）
  fetch(HUB_HOST + '/hub/count?topic=_ping')
    .then(function(r){
      if(r.status === 503){
        _hubDisabled = true;
        setStatus('err','Hub 未启用');
        showHubDisabledTip();
        return;
      }
      doConnectWS();
    })
    .catch(function(){
      // 网络不通，仍尝试 WS 连接
      doConnectWS();
    });
}

function showHubDisabledTip(){
  var msgs = document.getElementById('chatMsgs');
  msgs.innerHTML =
    '<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:14px;color:#aaa">'
    +'<svg width="56" height="56" viewBox="0 0 24 24" fill="#ddd"><path d="M1 9l2 2c4.97-4.97 13.03-4.97 18 0l2-2C16.93 2.93 7.08 2.93 1 9zm8 8l3 3 3-3c-1.65-1.66-4.34-1.66-6 0zm-4-4l2 2c2.76-2.76 7.24-2.76 10 0l2-2C15.14 9.14 8.87 9.14 5 13z"/></svg>'
    +'<div style="font-size:15px;font-weight:600;color:#888">Hub 消息服务器未启用</div>'
    +'<div style="font-size:13px;color:#bbb;text-align:center;line-height:1.6">请管理员登录后在<br>【功能设置】中开启<br>【启用 Hub 消息服务器】</div>'
    +'<button onclick="retryConnect()" style="margin-top:6px;padding:8px 22px;background:#667eea;color:#fff;border:none;border-radius:6px;font-size:13px;cursor:pointer">重试连接</button>'
    +'</div>';
}

function retryConnect(){
  _hubDisabled = false;
  document.getElementById('chatMsgs').innerHTML = '<div class="empty-chat"><svg width="64" height="64" viewBox="0 0 24 24" fill="#ccc"><path d="M20 2H4C2.9 2 2 2.9 2 4v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg><div>从左侧选择一个群聊开始聊天</div></div>';
  connectHub();
}

function doConnectWS(){
  var url = HUB_WS + '/hub/ws?device_id=' + encodeURIComponent(myDeviceId);
  ws = new WebSocket(url);

  ws.onopen = function(){
    setStatus('ok','在线');
    updateMyProfile();
    wsSend({action:'sub', topic:'chat/_rooms'});
    fetchRoomDefs();
    rooms.forEach(function(r){
      wsSend({action:'sub', topic:r.topic});
      fetchHistory(r.topic);
    });
  };

  ws.onmessage = function(e){
    try{ handleMsg(JSON.parse(e.data)); }catch(ex){}
  };

  ws.onclose = function(e){
    if(_hubDisabled) return;
    setStatus('err','连接断开，3秒后重连...');
    updateMyProfile();
    setTimeout(connectHub, 3000);
  };

  ws.onerror = function(){ ws.close(); };
}

function wsSend(obj){ if(ws && ws.readyState===1) ws.send(JSON.stringify(obj)); }

function setStatus(state, msg){
  var statusEl = document.getElementById('myStatus');
  var dot = document.getElementById('onlineDot');
  statusEl.textContent = msg;
  // 小绿点颜色随状态变化
  if(state === 'ok'){
    dot.style.background = 'var(--online)';       // 绿色
  } else if(state === 'err'){
    dot.style.background = '#fc8181';              // 红色
  } else {
    dot.style.background = '#f6ad55';              // 橙色（连接中）
  }
}

// ══════════════════════════════════════════════════════════
// 消息处理
// ══════════════════════════════════════════════════════════
function handleMsg(msg){
  // ack 帧
  if(msg.action) return;
  if(msg.seq === undefined) return;

  var topic = msg.topic;
  var pl = msg.payload;
  if(!pl || pl.type === undefined) return;

  // 处理群聊目录同步消息
  if(topic === 'chat/_rooms' && pl.type === 'room_def'){
    handleRoomDef(pl);
    return;
  }

  // 更新游标
  if(!seqCache[topic] || msg.seq >= seqCache[topic]){
    seqCache[topic] = msg.seq + 1;
    saveSeqs();
  }

  // 找对应房间
  var room = rooms.find(function(r){ return r.topic===topic; });
  if(!room) return;

  // 系统消息（进入/退出通知）不更新列表预览和排序
  if(pl.type !== 'system'){
    var previewText = pl.type==='image' ? '[图片]' : pl.type==='file' ? '[文件] '+(pl.fileName||'') : (pl.msg||'');
    room.lastMsg = (pl.nick||'?') + ': ' + previewText;
    room.lastTime = fmtTime(msg.published_at);
    room.lastTs = msg.published_at || Date.now();
    saveRooms();

    // 非当前房间才计未读
    if(!currentRoom || currentRoom.id !== room.id){
      unreadCounts[room.id] = (unreadCounts[room.id]||0) + 1;
      saveUnreads();
    }

    renderRoomList();
  }

  // 渲染消息（自己发的消息已在 doSend 本地渲染，跳过服务端推回的重复渲染）
  if(currentRoom && currentRoom.id===room.id){
    var ts = pl.ts;
    if(msg.from === myDeviceId && ts && _pendingTs[ts]){
      delete _pendingTs[ts]; // 消费掉，下次同 ts 不再跳过
      return;
    }
    renderMessage(msg, msg.from === myDeviceId);
  }
}

function fetchHistory(topic){
  if(_hubDisabled) return;
  var afterSeq = seqCache[topic] || 0;
  fetch(HUB_HOST + '/hub/history?topic=' + encodeURIComponent(topic) + '&after_seq=' + afterSeq)
    .then(function(r){
      if(r.status === 503){ _hubDisabled = true; return null; }
      return r.json();
    })
    .then(function(data){
      if(!data || !data.messages || !data.messages.length) return;
      data.messages.forEach(function(msg){ handleMsg(msg); });
    }).catch(function(){});
}

// ══════════════════════════════════════════════════════════
// 发送消息
// ══════════════════════════════════════════════════════════
function sendMsg(){
  if(!currentRoom) return;
  var input = document.getElementById('msgInput');
  var text = input.value.trim();
  if(!text || !ws || ws.readyState!==1) return;
  doSend({type:'text', nick:myNick, avatar:myAvatar, msg:text, ts:Date.now()});
  input.value='';
  autoResize(input);
}

// 统一上传入口：图片选择、文件选择、粘贴图片
function uploadAndSend(inputEl, type){
  var file = inputEl.files[0];
  if(!file || !currentRoom) return;
  inputEl.value='';
  uploadIMFile(file, type);
}

function onPasteInput(e){
  if(!currentRoom) return;
  var items = (e.clipboardData || e.originalEvent && e.originalEvent.clipboardData || {}).items;
  if(!items) return;
  for(var i=0;i<items.length;i++){
    if(items[i].kind==='file' && items[i].type.startsWith('image/')){
      e.preventDefault();
      var file = items[i].getAsFile();
      if(file) uploadIMFile(file, 'image');
      return;
    }
  }
}

function uploadIMFile(file, type){
  var prog = document.getElementById('uploadProgress');
  prog.textContent = '上传中... ' + fmtSize(file.size);
  prog.classList.add('show');

  var fd = new FormData();
  fd.append('file', file, file.name || ('paste_'+Date.now()+'.png'));

  var xhr = new XMLHttpRequest();
  xhr.open('POST', '/im/upload', true);

  xhr.upload.onprogress = function(e){
    if(e.lengthComputable){
      var pct = Math.round(e.loaded/e.total*100);
      prog.textContent = '上传中 ' + pct + '% (' + fmtSize(e.loaded) + '/' + fmtSize(e.total) + ')';
    }
  };

  xhr.onload = function(){
    prog.classList.remove('show');
    try{
      var res = JSON.parse(xhr.responseText);
      if(res.ok){        var msgType = (type==='image') ? 'image' : 'file';
        doSend({
          type: msgType,
          nick: myNick,
          avatar: myAvatar,
          msg: res.url,           // 服务端 URL
          fileName: res.name,     // 原始文件名
          fileSize: res.size,
          ts: Date.now()
        });
      } else {
        alert('上传失败：' + (res.error||'未知错误'));
      }
    } catch(ex){
      alert('上传响应解析失败');
    }
  };

  xhr.onerror = function(){
    prog.classList.remove('show');
    alert('上传失败，请检查网络');
  };

  xhr.send(fd);
}

function fmtSize(bytes){
  if(bytes < 1024) return bytes + 'B';
  if(bytes < 1048576) return (bytes/1024).toFixed(1) + 'KB';
  return (bytes/1048576).toFixed(1) + 'MB';
}

// 记录自己发出但尚未收到服务端推回的消息（用 ts 做 key，避免重复渲染）
var _pendingTs = {};

function doSend(payload){
  wsSend({action:'pub', topic:currentRoom.topic, payload:payload, ttl:MSG_TTL});
  // 本地立即渲染，同时记录 ts 防止服务端推回时重复渲染
  var ts = payload.ts || Date.now();
  _pendingTs[ts] = true;
  var fakeMsg = {
    seq: Date.now(),
    topic: currentRoom.topic,
    from: myDeviceId,
    published_at: ts,
    payload: payload
  };
  renderMessage(fakeMsg, true);
}

// ══════════════════════════════════════════════════════════
// 渲染消息
// ══════════════════════════════════════════════════════════
function renderMessage(msg, isSelf){
  if(!currentRoom) return;
  var pl = msg.payload;
  if(!pl) return;

  // 系统消息
  if(pl.type==='system'){
    appendSysMsg(pl.msg);
    return;
  }

  var isMine = isSelf || (msg.from === myDeviceId);
  var msgs = document.getElementById('chatMsgs');

  // 日期分隔线
  var d = new Date(msg.published_at);
  var dateStr = d.getFullYear()+'/'+pad(d.getMonth()+1)+'/'+pad(d.getDate());
  if(!lastDates[currentRoom.id] || lastDates[currentRoom.id]!==dateStr){
    lastDates[currentRoom.id] = dateStr;
    var div = document.createElement('div');
    div.className='date-divider';
    div.innerHTML='<span>'+dateStr+'</span>';
    msgs.appendChild(div);
  }

  var wrap = document.createElement('div');
  wrap.className = 'msg-wrap ' + (isMine?'mine':'other');

  // 头像
  var avatarEl = document.createElement('div');
  var avatarEmoji = pl.avatar || '😀';
  var avatarBg = strToColor(pl.nick||'?');
  avatarEl.className = 'msg-avatar';
  avatarEl.style.background = avatarBg;
  avatarEl.textContent = avatarEmoji;
  avatarEl.title = pl.nick || '?';

  // 消息主体
  var body = document.createElement('div');
  body.className = 'msg-body';

  // 昵称（非自己时显示）
  if(!isMine){
    var nickEl = document.createElement('div');
    nickEl.className = 'msg-nick';
    nickEl.textContent = pl.nick || '匿名';
    body.appendChild(nickEl);
  }

  // 气泡
  var bubble = document.createElement('div');
  bubble.className = 'bubble';

  if(pl.type==='image'){
    var img = document.createElement('img');
    img.className='img-msg';
    img.src = pl.msg;
    img.alt='图片';
    img.onerror = function(){ this.alt='图片已过期'; this.style.opacity='.4'; };
    img.onclick = function(){ previewImg(pl.msg); };
    bubble.appendChild(img);
  } else if(pl.type==='file'){
    var sizeStr = pl.fileSize ? ' (' + fmtSize(pl.fileSize) + ')' : '';
    bubble.innerHTML =
      '<a href="'+escHtml(pl.msg)+'" target="_blank" download="'+escHtml(pl.fileName||'文件')+'" '
      +'style="display:flex;align-items:center;gap:8px;color:inherit;text-decoration:none;'
      +'background:rgba(0,0,0,.06);border-radius:6px;padding:8px 10px;min-width:150px">'
      +'<svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" style="flex-shrink:0;opacity:.7">'
      +'<path d="M16.5 6v11.5c0 2.21-1.79 4-4 4s-4-1.79-4-4V5c0-1.38 1.12-2.5 2.5-2.5s2.5 1.12 2.5 2.5v10.5c0 .55-.45 1-1 1s-1-.45-1-1V6H10v9.5c0 1.38 1.12 2.5 2.5 2.5s2.5-1.12 2.5-2.5V5c0-2.21-1.79-4-4-4S7 2.79 7 5v12.5c0 3.04 2.46 5.5 5.5 5.5s5.5-2.46 5.5-5.5V6h-1.5z"/>'
      +'</svg>'
      +'<div style="min-width:0"><div style="font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+escHtml(pl.fileName||'文件')+'</div>'
      +'<div style="font-size:11px;opacity:.6">'+sizeStr+'点击下载</div></div></a>';
  } else {
    bubble.innerHTML = renderText(pl.msg||'');
  }
  body.appendChild(bubble);

  // 时间
  var timeEl = document.createElement('div');
  timeEl.className='msg-time';
  timeEl.textContent = fmtTime(msg.published_at);
  body.appendChild(timeEl);

  if(isMine){ wrap.appendChild(body); wrap.appendChild(avatarEl); }
  else { wrap.appendChild(avatarEl); wrap.appendChild(body); }

  msgs.appendChild(wrap);
  msgs.scrollTop = msgs.scrollHeight;
}

function appendSysMsg(text){
  var msgs = document.getElementById('chatMsgs');
  var div = document.createElement('div');
  div.className='msg-wrap sys';
  div.innerHTML='<div class="sys-msg">'+escHtml(text)+'</div>';
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
}

// 文本渲染：处理表情文字和换行
function renderText(text){
  var escaped = escHtml(text);
  // 把换行转成 <br>
  escaped = escaped.replace(/\n/g,'<br>');
  return escaped;
}

// ══════════════════════════════════════════════════════════
// 房间管理
// ══════════════════════════════════════════════════════════
function selectRoom(roomId, skipPwd){
  var room = rooms.find(function(r){ return r.id===roomId; });
  // 保底：如果本地列表还没有，从 allKnownRooms 里找并加入
  if(!room){
    var def = Object.values(allKnownRooms).find(function(d){ return d.id===roomId; });
    if(!def) return;
    joinRoom(def);
    room = rooms.find(function(r){ return r.id===roomId; });
    if(!room) return;
  }

  // 私密房间验证密码
  if(room.private && room.pwdHash && !skipPwd){
    var sessionKey = 'chat_pwd_ok_' + roomId;
    if(!sessionStorage.getItem(sessionKey)){
      showPwdModal(room, function(){
        sessionStorage.setItem(sessionKey, '1');
        selectRoom(roomId, true);
      });
      return;
    }
  }

  currentRoom = room;

  // 清未读
  unreadCounts[roomId] = 0;
  saveUnreads();
  renderRoomList();

  // 清消息区
  document.getElementById('chatMsgs').innerHTML='';
  lastDates[roomId] = null;

  // 更新标题
  document.getElementById('chatTitle').innerHTML = escHtml(currentRoom.icon + ' ' + currentRoom.name) + (currentRoom.shortId ? '<small>群号：' + currentRoom.shortId + '</small>' : '');
  document.getElementById('inputArea').style.display='';

  // 拉取历史
  var afterSeq = seqCache[currentRoom.topic] || 0;
  fetch(HUB_HOST + '/hub/history?topic=' + encodeURIComponent(currentRoom.topic) + '&after_seq=0')
    .then(function(r){return r.json();})
    .then(function(data){
      if(!data.messages) return;
      data.messages.forEach(function(msg){ renderMessage(msg, msg.from===myDeviceId); });
      document.getElementById('chatMsgs').scrollTop = 99999;
    }).catch(function(){});

  // 刷新在线人数
  refreshMembers();

  // 发送进入通知
  wsSend({action:'pub', topic:currentRoom.topic, payload:{type:'system',msg:myNick+'  进入了群聊',ts:Date.now()}, ttl:60});

  // 移动端：切换到聊天区
  showChatOnMobile();
}

function filterRooms(q){
  document.querySelectorAll('.room-item').forEach(function(el){
    el.style.display = el.dataset.name.includes(q) ? '' : 'none';
  });
}

function renderRoomList(){
  var list = document.getElementById('roomList');
  // 按最后消息时间降序排列（无消息的排最后）
  var sorted = rooms.slice().sort(function(a, b){
    return (b.lastTs||0) - (a.lastTs||0);
  });
  list.innerHTML = sorted.map(function(r){
    var isActive = currentRoom && currentRoom.id===r.id;
    var unread = unreadCounts[r.id] || 0;
    var unreadBadge = unread > 0
      ? '<div class="unread-badge">'+(unread>99?'99+':unread)+'</div>' : '';
    var timePart = r.lastTime ? '<div class="room-time">'+r.lastTime+'</div>' : '';
    var lockIcon = r.private ? ' 🔒' : '';
    var shortIdStr = r.shortId ? '<span class="room-shortid">'+r.shortId+'</span>' : '';
    return '<div class="room-item'+(isActive?' active':'')+' " data-name="'+r.name+' '+(r.shortId||'')+'" onclick="selectRoom(\''+r.id+'\')">'  
      + '<div class="room-avatar" style="background:'+strToColor(r.name)+'">'+r.icon+'</div>'
      + '<div class="room-info">'
      +   '<div class="room-name">'+escHtml(r.name)+lockIcon+' '+shortIdStr+'</div>'
      +   '<div class="room-preview">'+escHtml(r.lastMsg||'暂无消息')+'</div>'
      + '</div>'
      + '<div class="room-meta">'+timePart+unreadBadge+'</div>'
      + '</div>';
  }).join('');
}

  document.getElementById('newRoomName').value='';

function closeNewRoom(){ document.getElementById('newRoomModal').classList.remove('show'); }

var _selRoomIcon = '💬';
function buildRoomIconPicker(){
  var el = document.getElementById('roomIconPicker');
  el.innerHTML = ROOM_ICONS.map(function(ic){
    return '<span class="nick-emoji" onclick="selRoomIcon(this,\''+ic+'\')" title="'+ic+'">'+ic+'</span>';
  }).join('');
  el.children[0] && el.children[0].classList.add('sel');
  _selRoomIcon = ROOM_ICONS[0];
}

function selRoomIcon(el, icon){
  _selRoomIcon = icon;
  document.querySelectorAll('#roomIconPicker .nick-emoji').forEach(function(e){ e.classList.remove('sel'); });
  el.classList.add('sel');
}

function genShortId(){
  // 4位纯数字，首位不为0
  return String(Math.floor(1000 + Math.random() * 9000));
}

function onRoomTypeChange(){
  var isPrivate = document.getElementById('typePrivate').checked;
  document.getElementById('passwordRow').style.display = isPrivate ? '' : 'none';
  document.getElementById('typePublicLabel').style.borderColor = isPrivate ? '#ddd' : 'var(--accent)';
  document.getElementById('typePrivateLabel').style.borderColor = isPrivate ? 'var(--accent)' : '#ddd';
}

function createRoom(){
  var name = document.getElementById('newRoomName').value.trim();
  if(!name){ alert('请输入群聊名称'); return; }
  var isPrivate = document.getElementById('typePrivate').checked;
  var pwd = isPrivate ? document.getElementById('newRoomPassword').value.trim() : '';

  var shortId = genShortId();
  // 确保 shortId 不重复
  while(allKnownRooms[shortId]) shortId = genShortId();

  var id = 'room-' + Date.now();
  var topic = 'chat/' + id;

  var doCreate = function(pwdHash){
    var roomDef = {
      type:'room_def', id:id, name:name, icon:_selRoomIcon,
      topic:topic, shortId:shortId, private:isPrivate, pwdHash:pwdHash,
      creator:myNick, createdAt:Date.now()
    };
    // 发布到 _rooms topic（TTL 30天，让所有人都能发现）
    wsSend({action:'pub', topic:'chat/_rooms', payload:roomDef, ttl:2592000});
    // 本地加入
    joinRoom(roomDef);
    closeNewRoom();
    // 如果是私密，记住本次已验证
    if(isPrivate) sessionStorage.setItem('chat_pwd_ok_' + id, '1');
    setTimeout(function(){ selectRoom(id, true); }, 200);
  };

  if(isPrivate && pwd){
    sha256(pwd).then(function(h){ doCreate(h); });
  } else {
    doCreate('');
  }
}

function showNickModal(){
  document.getElementById('nickInput').value = myNick;
  _selAvatar = myAvatar;
  // 选中当前头像
  var picks = document.querySelectorAll('#avatarPicker .nick-emoji');
  picks.forEach(function(el){ el.classList.remove('sel'); if(el.textContent===myAvatar) el.classList.add('sel'); });
  document.getElementById('nickModal').classList.add('show');
  setTimeout(function(){ document.getElementById('nickInput').focus(); }, 50);
}

function closeNickModal(){ document.getElementById('nickModal').classList.remove('show'); }

function saveNick(){
  var nick = document.getElementById('nickInput').value.trim();
  if(!nick){ alert('昵称不能为空'); return; }
  myNick = nick;
  myAvatar = _selAvatar;
  localStorage.setItem('chat_nick', myNick);
  localStorage.setItem('chat_avatar', myAvatar);
  updateMyProfile();
  closeNickModal();
  if(!ws) connectHub();
}

function updateMyProfile(){
  document.getElementById('myNickDisplay').textContent = myNick || '点击设置昵称';
  document.getElementById('myAvatarText').textContent = myAvatar || '?';
  if(ws && ws.readyState === 1){
    setStatus('ok', '在线');
  } else {
    setStatus('ing', '连接中...');
  }
}

// ══════════════════════════════════════════════════════════
// 在线人数
// ══════════════════════════════════════════════════════════
function refreshMembers(){
  if(!currentRoom || _hubDisabled) return;
  fetch(HUB_HOST + '/hub/count?topic=' + encodeURIComponent(currentRoom.topic))
    .then(function(r){
      if(r.status === 503){ _hubDisabled = true; return null; }
      return r.json();
    })
    .then(function(data){
      if(!data) return;
      var count = data.count || 0;
      document.getElementById('memberCount').textContent = count > 0 ? count+'人在线' : '';
    }).catch(function(){
      document.getElementById('memberCount').textContent = '';
    });
}

function insertEmoji(emoji){
  var input = document.getElementById('msgInput');
  var start = input.selectionStart, end = input.selectionEnd;
  input.value = input.value.slice(0,start) + emoji + input.value.slice(end);
  input.selectionStart = input.selectionEnd = start + emoji.length;
  input.focus();
  autoResize(input);

// ══════════════════════════════════════════════════════════
// 工具函数
// ══════════════════════════════════════════════════════════
function escHtml(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function pad(n){ return n<10?'0'+n:n; }

function fmtTime(ms){
  if(!ms) return '';
  var d = new Date(ms);
  var now = new Date();
  var isToday = d.toDateString()===now.toDateString();
  if(isToday) return pad(d.getHours())+':'+pad(d.getMinutes());
  return (d.getMonth()+1)+'/'+d.getDate()+' '+pad(d.getHours())+':'+pad(d.getMinutes());
}

// 根据字符串生成固定颜色
function strToColor(str){
  var colors = ['#5b6af0','#e85d7a','#f0a500','#00b894','#6c5ce7','#e17055','#00cec9','#fd79a8','#a29bfe','#55efc4'];
  var h = 0;
  for(var i=0;i<str.length;i++) h = (h*31+str.charCodeAt(i))&0xffffff;
  return colors[Math.abs(h)%colors.length];
}
